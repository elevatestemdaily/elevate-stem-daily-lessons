<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">What Causes Genetic Diseases?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Mutations, dominant/recessive disorders, chromosomal, CRISPR — Day 20</text>

<!-- LEFT: Types of genetic disorders -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#dc2626">Types of Genetic Disease</text>

<rect x="30" y="104" width="280" height="100" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Single-Gene (Mendelian)</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">Dominant: one mutant copy sufficient</text>
<text x="40" y="162" font-family="Arial" font-size="14" fill="#555">Huntington's, achondroplasia, polydactyly</text>
<text x="40" y="182" font-family="Arial" font-size="14" fill="#555">Recessive: need 2 copies (aa genotype)</text>
<text x="40" y="198" font-family="Arial" font-size="14" fill="#555">Cystic fibrosis, sickle cell, PKU</text>

<rect x="30" y="214" width="280" height="80" rx="4" fill="white" stroke="#dc2626" stroke-width="1"/>
<text x="170" y="232" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Chromosomal Disorders</text>
<text x="40" y="252" font-family="Arial" font-size="14" fill="#333">Down syndrome: trisomy 21 (extra chr.)</text>
<text x="40" y="272" font-family="Arial" font-size="14" fill="#555">Turner (X0): missing X; Klinefelter (XXY)</text>
<text x="40" y="288" font-family="Arial" font-size="14" fill="#555">Caused by nondisjunction during meiosis</text>

<rect x="30" y="304" width="280" height="80" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="170" y="322" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">X-Linked Disorders</text>
<text x="40" y="342" font-family="Arial" font-size="14" fill="#333">Gene on X chromosome; males affected more</text>
<text x="40" y="362" font-family="Arial" font-size="14" fill="#555">Haemophilia A: clotting factor VIII deficient</text>
<text x="40" y="378" font-family="Arial" font-size="14" fill="#555">Colour blindness: red–green (8% M, 0.5% F)</text>

<rect x="30" y="394" width="280" height="88" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="170" y="412" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">Multifactorial</text>
<text x="40" y="432" font-family="Arial" font-size="14" fill="#333">Multiple genes + environment (polygenic)</text>
<text x="40" y="452" font-family="Arial" font-size="14" fill="#555">Diabetes, heart disease, schizophrenia</text>
<text x="40" y="470" font-family="Arial" font-size="14" fill="#555">GWAS: genome-wide association studies</text>

<!-- CENTRE: Mutation types + CRISPR -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Mutations and Gene Therapy</text>

<rect x="344" y="104" width="312" height="108" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Mutation Types</text>
<text x="354" y="142" font-family="Arial" font-size="14" fill="#333">Point mutation: one base substituted</text>
<text x="354" y="162" font-family="Arial" font-size="14" fill="#333">Sickle cell: GAG→GTG (Glu→Val in HbS)</text>
<text x="354" y="182" font-family="Arial" font-size="14" fill="#555">Frameshift: insertion/deletion shifts reading frame</text>
<text x="354" y="198" font-family="Arial" font-size="14" fill="#555">CF: ΔF508 deletion in CFTR protein</text>

<rect x="344" y="222" width="312" height="100" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="240" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Mutation Causes</text>
<text x="354" y="260" font-family="Arial" font-size="14" fill="#333">Spontaneous: DNA polymerase error (1 in 10¹⁰)</text>
<text x="354" y="280" font-family="Arial" font-size="14" fill="#333">Ionising radiation: UV, X-ray break DNA</text>
<text x="354" y="300" font-family="Arial" font-size="14" fill="#555">Chemical mutagens: tobacco, benzene, aflatoxin</text>
<text x="354" y="316" font-family="Arial" font-size="14" fill="#555">Viruses: HPV integrates → cervical cancer risk</text>

<rect x="344" y="332" width="312" height="100" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="350" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">CRISPR-Cas9 Gene Editing</text>
<text x="354" y="370" font-family="Arial" font-size="14" fill="#333">Guide RNA leads Cas9 to exact DNA location</text>
<text x="354" y="390" font-family="Arial" font-size="14" fill="#333">Cas9 cuts; cell repair inserts correct sequence</text>
<text x="354" y="410" font-family="Arial" font-size="14" fill="#555">Sickle cell cured in clinical trials (2023, Casgevy)</text>
<text x="354" y="426" font-family="Arial" font-size="14" fill="#555">Nobel 2020: Charpentier and Doudna</text>

<rect x="344" y="442" width="312" height="40" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="500" y="460" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Carrier screening: know your risk before having children</text>
<text x="500" y="476" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Prenatal testing: CVS (wk 10) or amniocentesis (16)</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Genetic Disease</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Thalassaemia in India</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">30 million carriers; 10,000 new cases/yr</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Beta-thalassaemia major: lifelong transfusions</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">National carrier screening programme 2023</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Sickle Cell Mission</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">4.4 million carriers; tribal belt most affected</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">National Sickle Cell Anaemia Elimination Mission</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">CRISPR cure trials: Indian patients enrolling</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">IGIB / CCMB Research</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">IGIB Delhi: FELUDA CRISPR diagnostics</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">CCMB Hyderabad: Indian genetic disease map</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">DBT: gene therapy clinical trials underway</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Cervical Cancer (HPV)</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 1/5 global cervical cancer deaths</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">CERVAVAC: India's own HPV vaccine (2022)</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Universal immunisation programme: girls 9–14 yr</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Mutations: point (Glu→Val in sickle cell), frameshift, chromosomal nondisjunction (Down, trisomy 21).</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">CRISPR cured sickle cell (2023). India: 30M thalassaemia carriers; CERVAVAC HPV vaccine (2022).</text>
</svg>
