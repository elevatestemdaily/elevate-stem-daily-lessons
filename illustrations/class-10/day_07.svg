<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How Can Corrosion Be Prevented?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Galvanisation, painting, cathodic protection, alloying — Day 7</text>

<!-- LEFT: Prevention methods -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#16a34a">Prevention Strategies</text>

<rect x="30" y="104" width="280" height="80" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#065f46">Barrier Methods</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">Paint: blocks O₂ and H₂O contact</text>
<text x="40" y="160" font-family="Arial" font-size="14" fill="#555">Oil/grease: temporary, for moving parts</text>
<text x="40" y="176" font-family="Arial" font-size="14" fill="#555">Plastic coating: car underbodies</text>

<rect x="30" y="194" width="280" height="80" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="170" y="212" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Galvanisation (Hot-dip Zn)</text>
<text x="40" y="232" font-family="Arial" font-size="14" fill="#333">Iron dipped in molten zinc (450°C)</text>
<text x="40" y="250" font-family="Arial" font-size="14" fill="#333">Zinc barrier + Zn sacrificial anode</text>
<text x="40" y="268" font-family="Arial" font-size="14" fill="#555">If scratched: Zn corrodes first, Fe safe</text>

<rect x="30" y="284" width="280" height="80" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="170" y="302" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Tinning (Tin Plating)</text>
<text x="40" y="322" font-family="Arial" font-size="14" fill="#333">Thin Sn layer on steel (food cans)</text>
<text x="40" y="342" font-family="Arial" font-size="14" fill="#555">Tin: less reactive + non-toxic</text>
<text x="40" y="358" font-family="Arial" font-size="14" fill="#555">Scratch: iron corrodes faster (Sn=cathode)</text>

<rect x="30" y="374" width="280" height="80" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="170" y="392" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#7c3aed">Alloying</text>
<text x="40" y="412" font-family="Arial" font-size="14" fill="#333">Stainless steel: Fe + 12–18% Cr + Ni</text>
<text x="40" y="432" font-family="Arial" font-size="14" fill="#555">Cr₂O₃ passive layer: self-healing</text>
<text x="40" y="448" font-family="Arial" font-size="14" fill="#555">Used in cutlery, surgical tools, reactors</text>

<!-- CENTRE: Cathodic + electroplating -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Advanced Protection</text>

<rect x="344" y="104" width="312" height="108" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Cathodic Protection</text>
<text x="354" y="144" font-family="Arial" font-size="14" fill="#333">Make the iron a cathode (no oxidation)</text>
<text x="354" y="164" font-family="Arial" font-size="14" fill="#333">Method 1: Sacrificial anode (Mg or Zn)</text>
<text x="354" y="184" font-family="Arial" font-size="14" fill="#555">More reactive metal corrodes instead of Fe</text>
<text x="354" y="200" font-family="Arial" font-size="14" fill="#555">Ships, pipelines, underground tanks</text>

<rect x="344" y="222" width="312" height="100" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="240" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Electroplating</text>
<text x="354" y="262" font-family="Arial" font-size="14" fill="#333">Use electrolysis to coat thin metal layer</text>
<text x="354" y="282" font-family="Arial" font-size="14" fill="#333">Chromium plating: car parts, taps</text>
<text x="354" y="302" font-family="Arial" font-size="14" fill="#555">Nickel plating: electronics, jewelry</text>
<text x="354" y="318" font-family="Arial" font-size="14" fill="#555">Gold plating: electrical contacts</text>

<rect x="344" y="332" width="312" height="98" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="350" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Corrosion Inhibitors</text>
<text x="354" y="372" font-family="Arial" font-size="14" fill="#333">Chemical additives in coolants, oils</text>
<text x="354" y="392" font-family="Arial" font-size="14" fill="#333">Form thin protective film on metal surface</text>
<text x="354" y="412" font-family="Arial" font-size="14" fill="#555">Benzotriazole: copper circuits in PCBs</text>
<text x="354" y="428" font-family="Arial" font-size="14" fill="#555">VCI (volatile): wrapping of machinery</text>

<rect x="344" y="440" width="312" height="42" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<text x="500" y="458" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Impressed current cathodic protection:</text>
<text x="500" y="474" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">External DC supply makes structure cathode</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Corrosion Solutions</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Galvanised Steel Sheets</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Rural India: galvanised iron roofs</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Lasts 20–30 years in monsoon climate</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">SAIL produces 15 MT galvanised steel/yr</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Pipeline Protection (ONGC)</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">ONGC: 18,000 km gas pipeline network</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Cathodic protection on all buried pipes</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Impressed current + Mg sacrificial anodes</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Indian Navy Ships</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">INS Vikrant: zinc sacrificial anodes</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Anti-fouling paint: biocide + corrosion</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Hull repainted every 2–3 years in dry dock</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Stainless Steel in India</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 2nd largest SS producer in Asia</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Hospital instruments, food processing</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Kitchen utensils: India's SS culture</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Galvanisation: Zn sacrificial anode + barrier. Cathodic protection: make Fe the cathode (no oxidation).</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Stainless steel: Cr₂O₃ self-healing passive layer. ONGC: 18,000 km pipelines with cathodic protection.</text>
</svg>
