<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How does a leaf export sugar to a growing fruit?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Loading and unloading maintain a source-to-sink pressure-flow system</text>
<text x="175" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Exporting source</text>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Phloem pathway</text>
<text x="850" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Importing sink</text>
<path d="M85 245 Q165 160 245 245 Q165 320 85 245 Z" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<rect x="330" y="220" width="370" height="50" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="420" y1="222" x2="420" y2="268" stroke="#1f5f8b" stroke-width="2"/>
<line x1="515" y1="222" x2="515" y2="268" stroke="#1f5f8b" stroke-width="2"/>
<line x1="610" y1="222" x2="610" y2="268" stroke="#1f5f8b" stroke-width="2"/>
<line x1="250" y1="245" x2="315" y2="245" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="355" y1="245" x2="670" y2="245" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="850" cy="265" r="40" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="715" y1="245" x2="800" y2="255" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="350" y1="175" x2="350" y2="205" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="720" y1="280" x2="720" y2="335" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="430" cy="300" r="15" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<text x="250" y="395" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Loading + water entry</text>
<text x="750" y="395" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Unloading + water exit</text>
<text x="500" y="456" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Higher relative source pressure drives sap toward a current sink.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Source and sink describe current roles; transport is not always downward.</text>
</svg>
