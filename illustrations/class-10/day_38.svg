<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How does Joule heating explain a low-voltage warming element?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">State the controlled quantity before comparing a resistance change</text>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Invented model: I = 2 A, R = 3 Ω, t = 10 s</text>
<text x="500" y="209" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#1f5f8b">H = I²Rt = 120 J</text>
<line x1="150" y1="255" x2="850" y2="255" stroke="#1f5f8b" stroke-width="2"/>
<text x="250" y="312" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#1f5f8b">Fixed current: P = I²R</text>
<text x="750" y="312" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#1f5f8b">Fixed voltage: P = V²/R</text>
<text x="250" y="373" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Increase R → increase model power</text>
<text x="750" y="373" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Increase R → decrease model power</text>
<text x="500" y="452" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Energy in joules does not by itself specify the element temperature.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Paper calculation only: low voltage does not prevent every heating hazard.</text>
</svg>
