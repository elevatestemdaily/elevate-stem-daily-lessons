<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does a persistent pesticide build up more in some predators?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Track retained chemical per common tissue basis, not total size alone</text>
<text x="170" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Prey level</text>
<rect x="80" y="190" width="180" height="145" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Next feeding level</text>
<rect x="410" y="190" width="180" height="145" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<text x="830" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Predator example</text>
<rect x="740" y="190" width="180" height="145" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="170" cy="260" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="470" cy="235" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="530" cy="285" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="795" cy="225" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="850" cy="225" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="795" cy="295" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="850" cy="295" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="285" y1="260" x2="385" y2="260" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="615" y1="260" x2="715" y2="260" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="389" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Equal model tissue basis; symbols are not measured concentrations.</text>
<line x1="830" y1="350" x2="900" y2="390" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="830" y="435" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Elimination can limit retention</text>
<text x="250" y="451" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">Within-organism build-up differs from the across-level pattern.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Persistence, uptake and removal determine whether biomagnification occurs.</text>
</svg>
