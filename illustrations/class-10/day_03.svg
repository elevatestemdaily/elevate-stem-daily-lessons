<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Acids and Bases Inside Everyday Life</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">pH scale, acid-base chemistry, neutralisation — Day 3</text>

<!-- LEFT: pH scale -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#374151">The pH Scale</text>

<!-- pH colour bar -->
<rect x="30" y="108" width="280" height="28" rx="4" fill="#dc2626"/>
<text x="170" y="127" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">pH 0–2: Strong acid (H₂SO₄, HCl)</text>
<rect x="30" y="138" width="280" height="28" rx="4" fill="#f97316"/>
<text x="170" y="157" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">pH 3–4: Weak acid (vinegar, lemon)</text>
<rect x="30" y="168" width="280" height="28" rx="4" fill="#eab308"/>
<text x="170" y="187" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">pH 5–6: Mildly acidic (coffee, rain)</text>
<rect x="30" y="198" width="280" height="28" rx="4" fill="#22c55e"/>
<text x="170" y="217" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">pH 7: Neutral (pure water)</text>
<rect x="30" y="228" width="280" height="28" rx="4" fill="#06b6d4"/>
<text x="170" y="247" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">pH 8–9: Mildly basic (baking soda, sea)</text>
<rect x="30" y="258" width="280" height="28" rx="4" fill="#6366f1"/>
<text x="170" y="277" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">pH 10–12: Weak base (soap, Mg(OH)₂)</text>
<rect x="30" y="288" width="280" height="28" rx="4" fill="#7c3aed"/>
<text x="170" y="307" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">pH 13–14: Strong base (NaOH, KOH)</text>

<rect x="30" y="328" width="280" height="68" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="170" y="346" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">pH = −log[H⁺]</text>
<text x="40" y="366" font-family="Arial" font-size="14" fill="#333">Each unit: 10× change in H⁺ concentration</text>
<text x="40" y="384" font-family="Arial" font-size="14" fill="#555">Indicator: litmus, phenolphthalein, turmeric</text>

<rect x="30" y="406" width="280" height="76" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
<text x="170" y="424" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">Arrhenius Definition</text>
<text x="40" y="444" font-family="Arial" font-size="14" fill="#333">Acid: donates H⁺ ion (proton) in water</text>
<text x="40" y="462" font-family="Arial" font-size="14" fill="#333">Base: accepts H⁺ (or donates OH⁻)</text>
<text x="40" y="478" font-family="Arial" font-size="14" fill="#555">Strong acid: fully dissociates (HCl)</text>

<!-- CENTRE: Neutralisation + reactions -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Acid-Base Reactions</text>

<rect x="344" y="104" width="312" height="98" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Neutralisation</text>
<text x="354" y="144" font-family="Arial" font-size="14" fill="#333">Acid + Base → Salt + Water</text>
<text x="354" y="164" font-family="Arial" font-size="14" fill="#333">HCl + NaOH → NaCl + H₂O</text>
<text x="354" y="184" font-family="Arial" font-size="14" fill="#555">Exothermic (heat released)</text>
<text x="354" y="198" font-family="Arial" font-size="14" fill="#555">Stomach acid + antacid: same principle</text>

<rect x="344" y="212" width="312" height="98" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="230" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Acid + Metal → Salt + H₂</text>
<text x="354" y="252" font-family="Arial" font-size="14" fill="#333">Zn + H₂SO₄ → ZnSO₄ + H₂↑</text>
<text x="354" y="272" font-family="Arial" font-size="14" fill="#555">H₂ gas: pop test (burning splint)</text>
<text x="354" y="292" font-family="Arial" font-size="14" fill="#555">Noble metals (Au, Pt) don't react</text>
<text x="354" y="306" font-family="Arial" font-size="14" fill="#555">Reactivity series: Na, Mg, Zn, Fe, Cu, Au</text>

<rect x="344" y="320" width="312" height="98" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="338" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Acid + Carbonate → Salt + H₂O + CO₂</text>
<text x="354" y="360" font-family="Arial" font-size="14" fill="#333">CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂↑</text>
<text x="354" y="380" font-family="Arial" font-size="14" fill="#555">CO₂ test: turns lime water milky</text>
<text x="354" y="400" font-family="Arial" font-size="14" fill="#555">Vinegar + baking soda: same reaction</text>
<text x="354" y="414" font-family="Arial" font-size="14" fill="#555">Acid rain: destroys limestone monuments</text>

<rect x="344" y="428" width="312" height="54" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="500" y="446" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">Buffer Systems</text>
<text x="354" y="466" font-family="Arial" font-size="14" fill="#555">Blood pH 7.35–7.45: tight control</text>
<text x="354" y="480" font-family="Arial" font-size="14" fill="#555">H₂CO₃/HCO₃⁻ buffer maintains this</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Acids and Bases</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Soil pH and Farming</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Acidic soil: lime (CaO) added to neutralise</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Optimal crops: pH 6–7</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India: 30% of farmland needs pH correction</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Acid Rain (Taj Mahal)</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">SO₂ + H₂O → H₂SO₄ (acid rain)</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Marble = CaCO₃ + H₂SO₄ → damage</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Agra industrial shutdowns protect Taj</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Turmeric as Indicator</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Yellow in acid/neutral → red in base</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Used in Indian kitchens for 3000 years</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Curcumin is the pH-sensitive pigment</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Water Treatment</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Municipal water: pH 6.5–8.5 target</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Lime added to raise pH, remove bacteria</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Namami Gange: Ganga pH monitoring</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">pH 0–14: acid→neutral→base. Each unit = 10× [H⁺] change. Neutralisation: acid + base → salt + water.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Acid rain destroys Taj Mahal (CaCO₃). Turmeric: India's natural pH indicator. Blood pH: 7.35–7.45.</text>
</svg>
