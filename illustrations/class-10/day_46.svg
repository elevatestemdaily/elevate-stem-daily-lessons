<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How does the liver package nitrogen waste for removal?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Nitrogen form, conversion, transport and removal belong to different stages</text>
<text x="170" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Nitrogen input</text>
<rect x="80" y="190" width="180" height="130" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Liver: urea cycle</text>
<rect x="410" y="190" width="180" height="130" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<text x="830" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Kidney handling</text>
<rect x="740" y="190" width="180" height="130" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="285" y1="255" x2="385" y2="255" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="615" y1="255" x2="715" y2="255" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="170" y="385" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Amino-acid processing</text>
<text x="500" y="385" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#1f5f8b">Urea: CO(NH2)2</text>
<text x="830" y="385" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Excretion route</text>
<line x1="830" y1="335" x2="830" y2="355" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="458" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Making urea and removing it are cooperating roles, not the same stage.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Human-oriented pathway model; no medical values or personal diagnosis.</text>
</svg>
