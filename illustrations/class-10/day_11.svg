<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How Does DNA Store Information?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">DNA structure, base pairing, genetic code, genome — Day 11</text>

<!-- LEFT: DNA structure -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#16a34a">DNA: Double Helix</text>

<rect x="30" y="104" width="280" height="110" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#065f46">Structure</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">Two strands: right-handed double helix</text>
<text x="40" y="162" font-family="Arial" font-size="14" fill="#333">Sugar-phosphate backbone: outside</text>
<text x="40" y="182" font-family="Arial" font-size="14" fill="#555">Bases on inside: A-T and G-C pairs</text>
<text x="40" y="200" font-family="Arial" font-size="14" fill="#555">Width: 2 nm; pitch: 3.4 nm per 10 bp</text>

<rect x="30" y="224" width="280" height="90" rx="4" fill="white" stroke="#94a3b8" stroke-width="1"/>
<text x="170" y="242" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Base Pairing Rules (Chargaff)</text>
<text x="40" y="262" font-family="Arial" font-size="14" fill="#dc2626">Adenine (A) ←→ Thymine (T): 2 H-bonds</text>
<text x="40" y="282" font-family="Arial" font-size="14" fill="#1d4ed8">Guanine (G) ←→ Cytosine (C): 3 H-bonds</text>
<text x="40" y="302" font-family="Arial" font-size="14" fill="#555">Complementary strands: A=T, G≡C always</text>

<rect x="30" y="324" width="280" height="90" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="170" y="342" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">The Genetic Code</text>
<text x="40" y="362" font-family="Arial" font-size="14" fill="#333">Triplet codon (3 bases) = 1 amino acid</text>
<text x="40" y="382" font-family="Arial" font-size="14" fill="#333">ATG = start (methionine); TAA/TAG/TGA = stop</text>
<text x="40" y="402" font-family="Arial" font-size="14" fill="#555">4³ = 64 possible codons for 20 amino acids</text>
<text x="40" y="418" font-family="Arial" font-size="14" fill="#555">Code is degenerate: multiple codons per aa</text>

<rect x="30" y="424" width="280" height="58" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="170" y="442" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Human Genome</text>
<text x="40" y="462" font-family="Arial" font-size="14" fill="#333">3.2 billion base pairs; 23 chromosome pairs</text>
<text x="40" y="478" font-family="Arial" font-size="14" fill="#555">~20,000 protein-coding genes; 2m long if stretched</text>

<!-- CENTRE: Replication + organisation -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">DNA Replication and Packaging</text>

<rect x="344" y="104" width="312" height="120" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#7c3aed">Semi-Conservative Replication</text>
<text x="354" y="144" font-family="Arial" font-size="14" fill="#333">Helicase unwinds; primase lays RNA primer</text>
<text x="354" y="164" font-family="Arial" font-size="14" fill="#333">DNA polymerase reads 3'→5', builds 5'→3'</text>
<text x="354" y="184" font-family="Arial" font-size="14" fill="#555">Leading: continuous; lagging: Okazaki fragments</text>
<text x="354" y="200" font-family="Arial" font-size="14" fill="#555">Each daughter cell: 1 old + 1 new strand</text>
<text x="354" y="216" font-family="Arial" font-size="14" fill="#555">Error rate: 1 in 10¹⁰ (proofreading repairs)</text>

<rect x="344" y="234" width="312" height="90" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="252" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Chromosomes and Chromatin</text>
<text x="354" y="274" font-family="Arial" font-size="14" fill="#333">DNA wound around histone proteins → nucleosome</text>
<text x="354" y="294" font-family="Arial" font-size="14" fill="#333">Nucleosomes → chromatin fibre → chromosome</text>
<text x="354" y="314" font-family="Arial" font-size="14" fill="#555">Packs 2m DNA into 6 micron nucleus</text>
<text x="354" y="320" font-family="Arial" font-size="14" fill="#555">×10,000 compaction ratio</text>

<rect x="344" y="334" width="312" height="78" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="352" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Mutations</text>
<text x="354" y="374" font-family="Arial" font-size="14" fill="#333">Point mutation: one base changed</text>
<text x="354" y="394" font-family="Arial" font-size="14" fill="#555">Frameshift: insertion/deletion shifts reading frame</text>
<text x="354" y="410" font-family="Arial" font-size="14" fill="#555">Sickle cell anaemia: just 1 base change (A→T)</text>

<rect x="344" y="422" width="312" height="60" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
<text x="500" y="440" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">Central Dogma</text>
<text x="354" y="462" font-family="Arial" font-size="14" fill="#333">DNA→(transcription)→mRNA→(translation)→Protein</text>
<text x="354" y="478" font-family="Arial" font-size="14" fill="#555">Information flows one way (normally)</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Genomics</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">IndiGen Programme</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1,029 Indian genomes sequenced (2019)</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Identified unique variants in Indian population</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">IGIB Delhi: leading institute</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Forensic DNA (CBI)</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">DNA fingerprinting: STR repeat analysis</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">CBI DNA unit: criminal identification</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Nirbhaya case: DNA evidence key</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">CRISPR in India</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">IIT Delhi: gene editing for crop improvement</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">CCMB Hyderabad: CRISPR diagnostics</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">FELUDA: CRISPR COVID test (IGIB)</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Sickle Cell in India</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1 in 86 tribal Indians: HbS gene carrier</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Govt programme: genetic screening 2023</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">CRISPR cure trials: India participating</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">DNA: A-T (2 bonds), G-C (3 bonds). Triplet codon → amino acid. Human genome: 3.2 billion base pairs.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Central dogma: DNA → mRNA → protein. India: IndiGen sequenced 1,029 Indian genomes; FELUDA CRISPR test.</text>
</svg>
