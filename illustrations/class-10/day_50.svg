<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How can a rainwater budget size a school&#x27;s storage tank?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Captured input, capacity and timed use form one storage balance</text>
<text x="245" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Hypothetical catchment input</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Storage and demand</text>
<path d="M70 250 L240 175 L410 250 Z" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="410" y1="250" x2="570" y2="250" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="595" y="190" width="280" height="170" rx="8" fill="#f8fbff" stroke="#1f5f8b" stroke-width="2"/>
<rect x="600" y="275" width="270" height="80" rx="0" fill="#ddeeff" stroke="#ddeeff" stroke-width="2"/>
<line x1="875" y1="220" x2="945" y2="220" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="875" y1="330" x2="945" y2="330" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="370" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#1f5f8b">100 m² × 0.01 m × 0.8</text>
<text x="250" y="410" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f5f8b">= 0.8 m³ = 800 litres</text>
<text x="750" y="410" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Track overflow and unmet demand</text>
<text x="500" y="464" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">The collection factor and all scenario values are invented for arithmetic.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">A volume budget is not a water-quality or structural-design certificate.</text>
</svg>
