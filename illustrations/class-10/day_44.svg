<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why can a solar water heater work without a solar cell?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Collector → circulating fluid → use or insulated storage</text>
<text x="220" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Solar thermal collector</text>
<text x="765" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Insulated storage</text>
<path d="M80 300 L160 190 L400 190 L320 300 Z" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="160" y1="175" x2="210" y2="225" stroke="#e6a23c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="220" y1="175" x2="270" y2="225" stroke="#e6a23c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="280" y1="175" x2="330" y2="225" stroke="#e6a23c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="665" y="185" width="200" height="150" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M385 220 L600 220 L600 240 L650 240" fill="none" stroke="#1f5f8b" stroke-width="5"/>
<path d="M650 310 L570 310 L570 350 L180 350 L180 310" fill="none" stroke="#1f5f8b" stroke-width="5"/>
<line x1="440" y1="220" x2="535" y2="220" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="450" y1="350" x2="300" y2="350" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="880" y1="265" x2="950" y2="265" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="422" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Fluid carries collected energy</text>
<text x="750" y="422" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Storage slows loss until use</text>
<text x="500" y="462" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Active or suitable passive circulation; direct or heat-exchanger routes.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Solar thermal output is heat; photovoltaic output is a different pathway.</text>
</svg>
