<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How can oxidation numbers track electron transfer in a reaction?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Formal electron bookkeeping preserves atoms and total charge</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Oxidation: increase</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Reduction: decrease</text>
<text x="250" y="215" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1f5f8b">Zn → Zn2+ + 2 electrons</text>
<text x="750" y="215" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1f5f8b">Cu2+ + 2 electrons → Cu</text>
<line x1="410" y1="290" x2="590" y2="290" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="500" y="267" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Match two released and accepted electrons</text>
<text x="250" y="389" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Donor: reducing agent</text>
<text x="750" y="389" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Acceptor: oxidising agent</text>
<text x="500" y="453" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Formal number is not literal ionic charge in every covalent substance.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">A balanced redox account does not by itself predict every reaction condition.</text>
</svg>
