<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does a box cooker need a transparent cover?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">A transparent cover keeps useful input while limiting air exchange</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Open box</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Covered box</text>
<path d="M105 220 L105 345 L395 345 L395 220" fill="#ddeeff" stroke="#1f5f8b" stroke-width="3"/>
<line x1="160" y1="155" x2="250" y2="310" stroke="#e6a23c" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M605 220 L605 345 L895 345 L895 220" fill="#ddeeff" stroke="#1f5f8b" stroke-width="3"/>
<line x1="660" y1="155" x2="750" y2="310" stroke="#e6a23c" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="595" y1="215" x2="905" y2="215" stroke="#1f5f8b" stroke-width="5"/>
<line x1="200" y1="300" x2="200" y2="175" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="310" y1="300" x2="365" y2="180" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="750" y1="340" x2="750" y2="390" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="426" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Warm air can be replaced readily</text>
<text x="750" y="426" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Other losses still continue</text>
<text x="500" y="467" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Opaque retention can also block input; the design needs selectivity.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">The paper model does not promise a cooking temperature or safe food outcome.</text>
</svg>
