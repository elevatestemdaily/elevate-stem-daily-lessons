<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How Does a Camera See?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Converging lens, focal length, real image, f-number, ISRO cameras — Day 26</text>

<!-- LEFT: Refraction + lenses -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1d4ed8">Converging Lens</text>

<rect x="30" y="104" width="280" height="100" rx="4" fill="white" stroke="#1d4ed8" stroke-width="1"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Refraction at Curved Surface</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">Light bends at glass–air interface (Snell's law)</text>
<text x="40" y="162" font-family="Arial" font-size="14" fill="#333">Convex lens: thicker centre → bends inward</text>
<text x="40" y="182" font-family="Arial" font-size="14" fill="#555">Focal point F: parallel rays converge here</text>
<text x="40" y="198" font-family="Arial" font-size="14" fill="#555">Focal length f: distance from lens to F</text>

<rect x="30" y="214" width="280" height="100" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="170" y="232" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">Lens Formula: 1/f = 1/v − 1/u</text>
<text x="40" y="252" font-family="Arial" font-size="14" fill="#333">u = object distance; v = image distance</text>
<text x="40" y="272" font-family="Arial" font-size="14" fill="#333">Object beyond 2f → real inverted image</text>
<text x="40" y="292" font-family="Arial" font-size="14" fill="#555">Magnification m = v/u = h_i/h_o</text>
<text x="40" y="308" font-family="Arial" font-size="14" fill="#555">Object inside f → virtual enlarged image</text>

<rect x="30" y="324" width="280" height="80" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="170" y="342" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">Power of Lens: P = 1/f</text>
<text x="40" y="362" font-family="Arial" font-size="14" fill="#333">Unit: dioptre (D); f in metres</text>
<text x="40" y="382" font-family="Arial" font-size="14" fill="#555">+3D: converging lens (hypermetropia)</text>
<text x="40" y="398" font-family="Arial" font-size="14" fill="#555">−2D: diverging lens (spectacles for myopia)</text>

<rect x="30" y="414" width="280" height="68" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="170" y="432" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Total Internal Reflection</text>
<text x="40" y="452" font-family="Arial" font-size="14" fill="#333">Above critical angle: light reflects inside glass</text>
<text x="40" y="470" font-family="Arial" font-size="14" fill="#555">Fibre optic: Indian broadband, surgical scopes</text>

<!-- CENTRE: Camera physics -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">How a Camera Works</text>

<rect x="344" y="104" width="312" height="108" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Camera Anatomy</text>
<text x="354" y="142" font-family="Arial" font-size="14" fill="#333">Lens: focuses light onto sensor/film</text>
<text x="354" y="162" font-family="Arial" font-size="14" fill="#333">Aperture (f-number): controls light admitted</text>
<text x="354" y="182" font-family="Arial" font-size="14" fill="#555">Shutter: controls exposure time</text>
<text x="354" y="200" font-family="Arial" font-size="14" fill="#555">Sensor (CMOS/CCD): photons → digital signal</text>

<rect x="344" y="222" width="312" height="90" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="240" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">f-number (Aperture)</text>
<text x="354" y="260" font-family="Arial" font-size="14" fill="#333">f/N = f/D (focal length / aperture diameter)</text>
<text x="354" y="280" font-family="Arial" font-size="14" fill="#333">f/1.4: wide — bright, shallow depth of field</text>
<text x="354" y="300" font-family="Arial" font-size="14" fill="#555">f/16: narrow — less light, deep focus</text>
<text x="354" y="316" font-family="Arial" font-size="14" fill="#555">Each stop: ×2 or ÷2 in light intensity</text>

<rect x="344" y="322" width="312" height="80" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="340" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Image Formation</text>
<text x="354" y="360" font-family="Arial" font-size="14" fill="#333">Object at u > 2f: image real, inverted, smaller</text>
<text x="354" y="380" font-family="Arial" font-size="14" fill="#555">Pixel: ~1–2 μm CMOS sensor square</text>
<text x="354" y="396" font-family="Arial" font-size="14" fill="#555">Colour filter array: Bayer pattern (RGGB)</text>

<rect x="344" y="412" width="312" height="70" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="500" y="430" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Chromatic aberration: different λ focus at different f</text>
<text x="500" y="448" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Fixed by achromat: two glasses different dispersion</text>
<text x="500" y="466" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Spherical aberration: fixed by aspheric lens elements</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Optics and Cameras</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">ISRO Satellite Cameras</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Cartosat-3: 0.25 m resolution (sub-metre)</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Chandrayaan-2 OHRC: 0.3 m lunar images</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">SAC Ahmedabad: ISRO optics lab</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Indian Optical Industry</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Opticians: 600,000+ across India</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 600M people need spectacles</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Only 300M access to correction lenses</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Smartphone Cameras</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 800M smartphone users</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Computational photography: AI + small sensor</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Multi-camera arrays: wide + tele + macro</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Fibre Optics in India</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">BharatNet: 600,000 km fibre to panchayats</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">TIR (total internal reflection): no signal loss</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Medical: laparoscopic surgery endoscopes</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">1/f = 1/v − 1/u. Object beyond 2f → real inverted image. f-number controls aperture and depth of field.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">ISRO Cartosat-3: 0.25 m resolution. India: 600M needing specs. BharatNet: 600,000 km fibre optic.</text>
</svg>
