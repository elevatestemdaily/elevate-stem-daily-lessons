<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How Does an Embryo Develop?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Fertilisation, zygote, blastocyst, organogenesis — Day 19</text>

<!-- LEFT: Development stages -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#7c3aed">From Zygote to Foetus</text>

<rect x="30" y="104" width="280" height="170" rx="4" fill="white" stroke="#7c3aed" stroke-width="1"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Development Timeline</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">Day 0: fertilisation (fallopian tube)</text>
<text x="40" y="162" font-family="Arial" font-size="14" fill="#333">Day 3–4: morula (16–32 cell ball)</text>
<text x="40" y="182" font-family="Arial" font-size="14" fill="#333">Day 5–6: blastocyst (ICM + trophoblast)</text>
<text x="40" y="202" font-family="Arial" font-size="14" fill="#555">Day 6–10: implantation in uterine wall</text>
<text x="40" y="222" font-family="Arial" font-size="14" fill="#555">Week 3: gastrulation → 3 germ layers</text>
<text x="40" y="242" font-family="Arial" font-size="14" fill="#555">Week 4–8: organogenesis (organs form)</text>
<text x="40" y="262" font-family="Arial" font-size="14" fill="#555">Month 3+: foetal stage (growth + maturation)</text>

<rect x="30" y="284" width="280" height="80" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="170" y="302" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">Three Germ Layers</text>
<text x="40" y="322" font-family="Arial" font-size="14" fill="#333">Ectoderm: skin, nervous system</text>
<text x="40" y="342" font-family="Arial" font-size="14" fill="#333">Mesoderm: muscle, bone, blood, heart</text>
<text x="40" y="358" font-family="Arial" font-size="14" fill="#555">Endoderm: gut, liver, lungs, pancreas</text>

<rect x="30" y="374" width="280" height="78" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
<text x="170" y="392" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">Stem Cells</text>
<text x="40" y="412" font-family="Arial" font-size="14" fill="#333">Totipotent: zygote → any cell type</text>
<text x="40" y="430" font-family="Arial" font-size="14" fill="#555">Pluripotent: blastocyst ICM → most cell types</text>
<text x="40" y="446" font-family="Arial" font-size="14" fill="#555">iPSCs: reprogrammed adult cells (Nobel 2012)</text>

<!-- CENTRE: Mechanisms -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Developmental Mechanisms</text>

<rect x="344" y="104" width="312" height="100" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Cell Differentiation</text>
<text x="354" y="142" font-family="Arial" font-size="14" fill="#333">All cells same DNA; different genes expressed</text>
<text x="354" y="162" font-family="Arial" font-size="14" fill="#333">Transcription factors switch genes on/off</text>
<text x="354" y="182" font-family="Arial" font-size="14" fill="#555">Hox genes: control body axis formation (head-tail)</text>
<text x="354" y="198" font-family="Arial" font-size="14" fill="#555">Hox gene mutation → legs on head (Drosophila)</text>

<rect x="344" y="214" width="312" height="88" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="232" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Placenta Function</text>
<text x="354" y="252" font-family="Arial" font-size="14" fill="#333">Exchange organ: O₂/nutrients in, CO₂/waste out</text>
<text x="354" y="272" font-family="Arial" font-size="14" fill="#555">Immune tolerance: stops mother rejecting foetus</text>
<text x="354" y="290" font-family="Arial" font-size="14" fill="#555">Produces progesterone, hCG (preg. test marker)</text>

<rect x="344" y="312" width="312" height="100" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="330" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Critical Periods</text>
<text x="354" y="350" font-family="Arial" font-size="14" fill="#333">Weeks 3–8: organs forming (teratogen risk)</text>
<text x="354" y="370" font-family="Arial" font-size="14" fill="#333">Alcohol, rubella virus, thalidomide: cause defects</text>
<text x="354" y="390" font-family="Arial" font-size="14" fill="#555">Folic acid (B9) prevents neural tube defects</text>
<text x="354" y="406" font-family="Arial" font-size="14" fill="#555">India: folic acid mandatory in pregnancy</text>

<rect x="344" y="422" width="312" height="60" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="500" y="440" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Twin types: identical (one zygote splits)</text>
<text x="500" y="458" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">vs fraternal (two eggs fertilised separately)</text>
<text x="500" y="474" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India: twin rate rising with IVF</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Maternal and Neonatal</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">ICMR Foetal Research</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">NICHD-India collaboration: preterm birth studies</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 3.5M preterm births/yr (highest globally)</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Kangaroo mother care protocol: saves lives</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Ultrasound in India</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">50 million scans/year: foetal monitoring</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">PC-PNDT Act: bans sex determination</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">AIIMS: foetal anomaly screening protocol</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Congenital Disorders</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Down syndrome: trisomy 21 (nondisjunction)</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Neural tube defects: preventable with folate</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Cleft palate: 35,000 cases/yr; Smile India</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Stem Cell Research</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">IIT Bombay + NCBS: iPSC disease modelling</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Cord blood banks: stem cell storage growing</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">DBT: stem cell therapeutic research fund</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Zygote → morula → blastocyst → gastrulation (3 layers) → organogenesis (wk 4–8) → foetus.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Hox genes control body plan. India: 3.5M preterm births; folic acid prevents neural tube defects.</text>
</svg>
