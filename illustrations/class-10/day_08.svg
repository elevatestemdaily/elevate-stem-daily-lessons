<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Carbon: The Element Behind Life</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Allotropes, carbon cycle, organic chemistry foundations — Day 8</text>

<!-- LEFT: Carbon allotropes -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#f8fafc" stroke="#374151" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#374151">Carbon Allotropes</text>

<rect x="30" y="104" width="280" height="80" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Diamond</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">Each C bonds 4 others: tetrahedral lattice</text>
<text x="40" y="160" font-family="Arial" font-size="14" fill="#333">Hardest natural substance (10 Mohs)</text>
<text x="40" y="176" font-family="Arial" font-size="14" fill="#555">No free electrons → doesn't conduct</text>

<rect x="30" y="194" width="280" height="80" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="170" y="212" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#374151">Graphite</text>
<text x="40" y="232" font-family="Arial" font-size="14" fill="#333">Layers of hexagonal rings; van der Waals</text>
<text x="40" y="250" font-family="Arial" font-size="14" fill="#333">Free electron per C: good conductor</text>
<text x="40" y="268" font-family="Arial" font-size="14" fill="#555">Layers slide → lubricant, pencil marks</text>

<rect x="30" y="284" width="280" height="80" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="170" y="302" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#7c3aed">Fullerene (C₆₀)</text>
<text x="40" y="322" font-family="Arial" font-size="14" fill="#333">60 carbon atoms: soccer ball shape</text>
<text x="40" y="340" font-family="Arial" font-size="14" fill="#333">Drug delivery, superconductors (future)</text>
<text x="40" y="356" font-family="Arial" font-size="14" fill="#555">Nobel Prize 1996: Curl, Kroto, Smalley</text>

<rect x="30" y="374" width="280" height="80" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="170" y="392" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Graphene</text>
<text x="40" y="412" font-family="Arial" font-size="14" fill="#333">Single layer of graphite (1 atom thick)</text>
<text x="40" y="430" font-family="Arial" font-size="14" fill="#333">Strongest known (~200× steel)</text>
<text x="40" y="448" font-family="Arial" font-size="14" fill="#555">Perfect conductor: future electronics</text>

<!-- CENTRE: Carbon cycle + organic intro -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Carbon Chemistry</text>

<rect x="344" y="104" width="312" height="108" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">The Carbon Cycle</text>
<text x="354" y="144" font-family="Arial" font-size="14" fill="#333">CO₂ → plants (photosynthesis)</text>
<text x="354" y="164" font-family="Arial" font-size="14" fill="#333">Plants eaten → animals → respiration CO₂</text>
<text x="354" y="184" font-family="Arial" font-size="14" fill="#555">Dead organisms → fossil fuels (millions yr)</text>
<text x="354" y="200" font-family="Arial" font-size="14" fill="#555">Burning fossil fuels → CO₂ (greenhouse)</text>

<rect x="344" y="222" width="312" height="108" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="240" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Why Carbon is Special</text>
<text x="354" y="262" font-family="Arial" font-size="14" fill="#333">4 valence electrons: forms 4 bonds</text>
<text x="354" y="282" font-family="Arial" font-size="14" fill="#333">Catenation: C-C chains (unbranched, branched)</text>
<text x="354" y="302" font-family="Arial" font-size="14" fill="#555">Tetravalency: bonds with H, O, N, S, halogens</text>
<text x="354" y="318" font-family="Arial" font-size="14" fill="#555">10 million+ organic compounds possible</text>

<rect x="344" y="340" width="312" height="98" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="500" y="358" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#7c3aed">Carbon Compounds</text>
<text x="354" y="380" font-family="Arial" font-size="14" fill="#333">Hydrocarbons: C + H only (CH₄, C₂H₆)</text>
<text x="354" y="400" font-family="Arial" font-size="14" fill="#333">Functional groups: OH, COOH, NH₂, CHO</text>
<text x="354" y="420" font-family="Arial" font-size="14" fill="#555">Carbohydrates: C(H₂O)n — sugars, starch</text>
<text x="354" y="436" font-family="Arial" font-size="14" fill="#555">Proteins: amino acids (C,H,O,N,S chains)</text>

<rect x="344" y="448" width="312" height="34" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
<text x="500" y="470" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Carbon dating: ¹⁴C t½=5,730 yr → age fossils</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Carbon Science</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Diamond Mining (Panna)</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Panna, MP: India's only diamond mine</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Geologically formed 3 billion years ago</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">NMDC produces 30,000 carats/year</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Coal: India's Carbon Reserve</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 4th largest coal reserves</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Jharkhand, Odisha: coalfields</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">1 billion tonnes mined/year (Coal India)</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Graphene Research (IIT/CSIR)</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">IIT Delhi: graphene energy storage</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">CSIR NCL: graphene-based sensors</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India files 200+ graphene patents/year</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Carbon Sequestration</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 33% forest cover target (2030)</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Forests: 2.9 billion tonnes CO₂/year</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Carbon trading markets: India CETS 2025</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Carbon allotropes: diamond (hardest), graphite (conductor/lubricant), graphene (strongest), fullerene.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">4 valence electrons + catenation = 10M+ organic compounds. India: Panna diamonds, Coal India 1B t/yr.</text>
</svg>
