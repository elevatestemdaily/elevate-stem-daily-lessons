<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Electricity: What Is Actually Moving?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Electrons, conventional current, Ohm's law, circuits — Day 21</text>

<!-- LEFT: What moves in a wire -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1d4ed8">Charge Carriers</text>

<rect x="30" y="104" width="280" height="100" rx="4" fill="white" stroke="#1d4ed8" stroke-width="1"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">In Metal Wires: Free Electrons</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">Outer valence electrons: loosely bound</text>
<text x="40" y="162" font-family="Arial" font-size="14" fill="#333">Sea of free electrons: delocalised</text>
<text x="40" y="182" font-family="Arial" font-size="14" fill="#555">Positive ions: fixed in metallic lattice</text>
<text x="40" y="198" font-family="Arial" font-size="14" fill="#555">Electrons drift opposite to conv. current</text>

<rect x="30" y="214" width="280" height="100" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="170" y="232" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">Conventional vs Electron Current</text>
<text x="40" y="252" font-family="Arial" font-size="14" fill="#333">Conventional current: + terminal to − (historical)</text>
<text x="40" y="272" font-family="Arial" font-size="14" fill="#333">Electron flow: − to + (actual electrons move)</text>
<text x="40" y="292" font-family="Arial" font-size="14" fill="#555">Both conventions give same maths</text>
<text x="40" y="308" font-family="Arial" font-size="14" fill="#555">In electrolytes/plasma: positive ions also move</text>

<rect x="30" y="324" width="280" height="80" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="170" y="342" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">Current: I = Q/t</text>
<text x="40" y="362" font-family="Arial" font-size="14" fill="#333">I = current (amperes, A)</text>
<text x="40" y="382" font-family="Arial" font-size="14" fill="#555">Q = charge (coulombs); t = time (s)</text>
<text x="40" y="398" font-family="Arial" font-size="14" fill="#555">1 A = 1 coulomb per second</text>

<rect x="30" y="414" width="280" height="68" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="170" y="432" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Drift Velocity</text>
<text x="40" y="452" font-family="Arial" font-size="14" fill="#333">Electrons drift very slowly (~mm/s)</text>
<text x="40" y="470" font-family="Arial" font-size="14" fill="#555">Signal propagates at near light speed (E-field)</text>

<!-- CENTRE: Ohm's law + circuits -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Ohm's Law and Circuits</text>

<rect x="344" y="104" width="312" height="100" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Ohm's Law: V = IR</text>
<text x="354" y="142" font-family="Arial" font-size="14" fill="#333">V = voltage (volts) = potential difference</text>
<text x="354" y="162" font-family="Arial" font-size="14" fill="#333">I = current (amperes)</text>
<text x="354" y="182" font-family="Arial" font-size="14" fill="#555">R = resistance (ohms, Ω)</text>
<text x="354" y="198" font-family="Arial" font-size="14" fill="#555">Valid for ohmic conductors (linear I–V graph)</text>

<rect x="344" y="214" width="312" height="90" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="232" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Series and Parallel</text>
<text x="354" y="252" font-family="Arial" font-size="14" fill="#333">Series: R_total = R₁ + R₂ + ... (same current)</text>
<text x="354" y="272" font-family="Arial" font-size="14" fill="#333">Parallel: 1/R_total = 1/R₁ + 1/R₂ (same voltage)</text>
<text x="354" y="292" font-family="Arial" font-size="14" fill="#555">Parallel: total R less than smallest branch</text>
<text x="354" y="308" font-family="Arial" font-size="14" fill="#555">Home wiring: parallel (each device independent)</text>

<rect x="344" y="314" width="312" height="88" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="332" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Power: P = IV = I²R = V²/R</text>
<text x="354" y="352" font-family="Arial" font-size="14" fill="#333">60W bulb at 230V: I = 60/230 = 0.26 A</text>
<text x="354" y="372" font-family="Arial" font-size="14" fill="#555">R = V/I = 230/0.26 = 885 Ω</text>
<text x="354" y="390" font-family="Arial" font-size="14" fill="#555">LED: same 60W equivalent at 10W input</text>

<rect x="344" y="412" width="312" height="70" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="500" y="430" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Kirchhoff's Laws: sum of voltages in a loop = 0</text>
<text x="500" y="448" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Sum of currents at junction = 0 (conservation)</text>
<text x="500" y="468" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Basis for all circuit analysis</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Electrical Grid</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">India's Power Grid</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">World's 3rd largest: 2,300+ GW capacity</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">230 V / 50 Hz AC (household)</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">ONE NATION ONE GRID: unified power system</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Electrification (SAUBHAGYA)</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">100% village electrification: 2018</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">2.86 crore households connected</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Solar mini-grids: remote tribal areas</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Transmission Losses</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India T&amp;D losses: ~18% (global target: &lt;10%)</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">P_loss = I²R — reduce I by raising V</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">HVDC: Rihand-Delhi 900 km, 2500 MW</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Smart Meters (EESL)</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">250 million smart meters planned</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Real-time consumption + demand response</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Cuts theft and billing errors</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Electrons drift → conventional current opposite. V = IR. Series: R adds; parallel: 1/R adds.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">P = I²R: high V reduces transmission loss. India: 230V/50Hz; 18% T&amp;D loss; SAUBHAGYA universal electrification.</text>
</svg>
