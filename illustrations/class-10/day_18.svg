<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Why Do We Need Reproduction?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Sexual vs asexual, genetic diversity, reproductive health — Day 18</text>

<!-- LEFT: Asexual reproduction -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1d4ed8">Asexual Reproduction</text>

<rect x="30" y="104" width="280" height="110" rx="4" fill="white" stroke="#1d4ed8" stroke-width="1"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">Types</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">Binary fission: bacteria (E. coli: 20 min)</text>
<text x="40" y="162" font-family="Arial" font-size="14" fill="#333">Budding: yeast, Hydra (outgrowth)</text>
<text x="40" y="182" font-family="Arial" font-size="14" fill="#555">Fragmentation: Planaria (piece → worm)</text>
<text x="40" y="202" font-family="Arial" font-size="14" fill="#555">Vegetative prop.: potato eye, onion bulb</text>

<rect x="30" y="224" width="280" height="80" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="170" y="242" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">Advantages</text>
<text x="40" y="262" font-family="Arial" font-size="14" fill="#333">Fast: one parent, no mate needed</text>
<text x="40" y="282" font-family="Arial" font-size="14" fill="#555">All offspring identical: good if env. stable</text>
<text x="40" y="298" font-family="Arial" font-size="14" fill="#555">No energy spent on finding mate</text>

<rect x="30" y="314" width="280" height="80" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="170" y="332" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Disadvantage</text>
<text x="40" y="352" font-family="Arial" font-size="14" fill="#333">No genetic variation: disease wipes colony</text>
<text x="40" y="372" font-family="Arial" font-size="14" fill="#555">Cavendish: TR4 fungus wiped out clones</text>
<text x="40" y="388" font-family="Arial" font-size="14" fill="#555">Cannot adapt to changing environment</text>

<rect x="30" y="404" width="280" height="78" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
<text x="170" y="422" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">Spores</text>
<text x="40" y="442" font-family="Arial" font-size="14" fill="#333">Fungi, mosses, ferns: haploid spore dispersal</text>
<text x="40" y="462" font-family="Arial" font-size="14" fill="#555">Survive harsh conditions (dormant)</text>
<text x="40" y="478" font-family="Arial" font-size="14" fill="#555">Germinate when conditions improve</text>

<!-- CENTRE: Sexual reproduction -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Sexual Reproduction</text>

<rect x="344" y="104" width="312" height="100" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">The Key Steps</text>
<text x="354" y="142" font-family="Arial" font-size="14" fill="#333">Meiosis: haploid gametes (sperm + egg)</text>
<text x="354" y="162" font-family="Arial" font-size="14" fill="#333">Fertilisation: fusion → diploid zygote</text>
<text x="354" y="182" font-family="Arial" font-size="14" fill="#555">Crossing over in meiosis: genetic recombination</text>
<text x="354" y="198" font-family="Arial" font-size="14" fill="#555">Each offspring: unique genotype</text>

<rect x="344" y="214" width="312" height="88" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="232" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Why Sexual? Evolutionary Advantage</text>
<text x="354" y="252" font-family="Arial" font-size="14" fill="#333">Variation: raw material for natural selection</text>
<text x="354" y="272" font-family="Arial" font-size="14" fill="#555">Bad mutations purged more efficiently</text>
<text x="354" y="290" font-family="Arial" font-size="14" fill="#555">Red Queen hypothesis: race against parasites</text>

<rect x="344" y="312" width="312" height="100" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="330" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Human Reproduction</text>
<text x="354" y="350" font-family="Arial" font-size="14" fill="#333">Testis: sperm (23 chromosomes, haploid)</text>
<text x="354" y="370" font-family="Arial" font-size="14" fill="#333">Ovary: egg (1 released per cycle)</text>
<text x="354" y="390" font-family="Arial" font-size="14" fill="#555">Fertilisation in fallopian tube → zygote</text>
<text x="354" y="406" font-family="Arial" font-size="14" fill="#555">Implantation: 6–10 days after fertilisation</text>

<rect x="344" y="422" width="312" height="60" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="500" y="440" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Hermaphrodites: earthworm (both sexes together)</text>
<text x="500" y="458" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Parthenogenesis: unfertilised egg develops (bees)</text>
<text x="500" y="474" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Komodo dragon: virgin birth!</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Reproductive Health</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">National Family Health Survey</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India TFR: 2.0 (below replacement: 2.1)</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Contraceptive use: 67% (NFHS-5)</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Fertility rate falling; population to peak ~2060</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Agriculture: Vegetative Propagation</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Sugarcane: stem cuttings (asexual)</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Mango: grafting (best variety propagated)</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Alphonso mango: grafted clones worldwide</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Maternal Health</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">MMR reduced from 254 (2004) to 97 (2018)</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Janani Suraksha Yojana: hospital delivery</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">>90% institutional births now achieved</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">IVF and ART in India</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 3rd largest IVF market globally</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">ART Regulation Act 2021: ethical guidelines</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">~250,000 IVF cycles/year in India</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Sexual reproduction: meiosis → unique gametes → fertilisation → genetically unique offspring.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Asexual: fast but no variation. India TFR 2.0; MMR fallen from 254 to 97; 3rd-largest IVF market.</text>
</svg>
