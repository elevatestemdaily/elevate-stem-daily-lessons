<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why do homologous compounds form a predictable series?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">A recurring functional feature accompanies a successive CH2 increment</text>
<text x="170" y="225" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">CH3OH</text>
<text x="500" y="225" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">C2H5OH</text>
<text x="830" y="225" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">C3H7OH</text>
<line x1="280" y1="225" x2="390" y2="225" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="335" y="187" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">+ CH2</text>
<line x1="610" y1="225" x2="720" y2="225" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="665" y="187" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">+ CH2</text>
<text x="500" y="315" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Common OH feature in the supplied alcohol sequence</text>
<text x="500" y="375" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#1f5f8b">Rounded increment: 12 + 2 × 1 ≈ 14</text>
<text x="500" y="448" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Similar chemical family does not mean identical properties or hazards.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Use formulas on paper; do not handle or taste alcohol samples.</text>
</svg>
