<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How do structural isomers share a formula but differ in</text>
<text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">arrangement?</text>
<text x="500" y="98" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">C4H10 atom totals can describe different carbon connection maps</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Butane: four-carbon path</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">2-methylpropane: branched</text>
<circle cx="100" cy="255" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="200" cy="255" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="300" cy="255" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="400" cy="255" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="115" y1="255" x2="185" y2="255" stroke="#1f5f8b" stroke-width="3"/>
<line x1="215" y1="255" x2="285" y2="255" stroke="#1f5f8b" stroke-width="3"/>
<line x1="315" y1="255" x2="385" y2="255" stroke="#1f5f8b" stroke-width="3"/>
<circle cx="750" cy="255" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="650" cy="255" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="850" cy="255" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="750" cy="180" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="735" y1="255" x2="665" y2="255" stroke="#1f5f8b" stroke-width="3"/>
<line x1="765" y1="255" x2="835" y2="255" stroke="#1f5f8b" stroke-width="3"/>
<line x1="750" y1="240" x2="750" y2="195" stroke="#1f5f8b" stroke-width="3"/>
<text x="250" y="366" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#1f5f8b">CH3–CH2–CH2–CH3</text>
<text x="750" y="366" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Three CH3 groups + one CH</text>
<text x="500" y="435" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f5f8b">Both totals: four carbons and ten hydrogens.</text>
<text x="500" y="470" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Rotating an unchanged graph does not create a structural isomer.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Count atoms and connections separately; use no real gas or ignition activity.</text>
</svg>
