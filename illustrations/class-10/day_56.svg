<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How does a lung surfactant keep tiny air sacs from collapsing?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">A film at the air–liquid interface reduces the surface-tension contribution</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Higher-tension model</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Surfactant-covered model</text>
<circle cx="250" cy="265" r="85" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="250" cy="265" r="70" fill="#f8fbff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="750" cy="265" r="85" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="750" cy="265" r="70" fill="#f8fbff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="140" y1="265" x2="185" y2="265" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="360" y1="265" x2="315" y2="265" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="250" y1="155" x2="250" y2="200" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="640" y1="265" x2="660" y2="265" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="860" y1="265" x2="840" y2="265" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="750" y1="155" x2="750" y2="175" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="750" cy="190" r="5" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="815" cy="230" r="5" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="815" cy="300" r="5" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="750" cy="340" r="5" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="685" cy="300" r="5" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="685" cy="230" r="5" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<text x="250" y="391" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Larger inward surface contribution</text>
<text x="750" y="391" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Reduced contribution at the boundary</text>
<text x="500" y="437" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Ideal single interface: pressure difference = 2 × tension ÷ radius</text>
<text x="500" y="470" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Fixed tension + smaller radius → larger balancing pressure difference.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Real alveoli share tissue and connections; the isolated-sphere model is limited.</text>
</svg>
