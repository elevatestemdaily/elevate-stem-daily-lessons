<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Metals: Why Are They Useful?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Metallic bonding, properties, reactivity series — Day 5</text>

<!-- LEFT: Metal properties -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">What Makes Metals Special?</text>

<rect x="30" y="104" width="280" height="100" rx="4" fill="white" stroke="#ca8a04" stroke-width="1"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Metallic Bonding</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">Positive ion lattice + sea of free electrons</text>
<text x="40" y="162" font-family="Arial" font-size="14" fill="#333">Electrons move freely: conduct electricity</text>
<text x="40" y="182" font-family="Arial" font-size="14" fill="#555">Bond non-directional: malleable/ductile</text>
<text x="40" y="198" font-family="Arial" font-size="14" fill="#555">Layers slide without breaking bond</text>

<rect x="30" y="214" width="280" height="170" rx="4" fill="white" stroke="#94a3b8" stroke-width="1"/>
<text x="170" y="232" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Key Properties</text>
<rect x="30" y="238" width="280" height="24" fill="#fef9c3"/>
<text x="40" y="255" font-family="Arial" font-size="14" fill="#333">Conductivity: free electrons carry charge</text>
<rect x="30" y="262" width="280" height="24" fill="#fee2e2"/>
<text x="40" y="279" font-family="Arial" font-size="14" fill="#333">Malleability: hammer into sheets</text>
<rect x="30" y="286" width="280" height="24" fill="#dbeafe"/>
<text x="40" y="303" font-family="Arial" font-size="14" fill="#333">Ductility: draw into wires</text>
<rect x="30" y="310" width="280" height="24" fill="#d1fae5"/>
<text x="40" y="327" font-family="Arial" font-size="14" fill="#333">High melting point (most): strong bonds</text>
<rect x="30" y="334" width="280" height="24" fill="#ede9fe"/>
<text x="40" y="351" font-family="Arial" font-size="14" fill="#333">Lustre: reflects light (shiny surface)</text>
<text x="40" y="377" font-family="Arial" font-size="14" fill="#555">Exceptions: mercury (liquid), Na (soft)</text>

<rect x="30" y="396" width="280" height="86" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<text x="170" y="414" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Reactivity Series (top → bottom)</text>
<text x="40" y="434" font-family="Arial" font-size="14" fill="#333">K, Na, Ca, Mg, Al, Zn, Fe, Pb, H, Cu, Ag, Au</text>
<text x="40" y="452" font-family="Arial" font-size="14" fill="#555">Top: react violently with water/acid</text>
<text x="40" y="470" font-family="Arial" font-size="14" fill="#555">Bottom: noble metals don't corrode</text>

<!-- CENTRE: Alloys + reactions -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Alloys and Metal Reactions</text>

<rect x="344" y="104" width="312" height="120" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#374151">Key Alloys</text>
<text x="354" y="144" font-family="Arial" font-size="14" fill="#333">Steel: Fe + 0.2–2% C (stronger than iron)</text>
<text x="354" y="164" font-family="Arial" font-size="14" fill="#333">Brass: Cu + Zn (corrosion resistant)</text>
<text x="354" y="184" font-family="Arial" font-size="14" fill="#555">Bronze: Cu + Sn (bells, statues)</text>
<text x="354" y="204" font-family="Arial" font-size="14" fill="#555">Duralumin: Al + Cu + Mg (aircraft)</text>
<text x="354" y="220" font-family="Arial" font-size="14" fill="#555">Stainless steel: Fe + Cr + Ni (cutlery)</text>

<rect x="344" y="234" width="312" height="98" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="252" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Metal + Oxygen → Metal Oxide</text>
<text x="354" y="274" font-family="Arial" font-size="14" fill="#333">4Fe + 3O₂ → 2Fe₂O₃ (rust)</text>
<text x="354" y="294" font-family="Arial" font-size="14" fill="#333">2Mg + O₂ → 2MgO (bright white flame)</text>
<text x="354" y="314" font-family="Arial" font-size="14" fill="#555">Metal oxides: basic (react with acids)</text>
<text x="354" y="328" font-family="Arial" font-size="14" fill="#555">Non-metal oxides: acidic</text>

<rect x="344" y="342" width="312" height="98" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="360" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Metal + Water → Hydroxide + H₂</text>
<text x="354" y="382" font-family="Arial" font-size="14" fill="#333">2Na + 2H₂O → 2NaOH + H₂↑ (violent)</text>
<text x="354" y="402" font-family="Arial" font-size="14" fill="#333">Mg + H₂O → only on boiling</text>
<text x="354" y="422" font-family="Arial" font-size="14" fill="#555">Fe: very slow, forms rust with moist air</text>
<text x="354" y="436" font-family="Arial" font-size="14" fill="#555">Cu, Ag, Au: don't react with water</text>

<rect x="344" y="450" width="312" height="32" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="500" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Thermite: Al + Fe₂O₃ → Al₂O₃ + Fe (displacement)</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Metal Heritage</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Iron Pillar of Delhi</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1600-year-old, barely corroded!</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">High phosphorus iron: forms FePO₄ coat</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Ancient metallurgical masterwork</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Steel Industry (SAIL, Tata)</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 2nd largest steel producer</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">120 million tonnes/year (2023)</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Jharkhand: iron ore + steel belt</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Gold: India's Obsession</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 25,000 tonnes gold held by public</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Noble metal: lowest reactivity</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Hallmarking: BIS purity standard</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Aluminium Industry</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 4th largest bauxite (Al₂O₃) reserve</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">NALCO, Vedanta: refine aluminium</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">ISRO uses duralumin (Al alloy) for rockets</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Metals: sea of free electrons → conduct, malleable, ductile. Reactivity: K&gt;Na&gt;Mg&gt;Al&gt;Zn&gt;Fe&gt;Cu&gt;Au.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Delhi Iron Pillar: 1600 yr rust-free. India: 2nd largest steel producer; 25,000 tonnes public gold holdings.</text>
</svg>
