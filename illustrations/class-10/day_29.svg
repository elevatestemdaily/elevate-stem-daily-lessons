<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">The Physics of Nuclear Energy</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">E=mc², fission, chain reaction, reactors — Day 29</text>

<!-- LEFT: Nuclear physics -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#dc2626">Nuclear Energy Basics</text>

<rect x="30" y="104" width="280" height="100" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">E = mc²</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">Mass and energy are equivalent</text>
<text x="40" y="162" font-family="Arial" font-size="14" fill="#333">c = 3×10⁸ m/s; c² = 9×10¹⁶ J/kg</text>
<text x="40" y="182" font-family="Arial" font-size="14" fill="#555">1 kg matter = 9×10¹⁶ J energy</text>
<text x="40" y="198" font-family="Arial" font-size="14" fill="#555">Nuclear: millions × chemical energy per atom</text>

<rect x="30" y="214" width="280" height="100" rx="4" fill="white" stroke="#dc2626" stroke-width="1"/>
<text x="170" y="232" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Binding Energy and Mass Defect</text>
<text x="40" y="252" font-family="Arial" font-size="14" fill="#333">Nucleus: protons + neutrons (nucleons)</text>
<text x="40" y="272" font-family="Arial" font-size="14" fill="#333">Nucleus mass &lt; sum of parts; defect = Δm</text>
<text x="40" y="292" font-family="Arial" font-size="14" fill="#555">Binding energy = Δm × c² (holds nucleus)</text>
<text x="40" y="308" font-family="Arial" font-size="14" fill="#555">Fe-56: peak binding energy (most stable)</text>

<rect x="30" y="324" width="280" height="80" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="170" y="342" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Fission</text>
<text x="40" y="362" font-family="Arial" font-size="14" fill="#333">Heavy nucleus (U-235) splits on neutron hit</text>
<text x="40" y="382" font-family="Arial" font-size="14" fill="#555">²³⁵U + n → Ba + Kr + 3n + 200 MeV energy</text>
<text x="40" y="398" font-family="Arial" font-size="14" fill="#555">3n → hit 3 more U-235 → chain reaction</text>

<rect x="30" y="414" width="280" height="68" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="170" y="432" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">Fusion</text>
<text x="40" y="452" font-family="Arial" font-size="14" fill="#333">Light nuclei join: ²H + ³H → ⁴He + n + 17.6 MeV</text>
<text x="40" y="470" font-family="Arial" font-size="14" fill="#555">Sun's power source; ITER tokamak (France)</text>

<!-- CENTRE: Reactor design -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Nuclear Reactor Components</text>

<rect x="344" y="104" width="312" height="120" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">How a Reactor Works</text>
<text x="354" y="142" font-family="Arial" font-size="14" fill="#333">Fuel: enriched U-235 (3–5%) rods</text>
<text x="354" y="162" font-family="Arial" font-size="14" fill="#333">Moderator: slow neutrons (D₂O or graphite)</text>
<text x="354" y="182" font-family="Arial" font-size="14" fill="#555">Control rods: absorb neutrons (boron/hafnium)</text>
<text x="354" y="202" font-family="Arial" font-size="14" fill="#555">Coolant: heat → steam → turbine → electricity</text>
<text x="354" y="218" font-family="Arial" font-size="14" fill="#555">Critical: exactly 1 neutron/fission sustains chain</text>

<rect x="344" y="234" width="312" height="90" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="252" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Safety Systems</text>
<text x="354" y="272" font-family="Arial" font-size="14" fill="#333">SCRAM: emergency insert control rods (shutdown)</text>
<text x="354" y="292" font-family="Arial" font-size="14" fill="#555">Passive safety: gravity/convection (no pump)</text>
<text x="354" y="308" font-family="Arial" font-size="14" fill="#555">Containment: concrete dome (>100 atm pressure)</text>

<rect x="344" y="334" width="312" height="90" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="352" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Nuclear Waste</text>
<text x="354" y="372" font-family="Arial" font-size="14" fill="#333">High-level waste: radioactive thousands of years</text>
<text x="354" y="392" font-family="Arial" font-size="14" fill="#555">Deep geological repositories: Finland (Onkalo)</text>
<text x="354" y="408" font-family="Arial" font-size="14" fill="#555">India: vitrification + deep storage policy</text>

<rect x="344" y="434" width="312" height="48" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="500" y="452" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Nuclear provides 10% global electricity; zero CO₂ ops</text>
<text x="500" y="470" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Chernobyl (1986), Fukushima (2011): human + design error</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Nuclear Programme</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">DAE and BARC</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Dept of Atomic Energy: founded 1954</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">BARC Mumbai: India's nuclear research hub</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Homi J. Bhabha: father of Indian nuclear</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">India's 3-Stage Programme</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Stage 1: U-235 PHWRs (22 operating)</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Stage 2: Fast breeder + thorium-232</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Stage 3: Thorium reactor (largest Th reserve)</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Kudankulam Plant</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Tamil Nadu: 2,000 MW (Indo-Russian project)</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India target: 22,480 MW nuclear by 2031</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Currently: 7,480 MW (3% India's electricity)</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">India in ITER (Fusion)</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 9% contribution to ITER project</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Superconducting coils, cryostats, cooling</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Inst. for Plasma Research (IPR), Gandhinagar</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">E = mc². Fission: U-235 + n → Ba + Kr + 3n + 200 MeV. Control rods keep reaction critical (k=1).</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">India: 3-stage thorium programme; Kudankulam 2,000 MW; 9% ITER contribution (fusion). BARC est. 1954.</text>
</svg>
