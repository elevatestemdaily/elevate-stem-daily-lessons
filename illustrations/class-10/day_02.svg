<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How Do We Know a Chemical Reaction Occurred?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Signs of reaction, types of reactions, and chemical equations — Day 2</text>

<!-- LEFT: Signs of reaction -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">Signs of a Chemical Reaction</text>

<rect x="30" y="104" width="280" height="280" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Observable Evidence</text>
<rect x="30" y="128" width="280" height="30" fill="#fee2e2"/>
<text x="40" y="148" font-family="Arial" font-size="14" fill="#333">Colour change: Fe → rust (brown)</text>
<rect x="30" y="158" width="280" height="30" fill="#dbeafe"/>
<text x="40" y="178" font-family="Arial" font-size="14" fill="#333">Gas produced: vinegar + soda → CO₂</text>
<rect x="30" y="188" width="280" height="30" fill="#d1fae5"/>
<text x="40" y="208" font-family="Arial" font-size="14" fill="#333">Temperature change: hand-warmer packs</text>
<rect x="30" y="218" width="280" height="30" fill="#ede9fe"/>
<text x="40" y="238" font-family="Arial" font-size="14" fill="#333">Precipitate forms: BaCl₂ + Na₂SO₄</text>
<rect x="30" y="248" width="280" height="30" fill="#fef9c3"/>
<text x="40" y="268" font-family="Arial" font-size="14" fill="#333">Light produced: burning, bioluminescence</text>
<rect x="30" y="278" width="280" height="30" fill="#f0fdf4"/>
<text x="40" y="298" font-family="Arial" font-size="14" fill="#333">Smell change: food cooking, acids</text>
<text x="40" y="328" font-family="Arial" font-size="14" fill="#555">New substance = new properties</text>
<text x="40" y="346" font-family="Arial" font-size="14" fill="#555">Cannot simply reverse (unlike mixing)</text>
<text x="40" y="364" font-family="Arial" font-size="14" fill="#555">Mass always conserved (Lavoisier's law)</text>

<rect x="30" y="396" width="280" height="86" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="170" y="414" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Physical vs Chemical Change</text>
<text x="40" y="434" font-family="Arial" font-size="14" fill="#333">Physical: same substance, form changes</text>
<text x="40" y="452" font-family="Arial" font-size="14" fill="#333">Ice → water → steam (still H₂O)</text>
<text x="40" y="470" font-family="Arial" font-size="14" fill="#555">Chemical: new substance with new bonds</text>

<!-- CENTRE: Types of reactions -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Types of Chemical Reactions</text>

<rect x="344" y="104" width="312" height="60" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Combination: A + B → AB</text>
<text x="354" y="142" font-family="Arial" font-size="14" fill="#555">2H₂ + O₂ → 2H₂O (water formed)</text>
<text x="354" y="158" font-family="Arial" font-size="14" fill="#555">2Mg + O₂ → 2MgO (magnesium burns)</text>

<rect x="344" y="174" width="312" height="60" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="500" y="192" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">Decomposition: AB → A + B</text>
<text x="354" y="212" font-family="Arial" font-size="14" fill="#555">2H₂O₂ → 2H₂O + O₂ (H₂O₂ decomposes)</text>
<text x="354" y="228" font-family="Arial" font-size="14" fill="#555">CaCO₃ → CaO + CO₂ (limestone heated)</text>

<rect x="344" y="244" width="312" height="60" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
<text x="500" y="262" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">Displacement: A + BC → AC + B</text>
<text x="354" y="282" font-family="Arial" font-size="14" fill="#555">Zn + CuSO₄ → ZnSO₄ + Cu</text>
<text x="354" y="298" font-family="Arial" font-size="14" fill="#555">More reactive metal displaces less reactive</text>

<rect x="344" y="314" width="312" height="60" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="500" y="332" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Double Displacement: AB + CD → AD + CB</text>
<text x="354" y="352" font-family="Arial" font-size="14" fill="#555">NaCl + AgNO₃ → AgCl↓ + NaNO₃</text>
<text x="354" y="368" font-family="Arial" font-size="14" fill="#555">Precipitate forms (AgCl, white, insoluble)</text>

<rect x="344" y="384" width="312" height="98" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="500" y="402" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Balancing Equations</text>
<text x="354" y="422" font-family="Arial" font-size="14" fill="#333">Same atoms on both sides (law of conservation)</text>
<text x="354" y="442" font-family="Arial" font-size="14" fill="#333">Fe + O₂ → Fe₂O₃ (unbalanced)</text>
<text x="354" y="462" font-family="Arial" font-size="14" fill="#555">4Fe + 3O₂ → 2Fe₂O₃ (balanced)</text>
<text x="354" y="478" font-family="Arial" font-size="14" fill="#555">Coefficients only — never change formulae</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Reactions at Scale</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Haber Process (Fertilisers)</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">N₂ + 3H₂ → 2NH₃ (Haber-Bosch)</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 3rd largest fertiliser user</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Green Revolution depended on this reaction</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Cement Industry</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">CaCO₃ → CaO + CO₂ (decomposition)</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 2nd largest cement producer</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">700 million tonnes/year capacity</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Chlor-alkali Industry</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">NaCl + H₂O → NaOH + Cl₂ + H₂</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Chlorine: disinfects India's water supply</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">NaOH (caustic soda): soaps + textiles</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Fireworks (Diwali)</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Oxidation + light emission reactions</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Strontium = red, Barium = green, Na = yellow</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India: 70% of firecrackers from Sivakasi</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Signs: colour change, gas, precipitate, heat, light. Types: combination, decomposition, displacement.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Balance equations: same atoms each side. India: Haber process feeds millions via fertilisers.</text>
</svg>
