<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How does an ester name reveal two chemical building blocks?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Read connectivity and include the carbonyl carbon in the acid-derived part</text>
<text x="180" y="260" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">CH3</text>
<text x="370" y="260" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">C</text>
<text x="550" y="260" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">O</text>
<text x="730" y="260" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">CH2</text>
<text x="900" y="260" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">CH3</text>
<text x="370" y="180" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">O</text>
<line x1="220" y1="252" x2="340" y2="252" stroke="#1f5f8b" stroke-width="3"/>
