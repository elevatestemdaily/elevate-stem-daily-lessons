<line x1="377" y1="198" x2="377" y2="229" stroke="#1f5f8b" stroke-width="2"/>
<text x="280" y="354" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f5f8b">Ethanoate portion</text>
<text x="790" y="354" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f5f8b">Ethyl portion</text>
<text x="500" y="422" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#1f5f8b">Name order: ethyl ethanoate</text>
<text x="500" y="466" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">The C(=O)–O linkage is structural evidence; smell is not a full test.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Formula exercise only: no ester preparation or chemical smelling activity.</text>
