<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does a photodiode respond when light falls on it?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Absorbed photons create carriers; the junction field helps collect them</text>
<text x="180" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Incoming photon</text>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Junction region</text>
<text x="830" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Collected signal</text>
<path d="M80 220 q20 -15 40 0 t40 0 t40 0" fill="none" stroke="#e6a23c" stroke-width="3"/>
<line x1="210" y1="220" x2="350" y2="220" stroke="#e6a23c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="375" y="175" width="250" height="160" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="475" cy="230" r="9" fill="#1f5f8b" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="525" cy="275" r="9" fill="#f8fbff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="460" y1="230" x2="395" y2="230" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="540" y1="275" x2="605" y2="275" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="650" y1="255" x2="880" y2="255" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="180" y="385" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Suitable photon absorbed</text>
<text x="500" y="385" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Electron and hole separate</text>
<text x="830" y="385" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Photocurrent response</text>
<rect x="280" y="447" width="50" height="18" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<rect x="680" y="420" width="50" height="45" rx="8" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<text x="305" y="430" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">Dark background</text>
<text x="705" y="402" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">Illuminated model</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Response depends on wavelength, collection and noise; not every photon is detected.</text>
</svg>
