<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How Does Household Electricity Work?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">AC vs DC, 230V/50Hz, live/neutral/earth, MCB, India grid — Day 23</text>

<!-- LEFT: AC vs DC -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#7c3aed">AC vs DC</text>

<rect x="30" y="104" width="280" height="100" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#5b21b6">Alternating Current (AC)</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">Direction reverses 50 times/second (50 Hz)</text>
<text x="40" y="162" font-family="Arial" font-size="14" fill="#333">V(t) = V₀ sin(2πft); V₀ = 325 V peak</text>
<text x="40" y="182" font-family="Arial" font-size="14" fill="#555">RMS voltage = 230 V (effective value)</text>
<text x="40" y="198" font-family="Arial" font-size="14" fill="#555">Easy to step up/down with transformers</text>

<rect x="30" y="214" width="280" height="80" rx="4" fill="white" stroke="#7c3aed" stroke-width="1"/>
<text x="170" y="232" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Direct Current (DC)</text>
<text x="40" y="252" font-family="Arial" font-size="14" fill="#333">Constant direction: batteries, solar panels</text>
<text x="40" y="272" font-family="Arial" font-size="14" fill="#555">Electronics need DC: adaptor converts AC→DC</text>
<text x="40" y="288" font-family="Arial" font-size="14" fill="#555">HVDC: long-distance (less loss than AC)</text>

<rect x="30" y="304" width="280" height="80" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="170" y="322" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Why AC for Distribution?</text>
<text x="40" y="342" font-family="Arial" font-size="14" fill="#333">Transformer: steps voltage up (↓ I → ↓ I²R loss)</text>
<text x="40" y="362" font-family="Arial" font-size="14" fill="#555">India: 11 kV generated → stepped to 400 kV</text>
<text x="40" y="378" font-family="Arial" font-size="14" fill="#555">Step down to 11 kV → 230 V (home)</text>

<rect x="30" y="394" width="280" height="88" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="170" y="412" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Edison vs Tesla War of Currents</text>
<text x="40" y="432" font-family="Arial" font-size="14" fill="#333">Edison backed DC; Tesla/Westinghouse: AC</text>
<text x="40" y="452" font-family="Arial" font-size="14" fill="#555">AC won (1890s): transformers + less loss</text>
<text x="40" y="470" font-family="Arial" font-size="14" fill="#555">Modern DC revival: HVDC long lines + EVs</text>

<!-- CENTRE: Home wiring safety -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Home Wiring and Safety</text>

<rect x="344" y="104" width="312" height="108" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Three Wires</text>
<text x="354" y="142" font-family="Arial" font-size="14" fill="#333">Live (brown/red): carries 230 V AC — dangerous</text>
<text x="354" y="162" font-family="Arial" font-size="14" fill="#333">Neutral (blue/black): return path (near 0 V)</text>
<text x="354" y="182" font-family="Arial" font-size="14" fill="#555">Earth (green): safety — connects case to ground</text>
<text x="354" y="200" font-family="Arial" font-size="14" fill="#555">Earth wire carries fault current → trips MCB safely</text>

<rect x="344" y="222" width="312" height="90" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="240" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">MCB and Fuse</text>
<text x="354" y="260" font-family="Arial" font-size="14" fill="#333">Fuse: wire melts above rated current</text>
<text x="354" y="280" font-family="Arial" font-size="14" fill="#333">MCB (miniature circuit breaker): trips and resets</text>
<text x="354" y="300" font-family="Arial" font-size="14" fill="#555">RCCB: detects earth leakage (30 mA → trip)</text>
<text x="354" y="316" font-family="Arial" font-size="14" fill="#555">MCB rated: 6A (light), 16A (AC), 32A (oven)</text>

<rect x="344" y="322" width="312" height="88" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="340" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Transformers</text>
<text x="354" y="360" font-family="Arial" font-size="14" fill="#333">V₁/V₂ = N₁/N₂ (turns ratio)</text>
<text x="354" y="380" font-family="Arial" font-size="14" fill="#333">Step up: more turns in secondary (V₂ > V₁)</text>
<text x="354" y="400" font-family="Arial" font-size="14" fill="#555">Ideal transformer: V₁I₁ = V₂I₂ (power conserved)</text>
<text x="354" y="416" font-family="Arial" font-size="14" fill="#555">Core losses: eddy currents (laminated core reduces)</text>

<rect x="344" y="420" width="312" height="62" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="500" y="438" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Electric shock: current through body (≥10 mA harmful)</text>
<text x="500" y="456" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">100 mA: ventricular fibrillation (fatal)</text>
<text x="500" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Earth + RCCB: standard UK/India protection</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Power Infrastructure</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">India's 230 V Standard</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">230 V / 50 Hz (British colonial legacy)</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">USA: 120 V / 60 Hz (different standard)</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">IS 1293: Indian plug standard (round pins)</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">DISCOMS and Billing</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Electricity Board buys in kWh (units)</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1 unit = 1 kWh = 3.6 MJ of energy</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">BESCOM, MSEDCL: state distribution companies</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Load Shedding in India</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Peak demand (summer): 240+ GW demand</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Scheduled cuts: 1–8 hours in rural areas</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Inverter/UPS: DC battery → AC (home backup)</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Rooftop Solar (PM KUSUM)</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">DC from solar panels → grid-tie inverter → AC</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">10 million rooftop solar target by 2026</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Net metering: sell surplus to grid</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">India: 230 V / 50 Hz AC. Live (230V), neutral (0V), earth (safety). MCB trips at overload.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Transformer: V₁/V₂ = N₁/N₂. High V transmission → less I²R loss. Solar DC → inverter → AC grid.</text>
</svg>
