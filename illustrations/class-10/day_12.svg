<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How Are Proteins Made from DNA?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Transcription, translation, ribosomes, and the genetic code — Day 12</text>

<!-- LEFT: Transcription -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#7c3aed">Step 1: Transcription</text>

<rect x="30" y="104" width="280" height="90" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#5b21b6">DNA → mRNA (in nucleus)</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">RNA polymerase binds to promoter region</text>
<text x="40" y="162" font-family="Arial" font-size="14" fill="#333">Reads DNA template strand 3'→5'</text>
<text x="40" y="182" font-family="Arial" font-size="14" fill="#555">Builds mRNA 5'→3' (A,U,G,C bases)</text>

<rect x="30" y="204" width="280" height="90" rx="4" fill="white" stroke="#7c3aed" stroke-width="1"/>
<text x="170" y="222" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">RNA vs DNA</text>
<text x="40" y="242" font-family="Arial" font-size="14" fill="#333">mRNA: single strand; uses U instead of T</text>
<text x="40" y="262" font-family="Arial" font-size="14" fill="#333">DNA codon ATG → mRNA AUG (start)</text>
<text x="40" y="282" font-family="Arial" font-size="14" fill="#555">mRNA exits nucleus through nuclear pore</text>

<rect x="30" y="304" width="280" height="80" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
<text x="170" y="322" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#5b21b6">mRNA Processing (eukaryotes)</text>
<text x="40" y="342" font-family="Arial" font-size="14" fill="#333">Introns (non-coding) removed: splicing</text>
<text x="40" y="362" font-family="Arial" font-size="14" fill="#555">Exons (coding) joined: mature mRNA</text>
<text x="40" y="378" font-family="Arial" font-size="14" fill="#555">5' cap + polyA tail added (stability)</text>

<rect x="30" y="394" width="280" height="88" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="170" y="412" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">Types of RNA</text>
<text x="40" y="432" font-family="Arial" font-size="14" fill="#333">mRNA: messenger (carries code)</text>
<text x="40" y="450" font-family="Arial" font-size="14" fill="#333">tRNA: transfer (brings amino acid)</text>
<text x="40" y="468" font-family="Arial" font-size="14" fill="#555">rRNA: ribosomal (structural + catalytic)</text>

<!-- CENTRE: Translation -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Step 2: Translation</text>

<rect x="344" y="104" width="312" height="108" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">mRNA → Protein (at ribosome)</text>
<text x="354" y="144" font-family="Arial" font-size="14" fill="#333">Ribosome: 2 subunits (small + large)</text>
<text x="354" y="164" font-family="Arial" font-size="14" fill="#333">Reads mRNA codon by codon (5'→3')</text>
<text x="354" y="184" font-family="Arial" font-size="14" fill="#555">tRNA anticodon matches mRNA codon</text>
<text x="354" y="200" font-family="Arial" font-size="14" fill="#555">Amino acid added to growing polypeptide chain</text>

<rect x="344" y="222" width="312" height="100" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="240" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Initiation-Elongation-Termination</text>
<text x="354" y="262" font-family="Arial" font-size="14" fill="#333">Start: AUG codon → methionine (Met)</text>
<text x="354" y="282" font-family="Arial" font-size="14" fill="#333">Elongation: ribosome slides one codon at a time</text>
<text x="354" y="302" font-family="Arial" font-size="14" fill="#555">Stop codon (UAA/UAG/UGA): releases chain</text>
<text x="354" y="318" font-family="Arial" font-size="14" fill="#555">Polypeptide folds → functional protein</text>

<rect x="344" y="332" width="312" height="90" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="350" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Protein Folding</text>
<text x="354" y="372" font-family="Arial" font-size="14" fill="#333">Primary: amino acid sequence</text>
<text x="354" y="392" font-family="Arial" font-size="14" fill="#333">Secondary: α-helix or β-sheet (H-bonds)</text>
<text x="354" y="412" font-family="Arial" font-size="14" fill="#555">Tertiary: 3D shape (determines function)</text>
<text x="354" y="426" font-family="Arial" font-size="14" fill="#555">Misfolding → disease (Alzheimer's: β-amyloid)</text>

<rect x="344" y="432" width="312" height="50" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="500" y="450" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">mRNA vaccine (COVID): inject mRNA → cells</text>
<text x="500" y="468" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">make spike protein → immune response</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Protein Science</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Insulin Production</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Recombinant insulin: human gene → E. coli</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Biocon Bangalore: world's largest biosimilar</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Exports insulin to 90+ countries</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Vaccine Production (SII)</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Serum Institute: world's largest vaccine maker</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Produces 1.5 billion doses/year</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Protein translation at industrial scale</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Nutrition: Protein Deficiency</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 80% population protein deficient</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Dal + rice = incomplete → supplement with curd</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">FSSAI: protein labelling on food packs</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">CSIR Protein Research</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">CCMB: protein structure and folding</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">IISc: structural biology + drug targets</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">AlphaFold: Indian scientists contribute</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Transcription: DNA → mRNA (nucleus). Translation: mRNA → protein (ribosome, codon by codon).</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">tRNA anticodon matches mRNA codon; adds amino acid. Biocon: world's largest insulin biosimilar maker.</text>
</svg>
