<text x="199" y="208" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">+</text>
<text x="301" y="208" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">−</text>
<text x="379" y="208" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">+</text>
<text x="80" y="297" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">− output</text>
<text x="430" y="297" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">+ output</text>
<rect x="722" y="205" width="56" height="35" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
