<text x="800" y="195" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">+</text>
<text x="700" y="295" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">−</text>
<text x="800" y="295" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">+</text>
