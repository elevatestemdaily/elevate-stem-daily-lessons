<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How can several cells supply a different voltage when</text>
<text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">rearranged?</text>
<text x="500" y="98" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Two fictional ideal cells, each 2 V and 3 Ah; paper comparison only</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Aiding series</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Matched parallel</text>
<rect x="132" y="220" width="56" height="55" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<rect x="312" y="220" width="56" height="55" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="80" y1="248" x2="132" y2="248" stroke="#1f5f8b" stroke-width="2"/>
<line x1="188" y1="248" x2="312" y2="248" stroke="#1f5f8b" stroke-width="2"/>
<line x1="368" y1="248" x2="430" y2="248" stroke="#1f5f8b" stroke-width="2"/>
