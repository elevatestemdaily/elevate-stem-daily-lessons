<text x="850" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">+ output</text>
<text x="250" y="406" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f5f8b">4 V; 3 Ah → 12 Wh</text>
<text x="750" y="406" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f5f8b">2 V; 6 Ah → 12 Wh</text>
<text x="500" y="460" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">V and Ah describe different quantities; equal Wh does not ensure device suitability.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Never rearrange real cell packs from this diagram; compatibility and protection matter.</text>
