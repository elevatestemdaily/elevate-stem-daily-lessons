<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Why Does Corrosion Happen?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Oxidation, electrochemical cells, rusting mechanism — Day 6</text>

<!-- LEFT: Rusting mechanism -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#dc2626">Rusting of Iron</text>

<rect x="30" y="104" width="280" height="80" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">The Rust Reaction</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">4Fe + 3O₂ + 6H₂O → 4Fe(OH)₃ → 2Fe₂O₃·3H₂O</text>
<text x="40" y="160" font-family="Arial" font-size="14" fill="#555">Rust = hydrated iron oxide (Fe₂O₃·nH₂O)</text>
<text x="40" y="176" font-family="Arial" font-size="14" fill="#555">Needs both O₂ AND water to form</text>

<rect x="30" y="194" width="280" height="120" rx="4" fill="white" stroke="#dc2626" stroke-width="1"/>
<text x="170" y="212" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Conditions for Rusting</text>
<text x="40" y="232" font-family="Arial" font-size="14" fill="#333">Water (moisture): electrolyte needed</text>
<text x="40" y="252" font-family="Arial" font-size="14" fill="#333">Oxygen: oxidising agent</text>
<text x="40" y="272" font-family="Arial" font-size="14" fill="#555">Salt: speeds up (better electrolyte)</text>
<text x="40" y="292" font-family="Arial" font-size="14" fill="#555">Acid: speeds up (lowers pH)</text>
<text x="40" y="308" font-family="Arial" font-size="14" fill="#555">Pure water: very slow. Dry air: no rust.</text>

<rect x="30" y="324" width="280" height="80" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="170" y="342" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Electrochemical Explanation</text>
<text x="40" y="362" font-family="Arial" font-size="14" fill="#333">Anode: Fe → Fe²⁺ + 2e⁻ (oxidation)</text>
<text x="40" y="382" font-family="Arial" font-size="14" fill="#333">Cathode: O₂ + H₂O + 4e⁻ → 4OH⁻</text>
<text x="40" y="398" font-family="Arial" font-size="14" fill="#555">Corrosion = spontaneous galvanic cell</text>

<rect x="30" y="414" width="280" height="68" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
<text x="170" y="432" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">Corrosion vs Rusting</text>
<text x="40" y="452" font-family="Arial" font-size="14" fill="#333">Rusting: only iron (Fe₂O₃·nH₂O)</text>
<text x="40" y="470" font-family="Arial" font-size="14" fill="#555">Corrosion: any metal (Cu tarnish, Al oxide)</text>

<!-- CENTRE: Types + factors -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Types of Corrosion</text>

<rect x="344" y="104" width="312" height="80" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Galvanic Corrosion</text>
<text x="354" y="142" font-family="Arial" font-size="14" fill="#333">Two different metals in contact + electrolyte</text>
<text x="354" y="162" font-family="Arial" font-size="14" fill="#555">Less reactive metal (cathode) protected</text>
<text x="354" y="178" font-family="Arial" font-size="14" fill="#555">More reactive (anode) corrodes faster</text>

<rect x="344" y="194" width="312" height="80" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="500" y="212" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">Crevice Corrosion</text>
<text x="354" y="232" font-family="Arial" font-size="14" fill="#333">Inside gaps, joints, under gaskets</text>
<text x="354" y="252" font-family="Arial" font-size="14" fill="#555">Depleted O₂ in crevice → concentration cell</text>
<text x="354" y="268" font-family="Arial" font-size="14" fill="#555">Common in ships, chemical tanks</text>

<rect x="344" y="284" width="312" height="80" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="500" y="302" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Stress Corrosion Cracking</text>
<text x="354" y="322" font-family="Arial" font-size="14" fill="#333">Tensile stress + corrosive environment</text>
<text x="354" y="342" font-family="Arial" font-size="14" fill="#555">Cracks propagate rapidly: catastrophic</text>
<text x="354" y="358" font-family="Arial" font-size="14" fill="#555">Bridge failures, pipeline bursts</text>

<rect x="344" y="374" width="312" height="108" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="392" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Economic Impact</text>
<text x="354" y="414" font-family="Arial" font-size="14" fill="#333">Global cost of corrosion: ~$2.5 trillion/yr</text>
<text x="354" y="434" font-family="Arial" font-size="14" fill="#333">India: ~₹2 lakh crore annual loss</text>
<text x="354" y="454" font-family="Arial" font-size="14" fill="#555">3–4% of GDP in developing nations</text>
<text x="354" y="470" font-family="Arial" font-size="14" fill="#555">Bridges, pipelines, ships, reinforcing bars</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Corrosion Challenge</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Coastal Infrastructure</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">7,516 km coastline: salt + humidity</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Mumbai bridges: accelerated corrosion</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">CPWD: special coatings for coastal zones</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Rebar in Concrete (RCC)</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Reinforced concrete: steel bars inside</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Chloride penetration → rebar rust → spalling</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">30-year buildings fail; stainless rebar used</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">DRDO Anti-Corrosion Research</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">DRDO: corrosion-resistant naval alloys</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">DMRL Hyderabad: special steels</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Monsoon conditions: extra challenge</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Ancient Wisdom</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Iron Pillar Delhi: 1600-yr rust-free</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">FePO₄ passive layer: natural protection</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Replicated in modern phosphate coatings</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Rusting needs O₂ + water. 4Fe + 3O₂ + 6H₂O → 2Fe₂O₃·3H₂O. Electrochemical: Fe oxidised at anode.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">India: ₹2 lakh crore/yr corrosion loss. 7,516 km coastline = high-risk zone. Delhi pillar: 1600-yr rust-free.</text>
</svg>
