<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why do leaves open stomata without emptying all their water?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Solute and water changes alter turgor; wall geometry directs the movement</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Narrower model pore</text>
<path d="M238 185 C143 185 143 345 238 345 C263 345 243 305 218 280 C198 260 258 225 238 185 Z" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<path d="M262 185 C357 185 357 345 262 345 C237 345 257 305 282 280 C302 260 242 225 262 185 Z" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Wider model pore</text>
<path d="M705 185 C610 185 610 345 705 345 C730 345 710 305 685 280 C665 260 725 225 705 185 Z" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<path d="M795 185 C890 185 890 345 795 345 C770 345 790 305 815 280 C835 260 775 225 795 185 Z" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<line x1="565" y1="265" x2="625" y2="265" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="935" y1="265" x2="875" y2="265" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="413" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Lower turgor in this sequence</text>
<text x="750" y="413" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Water entry supports opening</text>
<text x="500" y="460" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">The pore is the gap, not a third cell; plant anatomy and timing vary.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Local guard-cell mechanics regulate a water-loss and gas-exchange trade-off.</text>
</svg>
