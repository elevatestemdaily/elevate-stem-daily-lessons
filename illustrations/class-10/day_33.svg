<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How does a kilowatt-hour measure electricity bought for a shop?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Power is a rate; multiply by a stated duration to obtain energy</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Invented device and interval</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Accumulated energy</text>
<line x1="90" y1="330" x2="420" y2="330" stroke="#1f5f8b" stroke-width="2"/>
<line x1="90" y1="330" x2="90" y2="185" stroke="#1f5f8b" stroke-width="2"/>
<rect x="110" y="220" width="250" height="105" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<text x="250" y="195" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f5f8b">0.5 kW</text>
<text x="250" y="371" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#1f5f8b">2 hours</text>
<line x1="440" y1="270" x2="550" y2="270" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="750" y="250" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1f5f8b">0.5 kW × 2 h = 1 kWh</text>
<text x="750" y="310" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">1 kWh = 3.6 million joules</text>
<text x="500" y="431" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Actual operating pattern matters; nameplate power may not stay constant.</text>
<text x="500" y="464" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Energy accounting is separate from current tariffs and other charges.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">No sockets, wiring, meter covers or powered equipment are handled.</text>
</svg>
