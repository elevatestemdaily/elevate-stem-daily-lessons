<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does extra carbon dioxide slow Earth&#x27;s cooling to space?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Selective infrared exchange changes an open energy balance</text>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Atmosphere absorbs and emits; it is not a solid roof</text>
<rect x="170" y="195" width="660" height="85" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="70" y1="355" x2="930" y2="355" stroke="#579b70" stroke-width="6"/>
<line x1="135" y1="155" x2="250" y2="340" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="320" y1="340" x2="320" y2="230" stroke="#e6a23c" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="450" y1="235" x2="510" y2="160" stroke="#e6a23c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="560" y1="235" x2="560" y2="335" stroke="#e6a23c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="735" y1="335" x2="735" y2="155" stroke="#e6a23c" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="255" cy="230" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="405" cy="250" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="630" cy="220" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="780" cy="250" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<text x="250" y="405" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Solar input and infrared output differ</text>
<text x="750" y="405" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Energy still reaches space</text>
<text x="500" y="457" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">Old balance → altered transfer at old temperatures → temperature adjustment</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">No current concentration or numerical climate forecast is claimed.</text>
</svg>
