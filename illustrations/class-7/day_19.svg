<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<!-- Background -->
<rect width="1000" height="560" fill="#f8fbff"/>
<!-- Title -->
<text x="500" y="38" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">Why does iron rust?</text>
<text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Oxidation: iron + oxygen + water → iron oxide — Day 19</text>

<!-- Chemical equation banner -->
<rect x="20" y="68" width="960" height="38" rx="5" fill="#1f5f8b"/>
<text x="500" y="92" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">4Fe  +  3O₂  +  6H₂O  →  Fe₂O₃ · xH₂O  (hydrated iron oxide = rust)</text>

<!-- THREE COMPARISON PANELS -->
<!-- Panel 1: Shiny iron nail (x=20-308) -->
<rect x="20" y="116" width="288" height="258" rx="6" fill="#f0f7ff" stroke="#1f5f8b" stroke-width="2"/>
<text x="164" y="136" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">Fresh Iron Nail</text>
<!-- Nail shape: head + shaft -->
<rect x="120" y="152" width="88" height="22" rx="4" fill="#9ca3af"/>
<rect x="154" y="174" width="20" height="90" rx="3" fill="#9ca3af"/>
<!-- Shine lines -->
<line x1="128" y1="155" x2="138" y2="162" stroke="white" stroke-width="2" opacity="0.8"/>
<line x1="136" y1="153" x2="144" y2="159" stroke="white" stroke-width="2" opacity="0.6"/>
<!-- Labels -->
<text x="164" y="288" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Smooth surface</text>
<text x="164" y="302" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Metallic grey. Iron atoms</text>
<text x="164" y="316" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">tightly packed in crystal.</text>
<!-- Conditions needed -->
<rect x="35" y="330" width="258" height="36" rx="4" fill="#dbeafe"/>
<text x="164" y="345" text-anchor="middle" font-family="Arial" font-size="14" fill="#1f5f8b">Needs: Fe + O₂ + H₂O</text>
<text x="164" y="360" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Remove any one → no rust</text>

<!-- Panel 2: Rusted nail (x=336-664) -->
<rect x="336" y="116" width="328" height="258" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="500" y="136" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#ea580c">Rusted Nail (Fe₂O₃)</text>
<!-- Rusted nail: rough orange-brown -->
<rect x="416" y="152" width="168" height="22" rx="4" fill="#b45309"/>
<rect x="490" y="174" width="20" height="90" rx="3" fill="#b45309"/>
<!-- Rust texture dots -->
<circle cx="425" cy="158" r="3" fill="#dc2626" opacity="0.6"/>
<circle cx="440" cy="163" r="4" fill="#dc2626" opacity="0.7"/>
<circle cx="456" cy="156" r="3" fill="#7f1d1d" opacity="0.5"/>
<circle cx="470" cy="162" r="4" fill="#dc2626" opacity="0.6"/>
<circle cx="510" cy="180" r="3" fill="#dc2626" opacity="0.7"/>
<circle cx="498" cy="195" r="4" fill="#b45309" opacity="0.6"/>
<circle cx="508" cy="215" r="3" fill="#dc2626" opacity="0.5"/>
<!-- Water molecule O₂ labels -->
<text x="353" y="195" font-family="Arial" font-size="14" fill="#0369a1">H₂O</text>
<text x="353" y="210" font-family="Arial" font-size="14" fill="#15803d">O₂</text>
<!-- Rust facts text -->
<text x="351" y="288" font-family="Arial" font-size="14" fill="#333">Crumbly, red-brown, flakes off.</text>
<text x="351" y="302" font-family="Arial" font-size="14" fill="#333">Rust takes up MORE volume</text>
<text x="351" y="316" font-family="Arial" font-size="14" fill="#333">than iron → cracks and weakens.</text>
<text x="351" y="330" font-family="Arial" font-size="14" fill="#555">Salt water: 10× faster (electrolyte</text>
<text x="351" y="344" font-family="Arial" font-size="14" fill="#555">increases electron transfer rate).</text>
<text x="351" y="358" font-family="Arial" font-size="14" fill="#555">Water = enables electron transfer.</text>

<!-- Panel 3: Prevention (x=692-978) -->
<rect x="692" y="116" width="286" height="258" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="2"/>
<text x="835" y="136" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Preventing Rust</text>

<!-- Galvanising -->
<rect x="707" y="146" width="256" height="48" rx="4" fill="#a7f3d0" stroke="#065f46" stroke-width="1"/>
<text x="835" y="163" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Galvanising (zinc coat)</text>
<text x="835" y="177" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Zinc sacrificial anode: O₂ attacks</text>
<text x="835" y="189" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Zn first, sparing iron underneath.</text>

<!-- Stainless steel -->
<rect x="707" y="202" width="256" height="48" rx="4" fill="#a7f3d0" stroke="#065f46" stroke-width="1"/>
<text x="835" y="219" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Stainless steel (chromium)</text>
<text x="835" y="233" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Cr forms Cr₂O₃ passive layer —</text>
<text x="835" y="247" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">self-sealing barrier against O₂.</text>

<!-- Painting -->
<rect x="707" y="258" width="256" height="48" rx="4" fill="#a7f3d0" stroke="#065f46" stroke-width="1"/>
<text x="835" y="275" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Painting / Oiling</text>
<text x="835" y="289" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Physical barrier: blocks O₂ and H₂O</text>
<text x="835" y="303" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">from reaching iron surface.</text>

<!-- Everyday examples -->
<text x="707" y="325" font-family="Arial" font-size="14" fill="#065f46" font-weight="700">Examples:</text>
<text x="707" y="338" font-family="Arial" font-size="14" fill="#333">Galvanised: corrugated roofing, buckets</text>
<text x="707" y="351" font-family="Arial" font-size="14" fill="#333">Stainless: kitchen utensils, surgical tools</text>
<text x="707" y="364" font-family="Arial" font-size="14" fill="#333">Paint: bridges, vehicles, ships</text>

<!-- Why it matters box -->
<rect x="20" y="385" width="960" height="100" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="500" y="403" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Why Rust Matters — Economic Impact</text>
<text x="35" y="423" font-family="Arial" font-size="14" fill="#333">Rust costs India billions of rupees annually — bridges, railway tracks, and pipelines weaken as iron oxide expands, cracking</text>
<text x="35" y="438" font-family="Arial" font-size="14" fill="#333">and flaking. Mumbai's coastal humidity accelerates rusting because salty sea air is a strong electrolyte (enabling fast electron</text>
<text x="35" y="453" font-family="Arial" font-size="14" fill="#333">transfer). Ancient Iron Pillar, Delhi: 1,600 years old, almost no rust — misawite (phosphoric) layer protects the surface.</text>
<text x="35" y="468" font-family="Arial" font-size="14" fill="#555">The pillar was made from relatively pure iron with high phosphorus content — a natural corrosion barrier discovered by modern science.</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="525" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Rust = Fe + O₂ + H₂O → iron oxide. Remove any one ingredient → no rust. Zinc/paint/chromium block O₂ and H₂O access.</text>
</svg>
