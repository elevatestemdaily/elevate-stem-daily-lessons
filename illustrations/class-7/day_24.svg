<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="blueScArr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb"/>
  </marker>
  <marker id="redScArr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626"/>
  </marker>
  <marker id="orangeScArr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#ea580c"/>
  </marker>
</defs>
<!-- Background: gradient sky appearance -->
<rect width="1000" height="560" fill="#f8fbff"/>
<!-- Title -->
<text x="500" y="38" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">Why is the sky blue?</text>
<text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Rayleigh scattering — blue light scatters ~5× more than red — Day 24</text>

<!-- Vertical divider -->
<line x1="500" y1="68" x2="500" y2="460" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4"/>

<!-- LEFT PANEL: Midday — blue sky (x=20-490) -->
<!-- Sky background -->
<rect x="20" y="68" width="470" height="310" rx="6" fill="#bfdbfe"/>
<!-- Ground -->
<rect x="20" y="378" width="470" height="60" rx="0" fill="#4ade80"/>
<!-- Person (observer) looking up -->
<circle cx="255" cy="416" r="16" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
<line x1="255" y1="432" x2="255" y2="458" stroke="#78350f" stroke-width="2"/>
<line x1="255" y1="442" x2="235" y2="455" stroke="#78350f" stroke-width="2"/>
<line x1="255" y1="442" x2="275" y2="455" stroke="#78350f" stroke-width="2"/>
<!-- Eyes looking up -->
<text x="255" y="420" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">↑ look</text>

<!-- Sun: overhead (midday) -->
<circle cx="255" cy="92" r="28" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
<text x="255" y="97" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#78350f">SUN</text>
<!-- Sun rays -->
<line x1="255" y1="60" x2="255" y2="50" stroke="#fbbf24" stroke-width="2"/>
<line x1="278" y1="68" x2="286" y2="60" stroke="#fbbf24" stroke-width="2"/>
<line x1="232" y1="68" x2="224" y2="60" stroke="#fbbf24" stroke-width="2"/>

<!-- Atmosphere band label -->
<text x="35" y="88" font-family="Arial" font-size="14" fill="#1e40af" font-weight="700">Atmosphere</text>
<text x="35" y="100" font-family="Arial" font-size="14" fill="#1e40af">(N₂ + O₂ molecules)</text>

<!-- Short path annotation -->
<line x1="255" y1="120" x2="255" y2="380" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="115" y="200" font-family="Arial" font-size="14" fill="#1e3a8a" font-weight="700">Short path</text>
<text x="115" y="212" font-family="Arial" font-size="14" fill="#1e3a8a">through atmosphere</text>

<!-- Blue scatter arrows (going sideways in many directions) -->
<line x1="255" y1="160" x2="130" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#blueScArr)"/>
<line x1="255" y1="175" x2="105" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#blueScArr)"/>
<line x1="255" y1="220" x2="120" y2="240" stroke="#2563eb" stroke-width="2" marker-end="url(#blueScArr)"/>
<line x1="255" y1="160" x2="380" y2="142" stroke="#2563eb" stroke-width="2" marker-end="url(#blueScArr)"/>
<line x1="255" y1="175" x2="410" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#blueScArr)"/>
<line x1="255" y1="220" x2="395" y2="245" stroke="#2563eb" stroke-width="2" marker-end="url(#blueScArr)"/>
<line x1="255" y1="195" x2="180" y2="108" stroke="#2563eb" stroke-width="2" marker-end="url(#blueScArr)"/>
<line x1="255" y1="195" x2="330" y2="108" stroke="#2563eb" stroke-width="2" marker-end="url(#blueScArr)"/>

<!-- Observer sees blue from all directions -->
<text x="35" y="320" font-family="Arial" font-size="14" fill="#1e40af" font-weight="700">Blue light hits observer's</text>
<text x="35" y="333" font-family="Arial" font-size="14" fill="#1e40af">eyes from all directions</text>
<text x="35" y="348" font-family="Arial" font-size="14" fill="#1e40af">→ sky looks BLUE</text>

<!-- MIDDAY label -->
<text x="255" y="472" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e40af">MIDDAY — short path → blue sky</text>

<!-- RIGHT PANEL: Sunset — red/orange sky (x=510-978) -->
<!-- Sky background (orange-red at sunset) -->
<rect x="510" y="68" width="468" height="310" rx="6" fill="#fed7aa"/>
<!-- Ground -->
<rect x="510" y="378" width="468" height="60" rx="0" fill="#4ade80"/>

<!-- Sun: at horizon -->
<circle cx="978" cy="378" r="35" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
<text x="962" y="382" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">SUN</text>
<!-- Sun at horizon label -->
<text x="868" y="368" font-family="Arial" font-size="14" fill="#9a3412">near horizon</text>

<!-- Long path through atmosphere -->
<line x1="530" y1="380" x2="944" y2="380" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="700" y="365" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a" font-weight="700">LONG PATH through atmosphere</text>

<!-- Blue arrows scattered away along path (shown early, not reaching observer) -->
<line x1="870" y1="380" x2="850" y2="340" stroke="#2563eb" stroke-width="2" marker-end="url(#blueScArr)"/>
<line x1="850" y1="380" x2="825" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#blueScArr)"/>
<line x1="830" y1="380" x2="800" y2="345" stroke="#2563eb" stroke-width="2" marker-end="url(#blueScArr)"/>
<text x="810" y="315" text-anchor="middle" font-family="Arial" font-size="14" fill="#2563eb" font-weight="700">blue scattered away</text>
<text x="810" y="327" text-anchor="middle" font-family="Arial" font-size="14" fill="#2563eb">before reaching observer</text>

<!-- Red/orange arrows reaching observer -->
<line x1="870" y1="380" x2="610" y2="380" stroke="#dc2626" stroke-width="2.5" marker-end="url(#redScArr)"/>
<!-- Observer on right panel -->
<circle cx="560" cy="416" r="16" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
<line x1="560" y1="432" x2="560" y2="458" stroke="#78350f" stroke-width="2"/>
<line x1="560" y1="442" x2="540" y2="455" stroke="#78350f" stroke-width="2"/>
<line x1="560" y1="442" x2="580" y2="455" stroke="#78350f" stroke-width="2"/>
<text x="560" y="420" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">→ look</text>

<!-- Red/orange reaches observer label -->
<text x="525" y="298" font-family="Arial" font-size="14" fill="#9a3412" font-weight="700">Only red + orange</text>
<text x="525" y="311" font-family="Arial" font-size="14" fill="#9a3412">wavelengths survive the</text>
<text x="525" y="324" font-family="Arial" font-size="14" fill="#9a3412">long atmospheric path</text>
<text x="525" y="337" font-family="Arial" font-size="14" fill="#9a3412">→ sky looks ORANGE-RED</text>

<!-- SUNSET label -->
<text x="744" y="472" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#9a3412">SUNSET — long path → blue gone → red/orange sky</text>

<!-- BOTTOM: Rayleigh scattering key + spectrum bar -->
<rect x="20" y="490" width="960" height="0" rx="0" fill="none"/>

<!-- Spectrum bar across bottom -->
<rect x="20" y="462" width="960" height="30" rx="5" fill="none"/>
<!-- Spectrum colour bar -->
<rect x="20" y="462" width="137" height="28" rx="3" fill="#7c3aed"/>
<rect x="157" y="462" width="137" height="28" fill="#2563eb"/>
<rect x="294" y="462" width="137" height="28" fill="#16a34a"/>
<rect x="431" y="462" width="137" height="28" fill="#ca8a04"/>
<rect x="568" y="462" width="137" height="28" fill="#ea580c"/>
<rect x="705" y="462" width="275" height="28" rx="3" fill="#dc2626"/>
<!-- Spectrum labels -->
<text x="88" y="481" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">VIOLET</text>
<text x="225" y="481" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">BLUE</text>
<text x="362" y="481" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">GREEN</text>
<text x="499" y="481" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">YELLOW</text>
<text x="636" y="481" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">ORANGE</text>
<text x="842" y="481" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">RED — scatters least</text>
<!-- "scatters most" arrow on left -->
<text x="88" y="455" text-anchor="middle" font-family="Arial" font-size="14" fill="#7c3aed" font-weight="700">↑ scatters most</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="525" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Rayleigh scattering: blue scatters ~5× more than red. Midday sky = blue. Sunset = blue gone, red/orange sky.</text>
</svg>
