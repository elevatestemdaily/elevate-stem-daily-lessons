<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="magmaArr27" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
  </marker>
  <marker id="gasArr27" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#f97316"/>
  </marker>
</defs>
<!-- Background -->
<rect width="1000" height="560" fill="#f8fbff"/>
<!-- Title -->
<text x="500" y="38" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">How do volcanoes work?</text>
<text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Magma rises through pressure, erupts as lava — Day 27</text>

<!-- MAIN: Volcano cross-section (x=20-600, y=68-478) -->
<rect x="20" y="68" width="580" height="410" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="310" y="88" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#9a3412">Stratovolcano Cross-Section</text>

<!-- Earth layers (bottom to top) -->
<!-- Mantle (deep) -->
<rect x="35" y="400" width="550" height="68" rx="4" fill="#f97316" opacity="0.6"/>
<text x="310" y="430" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d" font-weight="700">MANTLE — hot semi-fluid rock, convection currents drive plates</text>
<text x="310" y="444" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">At subduction zones: water lowers rock melting point → magma forms</text>
<text x="310" y="458" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">At divergent boundary: reduced pressure → decompression melting</text>

<!-- Crust (middle zone) -->
<rect x="35" y="280" width="550" height="120" rx="0" fill="#d97706" opacity="0.3"/>
<text x="55" y="305" font-family="Arial" font-size="14" fill="#92400e">CRUST</text>

<!-- Magma chamber -->
<ellipse cx="310" cy="340" rx="120" ry="45" fill="#dc2626" opacity="0.7"/>
<text x="310" y="338" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">MAGMA CHAMBER</text>
<text x="310" y="351" text-anchor="middle" font-family="Arial" font-size="14" fill="white">pressure building</text>

<!-- Gas bubbles in magma -->
<circle cx="255" cy="335" r="5" fill="#fbbf24" opacity="0.8"/>
<circle cx="275" cy="325" r="4" fill="#fbbf24" opacity="0.8"/>
<circle cx="295" cy="345" r="6" fill="#fbbf24" opacity="0.8"/>
<circle cx="330" cy="330" r="4" fill="#fbbf24" opacity="0.8"/>
<circle cx="355" cy="342" r="5" fill="#fbbf24" opacity="0.8"/>
<text x="430" y="340" font-family="Arial" font-size="14" fill="#fbbf24" font-weight="700">dissolved gas</text>
<text x="430" y="351" font-family="Arial" font-size="14" fill="#fbbf24">(H₂O, CO₂, SO₂)</text>

<!-- Conduit (vent pipe) -->
<rect x="285" y="165" width="50" height="115" rx="0" fill="#dc2626" opacity="0.7"/>

<!-- Pressure arrows in conduit -->
<line x1="310" y1="340" x2="310" y2="295" stroke="#f97316" stroke-width="2.5" marker-end="url(#magmaArr27)"/>
<line x1="310" y1="280" x2="310" y2="232" stroke="#f97316" stroke-width="2.5" marker-end="url(#magmaArr27)"/>

<!-- Volcano cone (surface) -->
<!-- Left slope -->
<polygon points="120,280 310,95 370,165" fill="#78350f" opacity="0.8"/>
<polygon points="35,280 310,95 120,280" fill="#92400e" opacity="0.9"/>
<!-- Right slope -->
<polygon points="500,280 310,95 285,165" fill="#78350f" opacity="0.8"/>
<polygon points="565,280 310,95 500,280" fill="#6b3a0e" opacity="0.9"/>

<!-- Crater at top -->
<ellipse cx="310" cy="100" rx="30" ry="12" fill="#dc2626"/>

<!-- Lava flowing from crater -->
<path d="M295,100 Q240,140 200,200 Q170,250 155,280" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
<path d="M325,100 Q380,150 420,210 Q455,260 470,280" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>

<!-- Lava flow labels -->
<text x="145" y="295" font-family="Arial" font-size="14" fill="#f97316" font-weight="700">lava flow</text>

<!-- Ash cloud at top -->
<ellipse cx="310" cy="78" rx="50" ry="18" fill="#6b7280" opacity="0.6"/>
<ellipse cx="280" cy="65" rx="30" ry="14" fill="#9ca3af" opacity="0.6"/>
<ellipse cx="340" cy="60" rx="35" ry="16" fill="#6b7280" opacity="0.5"/>
<!-- Ejected fragments -->
<line x1="310" y1="85" x2="280" y2="52" stroke="#9ca3af" stroke-width="2" marker-end="url(#gasArr27)"/>
<line x1="310" y1="85" x2="345" y2="48" stroke="#9ca3af" stroke-width="2" marker-end="url(#gasArr27)"/>
<text x="210" y="55" font-family="Arial" font-size="14" fill="#374151">ash + pyroclasts</text>

<!-- Labels on diagram -->
<text x="55" y="275" font-family="Arial" font-size="14" fill="#555">crater</text>
<text x="55" y="245" font-family="Arial" font-size="14" fill="#555">↑ vent/conduit</text>
<text x="55" y="195" font-family="Arial" font-size="14" fill="#9a3412" font-weight="700">magma rises</text>
<text x="55" y="207" font-family="Arial" font-size="14" fill="#9a3412">less dense than</text>
<text x="55" y="219" font-family="Arial" font-size="14" fill="#9a3412">solid rock above</text>

<!-- RIGHT PANEL: Two volcano comparison (x=610-978, y=68-290) -->
<rect x="610" y="68" width="368" height="222" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="794" y="88" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Two Types of Eruption</text>

<!-- Shield volcano (left sub-panel) -->
<rect x="620" y="96" width="168" height="185" rx="4" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
<text x="704" y="114" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Shield Volcano</text>
<!-- Wide flat profile -->
<polygon points="625,230 704,165 783,230" fill="#065f46" opacity="0.6"/>
<ellipse cx="704" cy="166" rx="6" ry="4" fill="#f97316"/>
<!-- Gentle lava flow -->
<path d="M710,170 Q740,195 760,225" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
<text x="704" y="246" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">Low silica magma</text>
<text x="704" y="259" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">Runny → gas escapes</text>
<text x="704" y="272" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">gradually. Lava oozes</text>
<text x="704" y="285" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">Example: Hawaii</text>

<!-- Stratovolcano (right sub-panel) -->
<rect x="795" y="96" width="175" height="185" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="882" y="114" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Stratovolcano</text>
<!-- Steep profile -->
<polygon points="800,230 882,130 960,230" fill="#dc2626" opacity="0.6"/>
<ellipse cx="882" cy="131" rx="5" ry="5" fill="#fbbf24"/>
<!-- Explosive plume -->
<ellipse cx="882" cy="115" rx="30" ry="12" fill="#6b7280" opacity="0.5"/>
<path d="M882,126 Q862,105 845,90" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#gasArr27)"/>
<path d="M882,126 Q900,105 918,90" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#gasArr27)"/>
<text x="882" y="246" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">High silica magma</text>
<text x="882" y="259" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">Thick → gas trapped →</text>
<text x="882" y="272" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">pressure → EXPLOSION</text>
<text x="882" y="285" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Example: Krakatoa, Pinatubo</text>

<!-- Cola bottle analogy box (x=610-978, y=298-478) -->
<rect x="610" y="298" width="368" height="180" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="794" y="318" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">The Cola Bottle Analogy</text>

<!-- Cola bottle -->
<rect x="625" y="335" width="35" height="90" rx="8" fill="#d1fae5" stroke="#065f46" stroke-width="2"/>
<rect x="635" y="325" width="15" height="15" rx="4" fill="#4ade80" stroke="#065f46" stroke-width="1.5"/>
<!-- Bubbles in bottle -->
<circle cx="633" cy="390" r="3" fill="#a7f3d0"/>
<circle cx="643" cy="375" r="4" fill="#a7f3d0"/>
<circle cx="650" cy="395" r="3" fill="#a7f3d0"/>
<text x="680" y="355" font-family="Arial" font-size="14" fill="#7c3aed">Sealed cola: CO₂ dissolved</text>
<text x="680" y="368" font-family="Arial" font-size="14" fill="#7c3aed">under pressure (= magma</text>
<text x="680" y="381" font-family="Arial" font-size="14" fill="#7c3aed">in chamber, gas dissolved).</text>
<text x="680" y="396" font-family="Arial" font-size="14" fill="#7c3aed">Open cap slowly (low silica) →</text>
<text x="680" y="409" font-family="Arial" font-size="14" fill="#7c3aed">gentle fizz. Shake + open</text>
<text x="680" y="422" font-family="Arial" font-size="14" fill="#7c3aed">(high silica) → explosion!</text>

<text x="625" y="455" font-family="Arial" font-size="14" fill="#555" font-weight="700">India: Deccan Traps</text>
<text x="625" y="468" font-family="Arial" font-size="14" fill="#333">Flood basalt 66 Mya → Maharashtra/Karnataka black soil.</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="525" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Magma rises. Pressure exceeds rock strength → eruption. High-silica = explosive; low-silica = lava flow.</text>
</svg>
