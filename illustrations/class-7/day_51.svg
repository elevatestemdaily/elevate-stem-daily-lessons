<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why do gaps help railway tracks cope with hot weather?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Free expansion changes length; restrained expansion creates stress</text>
<text x="250" y="134" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Allowance before warming</text>
<text x="750" y="134" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Less allowance after warming</text>
<rect x="65" y="185" width="160" height="35" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<rect x="275" y="185" width="160" height="35" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<rect x="565" y="185" width="177" height="35" rx="8" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="758" y="185" width="177" height="35" rx="8" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="190" y1="255" x2="240" y2="255" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="310" y1="255" x2="260" y2="255" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="291" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Space can accommodate movement</text>
<text x="750" y="291" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Gaps shown enlarged</text>
<text x="250" y="354" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Free length change</text>
<text x="750" y="354" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Restraint can create instability</text>
<line x1="90" y1="408" x2="405" y2="408" stroke="#579b70" stroke-width="6"/>
<path d="M580 408 Q650 408 690 380 Q750 335 805 408 L910 408" fill="none" stroke="#e6a23c" stroke-width="6"/>
<line x1="580" y1="390" x2="580" y2="432" stroke="#1f5f8b" stroke-width="4"/>
<line x1="910" y1="390" x2="910" y2="432" stroke="#1f5f8b" stroke-width="4"/>
<text x="500" y="465" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Welded track requires temperature-aware support and restraint management.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">A rail can develop thermal stress without a large visible length change.</text>
</svg>
