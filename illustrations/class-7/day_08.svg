<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>

<!-- TITLE -->
<text x="500" y="44" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b">The hidden world inside a drop of water</text>
<text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f5f8b">Bacteria + algae + protozoa — a microscopic food web in every drop</text>

<!-- ── ROW 1: Bacteria  y=88–180
     text zone x=35–500 | shapes zone x=515–975 ── -->
<rect x="20" y="88" width="960" height="92" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="35" y="110" font-family="Arial" font-size="16" font-weight="700" fill="#92400e">Bacteria (0.5–5 µm) — Decomposers</text>
<text x="35" y="130" font-family="Arial" font-size="14" fill="#78350f">Smallest organisms — no nucleus (prokaryotes).</text>
<text x="35" y="149" font-family="Arial" font-size="14" fill="#78350f">Break down dead matter, recycle nutrients.</text>
<text x="35" y="168" font-family="Arial" font-size="14" fill="#78350f">Killed by boiling (proteins denatured at 100°C).</text>
<!-- shapes: rod-shaped bacteria in right zone x=515–970 -->
<rect x="534" y="102" width="30" height="12" fill="#d97706" rx="5"/>
<rect x="576" y="108" width="30" height="12" fill="#d97706" rx="5"/>
<rect x="618" y="100" width="30" height="12" fill="#d97706" rx="5"/>
<rect x="660" y="106" width="30" height="12" fill="#d97706" rx="5"/>
<rect x="702" y="101" width="30" height="12" fill="#d97706" rx="5"/>
<rect x="744" y="108" width="30" height="12" fill="#d97706" rx="5"/>
<rect x="786" y="102" width="30" height="12" fill="#d97706" rx="5"/>
<rect x="828" y="107" width="30" height="12" fill="#d97706" rx="5"/>
<rect x="870" y="101" width="30" height="12" fill="#d97706" rx="5"/>
<rect x="912" y="106" width="30" height="12" fill="#d97706" rx="5"/>
<text x="743" y="145" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e" font-style="italic">rod-shaped bacteria</text>
<text x="743" y="163" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">Visible: 400× microscope</text>

<!-- ── ROW 2: Algae  y=198–305
     text zone x=35–500 | shapes zone x=515–975 ── -->
<rect x="20" y="198" width="960" height="107" rx="7" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
<text x="35" y="220" font-family="Arial" font-size="16" font-weight="700" fill="#065f46">Algae — Photosynthetic Producers</text>
<text x="35" y="240" font-family="Arial" font-size="14" fill="#065f46">Contain chlorophyll → produce O₂ and food.</text>
<text x="35" y="259" font-family="Arial" font-size="14" fill="#065f46">Spirogyra: spiral chloroplasts in long threads.</text>
<text x="35" y="278" font-family="Arial" font-size="14" fill="#065f46">Diatoms: glass-like silica cell walls.</text>
<text x="35" y="297" font-family="Arial" font-size="14" fill="#065f46">Form base of the aquatic food chain.</text>
<!-- shapes: Spirogyra-like spiral threads in right zone x=515–970 -->
<!-- Outer cell boundaries (3 cells stacked horizontally) -->
<rect x="530" y="212" width="440" height="88" fill="none" stroke="#10b981" stroke-width="1.5" rx="4"/>
<!-- Cell division lines -->
<line x1="678" y1="212" x2="678" y2="300" stroke="#10b981" stroke-width="1.5"/>
<line x1="826" y1="212" x2="826" y2="300" stroke="#10b981" stroke-width="1.5"/>
<!-- Spiral chloroplasts in each cell (represented as oval ribbons) -->
<ellipse cx="604" cy="245" rx="45" ry="12" fill="#22c55e" opacity="0.8"/>
<ellipse cx="604" cy="268" rx="45" ry="12" fill="#22c55e" opacity="0.6"/>
<ellipse cx="752" cy="248" rx="45" ry="12" fill="#22c55e" opacity="0.8"/>
<ellipse cx="752" cy="271" rx="45" ry="12" fill="#22c55e" opacity="0.6"/>
<ellipse cx="900" cy="245" rx="45" ry="12" fill="#22c55e" opacity="0.8"/>
<ellipse cx="900" cy="268" rx="45" ry="12" fill="#22c55e" opacity="0.6"/>
<text x="750" y="293" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46" font-style="italic">Spirogyra — spiral chloroplasts</text>

<!-- ── ROW 3: Protozoa  y=323–420
     text zone x=35–500 | shapes zone x=515–975 ── -->
<rect x="20" y="323" width="960" height="97" rx="7" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="35" y="345" font-family="Arial" font-size="16" font-weight="700" fill="#4c1d95">Protozoa — Single-Celled Animal-like</text>
<text x="35" y="365" font-family="Arial" font-size="14" fill="#3b0764">Amoeba: moves using pseudopods (false feet),</text>
<text x="35" y="384" font-family="Arial" font-size="14" fill="#3b0764">engulfs bacteria by phagocytosis.</text>
<text x="35" y="403" font-family="Arial" font-size="14" fill="#3b0764">Paramecium: covered in cilia, swims rapidly.</text>
<!-- shapes: Paramecium in right zone x=515–970 -->
<!-- Paramecium body oval -->
<ellipse cx="720" cy="370" rx="120" ry="38" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
<!-- Cilia lines around paramecium -->
<line x1="605" y1="355" x2="592" y2="345" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="615" y1="368" x2="600" y2="368" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="605" y1="381" x2="592" y2="390" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="835" y1="355" x2="848" y2="345" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="840" y1="368" x2="855" y2="368" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="835" y1="381" x2="848" y2="390" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="650" y1="333" x2="645" y2="320" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="690" y1="333" x2="688" y2="318" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="730" y1="333" x2="730" y2="318" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="770" y1="333" x2="772" y2="318" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="650" y1="407" x2="645" y2="420" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="690" y1="407" x2="688" y2="420" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="730" y1="407" x2="730" y2="422" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="770" y1="407" x2="772" y2="420" stroke="#7c3aed" stroke-width="1.5"/>
<!-- Nucleus -->
<ellipse cx="720" cy="370" rx="22" ry="12" fill="#a78bfa"/>
<text x="720" y="416" text-anchor="middle" font-family="Arial" font-size="14" fill="#4c1d95" font-style="italic">Paramecium (cilia visible)</text>

<!-- ── ROW 4: Food web summary  y=433–482 ── -->
<rect x="20" y="433" width="960" height="49" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="500" y="453" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">Pond Food Web</text>
<text x="500" y="473" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">Algae produce O₂ + food → Protozoa eat bacteria + algae → Bacteria decompose dead matter → nutrients recycled</text>

<!-- TAKEAWAY STRIP (y=505–545) -->
<rect x="0" y="505" width="1000" height="40" fill="#1f5f8b"/>
<text x="500" y="530" text-anchor="middle" font-family="Arial" font-size="15" fill="white" font-weight="700">Bacteria + algae + protozoa form a food web in every pond drop — boiling kills most of them.</text>
</svg>
