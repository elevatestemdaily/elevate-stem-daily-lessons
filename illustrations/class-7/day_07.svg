<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>

<!-- TITLE -->
<text x="500" y="44" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b">Why do some materials float while others sink?</text>
<text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f5f8b">Density vs water density (1 g/cm³) determines float or sink</text>

<!-- ── ROW 1: Density rule header  y=88–130 ── -->
<rect x="20" y="88" width="960" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="500" y="107" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e3a5f">THE RULE: density &lt; 1 g/cm³ → FLOATS  |  density &gt; 1 g/cm³ → SINKS  |  Water = 1 g/cm³</text>
<text x="500" y="124" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f">Buoyant force = weight of water displaced. If buoyant force ≥ object weight → floats.</text>

<!-- ── ROW 2: Three comparison panels  y=145–285 ── -->

<!-- CORK panel  x=20–308 -->
<rect x="20" y="145" width="288" height="140" rx="6" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.5"/>
<!-- Cork object (floating high, mostly above water at y=145+60=205) -->
<rect x="95" y="152" width="138" height="48" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="4"/>
<text x="164" y="173" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">CORK</text>
<text x="164" y="191" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e">0.12 g/cm³</text>
<!-- Waterline -->
<line x1="20" y1="205" x2="308" y2="205" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,3"/>
<text x="25" y="218" font-family="Arial" font-size="14" fill="#3b82f6">waterline</text>
<!-- FLOATS label -->
<text x="164" y="252" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#059669">✓ FLOATS</text>
<text x="164" y="272" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">density &lt; water</text>

<!-- SHIP panel  x=330–670 -->
<rect x="330" y="145" width="340" height="140" rx="6" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.5"/>
<!-- Waterline at y=220 for ship panel -->
<line x1="330" y1="220" x2="670" y2="220" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,3"/>
<!-- Ship hull (above water) -->
<rect x="370" y="160" width="260" height="60" fill="#e2e8f0" stroke="#475569" stroke-width="2" rx="4"/>
<text x="500" y="178" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e3a5f">STEEL SHIP</text>
<text x="500" y="195" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Hollow hull — air inside</text>
<text x="500" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">avg. density &lt; 1 g/cm³</text>
<!-- FLOATS label -->
<text x="500" y="252" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#059669">✓ FLOATS</text>
<text x="500" y="269" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">hollow lowers avg. density</text>

<!-- NAIL panel  x=692–975 -->
<rect x="692" y="145" width="283" height="140" rx="6" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.5"/>
<!-- Nail (sunk to bottom) -->
<rect x="817" y="238" width="22" height="40" fill="#94a3b8" stroke="#374151" stroke-width="2" rx="2"/>
<!-- Nail head -->
<rect x="806" y="232" width="44" height="10" fill="#64748b" stroke="#374151" stroke-width="1.5" rx="2"/>
<text x="833" y="186" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">IRON NAIL</text>
<text x="833" y="204" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">7.8 g/cm³</text>
<!-- SINKS label -->
<text x="833" y="155" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#ef4444">✗ SINKS</text>
<text x="833" y="168" text-anchor="middle" font-family="Arial" font-size="14" fill="#991b1b">density &gt; water</text>

<!-- ── ROW 3: Archimedes box  y=300–385 ── -->
<rect x="20" y="300" width="960" height="85" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
<text x="500" y="323" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#065f46">Archimedes' Principle</text>
<text x="500" y="345" text-anchor="middle" font-family="Arial" font-size="14" fill="#064e3b">Buoyant force upward = weight of water the object pushes aside (displaces).</text>
<text x="500" y="364" text-anchor="middle" font-family="Arial" font-size="14" fill="#064e3b">A hollow ship displaces more water for its weight → enough force to stay up.</text>

<!-- ── ROW 4: Examples  y=400–478 ── -->
<!-- Left: Dead Sea -->
<rect x="20" y="400" width="468" height="78" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
<text x="254" y="423" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Dead Sea — Water Denser Than Humans</text>
<text x="254" y="443" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">Salt raises water density to ≈ 1.24 g/cm³.</text>
<text x="254" y="461" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">Human body ≈ 1.0 g/cm³ → floats effortlessly.</text>
<!-- Right: Submarines -->
<rect x="508" y="400" width="472" height="78" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="744" y="423" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#991b1b">Submarines — Adjustable Density</text>
<text x="744" y="443" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">Pump water into ballast tanks → avg. density rises → dive.</text>
<text x="744" y="461" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">Expel water with compressed air → avg. density falls → surface.</text>

<!-- TAKEAWAY STRIP (y=505–545) -->
<rect x="0" y="505" width="1000" height="40" fill="#1f5f8b"/>
<text x="500" y="530" text-anchor="middle" font-family="Arial" font-size="15" fill="white" font-weight="700">Density &lt; 1 g/cm³ = floats; &gt; 1 = sinks. A hollow hull lowers average density — why ships float.</text>
</svg>
