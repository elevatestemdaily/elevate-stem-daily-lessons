<line x1="660" y1="205" x2="905" y2="205" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="180" y="405" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Fine material remains aloft</text>
<text x="500" y="405" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Impacts loosen more grains</text>
<text x="820" y="405" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Surface is less exposed</text>
<text x="500" y="453" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Larger grains may roll or slide near the ground: surface creep.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Wind, particle attachment, moisture and cover all affect erosion.</text>
