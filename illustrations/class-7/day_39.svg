<circle cx="505" cy="355" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="585" cy="355" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="400" y1="345" x2="420" y2="353" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
