<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How does a grit chamber separate sand from sewage?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Capture depends on settling far enough before horizontal travel ends</text>
<text x="180" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Inlet</text>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Controlled-flow chamber</text>
<text x="865" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Outlet</text>
<rect x="140" y="170" width="720" height="200" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<rect x="145" y="340" width="710" height="25" rx="0" fill="#e6a23c" stroke="#e6a23c" stroke-width="2"/>
<line x1="65" y1="215" x2="130" y2="215" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="870" y1="215" x2="940" y2="215" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="200" y1="195" x2="520" y2="329" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="200" y1="195" x2="830" y2="270" stroke="#579b70" stroke-width="3"/>
<circle cx="200" cy="195" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="520" cy="329" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="830" cy="270" r="5" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<text x="280" y="407" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Faster-settling path: captured</text>
<text x="745" y="407" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Other path: leaves before settling</text>
<text x="500" y="453" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Horizontal flow and downward settling happen at the same time.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Removing grit protects equipment; outgoing water still needs treatment.</text>
</svg>
