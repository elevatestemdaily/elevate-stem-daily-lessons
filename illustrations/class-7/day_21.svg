<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="timeArr21" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#555"/>
  </marker>
  <marker id="fastArr21" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#065f46"/>
  </marker>
</defs>
<!-- Background -->
<rect width="1000" height="560" fill="#f8fbff"/>
<!-- Title -->
<text x="500" y="38" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">How do vaccines teach the immune system?</text>
<text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Harmless antigen → memory cells → fast response — Day 21</text>

<!-- Dividing line -->
<line x1="500" y1="68" x2="500" y2="495" stroke="#ccc" stroke-width="2" stroke-dasharray="6,4"/>

<!-- LEFT PANEL: Unvaccinated timeline (x=20-490) -->
<rect x="20" y="68" width="470" height="38" rx="5" fill="#fee2e2"/>
<text x="255" y="92" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">WITHOUT vaccine</text>

<!-- Timeline line -->
<line x1="45" y1="460" x2="470" y2="460" stroke="#555" stroke-width="2" marker-end="url(#timeArr21)"/>
<text x="460" y="476" font-family="Arial" font-size="14" fill="#555">time</text>

<!-- Day 0: Virus enters -->
<line x1="80" y1="455" x2="80" y2="300" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="80" y="292" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626" font-weight="700">Day 0</text>
<!-- Virus icon at day 0 -->
<circle cx="80" cy="250" r="20" fill="#dc2626" opacity="0.8"/>
<line x1="60" y1="250" x2="55" y2="245" stroke="#dc2626" stroke-width="2"/>
<line x1="65" y1="235" x2="62" y2="228" stroke="#dc2626" stroke-width="2"/>
<line x1="80" y1="230" x2="80" y2="222" stroke="#dc2626" stroke-width="2"/>
<line x1="95" y1="235" x2="98" y2="228" stroke="#dc2626" stroke-width="2"/>
<line x1="100" y1="250" x2="105" y2="245" stroke="#dc2626" stroke-width="2"/>
<text x="80" y="255" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">virus</text>
<text x="80" y="283" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">enters</text>

<!-- Confusion bar (days 1-10) -->
<rect x="90" y="395" width="200" height="55" rx="4" fill="#fecaca"/>
<text x="190" y="415" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Immune system confused</text>
<text x="190" y="430" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">Days 1–10: ID the pathogen</text>
<text x="190" y="444" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">Person is seriously ill</text>

<!-- Day 10: Peak illness -->
<line x1="290" y1="455" x2="290" y2="360" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="290" y="352" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">Day 10</text>
<!-- Person sick icon -->
<circle cx="290" cy="210" r="18" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
<text x="290" y="207" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">😷</text>
<text x="290" y="220" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">ill</text>
<!-- Squiggly lines for illness -->
<path d="M310,200 Q320,190 330,200 Q340,210 350,200" fill="none" stroke="#f87171" stroke-width="1.5"/>
<text x="345" y="188" font-family="Arial" font-size="14" fill="#dc2626">fever</text>
<path d="M310,218 Q320,225 330,218 Q340,211 350,218" fill="none" stroke="#f87171" stroke-width="1.5"/>

<!-- Day 21: Finally clears -->
<line x1="430" y1="455" x2="430" y2="360" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="430" y="352" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Day 21: recovered</text>
<text x="430" y="175" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Antibodies</text>
<text x="430" y="185" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">finally made</text>

<!-- Memory cells stored note -->
<rect x="30" y="115" width="455" height="40" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<text x="258" y="133" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e" font-weight="700">Slow first response: immune system must ID the enemy</text>
<text x="258" y="148" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e">from scratch — takes 10–14 days. Person suffers the full disease.</text>

<!-- RIGHT PANEL: Vaccinated timeline (x=510-978) -->
<rect x="510" y="68" width="468" height="38" rx="5" fill="#d1fae5"/>
<text x="744" y="92" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">WITH vaccine</text>

<!-- Vaccine injection symbol -->
<rect x="548" y="115" width="100" height="55" rx="5" fill="#a7f3d0" stroke="#065f46" stroke-width="2"/>
<text x="598" y="135" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Vaccine</text>
<text x="598" y="150" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">harmless antigen</text>
<text x="598" y="162" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">(killed/weakened)</text>

<!-- B-cell + antibody production -->
<rect x="660" y="115" width="145" height="55" rx="5" fill="#bbf7d0" stroke="#065f46" stroke-width="2"/>
<text x="732" y="133" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">B-cells activated</text>
<!-- Y-shape antibodies -->
<text x="665" y="150" font-family="Arial" font-size="14" fill="#065f46">Y</text>
<text x="683" y="148" font-family="Arial" font-size="14" fill="#065f46">Y</text>
<text x="701" y="150" font-family="Arial" font-size="14" fill="#065f46">Y</text>
<text x="719" y="148" font-family="Arial" font-size="14" fill="#065f46">Y</text>
<text x="737" y="162" font-family="Arial" font-size="14" fill="#555">antibodies made</text>

<!-- Memory cells stored box -->
<rect x="815" y="115" width="153" height="55" rx="5" fill="#6ee7b7" stroke="#065f46" stroke-width="2"/>
<text x="891" y="133" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Memory cells</text>
<text x="891" y="147" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">stored for years</text>
<text x="891" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">they keep the memory</text>
<!-- Arrows connecting -->
<line x1="648" y1="142" x2="658" y2="142" stroke="#065f46" stroke-width="1.5" marker-end="url(#fastArr21)"/>
<line x1="805" y1="142" x2="813" y2="142" stroke="#065f46" stroke-width="1.5" marker-end="url(#fastArr21)"/>

<!-- Timeline line (right) -->
<line x1="525" y1="460" x2="960" y2="460" stroke="#555" stroke-width="2" marker-end="url(#timeArr21)"/>
<text x="950" y="476" font-family="Arial" font-size="14" fill="#555">time</text>

<!-- Months later: Real virus arrives -->
<line x1="650" y1="455" x2="650" y2="300" stroke="#065f46" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="650" y="292" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46" font-weight="700">Months later</text>
<!-- Virus icon -->
<circle cx="650" cy="248" r="18" fill="#dc2626" opacity="0.7"/>
<line x1="632" y1="248" x2="627" y2="243" stroke="#dc2626" stroke-width="2"/>
<line x1="637" y1="233" x2="634" y2="226" stroke="#dc2626" stroke-width="2"/>
<line x1="668" y1="233" x2="671" y2="226" stroke="#dc2626" stroke-width="2"/>
<line x1="668" y1="248" x2="673" y2="243" stroke="#dc2626" stroke-width="2"/>
<text x="650" y="253" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">real</text>
<text x="650" y="263" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">virus</text>

<!-- Memory cells pounce -->
<text x="720" y="248" font-family="Arial" font-size="22" fill="#065f46">→</text>
<!-- Memory cell attacking -->
<circle cx="780" cy="248" r="18" fill="#34d399"/>
<text x="780" y="252" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">memory</text>
<text x="780" y="264" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">responds in hours!</text>

<!-- Hours bar (no illness) -->
<rect x="535" y="395" width="410" height="55" rx="4" fill="#a7f3d0"/>
<text x="740" y="415" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Memory cells recognise virus immediately</text>
<text x="740" y="430" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Attack launched within hours — not 10 days.</text>
<text x="740" y="444" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Person feels nothing. Virus destroyed at the door.</text>

<!-- Person healthy -->
<circle cx="895" cy="248" r="18" fill="#a7f3d0" stroke="#065f46" stroke-width="2"/>
<text x="895" y="252" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">:)</text>
<text x="895" y="268" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">healthy!</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="525" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Vaccine = harmless antigen → memory cells stored. Real pathogen arrives → memory cells attack in hours, not weeks.</text>
</svg>
