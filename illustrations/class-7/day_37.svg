<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why can some seeds wait months before sprouting?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Similar-looking seeds can be waiting for different reasons</text>
<text x="170" y="133" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Missing external conditions</text>
<circle cx="170" cy="210" r="32" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="133" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Internal dormancy</text>
<circle cx="500" cy="210" r="32" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<text x="830" y="133" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Nonviable seed</text>
<circle cx="830" cy="210" r="32" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="170" y1="255" x2="170" y2="300" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="500" y1="255" x2="500" y2="295" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="830" y1="255" x2="830" y2="295" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M170 310 Q165 340 185 350 Q200 362 185 375" fill="none" stroke="#579b70" stroke-width="5"/>
<rect x="470" y="305" width="60" height="35" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M485 305 L485 290 Q500 270 515 290 L515 305" fill="none" stroke="#1f5f8b" stroke-width="4"/>
<line x1="805" y1="310" x2="855" y2="350" stroke="#e6a23c" stroke-width="5"/>
<line x1="855" y1="310" x2="805" y2="350" stroke="#e6a23c" stroke-width="5"/>
<text x="170" y="407" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Supply suitable conditions</text>
<text x="500" y="407" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">A seed barrier must change</text>
<text x="830" y="407" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Cannot resume growth</text>
<text x="500" y="452" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Dormancy may involve a coat barrier or physiological control.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">No sprout alone does not identify the reason for waiting.</text>
</svg>
