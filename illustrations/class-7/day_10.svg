<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>

<defs>
  <marker id="redArr10" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
  </marker>
  <marker id="blueArr10" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
  </marker>
</defs>

<!-- TITLE -->
<text x="500" y="44" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b">How does a refrigerator actually cool things?</text>
<text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f5f8b">A refrigerant moves heat from inside to outside — four-step cycle</text>

<!-- ── FRIDGE OUTLINE  x=330–670, y=88–440 ── -->
<rect x="330" y="88" width="340" height="352" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
<text x="500" y="112" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#374151">REFRIGERATOR</text>
<!-- Fridge interior shelf line -->
<line x1="340" y1="145" x2="660" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
<!-- Food items inside -->
<rect x="360" y="155" width="55" height="40" rx="4" fill="#bbf7d0" stroke="#10b981" stroke-width="1"/>
<text x="387" y="179" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">food</text>
<rect x="430" y="155" width="55" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="457" y="179" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e">dahi</text>

<!-- ── CYCLE COMPONENTS ── -->

<!-- EVAPORATOR: inside fridge at top (y=210–290, x=350–650) -->
<rect x="350" y="210" width="300" height="80" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
<text x="500" y="233" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e3a5f">① EVAPORATOR</text>
<text x="500" y="252" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f">(inside fridge — cold coils)</text>
<text x="500" y="270" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f">Refrigerant evaporates → absorbs heat</text>
<text x="500" y="285" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f">→ food cools</text>

<!-- COMPRESSOR: at bottom-right of fridge (y=320–400, x=540–660) -->
<rect x="540" y="320" width="120" height="80" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
<text x="600" y="344" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#991b1b">② COMPRESSOR</text>
<text x="600" y="362" text-anchor="middle" font-family="Arial" font-size="14" fill="#991b1b">Raises pressure</text>
<text x="600" y="378" text-anchor="middle" font-family="Arial" font-size="14" fill="#991b1b">and temperature</text>
<text x="600" y="394" text-anchor="middle" font-family="Arial" font-size="14" fill="#991b1b">of gas</text>

<!-- ── CONDENSER: right side outside fridge (x=700–910, y=145–280) ── -->
<rect x="700" y="145" width="240" height="135" rx="8" fill="#fde8d8" stroke="#f97316" stroke-width="2"/>
<text x="820" y="168" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#9a3412">③ CONDENSER COILS</text>
<text x="820" y="188" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3412">(back of fridge — warm)</text>
<text x="820" y="208" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3412">Hot gas releases heat</text>
<text x="820" y="226" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3412">to room air → condenses</text>
<text x="820" y="244" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3412">back to liquid</text>
<text x="820" y="263" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3412">← why back is WARM</text>

<!-- ── EXPANSION VALVE: right side outside fridge (x=700–910, y=310–400) ── -->
<rect x="700" y="310" width="240" height="80" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
<text x="820" y="333" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">④ EXPANSION VALVE</text>
<text x="820" y="353" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">Liquid passes narrow</text>
<text x="820" y="371" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">opening → pressure drops</text>
<text x="820" y="389" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">→ ready to evaporate</text>

<!-- ── FLOW ARROWS (refrigerant circuit) ── -->
<!-- Evaporator → Compressor (down inside fridge) -->
<path d="M 560 290 L 560 320" stroke="#ef4444" stroke-width="2.5" fill="none" marker-end="url(#redArr10)"/>
<!-- Compressor → Condenser (right, outside) -->
<path d="M 660 360 L 700 200" stroke="#ef4444" stroke-width="2.5" fill="none" marker-end="url(#redArr10)"/>
<text x="685" y="285" font-family="Arial" font-size="14" fill="#991b1b">hot gas</text>
<!-- Condenser → Expansion valve (down outside) -->
<path d="M 820 280 L 820 310" stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#blueArr10)"/>
<text x="828" y="300" font-family="Arial" font-size="14" fill="#1e3a5f">liquid</text>
<!-- Expansion valve → Evaporator (left back inside fridge) -->
<path d="M 700 350 L 650 350 L 650 250 L 650 250" stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#blueArr10)"/>

<!-- ── LEFT INFO COLUMN  x=20–305 ── -->
<!-- Key principle box -->
<rect x="20" y="88" width="290" height="130" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
<text x="165" y="112" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#065f46">Key Principle</text>
<text x="165" y="133" text-anchor="middle" font-family="Arial" font-size="14" fill="#064e3b">Evaporation absorbs heat.</text>
<text x="165" y="152" text-anchor="middle" font-family="Arial" font-size="14" fill="#064e3b">Condensation releases heat.</text>
<text x="165" y="171" text-anchor="middle" font-family="Arial" font-size="14" fill="#064e3b">Refrigerant cycles between</text>
<text x="165" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#064e3b">these two states endlessly.</text>
<text x="165" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46" font-style="italic">Electricity drives the compressor only.</text>

<!-- Analogy box -->
<rect x="20" y="238" width="290" height="100" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
<text x="165" y="260" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Everyday Analogy</text>
<text x="165" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">Spirit on your skin → evaporates</text>
<text x="165" y="298" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">→ feels cold (absorbs body heat).</text>
<text x="165" y="316" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">Same idea inside the fridge.</text>
<text x="165" y="331" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">No "cold" is created — heat moves.</text>

<!-- What if box -->
<rect x="20" y="358" width="290" height="82" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="165" y="379" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#991b1b">If refrigerant leaks…</text>
<text x="165" y="399" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">No fluid to carry heat out.</text>
<text x="165" y="418" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">Compressor runs but fridge</text>
<text x="165" y="433" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">warms to room temperature.</text>

<!-- TAKEAWAY STRIP (y=505–545) -->
<rect x="0" y="505" width="1000" height="40" fill="#1f5f8b"/>
<text x="500" y="530" text-anchor="middle" font-family="Arial" font-size="15" fill="white" font-weight="700">Refrigerant evaporates inside (absorbs heat → cools food) then condenses outside (releases heat).</text>
</svg>
