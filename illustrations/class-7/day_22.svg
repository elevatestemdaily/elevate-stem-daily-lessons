<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="fevArr22" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
  </marker>
  <marker id="blueArr22" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1f5f8b"/>
  </marker>
</defs>
<!-- Background -->
<rect width="1000" height="560" fill="#f8fbff"/>
<!-- Title -->
<text x="500" y="38" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">Why do we get fever?</text>
<text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Pyrogens reset the hypothalamus thermostat — Day 22</text>

<!-- 4-STEP FEVER PATHWAY (top two-thirds) -->

<!-- Step 1: Pathogen detected (x=20-235, y=70-240) -->
<rect x="20" y="70" width="215" height="170" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="127" y="90" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Step 1: Detected</text>
<!-- Macrophage circle -->
<circle cx="80" cy="152" r="35" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
<text x="80" y="148" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7f1d1d">macro-</text>
<text x="80" y="160" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7f1d1d">phage</text>
<!-- Bacteria -->
<ellipse cx="150" cy="140" rx="12" ry="8" fill="#dc2626"/>
<line x1="138" y1="140" x2="130" y2="135" stroke="#dc2626" stroke-width="1.5"/>
<line x1="162" y1="140" x2="170" y2="135" stroke="#dc2626" stroke-width="1.5"/>
<text x="153" y="160" font-family="Arial" font-size="14" fill="#dc2626">bacteria</text>
<!-- Pyrogen release -->
<text x="127" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Detects pathogen →</text>
<text x="127" y="213" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">releases pyrogens</text>
<text x="127" y="226" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">(fire-signalling proteins)</text>

<!-- Arrow 1→2 -->
<line x1="235" y1="155" x2="262" y2="155" stroke="#dc2626" stroke-width="2.5" marker-end="url(#fevArr22)"/>

<!-- Step 2: Hypothalamus (x=265-480, y=70-240) -->
<rect x="265" y="70" width="215" height="170" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="372" y="90" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Step 2: Thermostat</text>
<!-- Brain outline -->
<ellipse cx="360" cy="155" rx="55" ry="48" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<!-- Hypothalamus label -->
<text x="360" y="145" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e" font-weight="700">Hypothalamus</text>
<text x="360" y="157" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e">(thermostat)</text>
<!-- Thermometer -->
<rect x="395" y="128" width="8" height="50" rx="4" fill="white" stroke="#d97706" stroke-width="1.5"/>
<rect x="396" y="148" width="6" height="28" rx="3" fill="#dc2626"/>
<circle cx="399" cy="178" r="6" fill="#dc2626" stroke="#d97706" stroke-width="1"/>
<!-- Arrow up -->
<line x1="399" y1="125" x2="399" y2="112" stroke="#dc2626" stroke-width="2" marker-end="url(#fevArr22)"/>
<text x="409" y="120" font-family="Arial" font-size="14" fill="#dc2626" font-weight="700">↑set-point</text>
<text x="409" y="131" font-family="Arial" font-size="14" fill="#dc2626">37°→39°C</text>
<text x="280" y="200" font-family="Arial" font-size="14" fill="#333">Pyrogens reach brain →</text>
<text x="280" y="213" font-family="Arial" font-size="14" fill="#333">reset-point raised to 39°C.</text>
<text x="280" y="226" font-family="Arial" font-size="14" fill="#555">Body now "feels cold" at 37°C.</text>

<!-- Arrow 2→3 -->
<line x1="480" y1="155" x2="507" y2="155" stroke="#dc2626" stroke-width="2.5" marker-end="url(#fevArr22)"/>

<!-- Step 3: Body heats up (x=510-725, y=70-240) -->
<rect x="510" y="70" width="215" height="170" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="617" y="90" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#ea580c">Step 3: Heat Up</text>
<!-- Shivering person (stick figure) -->
<circle cx="565" cy="130" r="18" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
<line x1="565" y1="148" x2="565" y2="188" stroke="#ea580c" stroke-width="2"/>
<!-- Shiver arms (wobbly) -->
<path d="M565,158 Q548,162 540,155" fill="none" stroke="#ea580c" stroke-width="2"/>
<path d="M565,158 Q582,162 590,155" fill="none" stroke="#ea580c" stroke-width="2"/>
<line x1="565" y1="188" x2="545" y2="208" stroke="#ea580c" stroke-width="2"/>
<line x1="565" y1="188" x2="585" y2="208" stroke="#ea580c" stroke-width="2"/>
<!-- Wavy heat lines around person -->
<path d="M598,120 Q603,115 608,120 Q613,125 618,120" fill="none" stroke="#f97316" stroke-width="1.5"/>
<path d="M598,132 Q603,127 608,132 Q613,137 618,132" fill="none" stroke="#f97316" stroke-width="1.5"/>
<!-- Responses list -->
<text x="525" y="200" font-family="Arial" font-size="14" fill="#333">Shivering: muscles generate</text>
<text x="525" y="213" font-family="Arial" font-size="14" fill="#333">heat to reach new set-point.</text>
<text x="525" y="226" font-family="Arial" font-size="14" fill="#555">Blood vessels constrict.</text>

<!-- Arrow 3→4 -->
<line x1="725" y1="155" x2="752" y2="155" stroke="#dc2626" stroke-width="2.5" marker-end="url(#fevArr22)"/>

<!-- Step 4: Outcome (x=755-978, y=70-240) -->
<rect x="755" y="70" width="223" height="170" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="2"/>
<text x="866" y="90" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Step 4: Why it Helps</text>
<!-- Two outcome items -->
<rect x="770" y="98" width="193" height="35" rx="3" fill="#a7f3d0"/>
<text x="866" y="113" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Bacteria slow at 39°C</text>
<text x="866" y="127" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">enzymes malfunction above 38°C</text>
<rect x="770" y="140" width="193" height="35" rx="3" fill="#a7f3d0"/>
<text x="866" y="155" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">White blood cells speed up</text>
<text x="866" y="169" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">reactions faster at higher temp</text>
<text x="770" y="196" font-family="Arial" font-size="14" fill="#333">Fever breaks when infection</text>
<text x="770" y="209" font-family="Arial" font-size="14" fill="#333">cleared → heavy sweating.</text>
<text x="770" y="222" font-family="Arial" font-size="14" fill="#555">Set-point resets to 37°C.</text>

<!-- BOTTOM ROW: Temperature zones + Safe range + Paracetamol -->

<!-- Temperature zones diagram (x=20-500, y=255-480) -->
<rect x="20" y="255" width="480" height="237" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="260" y="275" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Temperature Zones</text>

<!-- Temperature bar (horizontal) -->
<rect x="40" y="295" width="440" height="35" rx="5" fill="#e5e7eb"/>
<!-- Colour zones -->
<rect x="40" y="295" width="100" height="35" rx="0" fill="#93c5fd"/>
<rect x="140" y="295" width="110" height="35" fill="#4ade80"/>
<rect x="250" y="295" width="100" height="35" fill="#fbbf24"/>
<rect x="350" y="295" width="80" height="35" fill="#f97316"/>
<rect x="430" y="295" width="50" height="35" rx="0" fill="#dc2626"/>
<!-- Temperature labels on bar -->
<text x="90" y="317" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="700">35°C</text>
<text x="195" y="317" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="700">37°C</text>
<text x="300" y="317" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="700">39°C</text>
<text x="390" y="317" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="700">40°C</text>
<text x="455" y="317" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="700">41°C+</text>
<!-- Zone labels below bar -->
<text x="90" y="345" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e40af">hypo-</text>
<text x="90" y="355" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e40af">thermia</text>
<text x="195" y="345" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">normal</text>
<text x="295" y="345" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e">helpful</text>
<text x="295" y="355" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e">fever</text>
<text x="390" y="345" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3412">risky</text>
<text x="455" y="345" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">DANGER</text>

<!-- Zone explanations -->
<text x="40" y="378" font-family="Arial" font-size="14" fill="#1e40af" font-weight="700">Below 35°C:</text>
<text x="40" y="391" font-family="Arial" font-size="14" fill="#333">Hypothermia. Immune cells slow even faster than bacteria.</text>
<text x="40" y="406" font-family="Arial" font-size="14" fill="#065f46" font-weight="700">37–38.9°C:</text>
<text x="40" y="419" font-family="Arial" font-size="14" fill="#333">Normal to mild fever — immune system working normally.</text>
<text x="40" y="434" font-family="Arial" font-size="14" fill="#92400e" font-weight="700">39–40°C:</text>
<text x="40" y="447" font-family="Arial" font-size="14" fill="#333">Beneficial fever — bacteria slow, WBCs accelerated.</text>
<text x="40" y="462" font-family="Arial" font-size="14" fill="#7f1d1d" font-weight="700">Above 41°C:</text>
<text x="40" y="475" font-family="Arial" font-size="14" fill="#dc2626">Host enzymes and brain cells also start denaturing. Emergency.</text>

<!-- Paracetamol + safe range note (x=510-978, y=255-480) -->
<rect x="510" y="255" width="468" height="220" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="744" y="275" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">What to Do?</text>

<rect x="525" y="283" width="438" height="55" rx="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
<text x="744" y="300" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#4c1d95">Paracetamol (acetaminophen)</text>
<text x="525" y="316" font-family="Arial" font-size="14" fill="#333">  Blocks pyrogen signal → hypothalamus set-point returns to 37°C.</text>
<text x="525" y="330" font-family="Arial" font-size="14" fill="#333">  Reduces discomfort. Does NOT kill bacteria or viruses directly.</text>

<text x="525" y="354" font-family="Arial" font-size="14" fill="#4c1d95" font-weight="700">When to suppress fever:</text>
<text x="525" y="369" font-family="Arial" font-size="14" fill="#333">• Below 39°C and tolerable → let it work (immune system helped)</text>
<text x="525" y="384" font-family="Arial" font-size="14" fill="#333">• Above 39°C and very uncomfortable → paracetamol for relief</text>
<text x="525" y="399" font-family="Arial" font-size="14" fill="#dc2626">• Above 40°C or seizures → seek medical attention immediately</text>

<rect x="525" y="410" width="438" height="55" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="744" y="427" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Interesting: Behavioural Fever</text>
<text x="525" y="444" font-family="Arial" font-size="14" fill="#333">  Cold-blooded animals (lizards, fish) seek warm spots when infected</text>
<text x="525" y="458" font-family="Arial" font-size="14" fill="#333">  — a "behavioural fever." Fever is an ancient immune strategy.</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="525" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Pyrogens reset the hypothalamus. Bacteria slow at 39°C; immune cells speed up. Above 41°C is the danger zone.</text>
</svg>
