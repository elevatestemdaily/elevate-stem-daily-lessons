<text x="175" y="391" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Salt is already present</text>
<text x="500" y="391" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Less solvent remains</text>
<text x="825" y="391" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Repeating crystal lattice</text>
<text x="500" y="443" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Symbols show presence, not visible grains in the clear liquid.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Crystallisation recovers salt; water does not turn into salt.</text>
