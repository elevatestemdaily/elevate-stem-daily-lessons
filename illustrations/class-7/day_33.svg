<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why do crystals appear when a salt solution dries?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Water departs; dissolved salt joins an ordered solid</text>
<text x="175" y="138" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">1. Clear salt solution</text>
<path d="M65 195 L85 348 L265 348 L285 195" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="138" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">2. Water evaporates</text>
<path d="M390 195 L410 348 L590 348 L610 195" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<text x="825" y="138" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">3. Crystals remain</text>
