<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="fieldArr18" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#1f5f8b"/>
  </marker>
  <marker id="repArr18" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626"/>
  </marker>
</defs>
<!-- Background -->
<rect width="1000" height="560" fill="#f8fbff"/>
<!-- Title -->
<text x="500" y="38" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">How do magnets work without touching?</text>
<text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Magnetic field + domain theory — Day 18</text>

<!-- PANEL 1: Bar magnet with field lines (x=20-460, y=70-295) -->
<rect x="20" y="70" width="440" height="225" rx="6" fill="#f0f7ff" stroke="#1f5f8b" stroke-width="2"/>
<text x="240" y="90" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">Magnetic Field Lines</text>

<!-- Bar magnet -->
<rect x="80" y="150" width="80" height="50" rx="4" fill="#dc2626"/>
<text x="120" y="180" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">N</text>
<rect x="160" y="150" width="80" height="50" rx="4" fill="#1f5f8b"/>
<text x="200" y="180" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">S</text>

<!-- Field lines (arcs from N to S outside, inside straight) -->
<!-- Top arcs (N→S outside) -->
<path d="M100,150 Q120,105 200,110 Q270,115 240,150" fill="none" stroke="#1f5f8b" stroke-width="1.5" marker-end="url(#fieldArr18)"/>
<path d="M90,150 Q100,88 200,90 Q295,93 248,150" fill="none" stroke="#1f5f8b" stroke-width="1" marker-end="url(#fieldArr18)"/>
<!-- Bottom arcs -->
<path d="M100,200 Q120,240 200,245 Q270,240 240,200" fill="none" stroke="#1f5f8b" stroke-width="1.5" marker-end="url(#fieldArr18)"/>
<path d="M90,200 Q100,265 200,270 Q295,265 248,200" fill="none" stroke="#1f5f8b" stroke-width="1" marker-end="url(#fieldArr18)"/>
<!-- Right external lines -->
<path d="M240,157 Q310,145 370,175 Q310,205 240,193" fill="none" stroke="#1f5f8b" stroke-width="1.2" marker-end="url(#fieldArr18)"/>

<!-- Labels -->
<text x="295" y="230" font-family="Arial" font-size="14" fill="#1f5f8b">Field lines</text>
<text x="295" y="243" font-family="Arial" font-size="14" fill="#1f5f8b">exit N pole,</text>
<text x="295" y="256" font-family="Arial" font-size="14" fill="#1f5f8b">enter S pole</text>
<text x="290" y="270" font-family="Arial" font-size="14" fill="#555">(lines = force direction)</text>

<!-- Key facts text left -->
<text x="35" y="108" font-family="Arial" font-size="14" fill="#1f5f8b" font-weight="700">Invisible region of influence</text>
<text x="35" y="121" font-family="Arial" font-size="14" fill="#333">Field exists in space around magnet.</text>
<text x="35" y="134" font-family="Arial" font-size="14" fill="#333">Objects in field experience force</text>
<text x="35" y="147" font-family="Arial" font-size="14" fill="#333">without direct contact.</text>

<!-- PANEL 2: Domain theory (x=20-460, y=305-480) -->
<rect x="20" y="305" width="440" height="170" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="240" y="323" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Domain Theory — Why Iron is Attracted</text>

<!-- Unmagnetized iron: random domains -->
<text x="35" y="342" font-family="Arial" font-size="14" fill="#333" font-weight="700">Unmagnetized iron — domains point randomly</text>
<!-- Small arrows in random directions -->
<line x1="45" y1="360" x2="62" y2="352" stroke="#888" stroke-width="1.5" marker-end="url(#repArr18)"/>
<line x1="72" y1="358" x2="88" y2="368" stroke="#888" stroke-width="1.5" marker-end="url(#repArr18)"/>
<line x1="96" y1="352" x2="112" y2="360" stroke="#888" stroke-width="1.5" marker-end="url(#repArr18)"/>
<line x1="120" y1="365" x2="104" y2="355" stroke="#888" stroke-width="1.5" marker-end="url(#repArr18)"/>
<line x1="130" y1="356" x2="146" y2="363" stroke="#888" stroke-width="1.5" marker-end="url(#repArr18)"/>
<line x1="155" y1="360" x2="170" y2="352" stroke="#888" stroke-width="1.5" marker-end="url(#repArr18)"/>
<line x1="178" y1="363" x2="195" y2="357" stroke="#888" stroke-width="1.5" marker-end="url(#repArr18)"/>
<text x="210" y="363" font-family="Arial" font-size="14" fill="#555">Net field = 0. No magnet.</text>

<!-- Arrow showing alignment occurring -->
<text x="240" y="388" text-anchor="middle" font-family="Arial" font-size="14" fill="#d97706">↓ External magnet nearby ↓</text>

<!-- Magnetized iron: aligned domains -->
<text x="35" y="406" font-family="Arial" font-size="14" fill="#333" font-weight="700">In magnetic field — domains align:</text>
<line x1="45" y1="422" x2="62" y2="422" stroke="#1f5f8b" stroke-width="2" marker-end="url(#fieldArr18)"/>
<line x1="72" y1="422" x2="89" y2="422" stroke="#1f5f8b" stroke-width="2" marker-end="url(#fieldArr18)"/>
<line x1="99" y1="422" x2="116" y2="422" stroke="#1f5f8b" stroke-width="2" marker-end="url(#fieldArr18)"/>
<line x1="126" y1="422" x2="143" y2="422" stroke="#1f5f8b" stroke-width="2" marker-end="url(#fieldArr18)"/>
<line x1="153" y1="422" x2="170" y2="422" stroke="#1f5f8b" stroke-width="2" marker-end="url(#fieldArr18)"/>
<line x1="180" y1="422" x2="197" y2="422" stroke="#1f5f8b" stroke-width="2" marker-end="url(#fieldArr18)"/>
<text x="210" y="426" font-family="Arial" font-size="14" fill="#1f5f8b" font-weight="700">→ temporary magnet → attracted!</text>
<text x="35" y="445" font-family="Arial" font-size="14" fill="#555">Works for iron, cobalt, nickel (ferromagnetic).</text>
<text x="35" y="459" font-family="Arial" font-size="14" fill="#555">Remove magnet → domains randomise → no longer magnetic.</text>
<text x="35" y="473" font-family="Arial" font-size="14" fill="#555">Heat or sharp blows also randomise domains (degaussing).</text>

<!-- RIGHT PANEL: Like/unlike poles + Force distance (x=475-978) -->
<rect x="475" y="70" width="503" height="225" rx="6" fill="#f0fdf4" stroke="#065f46" stroke-width="2"/>
<text x="726" y="90" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Poles: Attract and Repel</text>

<!-- Unlike poles (attract) -->
<text x="490" y="112" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Unlike poles attract:</text>
<rect x="490" y="120" width="55" height="35" rx="3" fill="#dc2626"/>
<text x="517" y="142" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">N</text>
<rect x="600" y="120" width="55" height="35" rx="3" fill="#1f5f8b"/>
<text x="627" y="142" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">S</text>
<!-- Attract arrows -->
<line x1="545" y1="137" x2="596" y2="137" stroke="#065f46" stroke-width="2.5" marker-end="url(#fieldArr18)"/>
<line x1="602" y1="137" x2="551" y2="137" stroke="#065f46" stroke-width="2.5" marker-end="url(#fieldArr18)"/>
<text x="650" y="143" font-family="Arial" font-size="14" fill="#065f46">→ pulled together</text>

<!-- Like poles (repel) -->
<text x="490" y="178" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Like poles repel:</text>
<rect x="490" y="186" width="55" height="35" rx="3" fill="#dc2626"/>
<text x="517" y="208" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">N</text>
<rect x="600" y="186" width="55" height="35" rx="3" fill="#dc2626"/>
<text x="627" y="208" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">N</text>
<!-- Repel arrows -->
<line x1="545" y1="203" x2="570" y2="203" stroke="#dc2626" stroke-width="2.5" marker-end="url(#repArr18)"/>
<line x1="600" y1="203" x2="575" y2="203" stroke="#dc2626" stroke-width="2.5" marker-end="url(#repArr18)"/>
<text x="650" y="208" font-family="Arial" font-size="14" fill="#dc2626">→ pushed apart</text>

<!-- Force vs distance boxes -->
<rect x="475" y="305" width="503" height="170" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="726" y="323" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">Force Decreases with Distance</text>
<!-- Distance diagram -->
<text x="490" y="342" font-family="Arial" font-size="14" fill="#333">Magnetic force follows an inverse-square-like law:</text>
<text x="490" y="357" font-family="Arial" font-size="14" fill="#333">Double the distance → force drops to ~¼ of original.</text>
<!-- Visual: magnet + iron nail at different distances -->
<rect x="490" y="368" width="40" height="25" rx="3" fill="#dc2626"/>
<text x="510" y="384" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">N</text>
<!-- Near nail: thick arrow -->
<rect x="545" y="372" width="18" height="14" rx="2" fill="#888"/>
<line x1="530" y1="380" x2="545" y2="380" stroke="#7c3aed" stroke-width="3" marker-end="url(#fieldArr18)"/>
<text x="567" y="392" font-family="Arial" font-size="14" fill="#555">close → strong</text>

<!-- Far nail: thin arrow -->
<rect x="490" y="418" width="40" height="25" rx="3" fill="#dc2626"/>
<text x="510" y="433" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">N</text>
<rect x="630" y="422" width="18" height="14" rx="2" fill="#888"/>
<line x1="530" y1="430" x2="630" y2="430" stroke="#7c3aed" stroke-width="1" marker-end="url(#fieldArr18)"/>
<text x="652" y="432" font-family="Arial" font-size="14" fill="#555">far → weak</text>

<text x="490" y="460" font-family="Arial" font-size="14" fill="#333">Sun analogy: sunlight dims with distance — same principle.</text>
<text x="490" y="474" font-family="Arial" font-size="14" fill="#555">Steel buildings and cars use this daily — not spooky!</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="525" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Magnets create invisible fields. Iron domains align → temporary magnet → attraction. Force fades with distance.</text>
</svg>
