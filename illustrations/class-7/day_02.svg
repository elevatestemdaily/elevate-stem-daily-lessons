<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>

<!-- TITLE -->
<text x="500" y="44" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b">How does the human nose actually work?</text>
<text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f5f8b">Five steps from floating molecule to identified smell</text>

<!-- ══ HORIZONTAL 5-STEP FLOW  y=95–168 ══
     5 boxes × 172px + 4 arrows × 18px = 860+72 = 932px  x=34–966 -->

<!-- Box 1 -->
<rect x="34" y="95" width="172" height="73" rx="7" fill="#e0f2fe" stroke="#1f5f8b" stroke-width="1.5"/>
<text x="120" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0c4a6e">1. Odour Molecules</text>
<text x="120" y="139" text-anchor="middle" font-family="Arial" font-size="14" fill="#0c4a6e">Released by objects</text>
<text x="120" y="156" text-anchor="middle" font-family="Arial" font-size="14" fill="#0c4a6e">and float in air</text>
<!-- arrow → -->
<line x1="206" y1="131" x2="218" y2="131" stroke="#1f5f8b" stroke-width="2"/>
<polygon points="214,125 224,131 214,137" fill="#1f5f8b"/>

<!-- Box 2 -->
<rect x="224" y="95" width="172" height="73" rx="7" fill="#e0f2fe" stroke="#1f5f8b" stroke-width="1.5"/>
<text x="310" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0c4a6e">2. Dissolve in Mucus</text>
<text x="310" y="139" text-anchor="middle" font-family="Arial" font-size="14" fill="#0c4a6e">At olfactory epithelium</text>
<text x="310" y="156" text-anchor="middle" font-family="Arial" font-size="14" fill="#0c4a6e">high in nasal cavity</text>
<!-- arrow → -->
<line x1="396" y1="131" x2="408" y2="131" stroke="#1f5f8b" stroke-width="2"/>
<polygon points="404,125 414,131 404,137" fill="#1f5f8b"/>

<!-- Box 3 -->
<rect x="414" y="95" width="172" height="73" rx="7" fill="#e0f2fe" stroke="#1f5f8b" stroke-width="1.5"/>
<text x="500" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0c4a6e">3. Bind to Receptors</text>
<text x="500" y="139" text-anchor="middle" font-family="Arial" font-size="14" fill="#0c4a6e">On cilia of receptor cells</text>
<text x="500" y="156" text-anchor="middle" font-family="Arial" font-size="14" fill="#0c4a6e">→ electrical signal</text>
<!-- arrow → -->
<line x1="586" y1="131" x2="598" y2="131" stroke="#1f5f8b" stroke-width="2"/>
<polygon points="594,125 604,131 594,137" fill="#1f5f8b"/>

<!-- Box 4 -->
<rect x="604" y="95" width="172" height="73" rx="7" fill="#e0f2fe" stroke="#1f5f8b" stroke-width="1.5"/>
<text x="690" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#0c4a6e">4. Olfactory Nerve</text>
<text x="690" y="139" text-anchor="middle" font-family="Arial" font-size="14" fill="#0c4a6e">Carries signal through</text>
<text x="690" y="156" text-anchor="middle" font-family="Arial" font-size="14" fill="#0c4a6e">skull to olfactory bulb</text>
<!-- arrow → -->
<line x1="776" y1="131" x2="788" y2="131" stroke="#1f5f8b" stroke-width="2"/>
<polygon points="784,125 794,131 784,137" fill="#1f5f8b"/>

<!-- Box 5 -->
<rect x="794" y="95" width="172" height="73" rx="7" fill="#bfdbfe" stroke="#1f5f8b" stroke-width="2"/>
<text x="880" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e3a5f">5. Brain Decodes</text>
<text x="880" y="139" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f">Pattern across 400</text>
<text x="880" y="156" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f">receptor types = SMELL</text>

<!-- ══ MAGNIFIED DIAGRAM  y=185–492
     text zone x=30–460  |  shapes zone x=470–975 ══ -->

<!-- Row 1: Mucus layer  y=185–255 -->
<rect x="20" y="185" width="960" height="70" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="1.5"/>
<!-- text zone -->
<text x="35" y="209" font-family="Arial" font-size="16" font-weight="700" fill="#065f46">Mucus Layer</text>
<text x="35" y="229" font-family="Arial" font-size="14" fill="#065f46">Odour molecules dissolve here</text>
<text x="35" y="247" font-family="Arial" font-size="14" fill="#065f46">before reaching cilia and receptor proteins</text>
<!-- shapes zone: molecule dots (x=470+) -->
<circle cx="490" cy="215" r="7" fill="#38bdf8" opacity="0.85"/>
<circle cx="522" cy="228" r="6" fill="#38bdf8" opacity="0.85"/>
<circle cx="556" cy="210" r="8" fill="#38bdf8" opacity="0.85"/>
<circle cx="592" cy="226" r="6" fill="#38bdf8" opacity="0.85"/>
<circle cx="628" cy="213" r="7" fill="#38bdf8" opacity="0.85"/>
<circle cx="662" cy="230" r="6" fill="#38bdf8" opacity="0.85"/>
<circle cx="698" cy="215" r="8" fill="#38bdf8" opacity="0.85"/>
<circle cx="734" cy="225" r="6" fill="#38bdf8" opacity="0.85"/>
<circle cx="768" cy="210" r="7" fill="#38bdf8" opacity="0.85"/>
<circle cx="804" cy="228" r="6" fill="#38bdf8" opacity="0.85"/>
<circle cx="840" cy="215" r="7" fill="#38bdf8" opacity="0.85"/>
<text x="680" y="252" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46" font-style="italic">odour molecules</text>

<!-- Row 2: Receptor cells + cilia  y=263–358 -->
<rect x="20" y="263" width="960" height="95" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<!-- text zone -->
<text x="35" y="287" font-family="Arial" font-size="16" font-weight="700" fill="#92400e">Cilia of Olfactory Receptor Cells</text>
<text x="35" y="307" font-family="Arial" font-size="14" fill="#78350f">Each cilium has receptor proteins on its surface</text>
<text x="35" y="325" font-family="Arial" font-size="14" fill="#78350f">Molecule binds → electrical signal generated</text>
<text x="35" y="343" font-family="Arial" font-size="14" fill="#78350f">(like a key fitting a specific lock)</text>
<!-- shapes zone: cilia lines (x=470+) and cell ellipses below -->
<!-- cilia (vertical lines from top of row) -->
<line x1="490" y1="263" x2="490" y2="300" stroke="#b45309" stroke-width="2.5"/>
<line x1="524" y1="263" x2="524" y2="308" stroke="#b45309" stroke-width="2.5"/>
<line x1="558" y1="263" x2="558" y2="297" stroke="#b45309" stroke-width="2.5"/>
<line x1="592" y1="263" x2="592" y2="304" stroke="#b45309" stroke-width="2.5"/>
<line x1="626" y1="263" x2="626" y2="299" stroke="#b45309" stroke-width="2.5"/>
<line x1="660" y1="263" x2="660" y2="306" stroke="#b45309" stroke-width="2.5"/>
<line x1="694" y1="263" x2="694" y2="296" stroke="#b45309" stroke-width="2.5"/>
<line x1="728" y1="263" x2="728" y2="303" stroke="#b45309" stroke-width="2.5"/>
<!-- receptor cell ellipses below cilia -->
<ellipse cx="507" cy="333" rx="28" ry="15" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<ellipse cx="575" cy="333" rx="28" ry="15" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<ellipse cx="643" cy="333" rx="28" ry="15" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<ellipse cx="711" cy="333" rx="28" ry="15" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<!-- nuclei -->
<circle cx="507" cy="333" r="6" fill="#fca5a5"/>
<circle cx="575" cy="333" r="6" fill="#fca5a5"/>
<circle cx="643" cy="333" r="6" fill="#fca5a5"/>
<circle cx="711" cy="333" r="6" fill="#fca5a5"/>
<text x="609" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#991b1b" font-style="italic">receptor cells</text>

<!-- Row 3: Olfactory nerve fibres  y=366–421 -->
<rect x="20" y="366" width="960" height="55" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
<!-- text zone -->
<text x="35" y="390" font-family="Arial" font-size="16" font-weight="700" fill="#1e3a5f">Olfactory Nerve Fibres</text>
<text x="35" y="410" font-family="Arial" font-size="14" fill="#1e3a5f">Carry signals from receptor cells through skull to brain</text>
<!-- shapes zone: nerve lines (x=470+) -->
<line x1="490" y1="370" x2="490" y2="417" stroke="#3b82f6" stroke-width="2.5"/>
<line x1="520" y1="370" x2="520" y2="417" stroke="#3b82f6" stroke-width="2.5"/>
<line x1="550" y1="370" x2="550" y2="417" stroke="#3b82f6" stroke-width="2.5"/>
<line x1="580" y1="370" x2="580" y2="417" stroke="#3b82f6" stroke-width="2.5"/>
<line x1="610" y1="370" x2="610" y2="417" stroke="#3b82f6" stroke-width="2.5"/>
<line x1="640" y1="370" x2="640" y2="417" stroke="#3b82f6" stroke-width="2.5"/>
<line x1="670" y1="370" x2="670" y2="417" stroke="#3b82f6" stroke-width="2.5"/>
<line x1="700" y1="370" x2="700" y2="417" stroke="#3b82f6" stroke-width="2.5"/>
<text x="620" y="412" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f" font-style="italic">nerve fibres</text>

<!-- Row 4: Olfactory bulb + brain  y=429–492 -->
<rect x="20" y="429" width="960" height="63" rx="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<!-- text zone -->
<text x="35" y="453" font-family="Arial" font-size="16" font-weight="700" fill="#4c1d95">Olfactory Bulb + Brain</text>
<text x="35" y="473" font-family="Arial" font-size="14" fill="#3b0764">Decodes pattern across 400 receptor types → identifies the specific smell</text>
<!-- shapes zone: brain oval (x=700+) -->
<ellipse cx="830" cy="460" rx="115" ry="26" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
<text x="830" y="465" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#3b0764">BRAIN</text>

<!-- TAKEAWAY STRIP (y=505–545) -->
<rect x="0" y="505" width="1000" height="40" fill="#1f5f8b"/>
<text x="500" y="530" text-anchor="middle" font-family="Arial" font-size="15" fill="white" font-weight="700">Molecule → receptor → nerve → brain decodes = SMELL. Block any step = no smell.</text>
</svg>
