<circle cx="565" cy="325" r="12" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="825" cy="235" r="12" fill="#1f5f8b" stroke="#1f5f8b" stroke-width="2"/>
<path d="M825 220 Q775 175 780 235 L813 245 Z" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M840 235 Q895 215 875 270 L830 247 Z" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M820 250 Q815 305 775 280 L813 238 Z" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="720" y1="340" x2="720" y2="355" stroke="#1f5f8b" stroke-width="2"/>
<line x1="745" y1="340" x2="745" y2="355" stroke="#1f5f8b" stroke-width="2"/>
<line x1="785" y1="340" x2="785" y2="355" stroke="#1f5f8b" stroke-width="2"/>
<line x1="840" y1="340" x2="840" y2="355" stroke="#1f5f8b" stroke-width="2"/>
<line x1="905" y1="340" x2="905" y2="355" stroke="#1f5f8b" stroke-width="2"/>
<text x="185" y="438" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">Extreme → other side → back</text>
<text x="505" y="438" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Longer: longer period</text>
<text x="825" y="438" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Intervals may change</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Counting cycles gives time only when the cycle duration is known.</text>
</svg>
