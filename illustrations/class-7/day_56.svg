<path d="M125 340 Q185 378 245 340" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<line x1="245" y1="340" x2="255" y2="330" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M250 360 Q185 405 120 360" fill="none" stroke="#579b70" stroke-width="2"/>
<line x1="120" y1="360" x2="112" y2="350" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="445" y1="175" x2="445" y2="255" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="445" cy="255" r="12" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
