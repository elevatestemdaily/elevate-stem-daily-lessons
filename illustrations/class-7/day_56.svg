<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why is a spinning fan a poor clock but a pendulum useful?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Stable cycle intervals matter more than motion simply repeating</text>
<text x="185" y="137" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">One complete return</text>
<text x="505" y="137" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Length affects period</text>
<text x="825" y="137" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Uncontrolled rate</text>
<line x1="100" y1="170" x2="270" y2="170" stroke="#1f5f8b" stroke-width="5"/>
<line x1="185" y1="175" x2="120" y2="305" stroke="#1f5f8b" stroke-width="2"/>
