<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>

<!-- TITLE -->
<text x="500" y="44" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b">Why does sound disappear in space?</text>
<text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f5f8b">Sound = mechanical wave (needs particles). Space = vacuum (no particles) → no sound.</text>

<!-- ═══════════ LEFT PANEL: Earth / Air  x=20–470 ═══════════ -->

<!-- Sky background (light blue = air) -->
<rect x="20" y="88" width="450" height="345" rx="0" fill="#bfdbfe"/>
<!-- Ground (green) -->
<rect x="20" y="433" width="450" height="32" fill="#86efac" rx="0"/>

<!-- Header text in left panel -->
<text x="245" y="108" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1e3a5f">EARTH — Air is a Medium</text>
<text x="245" y="127" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f">Sound = compression wave through particles</text>
<text x="245" y="145" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f">Air: 343 m/s  |  Water: 1480 m/s  |  Steel: 5960 m/s</text>

<!-- Speaker box at left -->
<rect x="30" y="260" width="42" height="65" fill="#374151" rx="4"/>
<!-- Speaker cone -->
<ellipse cx="72" cy="292" rx="5" ry="25" fill="#64748b"/>
<!-- Speaker text -->
<text x="51" y="343" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e293b">Speaker</text>

<!-- Sound wave arcs (right-side semicircles from speaker, centered at 72,292) -->
<path d="M 72,247 A 45,45 0 0,1 72,337" fill="none" stroke="#1e3a5f" stroke-width="2.5"/>
<path d="M 72,207 A 85,85 0 0,1 72,377" fill="none" stroke="#1e3a5f" stroke-width="2.5" opacity="0.7"/>
<path d="M 72,167 A 125,125 0 0,1 72,417" fill="none" stroke="#1e3a5f" stroke-width="2.5" opacity="0.4"/>

<!-- Air particles (dots) in the sound path -->
<circle cx="160" cy="265" r="4" fill="#3b82f6" opacity="0.8"/>
<circle cx="185" cy="285" r="4" fill="#3b82f6" opacity="0.8"/>
<circle cx="175" cy="305" r="4" fill="#3b82f6" opacity="0.8"/>
<circle cx="210" cy="270" r="4" fill="#3b82f6" opacity="0.8"/>
<circle cx="225" cy="295" r="4" fill="#3b82f6" opacity="0.8"/>
<circle cx="200" cy="315" r="4" fill="#3b82f6" opacity="0.8"/>
<circle cx="248" cy="280" r="4" fill="#3b82f6" opacity="0.8"/>
<circle cx="262" cy="300" r="4" fill="#3b82f6" opacity="0.8"/>
<!-- Vibration arrows on particle -->
<text x="185" y="258" font-family="Arial" font-size="14" fill="#1e3a5f">←→ particles vibrate</text>
<text x="170" y="325" font-family="Arial" font-size="14" fill="#1e3a5f">compress &amp; expand</text>

<!-- Ear at right of left panel -->
<ellipse cx="445" cy="292" rx="14" ry="30" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
<ellipse cx="456" cy="292" rx="6" ry="15" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="445" y="340" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e293b">Ear</text>

<!-- "SOUND TRAVELS" label with arrow -->
<text x="250" y="390" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e40af">→ SOUND TRAVELS → YOU HEAR IT</text>

<!-- Ground text -->
<text x="245" y="451" text-anchor="middle" font-family="Arial" font-size="14" fill="#064e3b">Earth: particles everywhere → sound works</text>

<!-- ═══════════ RIGHT PANEL: Space / Vacuum  x=530–978 ═══════════ -->

<!-- Space background (light blue = vacuum) -->
<rect x="530" y="88" width="448" height="377" rx="0" fill="#eff6ff"/>
<!-- Stars (indigo dots on light bg) -->
<circle cx="560" cy="118" r="2" fill="#93c5fd"/>
<circle cx="620" cy="102" r="1.5" fill="#93c5fd"/>
<circle cx="700" cy="115" r="2" fill="#93c5fd"/>
<circle cx="780" cy="100" r="1.5" fill="#93c5fd"/>
<circle cx="860" cy="120" r="2" fill="#93c5fd"/>
<circle cx="940" cy="108" r="1.5" fill="#93c5fd"/>
<circle cx="550" cy="180" r="1.5" fill="#93c5fd"/>
<circle cx="650" cy="165" r="2" fill="#93c5fd"/>
<circle cx="760" cy="178" r="1.5" fill="#93c5fd"/>
<circle cx="880" cy="160" r="2" fill="#93c5fd"/>
<circle cx="970" cy="175" r="1.5" fill="#93c5fd"/>
<circle cx="575" cy="250" r="1.5" fill="#93c5fd"/>
<circle cx="680" cy="240" r="2" fill="#93c5fd"/>
<circle cx="820" cy="255" r="1.5" fill="#93c5fd"/>
<circle cx="955" cy="242" r="2" fill="#93c5fd"/>
<circle cx="560" cy="340" r="1.5" fill="#93c5fd"/>
<circle cx="730" cy="350" r="2" fill="#93c5fd"/>
<circle cx="900" cy="335" r="1.5" fill="#93c5fd"/>

<!-- Header text (dark on light) -->
<text x="754" y="108" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1e3a5f">SPACE — Vacuum</text>
<text x="754" y="127" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">No air, no particles → no medium for sound</text>
<text x="754" y="145" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">"In space, no one can hear you scream" — true!</text>

<!-- Explosion / burst in space center -->
<circle cx="754" cy="310" r="22" fill="#f97316"/>
<line x1="754" y1="282" x2="754" y2="268" stroke="#fbbf24" stroke-width="3"/>
<line x1="754" y1="338" x2="754" y2="352" stroke="#fbbf24" stroke-width="3"/>
<line x1="726" y1="310" x2="712" y2="310" stroke="#fbbf24" stroke-width="3"/>
<line x1="782" y1="310" x2="796" y2="310" stroke="#fbbf24" stroke-width="3"/>
<line x1="734" y1="290" x2="724" y2="280" stroke="#fbbf24" stroke-width="2.5"/>
<line x1="774" y1="290" x2="784" y2="280" stroke="#fbbf24" stroke-width="2.5"/>
<line x1="734" y1="330" x2="724" y2="340" stroke="#fbbf24" stroke-width="2.5"/>
<line x1="774" y1="330" x2="784" y2="340" stroke="#fbbf24" stroke-width="2.5"/>
<!-- "BOOM!" label -->
<text x="754" y="365" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#d97706">HUGE EXPLOSION</text>
<!-- No sound waves = big X over where waves would be -->
<text x="754" y="385" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#ef4444">✗ No sound waves</text>
<text x="754" y="403" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">Vacuum: no particles to vibrate</text>

<!-- Astronaut spacecraft at top right (simple shapes) -->
<rect x="905" y="200" width="38" height="22" fill="#94a3b8" rx="3"/>
<polygon points="905,200 924,180 943,200" fill="#e2e8f0"/>

<!-- Radio wave arc from spacecraft to Earth (yellow curved line) -->
<!-- Earth at bottom left of right panel -->
<circle cx="570" cy="430" r="20" fill="#3b82f6" stroke="#22c55e" stroke-width="4"/>
<text x="570" y="460" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f">Earth</text>
<!-- Bezier radio wave -->
<path d="M 905,210 Q 800,240 650,350 Q 610,390 575,428" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8,5"/>
<text x="754" y="232" text-anchor="middle" font-family="Arial" font-size="14" fill="#d97706" font-weight="700">RADIO WAVES (electromagnetic)</text>
<text x="754" y="248" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">No medium needed — travel at speed of light</text>

<!-- Space panel bottom strip -->
<rect x="530" y="465" width="448" height="30" fill="#dbeafe" rx="0"/>
<text x="754" y="484" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f">Astronauts communicate via radio — not by shouting!</text>

<!-- Centre divider line -->
<rect x="487" y="88" width="43" height="377" fill="#f8fbff"/>
<text x="508" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="#1f5f8b" transform="rotate(-90 508 280)">← AIR | VACUUM →</text>

<!-- TAKEAWAY STRIP -->
<rect x="0" y="505" width="1000" height="40" fill="#1f5f8b"/>
<text x="500" y="530" text-anchor="middle" font-family="Arial" font-size="15" fill="white" font-weight="700">Sound needs particles to travel. Space is a vacuum — no particles = no sound. Radio waves need no medium.</text>
</svg>
