<text x="235" y="418" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Hyphae form the mycelium</text>
<text x="650" y="390" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Enzymes out</text>
<text x="835" y="418" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Small products in</text>
<text x="500" y="459" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Example: saprotrophic feeding on dead organic material.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Secretion → breakdown outside the cells → uptake into hyphae.</text>
