<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why do mushrooms not need green leaves?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">The visible mushroom sits above a much larger feeding network</text>
<text x="235" y="133" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Visible fruiting structure</text>
<text x="735" y="133" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Magnified feeding contact</text>
