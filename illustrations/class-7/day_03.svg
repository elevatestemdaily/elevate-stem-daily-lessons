<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>

<!-- TITLE -->
<text x="500" y="44" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b">Why do we breathe faster after running?</text>
<text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f5f8b">An automatic feedback loop driven by rising CO₂ — not falling O₂</text>

<!-- ── KEY FACT box  x=30–255, y=95–223 ── -->
<rect x="30" y="95" width="225" height="128" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="143" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">Key Fact</text>
<text x="143" y="139" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Trigger = rising CO₂</text>
<text x="143" y="158" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">NOT falling O₂</text>
<text x="143" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Rest: ~15 breaths/min</text>
<text x="143" y="196" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Exercise: ~40–60/min</text>
<text x="143" y="214" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Loop is fully automatic</text>

<!-- ── NODE 2: Chemoreceptors  x=280–730, y=95–183 ── -->
<!-- no shapes, full width for text -->
<rect x="280" y="95" width="450" height="88" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="505" y="121" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">2. Chemoreceptors Detect Rising CO₂</text>
<text x="505" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">Detector cells in brainstem + aorta monitor blood CO₂</text>
<text x="505" y="162" text-anchor="middle" font-family="Arial" font-size="14" fill="#78350f">CO₂ rises → urgent signal sent to breathing centre</text>

<!-- ── NODE 1: Exercise  x=30–240, y=248–338 ── -->
<rect x="30" y="248" width="210" height="90" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
<text x="135" y="274" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#991b1b">1. Exercise</text>
<text x="135" y="294" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">Muscles burn glucose fast</text>
<text x="135" y="312" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">→ produce more CO₂</text>
<text x="135" y="330" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">CO₂ enters bloodstream</text>

<!-- arrow 1 → 2 (up-right diagonal) -->
<line x1="185" y1="248" x2="310" y2="183" stroke="#1f5f8b" stroke-width="2.5"/>
<polygon points="304,176 318,183 305,192" fill="#1f5f8b"/>
<text x="218" y="224" font-family="Arial" font-size="14" fill="#1f5f8b">CO₂ rises</text>
<text x="218" y="240" font-family="Arial" font-size="14" fill="#1f5f8b">in blood</text>

<!-- ── NODE 3: Brain signals  x=760–970, y=248–338 ── -->
<rect x="760" y="248" width="210" height="90" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
<text x="865" y="274" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">3. Brain Signals</text>
<text x="865" y="294" text-anchor="middle" font-family="Arial" font-size="14" fill="#064e3b">Brainstem tells diaphragm</text>
<text x="865" y="312" text-anchor="middle" font-family="Arial" font-size="14" fill="#064e3b">and chest muscles:</text>
<text x="865" y="330" text-anchor="middle" font-family="Arial" font-size="14" fill="#064e3b">"Breathe faster + deeper!"</text>

<!-- arrow 2 → 3 (down-right diagonal) -->
<line x1="730" y1="155" x2="858" y2="248" stroke="#1f5f8b" stroke-width="2.5"/>
<polygon points="851,241 865,248 852,257" fill="#1f5f8b"/>
<text x="788" y="198" font-family="Arial" font-size="14" fill="#1f5f8b">Brain</text>
<text x="788" y="214" font-family="Arial" font-size="14" fill="#1f5f8b">signals</text>

<!-- ── NODE 4: Lungs expel CO₂  x=280–730, y=410–495 ──
     text zone x=290–505 | shapes zone x=520–720 -->
<rect x="280" y="410" width="450" height="85" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<!-- text (left-aligned, ends before x=510) -->
<text x="295" y="436" font-family="Arial" font-size="15" font-weight="700" fill="#1e3a5f">4. Exhale CO₂, Inhale O₂</text>
<text x="295" y="456" font-family="Arial" font-size="14" fill="#1e3a5f">Faster breathing flushes CO₂</text>
<text x="295" y="474" font-family="Arial" font-size="14" fill="#1e3a5f">CO₂ drops → breathing slows</text>
<!-- shapes: lung ellipses in right zone (x=520+) -->
<ellipse cx="548" cy="452" rx="20" ry="26" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
<ellipse cx="596" cy="452" rx="20" ry="26" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="572" y="490" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f">Lungs</text>
<!-- small arrows inside lung shapes -->
<text x="548" y="449" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a5f">↑O₂</text>
<text x="596" y="449" text-anchor="middle" font-family="Arial" font-size="14" fill="#ef4444">↓CO₂</text>

<!-- arrow 3 → 4 (down-left diagonal) -->
<line x1="865" y1="338" x2="724" y2="410" stroke="#1f5f8b" stroke-width="2.5"/>
<polygon points="718,403 730,412 716,420" fill="#1f5f8b"/>
<text x="790" y="374" font-family="Arial" font-size="14" fill="#1f5f8b">Deep</text>
<text x="790" y="390" font-family="Arial" font-size="14" fill="#1f5f8b">breaths</text>

<!-- arrow 4 → 1 (left) -->
<line x1="280" y1="455" x2="240" y2="338" stroke="#1f5f8b" stroke-width="2.5"/>
<polygon points="233,342 244,330 250,344" fill="#1f5f8b"/>
<text x="220" y="398" font-family="Arial" font-size="14" fill="#1f5f8b">CO₂</text>
<text x="218" y="414" font-family="Arial" font-size="14" fill="#1f5f8b">drops →</text>
<text x="213" y="430" font-family="Arial" font-size="14" fill="#1f5f8b">breathing</text>
<text x="220" y="446" font-family="Arial" font-size="14" fill="#1f5f8b">slows</text>

<!-- centre label -->
<text x="500" y="315" text-anchor="middle" font-family="Arial" font-size="14" fill="#64748b">Automatic</text>
<text x="500" y="332" text-anchor="middle" font-family="Arial" font-size="14" fill="#64748b">feedback loop</text>
<circle cx="500" cy="320" r="52" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>

<!-- TAKEAWAY STRIP (y=505–545) -->
<rect x="0" y="505" width="1000" height="40" fill="#1f5f8b"/>
<text x="500" y="530" text-anchor="middle" font-family="Arial" font-size="15" fill="white" font-weight="700">Rising CO₂ triggers automatic breathing response — no conscious control needed</text>
</svg>
