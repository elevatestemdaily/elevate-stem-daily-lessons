<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why do oil and water form separate layers after shaking?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Droplet dispersion differs from molecular dissolution</text>
<text x="170" y="134" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Separate layers</text>
<path d="M70 170 L70 345 L270 345 L270 170" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<rect x="74" y="240" width="192" height="100" rx="0" fill="#ddeeff" stroke="#ddeeff" stroke-width="2"/>
<text x="500" y="134" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">After shaking</text>
<path d="M400 170 L400 345 L600 345 L600 170" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<rect x="404" y="240" width="192" height="100" rx="0" fill="#ddeeff" stroke="#ddeeff" stroke-width="2"/>
<text x="830" y="134" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Layers re-form</text>
<path d="M730 170 L730 345 L930 345 L930 170" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<rect x="734" y="240" width="192" height="100" rx="0" fill="#ddeeff" stroke="#ddeeff" stroke-width="2"/>
<rect x="74" y="205" width="192" height="40" rx="0" fill="#e6a23c" stroke="#e6a23c" stroke-width="2"/>
<rect x="734" y="205" width="192" height="40" rx="0" fill="#e6a23c" stroke="#e6a23c" stroke-width="2"/>
<circle cx="445" cy="205" r="11" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="485" cy="235" r="8" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="545" cy="215" r="12" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="460" cy="285" r="15" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="530" cy="310" r="10" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="565" cy="270" r="9" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="495" cy="265" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="290" y1="270" x2="365" y2="270" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="630" y1="270" x2="705" y2="270" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="170" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Oil and water stay distinct</text>
<text x="500" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Many oil droplets in water</text>
<text x="830" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Droplets can merge</text>
<text x="500" y="449" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Immiscibility explains separation; density helps set layer order.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">An evenly cloudy mixture need not be a molecular solution.</text>
</svg>
