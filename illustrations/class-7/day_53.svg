<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why is dissolving salt different from melting it?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Follow components and states rather than disappearance from sight</text>
<text x="170" y="136" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Ice: solid water</text>
<text x="500" y="136" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Melting</text>
<text x="830" y="136" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Liquid water</text>
<rect x="105" y="170" width="130" height="80" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M760 175 L760 250 L900 250 L900 175" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<rect x="765" y="215" width="130" height="30" rx="0" fill="#ddeeff" stroke="#ddeeff" stroke-width="2"/>
<line x1="310" y1="210" x2="685" y2="210" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="272" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Same component; changed state</text>
<text x="170" y="322" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Salt + water</text>
<text x="500" y="322" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Dissolving</text>
<text x="830" y="322" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Solution: both components</text>
<path d="M100 345 L100 425 L240 425 L240 345" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<rect x="105" y="385" width="130" height="35" rx="0" fill="#ddeeff" stroke="#ddeeff" stroke-width="2"/>
<rect x="125" y="397" width="15" height="15" rx="0" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="160" y="397" width="15" height="15" rx="0" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="195" y="397" width="15" height="15" rx="0" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="310" y1="385" x2="685" y2="385" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M760 345 L760 425 L900 425 L900 345" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<rect x="765" y="365" width="130" height="55" rx="0" fill="#ddeeff" stroke="#ddeeff" stroke-width="2"/>
<circle cx="785" cy="385" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="810" cy="405" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="845" cy="380" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="875" cy="400" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="464" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">A room-temperature salt solution is not molten salt.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Melting changes state; dissolving requires a solvent and forms a mixture.</text>
</svg>
