<rect width="1000" height="560" fill="#f8fbff"/>

<!-- TITLE -->
<text x="500" y="44" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b">Why does ice float on water?</text>
<text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f5f8b">Ice forms a hexagonal lattice with gaps — making it less dense than liquid water</text>

<!-- ── LEFT PANEL: Liquid water  x=20–455 ── -->
