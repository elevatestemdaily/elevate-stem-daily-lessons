<text x="170" y="400" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Proportions can vary</text>
<text x="500" y="400" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Each group represents H2O</text>
<text x="830" y="400" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Mixture containing water</text>
<text x="500" y="451" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Symbol counts are illustrative, not atmospheric percentages.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Uniform appearance alone does not establish chemical purity.</text>
