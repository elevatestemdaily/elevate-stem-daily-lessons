<circle cx="450" cy="210" r="15" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="428" cy="232" r="9" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
