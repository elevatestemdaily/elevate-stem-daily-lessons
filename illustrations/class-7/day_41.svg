<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does warm water rise above cooler water?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Heating from below can drive circulation; warmer water above can stay layered</text>
<text x="265" y="133" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Warmed from below</text>
<rect x="75" y="165" width="380" height="185" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<text x="735" y="133" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Warm layer above</text>
<rect x="545" y="165" width="380" height="185" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<rect x="100" y="310" width="85" height="28" rx="8" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="155" y1="300" x2="155" y2="205" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="175" y1="200" x2="380" y2="200" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="390" y1="215" x2="390" y2="315" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="370" y1="325" x2="200" y2="325" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="550" y="170" width="370" height="60" rx="0" fill="#e6a23c" stroke="#e6a23c" stroke-width="2"/>
<text x="265" y="398" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Rise → cross → sink → return</text>
<text x="735" y="398" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">More stable density arrangement</text>
<text x="500" y="447" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Model applies to water comfortably above the near-freezing region.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Convection transports energy through bulk movement of a fluid.</text>
</svg>
