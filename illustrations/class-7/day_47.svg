<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why do lichen partners live together on a rock?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">A close association combines different contributions</text>
<text x="255" y="134" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Simplified lichen section</text>
<text x="735" y="134" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Exchange between partners</text>
<rect x="75" y="165" width="365" height="175" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M90 185 Q125 173 160 185 T230 185 T300 185 T370 185 T425 185" fill="none" stroke="#e6a23c" stroke-width="4"/>
<path d="M90 280 Q125 268 160 280 T230 280 T300 280 T370 280 T425 280" fill="none" stroke="#e6a23c" stroke-width="4"/>
<path d="M90 315 Q125 303 160 315 T230 315 T300 315 T370 315 T425 315" fill="none" stroke="#e6a23c" stroke-width="4"/>
