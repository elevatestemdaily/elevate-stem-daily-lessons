<path d="M70 370 L125 345 L220 358 L310 350 L445 375 L445 405 L70 405 Z" fill="#1f5f8b" stroke="#1f5f8b" stroke-width="2"/>
<line x1="260" y1="340" x2="240" y2="363" stroke="#e6a23c" stroke-width="3"/>
<line x1="290" y1="340" x2="310" y2="360" stroke="#e6a23c" stroke-width="3"/>
<line x1="560" y1="210" x2="900" y2="210" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="730" y="184" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Organic products → fungus</text>
<line x1="900" y1="300" x2="560" y2="300" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="735" y="335" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Structure, water and mineral access</text>
<text x="255" y="445" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Rock: support, not a sugar source</text>
<text x="735" y="445" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Green cells + fungal structure</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Partners exchange resources; resting on bark does not prove parasitism.</text>
