<text x="500" y="398" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Organisms + changed materials</text>
<text x="830" y="398" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Coatings and aggregates</text>
<text x="500" y="450" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Humus is a broad term, not one pure, permanent chemical.</text>
