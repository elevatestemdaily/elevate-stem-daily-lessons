<text x="500" y="133" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Processing and redistribution</text>
<text x="830" y="133" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Organic–mineral mixture</text>
