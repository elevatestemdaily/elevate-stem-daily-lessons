<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does a saturated solution leave extra sugar undissolved?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">At fixed conditions, dissolving speed and equilibrium capacity are different</text>
<text x="170" y="134" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Unsaturated</text>
<path d="M70 170 L85 340 L255 340 L270 170" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<rect x="85" y="235" width="170" height="100" rx="0" fill="#ddeeff" stroke="#ddeeff" stroke-width="2"/>
<text x="500" y="134" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">More sugar dissolved</text>
<path d="M400 170 L415 340 L585 340 L600 170" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<rect x="415" y="235" width="170" height="100" rx="0" fill="#ddeeff" stroke="#ddeeff" stroke-width="2"/>
<text x="830" y="134" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Saturated + extra solid</text>
<path d="M730 170 L745 340 L915 340 L930 170" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<rect x="745" y="235" width="170" height="100" rx="0" fill="#ddeeff" stroke="#ddeeff" stroke-width="2"/>
<circle cx="140" cy="270" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="195" cy="300" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="440" cy="265" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="480" cy="300" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="530" cy="265" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="555" cy="310" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="770" cy="260" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="810" cy="285" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="860" cy="260" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="890" cy="305" r="4" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="775" y="321" width="13" height="13" rx="0" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="800" y="321" width="13" height="13" rx="0" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="825" y="321" width="13" height="13" rx="0" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="850" y="321" width="13" height="13" rx="0" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="875" y="321" width="13" height="13" rx="0" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="810" y1="310" x2="810" y2="285" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="845" y1="285" x2="845" y2="310" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="170" y="390" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Can dissolve more</text>
<text x="500" y="390" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Clear does not mean empty</text>
<text x="830" y="390" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Exchange can still continue</text>
<text x="500" y="435" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Stirring changes the rate; it does not provide unlimited capacity.</text>
<text x="500" y="462" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Compare the same solute, solvent amount and temperature.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Leftover grains after a short wait do not alone prove equilibrium.</text>
</svg>
