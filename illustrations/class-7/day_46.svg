<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why can you feel heat from the Sun across empty space?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Electromagnetic radiation needs no continuous material pathway</text>
<text x="155" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Sun: source</text>
<text x="490" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Largely empty space</text>
<text x="840" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Receiver</text>
<circle cx="155" cy="245" r="58" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="800" y="190" width="85" height="160" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M235 205 Q270 185 305 205 T375 205 T445 205 T515 205 T585 205 T655 205 T725 205" fill="none" stroke="#e6a23c" stroke-width="3"/>
<line x1="725" y1="205" x2="785" y2="205" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M235 255 Q270 235 305 255 T375 255 T445 255 T515 255 T585 255 T655 255 T725 255" fill="none" stroke="#e6a23c" stroke-width="3"/>
<line x1="725" y1="255" x2="785" y2="255" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="795" y1="215" x2="700" y2="170" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M795 315 Q760 295 725 315 T655 315" fill="none" stroke="#1f5f8b" stroke-width="3"/>
<line x1="650" y1="315" x2="590" y2="315" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="155" y="402" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Energy leaves the source</text>
<text x="490" y="402" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">No air conveyor required</text>
<text x="840" y="402" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Absorb / reflect / emit</text>
<text x="500" y="453" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">The receiver also loses energy; its temperature follows the balance.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">A vacuum reduces material transfer routes, but radiation still crosses.</text>
</svg>
