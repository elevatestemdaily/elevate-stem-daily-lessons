<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why do rain-splashed bare slopes develop tiny channels?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">A preferred route concentrates water, then erosion can deepen that route</text>
<text x="240" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Bare slope and converging runoff</text>
<text x="745" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Cover interrupts impact and flow</text>
<path d="M65 200 L435 330 L435 365 L65 235 Z" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="95" y1="210" x2="245" y2="280" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="160" y1="230" x2="310" y2="300" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="235" y1="255" x2="385" y2="325" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M160 235 L290 290 L400 330" fill="none" stroke="#1f5f8b" stroke-width="7"/>
<line x1="90" y1="155" x2="80" y2="185" stroke="#1f5f8b" stroke-width="2"/>
<line x1="150" y1="155" x2="140" y2="185" stroke="#1f5f8b" stroke-width="2"/>
<line x1="210" y1="155" x2="200" y2="185" stroke="#1f5f8b" stroke-width="2"/>
<path d="M570 200 L940 330 L940 365 L570 235 Z" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<path d="M600 215 l-5 -27 l10 24 l12 -20" fill="none" stroke="#579b70" stroke-width="4"/>
<path d="M665 238 l-5 -27 l10 24 l12 -20" fill="none" stroke="#579b70" stroke-width="4"/>
<path d="M730 260 l-5 -27 l10 24 l12 -20" fill="none" stroke="#579b70" stroke-width="4"/>
<path d="M795 283 l-5 -27 l10 24 l12 -20" fill="none" stroke="#579b70" stroke-width="4"/>
<path d="M860 306 l-5 -27 l10 24 l12 -20" fill="none" stroke="#579b70" stroke-width="4"/>
<line x1="580" y1="210" x2="630" y2="215" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="710" y1="255" x2="750" y2="263" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="240" y="409" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Deeper route draws in more flow</text>
<text x="745" y="409" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Surface protection changes exposure</text>
<text x="500" y="457" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Transport can be followed by deposition where flow slows.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Concentrated runoff and channel shape can reinforce each other.</text>
</svg>
