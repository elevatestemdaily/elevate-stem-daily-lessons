<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How can repeated timings make a race result more trustworthy?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Invented example data: preserve individual readings as well as summaries</text>
<text x="500" y="132" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">One event timed three times: 10.2 s, 10.4 s, 10.3 s</text>
<line x1="150" y1="220" x2="850" y2="220" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="350" cy="220" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<text x="350" y="259" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">10.2 s</text>
<circle cx="500" cy="220" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="259" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">10.3 s</text>
<circle cx="650" cy="220" r="7" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<text x="650" y="259" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">10.4 s</text>
<line x1="350" y1="290" x2="650" y2="290" stroke="#1f5f8b" stroke-width="2"/>
<line x1="350" y1="280" x2="350" y2="300" stroke="#1f5f8b" stroke-width="2"/>
<line x1="650" y1="280" x2="650" y2="300" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="330" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Range: 0.2 s     Mean: 10.3 s</text>
<line x1="500" y1="170" x2="500" y2="202" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="163" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">Mean marker</text>
<line x1="90" y1="410" x2="420" y2="410" stroke="#1f5f8b" stroke-width="2"/>
<line x1="580" y1="410" x2="910" y2="410" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="225" cy="410" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="245" cy="410" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="265" cy="410" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="610" cy="410" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="745" cy="410" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="880" cy="410" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<text x="255" y="452" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Narrower spread</text>
<text x="745" y="452" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Wider spread</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">A mean summarises readings; it does not erase their variation.</text>
</svg>
