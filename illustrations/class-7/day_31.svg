<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does a steel spoon warm up in hot dal?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Thermal energy crosses a stationary metal path</text>
<text x="200" y="133" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Contact with warm dal</text>
<text x="520" y="133" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Continuous steel path</text>
<text x="835" y="133" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Cooler handle</text>
<path d="M70 230 L310 230 L285 345 L95 345 Z" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<path d="M145 235 Q145 185 195 185 Q245 185 245 235 Q245 265 195 265 Q145 265 145 235 Z" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<rect x="220" y="211" width="680" height="25" rx="10" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="310" y1="185" x2="420" y2="185" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="480" y1="185" x2="590" y2="185" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="650" y1="185" x2="760" y2="185" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="200" y="391" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Bowl receives energy</text>
<text x="520" y="391" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Energy moves along the solid</text>
<text x="835" y="391" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Handle warms gradually</text>
<text x="250" y="440" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Thicker path: larger cross-section</text>
<text x="755" y="440" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Longer path: slower transfer</text>
<rect x="120" y="455" width="260" height="14" rx="3" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="570" y="455" width="360" height="5" rx="1" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Heat flows toward cooler regions; the steel does not flow.</text>
</svg>
