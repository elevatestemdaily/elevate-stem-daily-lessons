<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="elecArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#e85d04"/>
  </marker>
  <marker id="blueArr16" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1f5f8b"/>
  </marker>
</defs>
<!-- Background -->
<rect width="1000" height="560" fill="#f8fbff"/>
<!-- Title -->
<text x="500" y="38" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">What makes electricity flow?</text>
<text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Voltage pushes free electrons through conductors — Day 16</text>

<!-- LEFT COLUMN: Key Principle + Water Analogy (x=20-460) -->
<!-- Key Principle box -->
<rect x="20" y="70" width="440" height="68" rx="6" fill="#1f5f8b"/>
<text x="240" y="90" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">KEY PRINCIPLE</text>
<text x="240" y="107" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Voltage = pressure pushing free electrons.</text>
<text x="240" y="122" text-anchor="middle" font-family="Arial" font-size="14" fill="white">No voltage = no flow = no current.</text>

<!-- Water analogy panel -->
<rect x="20" y="148" width="440" height="155" rx="6" fill="#e8f4fd" stroke="#1f5f8b" stroke-width="2"/>
<text x="240" y="168" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">Water-pipe analogy</text>
<!-- Pipe shape -->
<rect x="45" y="180" width="390" height="30" rx="15" fill="#aac8e0" stroke="#1f5f8b" stroke-width="2"/>
<!-- Water flow arrows -->
<line x1="80" y1="195" x2="140" y2="195" stroke="#1f5f8b" stroke-width="2" marker-end="url(#blueArr16)"/>
<line x1="190" y1="195" x2="250" y2="195" stroke="#1f5f8b" stroke-width="2" marker-end="url(#blueArr16)"/>
<line x1="300" y1="195" x2="360" y2="195" stroke="#1f5f8b" stroke-width="2" marker-end="url(#blueArr16)"/>
<!-- Labels under pipe -->
<text x="60" y="228" font-family="Arial" font-size="14" fill="#333">Voltage</text>
<text x="45" y="240" font-family="Arial" font-size="14" fill="#555">= water pressure</text>
<text x="190" y="228" font-family="Arial" font-size="14" fill="#333">Conductor</text>
<text x="185" y="240" font-family="Arial" font-size="14" fill="#555">= pipe</text>
<text x="340" y="228" font-family="Arial" font-size="14" fill="#333">Electrons</text>
<text x="335" y="240" font-family="Arial" font-size="14" fill="#555">= water</text>
<!-- Three analogy rows -->
<text x="35" y="262" font-family="Arial" font-size="14" fill="#1f5f8b" font-weight="700">Voltage (V)</text>
<text x="145" y="262" font-family="Arial" font-size="14" fill="#333">→ pushes electrons (like pump pressure)</text>
<text x="35" y="278" font-family="Arial" font-size="14" fill="#1f5f8b" font-weight="700">Current (A)</text>
<text x="145" y="278" font-family="Arial" font-size="14" fill="#333">→ flow rate of electrons through wire</text>
<text x="35" y="294" font-family="Arial" font-size="14" fill="#1f5f8b" font-weight="700">Resistance (Ω)</text>
<text x="145" y="294" font-family="Arial" font-size="14" fill="#333">→ friction slowing electron flow</text>

<!-- Conductors vs insulators box -->
<rect x="20" y="313" width="440" height="80" rx="6" fill="#fff8e1" stroke="#f4a022" stroke-width="2"/>
<text x="240" y="332" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#b45309">Conductors vs Insulators</text>
<text x="35" y="350" font-family="Arial" font-size="14" fill="#333">Conductor: metals have free electrons that drift when</text>
<text x="35" y="364" font-family="Arial" font-size="14" fill="#333">voltage applied. (Copper, aluminium, silver)</text>
<text x="35" y="380" font-family="Arial" font-size="14" fill="#333">Insulator: electrons are tightly bound — no free drift.</text>

<!-- Short circuit warning box -->
<rect x="20" y="403" width="440" height="70" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="240" y="421" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Short Circuit Warning</text>
<text x="35" y="439" font-family="Arial" font-size="14" fill="#333">No resistance in path → huge current flows →</text>
<text x="35" y="453" font-family="Arial" font-size="14" fill="#333">wire heats rapidly → fire hazard. Fuse breaks circuit.</text>
<text x="35" y="467" font-family="Arial" font-size="14" fill="#333">Battery drains instantly.</text>

<!-- RIGHT COLUMN: Simple circuit diagram (x=480-978) -->
<rect x="480" y="70" width="498" height="405" rx="6" fill="#f0f7ff" stroke="#1f5f8b" stroke-width="2"/>
<text x="729" y="92" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">Simple Electric Circuit</text>

<!-- Battery (x=530-600, centered vertically ~y=200) -->
<rect x="530" y="180" width="48" height="90" rx="4" fill="#d1fae5" stroke="#065f46" stroke-width="2"/>
<text x="554" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46" font-weight="700">+</text>
<line x1="545" y1="210" x2="563" y2="210" stroke="#065f46" stroke-width="3"/>
<line x1="540" y1="220" x2="568" y2="220" stroke="#065f46" stroke-width="2"/>
<line x1="545" y1="230" x2="563" y2="230" stroke="#065f46" stroke-width="3"/>
<text x="554" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46" font-weight="700">−</text>
<text x="554" y="285" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Battery</text>
<text x="554" y="297" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">(electron pump)</text>

<!-- Wires forming circuit loop -->
<!-- Top wire: battery+ → lightbulb (right) -->
<line x1="578" y1="185" x2="800" y2="185" stroke="#555" stroke-width="3"/>
<!-- Right wire: top down to lightbulb -->
<line x1="800" y1="185" x2="800" y2="260" stroke="#555" stroke-width="3"/>
<!-- Bulb -->
<circle cx="800" cy="290" r="30" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<line x1="790" y1="278" x2="810" y2="302" stroke="#d97706" stroke-width="2"/>
<line x1="810" y1="278" x2="790" y2="302" stroke="#d97706" stroke-width="2"/>
<text x="800" y="336" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Lightbulb</text>
<text x="800" y="349" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">(resistance)</text>
<!-- Right wire continued: bulb → bottom -->
<line x1="800" y1="320" x2="800" y2="390" stroke="#555" stroke-width="3"/>
<!-- Bottom wire: right → battery- -->
<line x1="578" y1="390" x2="800" y2="390" stroke="#555" stroke-width="3"/>
<!-- Battery- to bottom wire -->
<line x1="578" y1="265" x2="578" y2="390" stroke="#555" stroke-width="3"/>

<!-- Electron flow arrows (orange, clockwise around circuit) -->
<line x1="660" y1="185" x2="700" y2="185" stroke="#e85d04" stroke-width="2" marker-end="url(#elecArr)"/>
<line x1="800" y1="235" x2="800" y2="255" stroke="#e85d04" stroke-width="2" marker-end="url(#elecArr)"/>
<line x1="720" y1="390" x2="680" y2="390" stroke="#e85d04" stroke-width="2" marker-end="url(#elecArr)"/>
<line x1="578" y1="340" x2="578" y2="320" stroke="#e85d04" stroke-width="2" marker-end="url(#elecArr)"/>

<!-- Labels on circuit -->
<text x="660" y="175" text-anchor="middle" font-family="Arial" font-size="14" fill="#e85d04" font-weight="700">electrons →</text>
<text x="720" y="403" text-anchor="middle" font-family="Arial" font-size="14" fill="#e85d04" font-weight="700">← electrons</text>

<!-- Switch symbol -->
<circle cx="690" cy="185" r="5" fill="white" stroke="#555" stroke-width="2"/>
<line x1="695" y1="182" x2="715" y2="172" stroke="#555" stroke-width="2"/>
<text x="703" y="165" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">switch</text>

<!-- Voltage label on battery side -->
<text x="505" y="228" font-family="Arial" font-size="14" fill="#1f5f8b" font-weight="700">Voltage</text>
<text x="505" y="241" font-family="Arial" font-size="14" fill="#1f5f8b" font-weight="700">pushes</text>
<text x="505" y="254" font-family="Arial" font-size="14" fill="#1f5f8b" font-weight="700">electrons</text>

<!-- Series vs parallel note -->
<rect x="495" y="365" width="465" height="96" rx="5" fill="white" stroke="#1f5f8b" stroke-width="1"/>
<text x="727" y="382" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">Series vs Parallel</text>
<text x="502" y="398" font-family="Arial" font-size="14" fill="#333">Series: bulbs share voltage — one fails, all fail. (Dim)</text>
<text x="502" y="413" font-family="Arial" font-size="14" fill="#333">Parallel: each bulb gets full voltage — one fails, rest</text>
<text x="502" y="427" font-family="Arial" font-size="14" fill="#333">stay on. (Home wiring uses parallel circuits.)</text>
<text x="502" y="451" font-family="Arial" font-size="14" fill="#555">Phone charger: converts 230 V AC → 5 V DC for battery.</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="525" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Voltage pushes free electrons through a conductor. No voltage = no flow = no current = no energy transfer.</text>
</svg>
