<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why can steady-speed circular motion still involve acceleration?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Constant speed can coexist with continuously changing velocity direction</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Tangent velocity / inward acceleration</text>
<text x="755" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Velocity-change construction</text>
<circle cx="250" cy="270" r="75" fill="#f8fbff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="250" y1="195" x2="335" y2="195" stroke="#579b70" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="325" y1="270" x2="325" y2="355" stroke="#579b70" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="250" y1="195" x2="250" y2="235" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="325" y1="270" x2="285" y2="270" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="600" y1="210" x2="720" y2="210" stroke="#579b70" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="600" y1="210" x2="696" y2="282" stroke="#579b70" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="720" y1="210" x2="696" y2="282" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="250" y="421" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Equal lengths, changing directions</text>
<text x="755" y="421" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Difference of equal-speed vectors</text>
<text x="500" y="463" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Green: velocity. Blue: inward acceleration or velocity difference.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">An inward acceleration arrow does not replace the tangent motion arrow.</text>
</svg>
