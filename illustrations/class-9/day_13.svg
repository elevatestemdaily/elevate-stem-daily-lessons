<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How do mitochondria make energy?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Krebs cycle, electron transport chain, ATP synthase — Day 13</text>

<!-- LEFT: Mitochondria structure -->
<rect x="20" y="74" width="310" height="416" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="175" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#dc2626">Mitochondria Structure</text>

<!-- Cross-section -->
<ellipse cx="175" cy="220" rx="140" ry="90" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
<ellipse cx="175" cy="220" rx="90" ry="58" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
<!-- Cristae folds -->
<path d="M 118 185 Q 135 202 118 218" fill="none" stroke="#dc2626" stroke-width="2"/>
<path d="M 140 175 Q 157 195 140 215" fill="none" stroke="#dc2626" stroke-width="2"/>
<path d="M 210 175 Q 220 200 210 215" fill="none" stroke="#dc2626" stroke-width="2"/>
<path d="M 232 180 Q 245 205 232 222" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="175" y="215" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7f1d1d">MATRIX</text>
<text x="175" y="231" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">Krebs cycle here</text>
<text x="50" y="240" font-family="Arial" font-size="14" fill="#dc2626">←cristae</text>
<text x="175" y="300" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">inner membrane = ETC</text>
<text x="175" y="318" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">outer membrane</text>

<rect x="30" y="336" width="280" height="146" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="175" y="354" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Why so Many Cristae?</text>
<text x="40" y="374" font-family="Arial" font-size="14" fill="#333">ETC proteins sit in inner membrane</text>
<text x="40" y="392" font-family="Arial" font-size="14" fill="#333">More folds = more surface area</text>
<text x="40" y="410" font-family="Arial" font-size="14" fill="#333">= more ETC = more ATP/second</text>
<text x="40" y="430" font-family="Arial" font-size="14" fill="#555">Active cells (muscle, liver): dense cristae</text>
<text x="40" y="450" font-family="Arial" font-size="14" fill="#555">Red muscle: more mitochondria per cell</text>
<text x="40" y="468" font-family="Arial" font-size="14" fill="#555">Heart: 30% volume = mitochondria</text>

<!-- CENTRE: Krebs + ETC -->
<rect x="344" y="74" width="312" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Energy Extraction</text>

<rect x="354" y="104" width="312" height="140" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="510" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Krebs Cycle (Matrix)</text>
<text x="364" y="144" font-family="Arial" font-size="14" fill="#333">Pyruvate → Acetyl-CoA (2C)</text>
<text x="364" y="164" font-family="Arial" font-size="14" fill="#333">Enters 8-step cycle:</text>
<text x="364" y="184" font-family="Arial" font-size="14" fill="#555">→ CO₂ released (we exhale)</text>
<text x="364" y="204" font-family="Arial" font-size="14" fill="#555">→ NADH and FADH₂ produced</text>
<text x="364" y="222" font-family="Arial" font-size="14" fill="#555">→ H⁺ ions carrying electron energy</text>

<rect x="354" y="254" width="312" height="140" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="510" y="272" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Electron Transport Chain</text>
<text x="364" y="292" font-family="Arial" font-size="14" fill="#333">NADH/FADH₂ → pump H⁺ ions</text>
<text x="364" y="312" font-family="Arial" font-size="14" fill="#333">across inner membrane (gradient)</text>
<text x="364" y="332" font-family="Arial" font-size="14" fill="#555">H⁺ flow back through ATP synthase</text>
<text x="364" y="352" font-family="Arial" font-size="14" fill="#555">→ rotates motor → makes ATP!</text>
<text x="364" y="370" font-family="Arial" font-size="14" fill="#555">O₂ accepts final electrons → H₂O</text>

<rect x="354" y="404" width="312" height="78" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="510" y="422" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#7c3aed">ATP Synthase — Rotary Motor</text>
<text x="364" y="442" font-family="Arial" font-size="14" fill="#333">Nano-motor: 120 rpm, 3–4 nm wide</text>
<text x="364" y="462" font-family="Arial" font-size="14" fill="#555">Most efficient motor in nature (~100%!)</text>
<text x="364" y="478" font-family="Arial" font-size="14" fill="#555">Nobel Prize 1997 (Boyer + Walker)</text>

<!-- RIGHT: India -->
<rect x="670" y="74" width="310" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="825" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India &amp; Mitochondria</text>

<rect x="680" y="104" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Mitochondrial Disease</text>
<text x="825" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Faulty ETC → insufficient ATP</text>
<text x="825" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Affects muscles, brain, heart</text>
<text x="825" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Research at AIIMS Delhi, NIMHANS</text>

<rect x="680" y="202" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Glycolysis in Indian Food</text>
<text x="825" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Fermentation: idli dosa batter</text>
<text x="825" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Bacteria use glycolysis → lactic acid</text>
<text x="825" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Rises batter without aerobic path</text>

<rect x="680" y="300" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Sports Science</text>
<text x="825" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Elite athletes: more mitochondria/cell</text>
<text x="825" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">SAI trains athletes on mitochondrial</text>
<text x="825" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">capacity building (endurance sports)</text>

<rect x="680" y="398" width="290" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="825" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Mitochondrial DNA</text>
<text x="825" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Inherited only from mother</text>
<text x="825" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Used to trace human migration —</text>
<text x="825" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India's diverse lineages studied by CCMB</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Krebs cycle: CO₂ + H carriers. ETC: H⁺ gradient drives ATP synthase rotary motor.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">ATP synthase = 120 rpm nano-motor. Mitochondrial DNA traces human ancestry — India's lineages at CCMB.</text>
</svg>
