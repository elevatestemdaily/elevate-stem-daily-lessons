<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How was the atom discovered?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Dalton → Thomson → Rutherford → Bohr — 100 years of atomic models — Day 6</text>

<!-- LEFT: Dalton + Thomson -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">Early Atomic Models</text>

<rect x="30" y="104" width="280" height="140" rx="4" fill="white" stroke="#d97706" stroke-width="1"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Dalton (1803)</text>
<circle cx="170" cy="168" r="30" fill="#374151"/>
<text x="170" y="174" text-anchor="middle" font-family="Arial" font-size="14" fill="white">solid</text>
<text x="170" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="white">sphere</text>
<text x="170" y="216" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Indivisible solid ball.</text>
<text x="170" y="234" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Each element = unique atom.</text>

<rect x="30" y="254" width="280" height="140" rx="4" fill="white" stroke="#7c3aed" stroke-width="1"/>
<text x="170" y="272" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#7c3aed">Thomson (1897)</text>
<!-- Plum pudding -->
<circle cx="170" cy="326" r="34" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<circle cx="152" cy="316" r="6" fill="#dc2626"/>
<circle cx="188" cy="316" r="6" fill="#dc2626"/>
<circle cx="170" cy="340" r="6" fill="#dc2626"/>
<text x="170" y="372" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">"Plum pudding" model</text>
<text x="170" y="388" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Electrons (−) in positive dough</text>

<!-- India link -->
<rect x="30" y="404" width="280" height="78" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="170" y="422" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">C.V. Raman (India, 1928)</text>
<text x="170" y="442" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Nobel Prize: Raman Effect —</text>
<text x="170" y="460" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">light scattered by molecules gives</text>
<text x="170" y="476" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">info about atomic structure</text>

<!-- CENTRE: Rutherford gold foil -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Rutherford Gold Foil (1911)</text>

<rect x="344" y="104" width="312" height="200" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#374151">The Experiment</text>
<!-- Gold foil in centre -->
<rect x="488" y="168" width="24" height="90" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<text x="500" y="165" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">gold foil</text>
<!-- Alpha source on left -->
<rect x="354" y="192" width="50" height="40" rx="4" fill="#374151"/>
<text x="379" y="208" text-anchor="middle" font-family="Arial" font-size="14" fill="white">α</text>
<text x="379" y="222" text-anchor="middle" font-family="Arial" font-size="14" fill="white">src</text>
<!-- Most alpha particles go straight through -->
<line x1="404" y1="210" x2="640" y2="210" stroke="#f97316" stroke-width="1.5"/>
<line x1="404" y1="220" x2="640" y2="220" stroke="#f97316" stroke-width="1.5"/>
<!-- One deflected slightly -->
<polyline points="404,195 486,195 560,155" fill="none" stroke="#dc2626" stroke-width="2"/>
<!-- One bounced back -->
<polyline points="404,228 484,228 400,265" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="655" y="206" text-anchor="end" font-family="Arial" font-size="14" fill="#f97316">most pass through</text>
<text x="562" y="148" font-family="Arial" font-size="14" fill="#dc2626">slight deflect</text>
<text x="344" y="268" font-family="Arial" font-size="14" fill="#1d4ed8">few bounce back!</text>

<text x="500" y="292" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Conclusions:</text>
<text x="354" y="312" font-family="Arial" font-size="14" fill="#333">1. Atom is mostly empty space</text>
<text x="354" y="330" font-family="Arial" font-size="14" fill="#333">2. Tiny dense positive nucleus exists</text>
<text x="354" y="348" font-family="Arial" font-size="14" fill="#555">3. Electrons orbit far from nucleus</text>
<text x="354" y="366" font-family="Arial" font-size="14" fill="#555">4. Smashed Thomson's plum pudding!</text>

<rect x="344" y="388" width="312" height="94" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="406" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Bohr Model (1913)</text>
<text x="354" y="426" font-family="Arial" font-size="14" fill="#333">Electrons in fixed energy shells</text>
<text x="354" y="446" font-family="Arial" font-size="14" fill="#333">Shell 1: max 2, Shell 2: max 8</text>
<text x="354" y="466" font-family="Arial" font-size="14" fill="#555">Energy emitted/absorbed when e⁻ jumps</text>
<text x="354" y="482" font-family="Arial" font-size="14" fill="#555">shells → explains atomic spectra!</text>

<!-- RIGHT: India -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India &amp; Atomic Discovery</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Meghnad Saha (1920)</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Saha ionisation equation:</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">explains stellar spectra (Bohr model)</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Astronomers could measure star temps</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">TIFR Mumbai</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Tata Institute of Fundamental Research</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Founded by Bhabha, 1945</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Particle physics + atom colliders</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Raman Effect (1928)</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Light scatters off molecules</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">revealing atomic/molecular structure</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Used in chemistry labs globally</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">India Today: CERN Participation</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Indian scientists at CERN, Geneva</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Contributed to Higgs boson discovery</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">(2012) — probing sub-atomic structure</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Rutherford (1911): tiny dense nucleus + mostly empty space. Bohr: electrons in fixed energy shells.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Meghnad Saha (India) used atomic models to explain star temperatures. C.V. Raman: Nobel 1930.</text>
</svg>
