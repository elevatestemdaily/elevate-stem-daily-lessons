<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="arr20g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#16a34a"/></marker>
  <marker id="arr20b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1d4ed8"/></marker>
</defs>
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How does gravity actually work?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">F=Gm₁m₂/r², weight vs mass, and a preview of general relativity — Day 20</text>

<!-- LEFT: Gravity equation + weight vs mass -->
<rect x="20" y="74" width="310" height="416" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="175" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#16a34a">Newton's Law of Gravitation</text>

<rect x="30" y="104" width="290" height="108" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="175" y="122" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#16a34a">F = Gm₁m₂ / r²</text>
<text x="40" y="146" font-family="Arial" font-size="14" fill="#333">G = 6.674 × 10⁻¹¹ N·m²/kg²</text>
<text x="40" y="166" font-family="Arial" font-size="14" fill="#333">m₁, m₂ = masses; r = distance</text>
<text x="40" y="186" font-family="Arial" font-size="14" fill="#555">Double r → force drops to 1/4 (inverse sq)</text>
<text x="40" y="204" font-family="Arial" font-size="14" fill="#555">Double mass → double force</text>

<rect x="30" y="222" width="290" height="120" rx="4" fill="white" stroke="#94a3b8" stroke-width="1"/>
<text x="175" y="240" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#374151">Weight vs Mass</text>
<text x="40" y="262" font-family="Arial" font-size="14" fill="#333">Mass (m): amount of matter. Always same.</text>
<text x="40" y="282" font-family="Arial" font-size="14" fill="#333">Weight (W): force of gravity = mg</text>
<text x="40" y="302" font-family="Arial" font-size="14" fill="#333">W on Earth: 70 kg × 9.8 = 686 N</text>
<text x="40" y="322" font-family="Arial" font-size="14" fill="#555">W on Moon: 70 × 1.62 = 113 N (1/6)</text>
<text x="40" y="336" font-family="Arial" font-size="14" fill="#555">Mass: 70 kg everywhere!</text>

<rect x="30" y="352" width="290" height="130" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="175" y="370" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Free Fall</text>
<text x="40" y="392" font-family="Arial" font-size="14" fill="#333">All objects fall at same rate (no air)</text>
<text x="40" y="410" font-family="Arial" font-size="14" fill="#333">g = 9.8 m/s² on Earth's surface</text>
<text x="40" y="430" font-family="Arial" font-size="14" fill="#555">Moon: g = 1.62 m/s²</text>
<text x="40" y="448" font-family="Arial" font-size="14" fill="#555">Sun: g = 274 m/s² (28× Earth)</text>
<text x="40" y="468" font-family="Arial" font-size="14" fill="#555">Galileo (1590s): disproved Aristotle</text>

<!-- CENTRE: Gravity fields + relativity -->
<rect x="344" y="74" width="312" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Gravitational Field</text>

<rect x="354" y="104" width="312" height="138" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#374151">Field Lines</text>
<!-- Earth circle -->
<circle cx="500" cy="210" r="44" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
<text x="500" y="214" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Earth</text>
<!-- Field lines pointing inward -->
<line x1="500" y1="108" x2="500" y2="166" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr20g)"/>
<line x1="556" y1="122" x2="528" y2="172" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr20g)"/>
<line x1="616" y1="158" x2="558" y2="195" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr20g)"/>
<line x1="444" y1="122" x2="472" y2="172" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr20g)"/>
<line x1="384" y1="158" x2="442" y2="195" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr20g)"/>
<text x="500" y="243" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Field lines point toward mass</text>
<text x="500" y="260" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Closer lines = stronger field (near surface)</text>

<rect x="354" y="252" width="312" height="108" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="500" y="270" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#7c3aed">General Relativity Preview</text>
<text x="364" y="292" font-family="Arial" font-size="14" fill="#333">Einstein (1915): gravity = curved spacetime</text>
<text x="364" y="312" font-family="Arial" font-size="14" fill="#333">Mass bends space → objects follow curves</text>
<text x="364" y="332" font-family="Arial" font-size="14" fill="#555">GPS satellites: GR corrections needed!</text>
<text x="364" y="350" font-family="Arial" font-size="14" fill="#555">Without GR: 10 km/day GPS error</text>

<rect x="354" y="370" width="312" height="112" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="388" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Calculating Gravity</text>
<text x="364" y="410" font-family="Arial" font-size="14" fill="#333">Earth-Moon: r = 3.84×10⁸ m</text>
<text x="364" y="430" font-family="Arial" font-size="14" fill="#333">F = 6.67×10⁻¹¹×6×10²⁴×7.3×10²²</text>
<text x="364" y="450" font-family="Arial" font-size="14" fill="#555">      (3.84×10⁸)²</text>
<text x="364" y="470" font-family="Arial" font-size="14" fill="#555">F ≈ 2×10²⁰ N — keeps Moon orbiting!</text>

<!-- RIGHT: India context -->
<rect x="670" y="74" width="310" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="825" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Gravity Applications</text>

<rect x="680" y="104" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Chandrayaan-3 Lunar Landing</text>
<text x="825" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Moon gravity: g = 1.62 m/s²</text>
<text x="825" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Vikram lander: retro-thrust vs mg</text>
<text x="825" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Every kg matters at Moon's surface</text>

<rect x="680" y="202" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Hydroelectric Dams</text>
<text x="825" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">GPE = mgh. Bhakra: h = 226 m</text>
<text x="825" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Gravity converts water GPE → electricity</text>
<text x="825" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India: 47,000 MW hydroelectric capacity</text>

<rect x="680" y="300" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">NavIC GPS System</text>
<text x="825" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India's own GPS: 7 satellites</text>
<text x="825" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">GR corrections applied: 38 µs/day</text>
<text x="825" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Without correction: 10 km daily error</text>

<rect x="680" y="398" width="290" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="825" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Gravity Survey of India</text>
<text x="825" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Geological Survey of India maps g</text>
<text x="825" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Detects mineral deposits (denser rock</text>
<text x="825" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">= stronger g). Oil, ore exploration</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">F = Gm₁m₂/r². Weight = mg (changes); mass constant. All objects fall at same rate in vacuum.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Einstein: gravity = curved spacetime. NavIC GPS needs GR correction. Chandrayaan-3 balanced Moon gravity.</text>
</svg>
