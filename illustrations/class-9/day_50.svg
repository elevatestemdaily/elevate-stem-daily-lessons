<text x="740" y="309" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Mean density: 4 plants/m²</text>
<text x="740" y="360" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">10 m² area → estimated 40</text>
<text x="500" y="451" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">The arithmetic data are separate from the illustrative map dots.</text>
