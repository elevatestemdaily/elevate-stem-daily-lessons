<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How can simple distillation recover water from salty water?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Recover the solvent through a guided vapour route and separate condensation</text>
<text x="190" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Original salt solution</text>
<text x="550" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Cooler condensing region</text>
<text x="865" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Receiver</text>
<circle cx="190" cy="270" r="60" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M165 215 L165 180 L230 180 L230 215" fill="none" stroke="#1f5f8b" stroke-width="3"/>
<path d="M230 195 L790 195 L790 300" fill="none" stroke="#1f5f8b" stroke-width="9"/>
<rect x="440" y="170" width="240" height="52" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="270" y1="195" x2="405" y2="195" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M800 285 L800 355 L930 355 L930 285" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<rect x="805" y="325" width="120" height="25" rx="0" fill="#ddeeff" stroke="#ddeeff" stroke-width="2"/>
<circle cx="165" cy="300" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="205" cy="315" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="210" cy="285" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="190" y1="390" x2="190" y2="340" stroke="#e6a23c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="550" y1="235" x2="550" y2="290" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="190" y="425" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Energy supplied</text>
<text x="550" y="332" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Energy removed</text>
<text x="865" y="405" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Distillate collected</text>
<text x="500" y="466" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Nonvolatile salt stays mainly behind; other volatile material may pass.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">A process diagram is not a home heater design or a safety certificate.</text>
</svg>
