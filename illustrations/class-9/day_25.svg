<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How does sound travel?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Longitudinal pressure waves, medium required, speed in different materials — Day 25</text>

<!-- LEFT: Wave diagram -->
<rect x="20" y="74" width="310" height="416" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
<text x="175" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#0284c7">Sound as Pressure Wave</text>

<!-- Longitudinal wave visualization -->
<rect x="30" y="104" width="290" height="150" rx="4" fill="white" stroke="#0284c7" stroke-width="1"/>
<text x="175" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Compressions and Rarefactions</text>
<!-- Speaker cone -->
<rect x="38" y="152" width="20" height="56" rx="3" fill="#374151"/>
<!-- Compressed regions -->
<rect x="62" y="148" width="22" height="64" rx="2" fill="#bfdbfe" fill-opacity="0.8"/>
<rect x="96" y="156" width="14" height="48" rx="2" fill="#bfdbfe" fill-opacity="0.4"/>
<rect x="120" y="150" width="22" height="60" rx="2" fill="#bfdbfe" fill-opacity="0.8"/>
<rect x="154" y="157" width="14" height="46" rx="2" fill="#bfdbfe" fill-opacity="0.4"/>
<rect x="178" y="150" width="22" height="60" rx="2" fill="#bfdbfe" fill-opacity="0.8"/>
<rect x="212" y="157" width="14" height="46" rx="2" fill="#bfdbfe" fill-opacity="0.4"/>
<rect x="236" y="150" width="22" height="60" rx="2" fill="#bfdbfe" fill-opacity="0.8"/>
<rect x="270" y="157" width="14" height="46" rx="2" fill="#bfdbfe" fill-opacity="0.4"/>
<text x="76" y="245" text-anchor="middle" font-family="Arial" font-size="14" fill="#0284c7">compression</text>
<text x="196" y="245" text-anchor="middle" font-family="Arial" font-size="14" fill="#94a3b8">rarefaction</text>
<text x="175" y="261" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">→ direction of wave travel</text>

<!-- Speed comparison -->
<rect x="30" y="264" width="290" height="130" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="175" y="282" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Speed in Different Media</text>
<text x="40" y="302" font-family="Arial" font-size="14" fill="#333">Vacuum: 0 m/s (no medium!)</text>
<text x="40" y="322" font-family="Arial" font-size="14" fill="#333">Air (20°C): 343 m/s</text>
<text x="40" y="342" font-family="Arial" font-size="14" fill="#333">Water: 1,480 m/s (denser medium)</text>
<text x="40" y="362" font-family="Arial" font-size="14" fill="#333">Steel: 5,120 m/s (rigid bonds)</text>
<text x="40" y="382" font-family="Arial" font-size="14" fill="#555">Warmer air → faster (v ∝ √T in K)</text>

<rect x="30" y="404" width="290" height="78" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
<text x="175" y="422" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">Wave Properties</text>
<text x="40" y="442" font-family="Arial" font-size="14" fill="#333">v = fλ  (speed = frequency × wavelength)</text>
<text x="40" y="460" font-family="Arial" font-size="14" fill="#555">Amplitude = loudness. f = pitch</text>
<text x="40" y="478" font-family="Arial" font-size="14" fill="#555">Sound: 20 Hz – 20,000 Hz (human range)</text>

<!-- CENTRE: Sound properties + reflection -->
<rect x="344" y="74" width="302" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="495" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Sound Properties</text>

<rect x="354" y="104" width="282" height="108" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="495" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#7c3aed">Ultrasound &amp; Infrasound</text>
<text x="364" y="144" font-family="Arial" font-size="14" fill="#333">Ultrasound: &gt; 20,000 Hz</text>
<text x="364" y="164" font-family="Arial" font-size="14" fill="#333">Medical imaging, sonar, cleaning</text>
<text x="364" y="184" font-family="Arial" font-size="14" fill="#555">Infrasound: &lt; 20 Hz</text>
<text x="364" y="200" font-family="Arial" font-size="14" fill="#555">Elephants communicate (10+ km)</text>

<rect x="354" y="222" width="282" height="100" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="495" y="240" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Reflection &amp; Echo</text>
<text x="364" y="262" font-family="Arial" font-size="14" fill="#333">Sound reflects off hard surfaces</text>
<text x="364" y="282" font-family="Arial" font-size="14" fill="#333">Echo: reflected sound heard separately</text>
<text x="364" y="302" font-family="Arial" font-size="14" fill="#555">Minimum 17.2 m for distinct echo</text>
<text x="364" y="318" font-family="Arial" font-size="14" fill="#555">Sonar: timing echo = distance measure</text>

<rect x="354" y="332" width="282" height="100" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="495" y="350" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Decibel Scale (dB)</text>
<text x="364" y="372" font-family="Arial" font-size="14" fill="#333">0 dB: threshold of hearing</text>
<text x="364" y="392" font-family="Arial" font-size="14" fill="#333">60 dB: normal conversation</text>
<text x="364" y="412" font-family="Arial" font-size="14" fill="#555">120 dB: threshold of pain</text>
<text x="364" y="428" font-family="Arial" font-size="14" fill="#555">India noise pollution: &gt;75 dB common</text>

<rect x="354" y="442" width="282" height="40" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="495" y="460" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Interference: two waves add or cancel</text>
<text x="495" y="476" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Noise-cancelling headphones: destructive</text>

<!-- RIGHT: India context -->
<rect x="660" y="74" width="320" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="820" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Sound Science</text>

<rect x="670" y="104" width="300" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="820" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Medical Ultrasound</text>
<text x="820" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">50 million scans/year in India</text>
<text x="820" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Reflects off tissue boundaries</text>
<text x="820" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Timing echo → depth → image</text>

<rect x="670" y="202" width="300" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="820" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Indian Navy Sonar</text>
<text x="820" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">DRDO: sonar systems for submarines</text>
<text x="820" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">INS Arihant + Akula submarines</text>
<text x="820" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Undersea sound at 1,480 m/s</text>

<rect x="670" y="300" width="300" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="820" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Music &amp; Acoustics</text>
<text x="820" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Indian classical: sitar, tabla, bansuri</text>
<text x="820" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Harmonics create timbre/texture</text>
<text x="820" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Resonance amplifies specific frequencies</text>

<rect x="670" y="398" width="300" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="820" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Noise Pollution (India)</text>
<text x="820" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Mumbai, Delhi: highest traffic noise</text>
<text x="820" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Diwali crackers: 100–130 dB</text>
<text x="820" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">CPCB noise standards: 55 dB day (resi)</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Sound = longitudinal pressure waves. Needs medium. Speed: vacuum 0, air 343, water 1480, steel 5120 m/s.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">v = fλ. Ultrasound: &gt;20,000 Hz used in medical scans. India: 50 million ultrasound scans/year.</text>
</svg>
