<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Could we ever travel to another star?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Light-years, the energy problem, and Breakthrough Starshot — Day 29</text>

<!-- LEFT: Distance scale -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">The Interstellar Distance Problem</text>

<rect x="30" y="104" width="280" height="128" rx="4" fill="white" stroke="#ca8a04" stroke-width="1"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">How Far is a Star?</text>
<text x="40" y="144" font-family="Arial" font-size="14" fill="#333">1 light-year = 9.46 × 10¹⁵ m</text>
<text x="40" y="164" font-family="Arial" font-size="14" fill="#333">= distance light travels in 1 year</text>
<text x="40" y="184" font-family="Arial" font-size="14" fill="#333">Proxima Centauri: 4.24 light-years</text>
<text x="40" y="204" font-family="Arial" font-size="14" fill="#555">= 40 trillion km away</text>
<text x="40" y="222" font-family="Arial" font-size="14" fill="#555">Andromeda galaxy: 2.5 million ly</text>

<rect x="30" y="242" width="280" height="128" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="170" y="260" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Current Spacecraft Speed</text>
<text x="40" y="282" font-family="Arial" font-size="14" fill="#333">Voyager 1: 17 km/s (fastest ever)</text>
<text x="40" y="302" font-family="Arial" font-size="14" fill="#333">= 0.006% speed of light</text>
<text x="40" y="322" font-family="Arial" font-size="14" fill="#dc2626">Time to Proxima: 70,000 years!</text>
<text x="40" y="342" font-family="Arial" font-size="14" fill="#555">Need 0.1c for 42-year trip</text>
<text x="40" y="358" font-family="Arial" font-size="14" fill="#555">= 30,000 km/s (1000× Voyager)</text>

<rect x="30" y="380" width="280" height="102" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<text x="170" y="398" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">The Energy Problem</text>
<text x="40" y="420" font-family="Arial" font-size="14" fill="#333">KE = ½mv²: 1 kg at 0.1c needs</text>
<text x="40" y="440" font-family="Arial" font-size="14" fill="#dc2626">4.5 × 10¹⁴ J (450 TJ) per kg</text>
<text x="40" y="460" font-family="Arial" font-size="14" fill="#333">1 tonne ship: world's daily electricity</text>
<text x="40" y="476" font-family="Arial" font-size="14" fill="#dc2626">output just for fuel</text>

<!-- CENTRE: Solutions + proposals -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Possible Approaches</text>

<rect x="344" y="104" width="312" height="100" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Breakthrough Starshot</text>
<text x="354" y="144" font-family="Arial" font-size="14" fill="#333">Tiny laser sail (gram-scale)</text>
<text x="354" y="164" font-family="Arial" font-size="14" fill="#333">Ground laser pushes sail to 0.2c</text>
<text x="354" y="184" font-family="Arial" font-size="14" fill="#555">Proxima in ~20 years, no deceleration</text>
<text x="354" y="200" font-family="Arial" font-size="14" fill="#555">Proposed 2016 by Hawking and Milner</text>

<rect x="344" y="214" width="312" height="98" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="232" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Nuclear Pulse Propulsion</text>
<text x="354" y="254" font-family="Arial" font-size="14" fill="#333">Project Orion (1950s): nuclear bombs</text>
<text x="354" y="274" font-family="Arial" font-size="14" fill="#333">Explode behind ship → thrust</text>
<text x="354" y="294" font-family="Arial" font-size="14" fill="#555">Could reach 3–5% c theoretically</text>
<text x="354" y="308" font-family="Arial" font-size="14" fill="#555">Banned by test-ban treaty</text>

<rect x="344" y="322" width="312" height="80" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="340" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">Fusion Rocket (Future)</text>
<text x="354" y="362" font-family="Arial" font-size="14" fill="#333">H + H → He: highest energy density</text>
<text x="354" y="382" font-family="Arial" font-size="14" fill="#555">Could reach 10–12% c if achieved</text>
<text x="354" y="398" font-family="Arial" font-size="14" fill="#555">Proxima in ~40 years</text>

<rect x="344" y="412" width="312" height="70" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="500" y="430" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">Time Dilation (Relativity)</text>
<text x="354" y="452" font-family="Arial" font-size="14" fill="#555">Near c: time slows for traveller</text>
<text x="354" y="470" font-family="Arial" font-size="14" fill="#555">At 0.99c: 42 ly feels like ~6 years!</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Deep Space Vision</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">ISRO Long-Term Roadmap</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Moon base: 2040s target</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Mars mission: 2040 Mangalyaan-2</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Deep space propulsion: research ongoing</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">IIT Propulsion Research</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">IIT Madras: electric propulsion</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Hall thrusters, ion drives</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Efficient for deep space, but slow</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">India + Starshot</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Indian researchers contribute to</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">photonic sail material design</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Laser power beaming for nanosatellites</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Gaganyaan and Beyond</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Human spaceflight: 2025 Gaganyaan</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">First Indian in space: step 1 of many</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Generation ships remain theoretical</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Proxima Centauri = 4.24 ly. Voyager: 70,000 years. Need 0.1c; KE at that speed = 450 TJ per kg.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Breakthrough Starshot: gram-scale sail at 0.2c = 20 years. Time dilation: at 0.99c, 42 ly feels like 6 years.</text>
</svg>
