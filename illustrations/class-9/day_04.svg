<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Why does temperature affect particle motion?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Latent heat, state changes, and the Kelvin scale — Day 4</text>

<!-- LEFT: Heating curve -->
<rect x="20" y="74" width="310" height="416" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
<text x="175" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#0284c7">Heating Curve for Water</text>

<rect x="30" y="104" width="290" height="200" rx="4" fill="white" stroke="#0284c7" stroke-width="1"/>
<!-- Axes -->
<line x1="50" y1="290" x2="310" y2="290" stroke="#374151" stroke-width="2"/>
<line x1="50" y1="290" x2="50" y2="112" stroke="#374151" stroke-width="2"/>
<text x="180" y="302" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">Heat added →</text>
<text x="38" y="220" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151" transform="rotate(-90,38,220)">Temp (°C)</text>
<!-- Curve segments -->
<!-- Ice warming -->
<line x1="55" y1="270" x2="100" y2="248" stroke="#1d4ed8" stroke-width="3"/>
<!-- Melting plateau at 0°C -->
<line x1="100" y1="248" x2="148" y2="248" stroke="#0284c7" stroke-width="3"/>
<!-- Water warming -->
<line x1="148" y1="248" x2="220" y2="185" stroke="#16a34a" stroke-width="3"/>
<!-- Boiling plateau at 100°C -->
<line x1="220" y1="185" x2="268" y2="185" stroke="#dc2626" stroke-width="3"/>
<!-- Steam warming -->
<line x1="268" y1="185" x2="305" y2="160" stroke="#f97316" stroke-width="3"/>
<!-- Labels -->
<text x="58" y="244" font-family="Arial" font-size="14" fill="#1d4ed8">ice</text>
<text x="106" y="244" font-family="Arial" font-size="14" fill="#0284c7">melt</text>
<text x="158" y="220" font-family="Arial" font-size="14" fill="#16a34a">water</text>
<text x="224" y="180" font-family="Arial" font-size="14" fill="#dc2626">boil</text>
<text x="272" y="158" font-family="Arial" font-size="14" fill="#f97316">steam</text>
<text x="38" y="252" font-family="Arial" font-size="14" fill="#374151">0°</text>
<text x="32" y="189" font-family="Arial" font-size="14" fill="#374151">100°</text>

<rect x="30" y="316" width="290" height="164" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="175" y="334" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Latent Heat</text>
<text x="40" y="354" font-family="Arial" font-size="14" fill="#333">During phase change: temperature</text>
<text x="40" y="372" font-family="Arial" font-size="14" fill="#333">stays CONSTANT despite heat added</text>
<text x="40" y="392" font-family="Arial" font-size="14" fill="#555">Energy breaks bonds — not motion</text>
<text x="40" y="412" font-family="Arial" font-size="14" fill="#333">Latent heat of fusion (ice→water):</text>
<text x="40" y="430" font-family="Arial" font-size="14" fill="#1d4ed8">334,000 J per kg</text>
<text x="40" y="450" font-family="Arial" font-size="14" fill="#333">Latent heat of vaporisation:</text>
<text x="40" y="468" font-family="Arial" font-size="14" fill="#dc2626">2,260,000 J per kg</text>

<!-- CENTRE: Kelvin + particle energy -->
<rect x="344" y="74" width="312" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Kelvin Scale &amp; Particle Energy</text>

<rect x="354" y="104" width="292" height="108" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Converting Temperatures</text>
<text x="364" y="144" font-family="Arial" font-size="14" fill="#333">K = °C + 273</text>
<text x="364" y="164" font-family="Arial" font-size="14" fill="#333">Body temp: 37°C = 310 K</text>
<text x="364" y="184" font-family="Arial" font-size="14" fill="#333">Sun surface: 5,778°C = 6,051 K</text>
<text x="364" y="204" font-family="Arial" font-size="14" fill="#555">Absolute zero: 0 K = −273°C</text>

<rect x="354" y="222" width="292" height="130" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="240" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Why Kelvin?</text>
<text x="364" y="262" font-family="Arial" font-size="14" fill="#333">Kelvin starts at absolute zero —</text>
<text x="364" y="280" font-family="Arial" font-size="14" fill="#333">true zero of particle motion</text>
<text x="364" y="300" font-family="Arial" font-size="14" fill="#555">KE ∝ T(K) — direct relationship</text>
<text x="364" y="320" font-family="Arial" font-size="14" fill="#555">Can't have negative Kelvin</text>
<text x="364" y="340" font-family="Arial" font-size="14" fill="#555">(unlike Celsius)</text>

<rect x="354" y="362" width="292" height="120" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="380" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">State Changes Summary</text>
<text x="364" y="400" font-family="Arial" font-size="14" fill="#333">Melting/boiling: energy breaks bonds</text>
<text x="364" y="420" font-family="Arial" font-size="14" fill="#333">Freezing/condensing: bonds form</text>
<text x="364" y="440" font-family="Arial" font-size="14" fill="#555">Sublimation: solid → gas directly</text>
<text x="364" y="460" font-family="Arial" font-size="14" fill="#555">Deposition: gas → solid directly</text>
<text x="364" y="478" font-family="Arial" font-size="14" fill="#555">Examples: dry ice, frost on glass</text>

<!-- RIGHT: India context -->
<rect x="670" y="74" width="310" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="825" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Heat &amp; Phase Changes</text>

<rect x="680" y="104" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Monsoon &amp; Evaporation</text>
<text x="825" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Oceans absorb latent heat while</text>
<text x="825" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">evaporating — clouds release it</text>
<text x="825" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Drives India's monsoon cycle</text>

<rect x="680" y="202" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Refrigeration</text>
<text x="825" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Refrigerant evaporates inside:</text>
<text x="825" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">absorbs latent heat → cools food</text>
<text x="825" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India: 150 million fridges in homes</text>

<rect x="680" y="300" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Steam Power</text>
<text x="825" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Thermal power: water → steam</text>
<text x="825" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">at 600°C drives turbines</text>
<text x="825" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">60% of India's electricity</text>

<rect x="680" y="398" width="290" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="825" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Sweating — Evaporative Cooling</text>
<text x="825" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Sweat evaporates: takes 2,260 J/g</text>
<text x="825" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">of latent heat from skin → cooling</text>
<text x="825" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Critical in India's 45°C summers</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Latent heat: temperature stays flat during phase change — energy breaks bonds, not KE.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Kelvin = Celsius + 273. K = 0 K is absolute zero. India's monsoon, sweating, steam power all use latent heat.</text>
</svg>
