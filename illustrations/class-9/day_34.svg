<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How does a rain gauge turn collected water into rainfall depth?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Equivalent depth normalises collected volume by the true opening area</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Catchment opening</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Invented arithmetic example</text>
<path d="M90 185 L410 185 L280 275 L280 350 L220 350 L220 275 Z" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="110" y1="160" x2="390" y2="160" stroke="#1f5f8b" stroke-width="2"/>
<line x1="145" y1="205" x2="250" y2="265" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="250" y1="205" x2="250" y2="265" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="355" y1="205" x2="250" y2="265" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="210" y="300" width="80" height="50" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<text x="750" y="210" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#1f5f8b">Volume: 50 cm³ = 50 mL</text>
<text x="750" y="257" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#1f5f8b">Opening area: 100 cm²</text>
<text x="750" y="304" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Depth: 0.5 cm = 5 mm</text>
<text x="250" y="408" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Use the funnel mouth, not bottle waist</text>
<text x="500" y="455" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Depth = volume / area; record the collection time and conditions too.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Rainfall input is not automatically infiltration or groundwater recharge.</text>
</svg>
