<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How can a calibration line turn a colour reading into</text>
<text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">concentration?</text>
<text x="500" y="98" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Invented model: signal = 10 + 20 × concentration</text>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Use standards over a supported range</text>
<text x="280" y="170" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">Signal (model units)</text>
<text x="500" y="438" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">Concentration (model units)</text>
<line x1="150" y1="370" x2="825" y2="370" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="150" y1="370" x2="150" y2="165" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="150" y1="340" x2="750" y2="220" stroke="#579b70" stroke-width="4"/>
<circle cx="150" cy="340" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="450" cy="280" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="750" cy="220" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="150" y1="250" x2="600" y2="250" stroke="#1f5f8b" stroke-width="2"/>
<line x1="600" y1="250" x2="600" y2="370" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="600" cy="250" r="6" fill="#1f5f8b" stroke="#1f5f8b" stroke-width="2"/>
<text x="150" y="403" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">0</text>
<text x="450" y="403" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">1</text>
<text x="750" y="403" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">2</text>
<text x="110" y="344" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">10</text>
<text x="110" y="284" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">30</text>
<text x="110" y="224" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">50</text>
<text x="610" y="194" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Signal 40 → concentration 1.5</text>
<text x="500" y="470" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Abstract units; the line beyond the standards is not automatically valid.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Calibration needs known standards, matched conditions and stated limits.</text>
</svg>
