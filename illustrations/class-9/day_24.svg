<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Why can machines never be 100% efficient?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Friction, the 2nd law of thermodynamics, and energy quality — Day 24</text>

<!-- LEFT: Efficiency + friction -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#dc2626">Why Not 100%?</text>

<rect x="30" y="104" width="280" height="80" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Efficiency Formula</text>
<text x="40" y="144" font-family="Arial" font-size="14" fill="#333">η = (Useful output / Total input) × 100%</text>
<text x="40" y="164" font-family="Arial" font-size="14" fill="#555">Always: η &lt; 100% in real machines</text>

<rect x="30" y="194" width="280" height="130" rx="4" fill="white" stroke="#dc2626" stroke-width="1"/>
<text x="170" y="212" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Dissipative Forces</text>
<text x="40" y="232" font-family="Arial" font-size="14" fill="#333">Friction: moving surfaces → heat</text>
<text x="40" y="252" font-family="Arial" font-size="14" fill="#333">Air resistance: KE → heat + sound</text>
<text x="40" y="272" font-family="Arial" font-size="14" fill="#333">Electrical resistance: I²R losses</text>
<text x="40" y="292" font-family="Arial" font-size="14" fill="#555">Sound, vibration, deformation</text>
<text x="40" y="312" font-family="Arial" font-size="14" fill="#555">All convert useful energy to heat</text>

<rect x="30" y="334" width="280" height="130" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="170" y="352" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Efficiency Examples</text>
<text x="40" y="374" font-family="Arial" font-size="14" fill="#333">Electric motor: 85–95% efficient</text>
<text x="40" y="392" font-family="Arial" font-size="14" fill="#333">Petrol engine: ~25% efficient</text>
<text x="40" y="410" font-family="Arial" font-size="14" fill="#333">LED bulb: ~90% efficient</text>
<text x="40" y="428" font-family="Arial" font-size="14" fill="#555">Steam turbine: ~40% efficient</text>
<text x="40" y="446" font-family="Arial" font-size="14" fill="#555">Human body (motion): ~25%</text>
<text x="40" y="464" font-family="Arial" font-size="14" fill="#555">Bicycle: ~95% (most efficient vehicle!)</text>

<!-- CENTRE: 2nd law + entropy -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">2nd Law of Thermodynamics</text>

<rect x="344" y="104" width="312" height="118" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#374151">Entropy Always Increases</text>
<text x="354" y="144" font-family="Arial" font-size="14" fill="#333">In every energy transformation, some</text>
<text x="354" y="164" font-family="Arial" font-size="14" fill="#333">energy becomes disordered thermal energy</text>
<text x="354" y="184" font-family="Arial" font-size="14" fill="#555">Ordered motion → disordered heat</text>
<text x="354" y="204" font-family="Arial" font-size="14" fill="#555">Cannot reverse spontaneously</text>
<text x="354" y="220" font-family="Arial" font-size="14" fill="#555">Energy quality degrades each conversion</text>

<rect x="344" y="232" width="312" height="108" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="250" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Carnot Limit</text>
<text x="354" y="272" font-family="Arial" font-size="14" fill="#333">Even a perfect (frictionless) heat engine:</text>
<text x="354" y="292" font-family="Arial" font-size="14" fill="#333">η_max = 1 − T_C/T_H (Kelvin)</text>
<text x="354" y="312" font-family="Arial" font-size="14" fill="#555">T_C &gt; 0 always → η always &lt; 100%</text>
<text x="354" y="332" font-family="Arial" font-size="14" fill="#555">Fundamental law, not engineering limit</text>

<rect x="344" y="350" width="312" height="132" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="368" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Improving Efficiency</text>
<text x="354" y="390" font-family="Arial" font-size="14" fill="#333">Lubrication: reduces friction losses</text>
<text x="354" y="410" font-family="Arial" font-size="14" fill="#333">Insulation: reduces heat loss</text>
<text x="354" y="430" font-family="Arial" font-size="14" fill="#555">Streamlining: reduces air resistance</text>
<text x="354" y="450" font-family="Arial" font-size="14" fill="#555">Higher T_H in engines: better Carnot η</text>
<text x="354" y="470" font-family="Arial" font-size="14" fill="#555">Regeneration: recover waste heat</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Efficiency Matters</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Motor Efficiency (SEEP)</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">IE1 (87%) → IE3 (93%) motors</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Save 400 MWh per motor over 10 yrs</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India: 30 million motors in industry</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">PAT Scheme</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Perform Achieve Trade: large industries</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">must improve efficiency or buy credits</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Saved 100 million tonnes coal/year</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Thermal Power Plants</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 60% coal electricity, 33% efficient</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">NTPC supercritical plants: 40%+ η</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Higher steam pressure → better Carnot</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">EV Trains (Vande Bharat)</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Electric: 85% efficient vs 25% diesel</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Regenerative braking: KE → electrical</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">30% energy recovery while braking</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">100% efficiency impossible: friction always wastes energy as heat. Entropy always increases.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Carnot limit: η &lt; 1 − T_C/T_H. India: Vande Bharat uses regenerative braking to recover 30% energy.</text>
</svg>
