<line x1="785" y1="260" x2="915" y2="260" stroke="#1f5f8b" stroke-width="2"/>
<line x1="785" y1="300" x2="915" y2="300" stroke="#1f5f8b" stroke-width="2"/>
<text x="250" y="405" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Traceable site, time and handling</text>
<text x="750" y="405" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Units, range, repeats and uncertainty</text>
<text x="500" y="458" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Not measured is better than an invented value for an untested property.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">A report prototype does not certify that a real source is safe to drink.</text>
