<text x="250" y="414" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Reduced vertical mixing</text>
<text x="750" y="414" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Material spreads through more air</text>
<text x="500" y="460" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">An inversion is an air-temperature profile, not a solid roof.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Concentration can change without an equal change in source emissions.</text>
