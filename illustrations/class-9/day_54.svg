<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why is carbon dioxide measured as a proportion of dry air?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Hold dry-gas content fixed, then change whether water enters the denominator</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Dry-gas group</text>
<rect x="85" y="175" width="330" height="180" rx="8" fill="#f8fbff" stroke="#1f5f8b" stroke-width="2"/>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Same group + water vapour</text>
<rect x="585" y="175" width="330" height="180" rx="8" fill="#f8fbff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="145" cy="215" r="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="220" cy="290" r="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="300" cy="225" r="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="365" cy="315" r="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="250" cy="255" r="10" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="645" cy="215" r="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="720" cy="290" r="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="800" cy="225" r="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="865" cy="315" r="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="750" cy="255" r="10" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="625" cy="295" r="6" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="670" cy="195" r="6" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="800" cy="300" r="6" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="865" cy="245" r="6" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<text x="250" y="407" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f5f8b">Dry fraction: c / n</text>
<text x="750" y="407" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f5f8b">Wet fraction: c / (n + w)</text>
<text x="500" y="461" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">The target amount c can stay fixed while a wet-air fraction changes.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Reporting basis matters; no current atmospheric concentration is claimed.</text>
</svg>
