<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How does momentum help compare two moving trolleys?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Compare the mass–velocity product and keep its direction</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Invented trolley A</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Invented trolley B</text>
<rect x="175" y="230" width="150" height="65" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<rect x="700" y="230" width="100" height="65" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="200" cy="310" r="10" fill="#1f5f8b" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="300" cy="310" r="10" fill="#1f5f8b" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="720" cy="310" r="10" fill="#1f5f8b" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="780" cy="310" r="10" fill="#1f5f8b" stroke="#1f5f8b" stroke-width="2"/>
<line x1="210" y1="190" x2="300" y2="190" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="660" y1="190" x2="840" y2="190" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="250" y="367" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#1f5f8b">2 kg × 3 m/s east</text>
<text x="750" y="367" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#1f5f8b">1 kg × 6 m/s east</text>
<text x="500" y="422" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f5f8b">Both: 6 kg m/s east</text>
<text x="500" y="465" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Reverse velocity and momentum direction reverses too.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Equal momentum does not mean every other motion quantity is equal.</text>
</svg>
