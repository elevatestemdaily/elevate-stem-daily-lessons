<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does a suspension settle while a colloid often stays</text>
<text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">dispersed?</text>
<text x="500" y="98" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Compare dispersed scale and behaviour over a stated observation interval</text>
<text x="170" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Solution</text>
<rect x="50" y="170" width="240" height="185" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Colloid example</text>
<rect x="380" y="170" width="240" height="185" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<text x="830" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Suspension after standing</text>
<rect x="710" y="170" width="240" height="185" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="95" cy="220" r="3" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="180" cy="280" r="3" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="240" cy="230" r="3" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="130" cy="320" r="3" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="430" cy="230" r="9" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="510" cy="290" r="9" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="565" cy="215" r="9" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="450" cy="320" r="9" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="740" cy="338" r="10" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="775" cy="338" r="10" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="810" cy="338" r="10" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="845" cy="338" r="10" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="880" cy="338" r="10" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="915" cy="338" r="10" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<text x="170" y="404" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Molecular or ionic scale</text>
<text x="500" y="404" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Dispersed during this interval</text>
<text x="830" y="404" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Visible sediment can develop</text>
<text x="500" y="456" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">No visible settling in a short trial does not prove permanent stability.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Clear or cloudy appearance alone does not establish purity or safety.</text>
</svg>
