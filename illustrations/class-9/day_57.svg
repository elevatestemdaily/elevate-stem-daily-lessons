<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does a long catch reduce the average stopping force?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Same momentum change, different stopping duration</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Shorter stop</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Longer stop</text>
<line x1="80" y1="335" x2="420" y2="335" stroke="#1f5f8b" stroke-width="2"/>
<line x1="80" y1="335" x2="80" y2="175" stroke="#1f5f8b" stroke-width="2"/>
<line x1="580" y1="335" x2="920" y2="335" stroke="#1f5f8b" stroke-width="2"/>
<line x1="580" y1="335" x2="580" y2="175" stroke="#1f5f8b" stroke-width="2"/>
<rect x="100" y="205" width="120" height="125" rx="0" fill="#e6a23c" stroke="#e6a23c" stroke-width="2"/>
<rect x="600" y="267" width="240" height="63" rx="0" fill="#ddeeff" stroke="#ddeeff" stroke-width="2"/>
<path d="M360 330 Q400 150 440 330" fill="none" stroke="#579b70" stroke-width="3"/>
<text x="250" y="390" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">100 N × 0.1 s = 10 N s</text>
<text x="750" y="390" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">50 N × 0.2 s = 10 N s</text>
<text x="500" y="444" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Invented values. Force vertically, time horizontally; area is impulse.</text>
<text x="500" y="470" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">A varying real force can have a peak unlike its average.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Keep the same initial and final motion before comparing stopping times.</text>
</svg>
