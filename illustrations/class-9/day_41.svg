<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why can camphor disappear from an open cupboard?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Track material across states rather than treating invisible gas as absent</text>
<text x="230" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Direct solid → gas route</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Different two-step route</text>
<rect x="110" y="270" width="170" height="65" rx="8" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="145" cy="240" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="230" cy="215" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="175" cy="175" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="295" cy="185" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="200" y1="260" x2="200" y2="170" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="615" y="185" width="80" height="60" rx="8" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="755" y="185" width="80" height="60" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="705" y1="215" x2="745" y2="215" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="650" cy="320" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="760" cy="300" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="860" cy="325" r="6" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="795" y1="260" x2="795" y2="300" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="230" y="405" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Sublimation bypasses bulk liquid</text>
<text x="750" y="405" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Melting then evaporation includes liquid</text>
<text x="500" y="458" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Deposition is the reverse direct gas → solid transition.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">No chemical, heating or deliberate smelling is needed for the activity.</text>
</svg>
