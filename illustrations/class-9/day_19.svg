<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="arr19b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1d4ed8"/></marker>
  <marker id="arr19r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#dc2626"/></marker>
</defs>
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Why do objects resist changes in motion?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Newton's 1st law, mass and inertia, rotational inertia — Day 19</text>

<!-- LEFT: Inertia demonstrations -->
<rect x="20" y="74" width="300" height="416" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="170" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1d4ed8">Inertia Demonstrations</text>

<rect x="30" y="104" width="280" height="120" rx="4" fill="white" stroke="#1d4ed8" stroke-width="1"/>
<text x="170" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Tablecloth trick</text>
<text x="40" y="144" font-family="Arial" font-size="14" fill="#333">Pull cloth fast → dishes stay put</text>
<text x="40" y="162" font-family="Arial" font-size="14" fill="#333">Dishes' inertia resists change</text>
<text x="40" y="182" font-family="Arial" font-size="14" fill="#555">Friction brief → not enough force</text>
<text x="40" y="200" font-family="Arial" font-size="14" fill="#555">to overcome their inertia</text>
<text x="40" y="218" font-family="Arial" font-size="14" fill="#555">Slow pull: friction accelerates dishes</text>

<rect x="30" y="234" width="280" height="100" rx="4" fill="white" stroke="#1d4ed8" stroke-width="1"/>
<text x="170" y="252" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Bus braking</text>
<text x="40" y="272" font-family="Arial" font-size="14" fill="#333">Passenger lurches forward when bus brakes</text>
<text x="40" y="290" font-family="Arial" font-size="14" fill="#333">Bus decelerates; body's inertia keeps</text>
<text x="40" y="308" font-family="Arial" font-size="14" fill="#555">going forward at original speed</text>
<text x="40" y="326" font-family="Arial" font-size="14" fill="#555">Seatbelts: apply force to stop body</text>

<rect x="30" y="344" width="280" height="90" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="170" y="362" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">Mass ∝ Inertia</text>
<text x="40" y="382" font-family="Arial" font-size="14" fill="#333">Heavier object → harder to start, stop</text>
<text x="40" y="400" font-family="Arial" font-size="14" fill="#333">Truck vs bicycle: same force → less a</text>
<text x="40" y="418" font-family="Arial" font-size="14" fill="#555">a = F/m (Law 2)</text>
<text x="40" y="430" font-family="Arial" font-size="14" fill="#555">m = measure of inertia</text>

<rect x="30" y="444" width="280" height="38" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="170" y="462" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Galileo (1600s): inertia concept —</text>
<text x="170" y="477" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">motion natural, not force-needing</text>

<!-- CENTRE: Rotational inertia + momentum -->
<rect x="334" y="74" width="332" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Rotational Inertia &amp; Momentum</text>

<rect x="344" y="104" width="312" height="128" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#7c3aed">Rotational Inertia (moment of inertia)</text>
<text x="354" y="144" font-family="Arial" font-size="14" fill="#333">Resistance to change in rotation</text>
<text x="354" y="164" font-family="Arial" font-size="14" fill="#333">I = mr² (depends on mass distribution)</text>
<text x="354" y="184" font-family="Arial" font-size="14" fill="#555">Mass far from axis → high I (harder to spin)</text>
<text x="354" y="204" font-family="Arial" font-size="14" fill="#555">Spinning skater arms in: I decreases → faster</text>
<text x="354" y="220" font-family="Arial" font-size="14" fill="#555">L = Iω conserved (angular momentum)</text>

<rect x="344" y="242" width="312" height="104" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="260" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Linear Momentum</text>
<text x="354" y="282" font-family="Arial" font-size="14" fill="#333">p = mv (kg·m/s)</text>
<text x="354" y="302" font-family="Arial" font-size="14" fill="#333">Newton's 2nd law: F = Δp/Δt</text>
<text x="354" y="322" font-family="Arial" font-size="14" fill="#555">Conservation of momentum:</text>
<text x="354" y="340" font-family="Arial" font-size="14" fill="#555">total p before = total p after (no ext. force)</text>

<rect x="344" y="356" width="312" height="126" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="374" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Inertia in Space</text>
<text x="354" y="396" font-family="Arial" font-size="14" fill="#333">No friction in space → objects keep moving</text>
<text x="354" y="416" font-family="Arial" font-size="14" fill="#333">forever without any force (Law 1)</text>
<text x="354" y="436" font-family="Arial" font-size="14" fill="#555">Astronauts weightless but not massless</text>
<text x="354" y="456" font-family="Arial" font-size="14" fill="#555">Still have inertia — hard to stop moving</text>
<text x="354" y="472" font-family="Arial" font-size="14" fill="#555">Tools float away if not secured</text>

<!-- RIGHT: India context -->
<rect x="680" y="74" width="300" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India: Inertia in Action</text>

<rect x="690" y="104" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Road Safety</text>
<text x="830" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1.5 lakh road deaths/year (India #1)</text>
<text x="830" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Helmets, seatbelts → counter inertia</text>
<text x="830" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">MV Act 2019: mandatory seatbelt</text>

<rect x="690" y="202" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Cricket Batting</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Ball: 0.16 kg at 150 km/h</text>
<text x="830" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Huge inertia to reverse direction</text>
<text x="830" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Bat force F = Δp/Δt over ~1 ms</text>

<rect x="690" y="300" width="280" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Flywheel (Rotational inertia)</text>
<text x="830" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">High-I disk stores rotational energy</text>
<text x="830" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Smooths power delivery in engines</text>
<text x="830" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Tata Motors: flywheel energy storage</text>

<rect x="690" y="398" width="280" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Spinning Top (Lattu)</text>
<text x="830" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Angular momentum resists tipping</text>
<text x="830" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Gyroscope effect: axis stays stable</text>
<text x="830" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Used in ISRO satellite stabilisation</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Inertia: resistance to change in motion. Mass = measure of inertia. p = mv conserved.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Rotational inertia I = mr². Skater spins faster arms in. India: 1.5 lakh road deaths/year — seatbelts save lives.</text>
</svg>
