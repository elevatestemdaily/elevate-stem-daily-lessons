<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How can composite fish culture use different parts of a pond?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Complementary feeding zones remain part of one connected pond</text>
<rect x="70" y="170" width="570" height="200" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="75" y1="235" x2="635" y2="235" stroke="#1f5f8b" stroke-width="1" stroke-dasharray="5 5"/>
<line x1="75" y1="300" x2="635" y2="300" stroke="#1f5f8b" stroke-width="1" stroke-dasharray="5 5"/>
<path d="M190 205 q30 -20 60 0 l20 -12 l0 24 l-20 -12 q-30 20 -60 0 Z" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<path d="M350 270 q30 -20 60 0 l20 -12 l0 24 l-20 -12 q-30 20 -60 0 Z" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<path d="M470 335 q30 -20 60 0 l20 -12 l0 24 l-20 -12 q-30 20 -60 0 Z" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<text x="800" y="210" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Catla: surface tendency</text>
<text x="800" y="275" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Rohu: water-column tendency</text>
<text x="800" y="340" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Mrigal: bottom tendency</text>
<text x="500" y="426" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Dashed regions are not walls. Food and oxygen remain shared limits.</text>
<text x="500" y="463" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Educational tendencies, not a stocking density or release recommendation.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Complementary resource use can reduce overlap without eliminating competition.</text>
</svg>
