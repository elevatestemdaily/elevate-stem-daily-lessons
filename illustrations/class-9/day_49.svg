<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why can dissolved oxygen change along a polluted river?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">A qualitative oxygen budget combines supply, transport and demand</text>
<text x="180" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Upstream transport</text>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Organic-related demand</text>
<text x="825" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Possible replenishment</text>
<rect x="70" y="185" width="860" height="100" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="95" y1="230" x2="900" y2="230" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="500" y1="155" x2="500" y2="210" stroke="#e6a23c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="700" y1="155" x2="700" y2="205" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="825" y1="155" x2="825" y2="205" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M100 335 Q280 325 420 395 Q560 450 700 370 Q790 330 900 335" fill="none" stroke="#579b70" stroke-width="4"/>
<text x="500" y="473" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Illustrative decline-and-recovery pattern, not real river measurements.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">DO is dissolved O2, not the oxygen chemically bound in H2O.</text>
</svg>
