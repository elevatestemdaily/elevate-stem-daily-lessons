<text x="500" y="422" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Shared input can connect more than one finished batch.</text>
<text x="500" y="462" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">A missing arrow remains unknown; do not invent a tidy route.</text>
