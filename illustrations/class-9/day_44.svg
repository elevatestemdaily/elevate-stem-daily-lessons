<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does repeated drying crack some clay-rich soil surfaces?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Water loss plus restraint can turn shrinkage into cracking</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Moist connected layer</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Drying and restrained contraction</text>
<rect x="75" y="205" width="350" height="110" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<rect x="590" y="225" width="90" height="90" rx="8" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="705" y="225" width="90" height="90" rx="8" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="820" y="225" width="90" height="90" rx="8" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="65" y1="330" x2="435" y2="330" stroke="#1f5f8b" stroke-width="4"/>
<line x1="555" y1="330" x2="940" y2="330" stroke="#1f5f8b" stroke-width="4"/>
<line x1="598" y1="190" x2="615" y2="190" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="685" y1="190" x2="668" y2="190" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="713" y1="190" x2="730" y2="190" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="800" y1="190" x2="783" y2="190" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="828" y1="190" x2="845" y2="190" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="915" y1="190" x2="898" y2="190" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="695" y1="370" x2="695" y2="278" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="250" y="410" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Water loss changes volume</text>
<text x="750" y="410" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Gaps relieve local stress</text>
<text x="500" y="458" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Later water may use a crack; formation and flow are distinct steps.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Not every ground crack is tectonic, and clay-rich materials vary.</text>
</svg>
