<text x="86" y="177" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Be</text>
<text x="86" y="187" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">4</text>
<rect x="175" y="162" width="32" height="28" rx="2" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
<text x="191" y="177" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">C</text>
<text x="191" y="187" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">6</text>
<rect x="210" y="162" width="32" height="28" rx="2" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
<text x="226" y="177" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">N</text>
<text x="226" y="187" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">7</text>
<rect x="245" y="162" width="32" height="28" rx="2" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
<text x="261" y="177" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">O</text>
<text x="261" y="187" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">8</text>
<rect x="285" y="162" width="32" height="28" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="301" y="177" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">Ne</text>
<text x="301" y="187" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">10</text>
<!-- Row 3 -->
<rect x="35" y="196" width="32" height="28" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
<text x="51" y="211" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Na</text>
<text x="51" y="221" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">11</text>
<rect x="70" y="196" width="32" height="28" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
<text x="86" y="211" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Mg</text>
<text x="86" y="221" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">12</text>
<rect x="175" y="196" width="32" height="28" rx="2" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
<text x="191" y="211" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Si</text>
<text x="191" y="221" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">14</text>
<rect x="210" y="196" width="32" height="28" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="226" y="211" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">Cl</text>
<text x="226" y="221" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">17</text>
<rect x="285" y="196" width="32" height="28" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="301" y="211" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">Ar</text>
<text x="301" y="221" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">18</text>
<!-- Row 4 -->
<rect x="35" y="230" width="32" height="28" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
<text x="51" y="245" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">K</text>
<text x="51" y="255" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">19</text>
<rect x="70" y="230" width="32" height="28" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
<text x="86" y="245" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Ca</text>
<text x="86" y="255" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">20</text>

<text x="30" y="292" font-family="Arial" font-size="14" fill="#555">Z = proton count defines the element</text>
<text x="30" y="310" font-family="Arial" font-size="14" fill="#555">Rows = periods (electron shells)</text>
<text x="30" y="328" font-family="Arial" font-size="14" fill="#555">Columns = groups (same outer shell)</text>

<rect x="30" y="340" width="290" height="140" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="175" y="358" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Key Periodic Trends</text>
<text x="40" y="378" font-family="Arial" font-size="14" fill="#333">Atomic radius: decreases → across period</text>
<text x="40" y="396" font-family="Arial" font-size="14" fill="#333">Atomic radius: increases ↓ down group</text>
<text x="40" y="414" font-family="Arial" font-size="14" fill="#555">Reactivity (metals): increases down</text>
<text x="40" y="432" font-family="Arial" font-size="14" fill="#555">Reactivity (non-metals): decreases down</text>
<text x="40" y="452" font-family="Arial" font-size="14" fill="#555">Noble gases: full outer shell = stable</text>
<text x="40" y="472" font-family="Arial" font-size="14" fill="#555">Mendeleev (1869) left gaps for unknowns</text>

<!-- CENTRE: Isotopes and Mendeleev -->
<rect x="344" y="74" width="312" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Elements &amp; Isotopes</text>

<rect x="354" y="104" width="292" height="120" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">What Defines an Element?</text>
<text x="364" y="144" font-family="Arial" font-size="14" fill="#333">Atomic number (Z) = number of protons</text>
<text x="364" y="164" font-family="Arial" font-size="14" fill="#333">Z is unique to each element</text>
<text x="364" y="184" font-family="Arial" font-size="14" fill="#555">Change Z → different element!</text>
<text x="364" y="204" font-family="Arial" font-size="14" fill="#555">Same Z, different neutrons → isotopes</text>

<rect x="354" y="234" width="292" height="120" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="252" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Isotope Examples</text>
<text x="364" y="272" font-family="Arial" font-size="14" fill="#333">Carbon: C-12 (stable), C-13, C-14</text>
<text x="364" y="292" font-family="Arial" font-size="14" fill="#333">Hydrogen: H-1, H-2 (deuterium), H-3</text>
<text x="364" y="312" font-family="Arial" font-size="14" fill="#555">Uranium: U-235 (fissile), U-238</text>
<text x="364" y="332" font-family="Arial" font-size="14" fill="#555">Same electrons → same chemistry</text>

<rect x="354" y="364" width="292" height="118" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500" y="382" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Mendeleev's Prediction</text>
<text x="364" y="402" font-family="Arial" font-size="14" fill="#333">1869: arranged elements by mass</text>
<text x="364" y="422" font-family="Arial" font-size="14" fill="#333">Left gaps for undiscovered elements</text>
<text x="364" y="442" font-family="Arial" font-size="14" fill="#555">Predicted properties of gallium (Ga)</text>
<text x="364" y="462" font-family="Arial" font-size="14" fill="#555">and germanium (Ge) — both found!</text>
<text x="364" y="478" font-family="Arial" font-size="14" fill="#555">Modern table: ordered by Z, not mass</text>

<!-- RIGHT: India context -->
<rect x="670" y="74" width="310" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="825" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India &amp; Elements</text>

<rect x="680" y="104" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">India: Mining Elements</text>
<text x="825" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Iron ore: Jharkhand, Odisha</text>
<text x="825" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Bauxite (Al): Gujarat, Odisha</text>
<text x="825" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Rare earths: critical for electronics</text>

<rect x="680" y="202" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Silicon — Heart of Tech</text>
<text x="825" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Z=14 semiconductor: all chips</text>
<text x="825" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India's semiconductor mission:</text>
<text x="825" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">₹76,000 crore chip factories planned</text>

<rect x="680" y="300" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Gold (Z=79)</text>
<text x="825" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: world's largest gold consumer</text>
<text x="825" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">~800 tonnes/year imported</text>
<text x="825" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Kolar Gold Fields: 3 million kg mined</text>

<rect x="680" y="398" width="290" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="825" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Helium (Z=2) — Balloons to MRI</text>
<text x="825" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India imports liquid He for MRI machines</text>
<text x="825" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">ISRO researching He-3 on Moon</text>
<text x="825" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Future fusion fuel</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Z = atomic number = element identity. Periodic table: rows = periods, columns = groups.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Mendeleev predicted undiscovered elements in 1869. India mines Fe, Al; plans semiconductor chip factories.</text>
</svg>
