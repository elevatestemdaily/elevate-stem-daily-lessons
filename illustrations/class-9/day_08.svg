<rect x="35" y="128" width="32" height="28" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<text x="51" y="143" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">H</text>
<text x="51" y="153" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">1</text>
