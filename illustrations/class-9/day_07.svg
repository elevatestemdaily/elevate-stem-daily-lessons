<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Why are some atoms radioactive?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Unstable nuclei, alpha/beta/gamma decay, and half-life — Day 7</text>

<!-- LEFT: Types of radiation -->
<rect x="20" y="74" width="310" height="416" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="175" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#dc2626">Types of Radiation</text>

<rect x="30" y="104" width="290" height="90" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
<text x="175" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Alpha (α)</text>
<text x="40" y="142" font-family="Arial" font-size="14" fill="#333">2 protons + 2 neutrons (He nucleus)</text>
<text x="40" y="160" font-family="Arial" font-size="14" fill="#333">Stopped by paper or skin</text>
<text x="40" y="178" font-family="Arial" font-size="14" fill="#555">Most ionising — dangerous if inhaled</text>

<rect x="30" y="204" width="290" height="90" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
<text x="175" y="222" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Beta (β)</text>
<text x="40" y="242" font-family="Arial" font-size="14" fill="#333">Fast electron from nucleus</text>
<text x="40" y="260" font-family="Arial" font-size="14" fill="#333">Stopped by 3 mm aluminium</text>
<text x="40" y="278" font-family="Arial" font-size="14" fill="#555">Neutron → proton + electron + antineutrino</text>

<rect x="30" y="304" width="290" height="90" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="175" y="322" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Gamma (γ)</text>
<text x="40" y="342" font-family="Arial" font-size="14" fill="#333">High-energy electromagnetic wave</text>
<text x="40" y="360" font-family="Arial" font-size="14" fill="#333">Stopped by thick lead or concrete</text>
<text x="40" y="378" font-family="Arial" font-size="14" fill="#555">Least ionising; deepest penetrating</text>

<rect x="30" y="404" width="290" height="78" rx="4" fill="white" stroke="#94a3b8" stroke-width="1"/>
<text x="175" y="422" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Why radioactive?</text>
<text x="40" y="442" font-family="Arial" font-size="14" fill="#333">Too many / few neutrons → unstable</text>
<text x="40" y="460" font-family="Arial" font-size="14" fill="#333">Nucleus decays to reach stability</text>
<text x="40" y="478" font-family="Arial" font-size="14" fill="#555">Random process — can't be predicted</text>

<!-- CENTRE: Half-life -->
<rect x="344" y="74" width="312" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="500" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Half-Life</text>

<rect x="354" y="104" width="292" height="88" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Definition</text>
<text x="364" y="144" font-family="Arial" font-size="14" fill="#333">Time for half the radioactive atoms</text>
<text x="364" y="162" font-family="Arial" font-size="14" fill="#333">to decay to a stable form.</text>
<text x="364" y="182" font-family="Arial" font-size="14" fill="#555">After n half-lives: N = N₀ × (½)ⁿ</text>

<!-- Half-life decay table -->
<rect x="354" y="202" width="292" height="160" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="500" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#374151">Decay Example (t½ = 10 min)</text>
<rect x="354" y="226" width="292" height="22" fill="#1f5f8b"/>
<text x="430" y="241" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Time</text>
<text x="570" y="241" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Atoms remaining</text>
<rect x="354" y="248" width="292" height="22" fill="#f0fdf4"/>
<text x="430" y="263" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">0 min</text>
<text x="570" y="263" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1,000</text>
<rect x="354" y="270" width="292" height="22" fill="white"/>
<text x="430" y="285" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">10 min</text>
<text x="570" y="285" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">500</text>
<rect x="354" y="292" width="292" height="22" fill="#f0fdf4"/>
<text x="430" y="307" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">20 min</text>
<text x="570" y="307" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">250</text>
<rect x="354" y="314" width="292" height="22" fill="white"/>
<text x="430" y="329" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">30 min</text>
<text x="570" y="329" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">125</text>
<rect x="354" y="336" width="292" height="22" fill="#f0fdf4"/>
<text x="430" y="351" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">70 min</text>
<text x="570" y="351" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">~8</text>

<rect x="354" y="372" width="292" height="110" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="500" y="390" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Real Half-Lives</text>
<text x="364" y="410" font-family="Arial" font-size="14" fill="#333">Carbon-14: 5,730 years (dating!)</text>
<text x="364" y="430" font-family="Arial" font-size="14" fill="#333">Uranium-238: 4.5 billion years</text>
<text x="364" y="450" font-family="Arial" font-size="14" fill="#555">Iodine-131: 8 days (medical)</text>
<text x="364" y="470" font-family="Arial" font-size="14" fill="#555">Polonium-214: 0.0002 seconds</text>

<!-- RIGHT: India context -->
<rect x="670" y="74" width="310" height="416" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="825" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India &amp; Radioactivity</text>

<rect x="680" y="104" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Nuclear Power (BARC)</text>
<text x="825" y="142" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Bhabha Atomic Research Centre, Mumbai</text>
<text x="825" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Uses U-235 fission → 6,780 MW</text>
<text x="825" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Produces medical isotopes for hospitals</text>

<rect x="680" y="202" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="220" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Radiocarbon Dating</text>
<text x="825" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">C-14 half-life = 5,730 years</text>
<text x="825" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Dating Harappan civilisation remains</text>
<text x="825" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">IIT labs confirm 5,000-year-old sites</text>

<rect x="680" y="300" width="290" height="88" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="825" y="318" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Cancer Radiotherapy</text>
<text x="825" y="338" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Gamma rays kill cancer cells</text>
<text x="825" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">3 million Indians treated/year</text>
<text x="825" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">BARC-designed Bhabhatron machine</text>

<rect x="680" y="398" width="290" height="84" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="825" y="416" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Thorium — India's Advantage</text>
<text x="825" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India has 32% of world's Th-232</text>
<text x="825" y="454" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Kerala beaches: thorite-rich sands</text>
<text x="825" y="472" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Future thorium reactors planned</text>

<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Radioactivity: unstable nucleus decays emitting α, β, or γ. After n half-lives: N = N₀ × (½)ⁿ</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">India's BARC: nuclear power, medical isotopes. C-14 dating reveals Harappan civilisation.</text>
</svg>
