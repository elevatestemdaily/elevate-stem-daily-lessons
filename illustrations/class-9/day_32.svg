<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why can the same journey have different distance and</text>
<text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">displacement?</text>
<text x="500" y="98" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Distance tracks the path; displacement links endpoints with direction</text>
<text x="450" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Invented one-dimensional journey; arrows offset for clarity</text>
<line x1="150" y1="215" x2="750" y2="215" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="450" y="187" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">40 m east</text>
<line x1="750" y1="275" x2="300" y2="275" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="520" y="317" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">30 m west</text>
<line x1="150" y1="365" x2="300" y2="365" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="150" y="413" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Start</text>
<text x="330" y="413" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Finish: 10 m east of start</text>
<text x="750" y="385" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Distance: 70 m</text>
<text x="750" y="433" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Displacement: 10 m east</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">A complete return gives zero displacement but positive travelled distance.</text>
</svg>
