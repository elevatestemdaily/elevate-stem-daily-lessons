<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">Why can a giant ship float?</text>

<!-- Left panel: Three scenarios -->
<text x="30" y="88" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">THREE SCENARIOS</text>

<!-- Scenario 1: Solid steel sinks -->
<rect x="20" y="100" width="180" height="170" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
<text x="110" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c62828">SOLID STEEL BALL</text>
<text x="110" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">density ≈ 7,800 kg/m³</text>

<!-- Water background -->
<rect x="30" y="138" width="160" height="80" rx="4" fill="#bbdefb"/>
<!-- Ball sinking -->
<circle cx="110" cy="185" r="22" fill="#78909c"/>
<text x="110" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="white">steel</text>
<!-- Downward arrow (weight) -->
<line x1="110" y1="210" x2="110" y2="225" stroke="#c62828" stroke-width="2" marker-end="url(#arr)"/>
<text x="128" y="222" font-family="Arial" font-size="14" fill="#c62828">weight</text>
<!-- Small upward arrow (upthrust, smaller) -->
<line x1="95" y1="172" x2="95" y2="158" stroke="#1f5f8b" stroke-width="1.5" marker-end="url(#arr2)"/>
<text x="28" y="162" font-family="Arial" font-size="14" fill="#1f5f8b">small</text>
<text x="28" y="173" font-family="Arial" font-size="14" fill="#1f5f8b">upthrust</text>

<text x="110" y="243" text-anchor="middle" font-family="Arial" font-size="14" fill="#c62828">SINKS</text>
<text x="110" y="257" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Weight > upthrust</text>
<text x="110" y="271" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">avg density > water</text>

<!-- Scenario 2: Hollow ship floats -->
<rect x="215" y="100" width="220" height="170" rx="8" fill="#e8f5e9" stroke="#2a7a2a" stroke-width="2"/>
<text x="325" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">HOLLOW STEEL SHIP</text>
<text x="325" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">avg density ≈ 200–700 kg/m³</text>

<!-- Water background -->
<rect x="225" y="138" width="200" height="80" rx="4" fill="#bbdefb"/>
<!-- Ship hull (hollow U-shape) -->
<path d="M255,175 L255,210 L395,210 L395,175 L385,165 L265,165 Z" fill="#78909c" stroke="#546e7a" stroke-width="1.5"/>
<!-- Air space inside -->
<rect x="265" y="166" width="120" height="42" fill="#e3f2fd"/>
<text x="325" y="192" text-anchor="middle" font-family="Arial" font-size="14" fill="#1f5f8b">AIR</text>
<!-- Equal arrows -->
<line x1="325" y1="213" x2="325" y2="228" stroke="#c62828" stroke-width="2"/>
<text x="350" y="222" font-family="Arial" font-size="14" fill="#c62828">weight ↓</text>
<line x1="310" y1="163" x2="310" y2="148" stroke="#1f5f8b" stroke-width="2"/>
<text x="230" y="155" font-family="Arial" font-size="14" fill="#1f5f8b">upthrust ↑</text>
<text x="233" y="165" font-family="Arial" font-size="14" fill="#1f5f8b">(equal!)</text>

<text x="325" y="248" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">FLOATS</text>
<text x="325" y="262" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Upthrust = weight</text>
<text x="325" y="271" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">avg density &lt; water</text>

<!-- Scenario 3: Breached hull sinks -->
<rect x="450" y="100" width="180" height="170" rx="8" fill="#fff3e0" stroke="#e07000" stroke-width="2"/>
<text x="540" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#e07000">BREACHED HULL (Q3)</text>
<text x="540" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">avg density rises</text>

<!-- Water background -->
<rect x="460" y="138" width="160" height="80" rx="4" fill="#bbdefb"/>
<!-- Partially sunk ship -->
<path d="M470,188 L470,225 L610,225 L610,188 L600,178 L480,178 Z" fill="#78909c" stroke="#546e7a" stroke-width="1.5"/>
<!-- Water inside -->
<rect x="480" y="179" width="120" height="44" fill="#bbdefb" opacity="0.8"/>
<text x="540" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#1f5f8b">WATER fills in</text>
<!-- Breach arrow -->
<line x1="470" y1="195" x2="458" y2="202" stroke="#c62828" stroke-width="2"/>
<text x="430" y="210" font-family="Arial" font-size="14" fill="#c62828">breach</text>

<text x="540" y="245" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#e07000">SINKS</text>
<text x="540" y="259" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Air replaced by water</text>
<text x="540" y="268" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">avg density &gt; water</text>

<!-- Centre: Archimedes' principle -->
<text x="30" y="295" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">ARCHIMEDES' PRINCIPLE</text>

<rect x="20" y="308" width="610" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="325" y="330" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#3949ab">Buoyant force = weight of fluid displaced = ρ_fluid × V_displaced × g</text>
<text x="325" y="350" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">If object average density &lt; fluid density → upthrust ≥ weight → FLOATS</text>
<text x="325" y="363" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">If object average density &gt; fluid density → upthrust &lt; weight → SINKS</text>

<!-- Plimsoll line -->
<rect x="20" y="382" width="610" height="80" rx="6" fill="#fff8e1" stroke="#f0a000" stroke-width="1.5"/>
<text x="325" y="400" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c07000">PLIMSOLL LINE — safe loading limit</text>
<!-- Plimsoll marks -->
<circle cx="160" cy="430" r="18" fill="none" stroke="#1f5f8b" stroke-width="2"/>
<line x1="142" y1="430" x2="178" y2="430" stroke="#1f5f8b" stroke-width="2"/>
<text x="160" y="456" text-anchor="middle" font-family="Arial" font-size="14" fill="#1f5f8b">Plimsoll mark</text>
<text x="280" y="418" font-family="Arial" font-size="14" fill="#333">SW = Salt Water (denser → ship floats higher → more cargo OK)</text>
<text x="280" y="432" font-family="Arial" font-size="14" fill="#333">FW = Fresh Water (less dense → ship sits lower → less cargo)</text>
<text x="280" y="446" font-family="Arial" font-size="14" fill="#333">Salt water: 1025 kg/m³   Fresh water: 1000 kg/m³</text>
<text x="280" y="458" font-family="Arial" font-size="14" fill="#c62828">Overloaded ship sinks below Plimsoll → dangerous</text>

<!-- Right column: Applications -->
<text x="660" y="88" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">APPLICATIONS</text>

<rect x="650" y="100" width="330" height="65" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="815" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#3949ab">INS Vikrant (India)</text>
<text x="815" y="134" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">45,000-t carrier, Cochin Shipyard, 2022</text>
<text x="815" y="150" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Enclosed air keeps avg density &lt; 1000 kg/m³</text>
<text x="815" y="163" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India's naval power via Archimedes' principle</text>

<rect x="650" y="180" width="330" height="65" rx="6" fill="#e8f5e9" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="815" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">Submarines</text>
<text x="815" y="214" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Ballast tanks fill with water → denser → dives</text>
<text x="815" y="230" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Compressed air blows out water → less dense → rises</text>
<text x="815" y="243" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Ballast tanks fail → cannot reduce density → sinks</text>

<rect x="650" y="260" width="330" height="65" rx="6" fill="#fff3e0" stroke="#e07000" stroke-width="1.5"/>
<text x="815" y="278" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#e07000">Dead Sea</text>
<text x="815" y="294" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Salinity ~34% → density ≈ 1240 kg/m³</text>
<text x="815" y="310" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Body density ≈ 985 kg/m³ → floats easily</text>
<text x="815" y="323" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Upthrust far exceeds body weight</text>

<rect x="650" y="340" width="330" height="65" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
<text x="815" y="358" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c62828">Hydrometer</text>
<text x="815" y="374" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Sinks deeper in less dense liquid; higher in denser</text>
<text x="815" y="390" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Tests: battery acid, milk, alcohol content</text>
<text x="815" y="403" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Uses Archimedes directly — no calculation needed</text>

<!-- Clay activity -->
<rect x="20" y="475" width="960" height="20" rx="4" fill="#ddeeff" stroke="#1f5f8b" stroke-width="1"/>
<text x="500" y="489" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Activity: Clay ball sinks → reshape to bowl → larger displaced volume → upthrust increases → FLOATS</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="536" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Upthrust = weight of displaced fluid. Average density &lt; water → floats. Hull breached → density rises → sinks.</text>
</svg>
