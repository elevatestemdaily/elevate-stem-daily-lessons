<text x="250" y="431" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Barrier + starting-condition checks</text>
<text x="750" y="431" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Batch identity + later observations</text>
<text x="500" y="469" text-anchor="middle" font-family="Arial" font-size="14" font-weight="400" fill="#1f5f8b">Invented budget: repair 2 + labels 1 + platform 2 + routine 1 = 6 tokens.</text>
