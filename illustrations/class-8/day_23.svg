<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="arr23" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1f5f8b"/></marker>
  <marker id="arr23g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#16a34a"/></marker>
</defs>
<rect width="1000" height="560" fill="#f8fbff"/>

<!-- Title -->
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How does a food chain work?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Energy flows from producers to consumers — 10% transfers each step — Day 23</text>

<!-- ── LEFT: Energy Pyramid ── -->
<rect x="20" y="74" width="420" height="416" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="230" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#16a34a">Energy Pyramid — 10% Rule</text>

<!-- Pyramid tiers (bottom to top, wider at bottom) -->
<!-- Level 1: Producers — 1,000,000 kJ -->
<polygon points="30,456 430,456 390,416 70,416" fill="#22c55e" stroke="white" stroke-width="1"/>
<text x="230" y="440" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Producers (Grass / Rice)</text>
<text x="230" y="456" text-anchor="middle" font-family="Arial" font-size="14" fill="white">1,000,000 kJ</text>

<!-- Level 2: Primary consumers — 100,000 kJ -->
<polygon points="70,416 390,416 358,376 102,376" fill="#84cc16" stroke="white" stroke-width="1"/>
<text x="230" y="400" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">Herbivores (Grasshopper / Deer)</text>
<text x="230" y="415" text-anchor="middle" font-family="Arial" font-size="14" fill="white">100,000 kJ (10%)</text>

<!-- Level 3: Secondary consumers — 10,000 kJ -->
<polygon points="102,376 358,376 326,336 134,336" fill="#f59e0b" stroke="white" stroke-width="1"/>
<text x="230" y="360" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">Carnivores (Frog / Fox)</text>
<text x="230" y="375" text-anchor="middle" font-family="Arial" font-size="14" fill="white">10,000 kJ</text>

<!-- Level 4: Tertiary — 1,000 kJ -->
<polygon points="134,336 326,336 294,296 166,296" fill="#f97316" stroke="white" stroke-width="1"/>
<text x="230" y="318" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">Snake / Eagle</text>
<text x="230" y="334" text-anchor="middle" font-family="Arial" font-size="14" fill="white">1,000 kJ</text>

<!-- Level 5: Apex — 100 kJ -->
<polygon points="166,296 294,296 262,256 198,256" fill="#dc2626" stroke="white" stroke-width="1"/>
<text x="230" y="280" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">Apex (Eagle)</text>
<text x="230" y="295" text-anchor="middle" font-family="Arial" font-size="14" fill="white">100 kJ</text>

<!-- Sun at top -->
<circle cx="230" cy="220" r="28" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
<text x="230" y="215" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">SUN</text>
<text x="230" y="230" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e">1M kJ</text>
<line x1="230" y1="248" x2="230" y2="257" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr23g)"/>

<!-- 10% arrows on right side -->
<text x="400" y="440" font-family="Arial" font-size="14" fill="#dc2626">← 90%</text>
<text x="400" y="452" font-family="Arial" font-size="14" fill="#dc2626">lost as</text>
<text x="400" y="464" font-family="Arial" font-size="14" fill="#dc2626">heat</text>

<!-- Decomposers note -->
<rect x="30" y="468" width="390" height="16" rx="2" fill="#e2e8f0"/>
<text x="225" y="480" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Decomposers break dead matter → return nutrients to soil</text>

<!-- ── RIGHT: Food web + India ── -->
<rect x="454" y="74" width="526" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="717" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Food Chain &amp; India Examples</text>

<!-- Simple food chain -->
<rect x="464" y="104" width="506" height="156" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="717" y="120" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#555">Sundarbans Food Chain</text>

<!-- Chain: mangrove → fish → dolphin/tiger -->
<rect x="472" y="128" width="96" height="40" rx="4" fill="#22c55e"/>
<text x="520" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">Mangrove</text>
<text x="520" y="162" text-anchor="middle" font-family="Arial" font-size="14" fill="white">producer</text>

<line x1="568" y1="148" x2="582" y2="148" stroke="#1f5f8b" stroke-width="2.5" marker-end="url(#arr23)"/>

<rect x="584" y="128" width="82" height="40" rx="4" fill="#84cc16"/>
<text x="625" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">Shrimp</text>
<text x="625" y="162" text-anchor="middle" font-family="Arial" font-size="14" fill="white">herbivore</text>

<line x1="666" y1="148" x2="680" y2="148" stroke="#1f5f8b" stroke-width="2.5" marker-end="url(#arr23)"/>

<rect x="682" y="128" width="72" height="40" rx="4" fill="#f59e0b"/>
<text x="718" y="148" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">Fish</text>
<text x="718" y="162" text-anchor="middle" font-family="Arial" font-size="14" fill="white">2° con.</text>

<line x1="754" y1="148" x2="768" y2="148" stroke="#1f5f8b" stroke-width="2.5" marker-end="url(#arr23)"/>

<rect x="770" y="128" width="72" height="40" rx="4" fill="#f97316"/>
<text x="806" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">Dolphin</text>
<text x="806" y="162" text-anchor="middle" font-family="Arial" font-size="14" fill="white">3° con.</text>

<line x1="842" y1="148" x2="856" y2="148" stroke="#1f5f8b" stroke-width="2.5" marker-end="url(#arr23)"/>

<rect x="858" y="128" width="104" height="40" rx="4" fill="#dc2626"/>
<text x="910" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">Tiger</text>
<text x="910" y="162" text-anchor="middle" font-family="Arial" font-size="14" fill="white">apex</text>

<!-- Energy loss labels -->
<text x="717" y="192" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">Each arrow = ~10% energy transfer; 90% lost as heat</text>
<text x="717" y="208" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Rarely more than 4–5 links in any chain</text>
<text x="717" y="224" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Sundarbans: mangrove health = tiger health</text>
<text x="717" y="242" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Protecting one level protects all others</text>

<!-- Key concepts -->
<rect x="464" y="268" width="240" height="210" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="584" y="286" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Key Concepts</text>
<text x="474" y="305" font-family="Arial" font-size="14" font-weight="700" fill="#333">Trophic level:</text>
<text x="474" y="321" font-family="Arial" font-size="14" fill="#555">Position in food chain</text>
<text x="474" y="341" font-family="Arial" font-size="14" font-weight="700" fill="#333">Food web:</text>
<text x="474" y="357" font-family="Arial" font-size="14" fill="#555">Multiple chains linked —</text>
<text x="474" y="373" font-family="Arial" font-size="14" fill="#555">more resilient system</text>
<text x="474" y="393" font-family="Arial" font-size="14" font-weight="700" fill="#333">Biomass:</text>
<text x="474" y="409" font-family="Arial" font-size="14" fill="#555">Total mass at each level</text>
<text x="474" y="425" font-family="Arial" font-size="14" fill="#555">Pyramidal — base largest</text>
<text x="474" y="445" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">10% rule:</text>
<text x="474" y="461" font-family="Arial" font-size="14" fill="#555">Only 10% energy moves up</text>
<text x="474" y="477" font-family="Arial" font-size="14" fill="#555">Rest = heat + waste</text>

<!-- India food security box -->
<rect x="716" y="268" width="256" height="210" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="844" y="286" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#065f46">India Food Security</text>
<text x="844" y="305" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Rice &amp; wheat at trophic 1</text>
<text x="844" y="323" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Feed far more per hectare</text>
<text x="844" y="341" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">than meat at trophic 3</text>
<text x="844" y="363" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India: world's #1 pulse</text>
<text x="844" y="379" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">producer (lentils/dal)</text>
<text x="844" y="399" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Green Revolution (1960s):</text>
<text x="844" y="415" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Boosted trophic level 1</text>
<text x="844" y="435" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Wheat + rice yield tripled</text>
<text x="844" y="453" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">→ food security for 1.4 B</text>
<text x="844" y="473" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Dal &gt; beef: 10× less land</text>

<!-- Takeaway -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">10% rule: only 1/10 energy moves to next level. Food chains have 4–5 links max.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Plant-based diet is 10× more efficient. India's Sundarbans: mangrove–fish–tiger interdependence.</text>
</svg>
