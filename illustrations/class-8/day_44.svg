<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why is a comet&#x27;s tail directed away from the Sun?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Solar influences shape released material; tails are not rigid handles</text>
<text x="125" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Sun</text>
<text x="450" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Nucleus + coma</text>
<text x="810" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Different material streams</text>
<circle cx="125" cy="255" r="45" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="450" cy="255" r="45" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="450" cy="255" r="16" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="190" y1="220" x2="385" y2="220" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="190" y1="290" x2="385" y2="290" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M490 245 L930 215 L925 245 L490 265 Z" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M480 280 Q660 325 895 360 Q680 390 455 290 Z" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<line x1="450" y1="200" x2="415" y2="165" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="805" y="190" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Ion tail: generally away from Sun</text>
<text x="805" y="410" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Dust tail can curve</text>
<text x="250" y="410" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Motion and solar direction differ</text>
<text x="500" y="461" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Ionised gas interacts with solar wind; dust also feels radiation pressure.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">A comet need not enter Earth atmosphere to form a tail.</text>
</svg>
