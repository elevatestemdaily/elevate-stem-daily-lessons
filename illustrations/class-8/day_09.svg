<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">How does pressure change with depth?</text>

<!-- Left: Ocean depth cross-section -->
<text x="30" y="88" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">PRESSURE VS DEPTH</text>

<!-- Ocean background -->
<rect x="20" y="100" width="260" height="370" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>

<!-- Surface line -->
<line x1="20" y1="118" x2="280" y2="118" stroke="#1565c0" stroke-width="2"/>
<text x="150" y="114" text-anchor="middle" font-family="Arial" font-size="14" fill="#1565c0">SURFACE (0 m)</text>

<!-- Depth markers and pressure values -->
<!-- 10 m -->
<line x1="20" y1="157" x2="280" y2="157" stroke="#90caf9" stroke-width="1" stroke-dasharray="4,3"/>
<text x="35" y="153" font-family="Arial" font-size="14" fill="#333">10 m</text>
<text x="155" y="153" font-family="Arial" font-size="14" font-weight="700" fill="#1565c0">2 atm total</text>
<!-- Diver figure -->
<text x="220" y="172" font-family="Arial" font-size="20">🤿</text>
<text x="235" y="155" font-family="Arial" font-size="14" fill="#333">diver</text>

<!-- 50 m -->
<line x1="20" y1="225" x2="280" y2="225" stroke="#64b5f6" stroke-width="1" stroke-dasharray="4,3"/>
<text x="35" y="221" font-family="Arial" font-size="14" fill="#333">50 m</text>
<text x="155" y="221" font-family="Arial" font-size="14" font-weight="700" fill="#1565c0">6 atm total</text>
<!-- Inward pressure arrows at 50m -->
<text x="90" y="238" text-anchor="middle" font-family="Arial" font-size="14" fill="#1f5f8b">←●→</text>
<text x="90" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">pressure all sides</text>

<!-- 100 m -->
<line x1="20" y1="293" x2="280" y2="293" stroke="#42a5f5" stroke-width="1" stroke-dasharray="4,3"/>
<text x="35" y="289" font-family="Arial" font-size="14" fill="#333">100 m</text>
<text x="155" y="289" font-family="Arial" font-size="14" font-weight="700" fill="#1565c0">11 atm total</text>

<!-- 200 m -->
<line x1="20" y1="361" x2="280" y2="361" stroke="#1e88e5" stroke-width="1" stroke-dasharray="4,3"/>
<text x="35" y="357" font-family="Arial" font-size="14" fill="#333">200 m</text>
<text x="155" y="357" font-family="Arial" font-size="14" font-weight="700" fill="#0d47a1">21 atm total</text>
<!-- Submarine -->
<rect x="155" y="365" width="70" height="28" rx="12" fill="#546e7a" stroke="#37474f" stroke-width="1.5"/>
<text x="190" y="383" text-anchor="middle" font-family="Arial" font-size="14" fill="white">submarine</text>

<!-- Bottom -->
<text x="150" y="460" text-anchor="middle" font-family="Arial" font-size="14" fill="#0d47a1">P = ρgh formula</text>
<text x="150" y="474" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">ρ=1000 kg/m³, g=10 m/s²</text>

<!-- Weight column above diver -->
<text x="55" y="128" font-family="Arial" font-size="14" fill="#1565c0">Water above</text>
<text x="55" y="140" font-family="Arial" font-size="14" fill="#1565c0">pressing down</text>
<text x="55" y="152" font-family="Arial" font-size="14" fill="#1565c0">↓↓↓↓↓↓↓</text>

<!-- Centre: Formula and calculations -->
<text x="310" y="88" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">HYDROSTATIC PRESSURE FORMULA</text>

<rect x="300" y="100" width="290" height="85" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
<text x="445" y="126" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b">P = ρgh</text>
<text x="445" y="148" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">ρ = fluid density (kg/m³)</text>
<text x="445" y="163" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">g = 10 m/s²  |  h = depth (m)</text>
<text x="445" y="178" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">P in Pascals (Pa) | 100,000 Pa = 1 atm</text>

<!-- Worked calculations -->
<rect x="300" y="200" width="290" height="120" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="445" y="218" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c07000">Worked examples</text>
<text x="310" y="235" font-family="Arial" font-size="14" fill="#333">10 m: P = 1000×10×10 = 100,000 Pa = 1 atm</text>
<text x="310" y="250" font-family="Arial" font-size="14" fill="#333">      Total = 1 atm (air) + 1 atm = 2 atm</text>
<text x="310" y="268" font-family="Arial" font-size="14" fill="#333">50 m: P = 1000×10×50 = 500,000 Pa = 5 atm</text>
<text x="310" y="283" font-family="Arial" font-size="14" fill="#333">      Total = 1 + 5 = 6 atm</text>
<text x="310" y="300" font-family="Arial" font-size="14" fill="#333">200 m: P = 2,000,000 Pa = 20 atm</text>
<text x="310" y="316" font-family="Arial" font-size="14" fill="#333">       Total = 1 + 20 = 21 atm</text>

<!-- Double depth box -->
<rect x="300" y="335" width="290" height="60" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
<text x="445" y="353" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c62828">Q3: Double depth → double water pressure</text>
<text x="445" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">P = ρgh is linear in h → 2× depth = 2× ρgh</text>
<text x="445" y="384" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">(1 atm atmospheric stays constant)</text>

<!-- Pascal's Law -->
<rect x="300" y="410" width="290" height="60" rx="6" fill="#e8f5e9" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="445" y="428" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">Pascal's Law: pressure = all directions</text>
<text x="445" y="445" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Pressure pushes inward from all sides</text>
<text x="445" y="460" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">F₁/A₁ = F₂/A₂ (transmitted equally)</text>

<!-- Right column: Applications -->
<text x="620" y="88" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">REAL-WORLD CONNECTIONS</text>

<rect x="610" y="100" width="370" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="795" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#3949ab">The Bends (decompression sickness)</text>
<text x="795" y="135" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">At depth: high pressure forces N₂ into blood (Henry's Law)</text>
<text x="795" y="151" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Fast ascent → N₂ bubbles in blood → death</text>

<rect x="610" y="175" width="370" height="60" rx="6" fill="#e8f5e9" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="795" y="193" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">INS Chakra (Indian submarine)</text>
<text x="795" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Dives to ~600 m → pressure ≈ 61 atm inward on hull</text>
<text x="795" y="225" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Hull: high-strength steel, cm thick, no defects</text>

<rect x="610" y="250" width="370" height="60" rx="6" fill="#fff3e0" stroke="#e07000" stroke-width="1.5"/>
<text x="795" y="268" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#e07000">Hydraulic systems (JCB, car brakes)</text>
<text x="795" y="285" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Small piston → equal pressure in fluid</text>
<text x="795" y="300" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Large piston area → large force: F₁/A₁ = F₂/A₂</text>

<rect x="610" y="325" width="370" height="60" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
<text x="795" y="343" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7b1fa2">Deep-sea fish (snailfish at 8,336 m)</text>
<text x="795" y="360" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">No swim bladder; special lipids; TMAO</text>
<text x="795" y="375" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Proteins adapted to fold correctly under 830 atm pressure</text>

<!-- Bottle experiment -->
<rect x="610" y="400" width="370" height="60" rx="6" fill="#fff8e1" stroke="#c07000" stroke-width="1.5"/>
<text x="795" y="418" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c07000">Activity: three-hole bottle</text>
<text x="795" y="435" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Poke holes at top/middle/bottom of water-filled bottle</text>
<text x="795" y="451" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Bottom jet highest — most pressure = P = ρgh</text>

<!-- Mariana Trench note -->
<rect x="300" y="478" width="680" height="18" rx="4" fill="#ddeeff" stroke="#1f5f8b" stroke-width="1"/>
<text x="640" y="491" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Mariana Trench (11,000 m): 1,100 atm = 50 jets on 1 m²</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="536" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">P = ρgh: pressure increases with depth. 10 m of water ≈ 1 atm extra. Double depth → double water pressure.</text>
</svg>
