<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">What actually happens when you eat food?</text>

<!-- Left column: digestive tract organs -->
<text x="30" y="95" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">DIGESTIVE SEQUENCE</text>

<!-- Organ boxes left column -->
<rect x="20" y="105" width="200" height="40" rx="6" fill="#ddeeff" stroke="#1f5f8b" stroke-width="1.5"/>
<text x="120" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">1. MOUTH</text>
<text x="120" y="135" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Amylase: starch → maltose</text>

<text x="120" y="160" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f5f8b">↓</text>

<rect x="20" y="170" width="200" height="40" rx="6" fill="#ddeeff" stroke="#1f5f8b" stroke-width="1.5"/>
<text x="120" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">2. OESOPHAGUS</text>
<text x="120" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Peristalsis — transport only</text>

<text x="120" y="225" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f5f8b">↓</text>

<rect x="20" y="235" width="200" height="55" rx="6" fill="#ffe8cc" stroke="#e07000" stroke-width="1.5"/>
<text x="120" y="252" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#e07000">3. STOMACH</text>
<text x="120" y="267" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">HCl (pH 1–2): activates pepsin</text>
<text x="120" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Pepsin: proteins → peptides</text>

<text x="120" y="305" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f5f8b">↓</text>

<rect x="20" y="315" width="200" height="70" rx="6" fill="#d4f4d4" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="120" y="332" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">4. SMALL INTESTINE</text>
<text x="120" y="347" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Pancreatic juice + bile (emulsifies fats)</text>
<text x="120" y="362" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Villi absorb: glucose, amino acids</text>
<text x="120" y="377" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Fatty acids → lacteals</text>

<text x="120" y="400" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f5f8b">↓</text>

<rect x="20" y="410" width="200" height="40" rx="6" fill="#ddeeff" stroke="#1f5f8b" stroke-width="1.5"/>
<text x="120" y="425" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">5. LARGE INTESTINE</text>
<text x="120" y="440" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Water + mineral absorption</text>

<!-- Middle column: enzyme info -->
<text x="270" y="95" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">KEY ENZYMES</text>

<rect x="260" y="105" width="200" height="55" rx="6" fill="#fff3e0" stroke="#e07000" stroke-width="1.5"/>
<text x="360" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">AMYLASE</text>
<text x="360" y="137" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Source: saliva + pancreas</text>
<text x="360" y="152" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Starch → maltose → glucose</text>

<rect x="260" y="175" width="200" height="55" rx="6" fill="#ffe8cc" stroke="#e07000" stroke-width="1.5"/>
<text x="360" y="192" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">PEPSIN</text>
<text x="360" y="207" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Source: stomach (from pepsinogen)</text>
<text x="360" y="222" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Proteins → short peptides</text>

<rect x="260" y="245" width="200" height="55" rx="6" fill="#d4f4d4" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="360" y="262" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">LIPASE + BILE</text>
<text x="360" y="277" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Bile emulsifies fat globules</text>
<text x="360" y="292" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Lipase: fats → fatty acids+glycerol</text>

<!-- Villi zoom box -->
<rect x="260" y="315" width="200" height="90" rx="6" fill="#eef5ff" stroke="#1f5f8b" stroke-width="1.5"/>
<text x="360" y="332" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">VILLI (zoom)</text>
<text x="360" y="348" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Finger-like projections</text>
<text x="360" y="363" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Surface area ≈ 250 m²</text>
<text x="360" y="378" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Blood capillary: glucose, amino acids</text>
<text x="360" y="393" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Lacteal: fatty acids</text>

<!-- Right column: real world -->
<text x="510" y="95" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">REAL-WORLD CONNECTIONS</text>

<rect x="500" y="105" width="470" height="50" rx="6" fill="#fff8e1" stroke="#f0a000" stroke-width="1.5"/>
<text x="735" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c07000">Roti-chewing experiment</text>
<text x="735" y="138" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Chew 2 min → turns sweet = amylase: starch → maltose</text>

<rect x="500" y="170" width="470" height="50" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
<text x="735" y="187" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c62828">Q3: No stomach acid?</text>
<text x="735" y="203" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">No HCl → pepsinogen inactive → protein digestion fails</text>

<rect x="500" y="235" width="470" height="50" rx="6" fill="#e8f5e9" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="735" y="252" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">Lactose intolerance</text>
<text x="735" y="268" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">No lactase → lactose fermented in colon → gas, bloating</text>

<rect x="500" y="300" width="470" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="735" y="317" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#3949ab">Antacids (Eno, etc.)</text>
<text x="735" y="333" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">HCl excess → ulcers; antacids (NaHCO₃) neutralise acid</text>

<rect x="500" y="365" width="470" height="50" rx="6" fill="#fbe9e7" stroke="#bf360c" stroke-width="1.5"/>
<text x="735" y="382" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#bf360c">Dietary fibre</text>
<text x="735" y="398" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Cellulose undigested → adds bulk, reduces constipation</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="536" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Digestion sequence: mouth → oesophagus → stomach (HCl+pepsin) → small intestine (villi absorb) → large intestine.</text>
</svg>
