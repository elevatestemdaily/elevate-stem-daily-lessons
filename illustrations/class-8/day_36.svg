<text x="170" y="403" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Strong local overlap</text>
<text x="500" y="403" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Match crop and conditions</text>
<text x="830" y="403" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Unused plot space</text>
<text x="500" y="452" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Individual plant size and useful output per area are different outcomes.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">No single spacing is optimal for every crop, place and growing condition.</text>
