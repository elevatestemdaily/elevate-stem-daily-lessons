<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="arr26" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1f5f8b"/></marker>
  <marker id="arr26r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#dc2626"/></marker>
</defs>
<rect width="1000" height="560" fill="#f8fbff"/>

<!-- Title -->
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Why do cyclones rotate?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Coriolis effect + pressure gradient → spiral rotation — Day 26</text>

<!-- ── LEFT: Cyclone structure diagram ── -->
<rect x="20" y="74" width="380" height="416" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="210" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#0284c7">Cyclone Structure (N. Hemisphere)</text>

<!-- Concentric circles for cyclone -->
<!-- Outer rainband -->
<circle cx="210" cy="300" r="170" fill="none" stroke="#93c5fd" stroke-width="8" stroke-dasharray="16,8"/>
<!-- Middle band -->
<circle cx="210" cy="300" r="120" fill="none" stroke="#60a5fa" stroke-width="10" stroke-dasharray="10,5"/>
<!-- Eyewall -->
<circle cx="210" cy="300" r="68" fill="#1d4ed8" fill-opacity="0.25" stroke="#1d4ed8" stroke-width="3"/>
<!-- Eye -->
<circle cx="210" cy="300" r="28" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
<text x="210" y="296" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e3a8a">Eye</text>
<text x="210" y="312" text-anchor="middle" font-family="Arial" font-size="14" fill="#1e3a8a">Calm</text>

<!-- Rotation arrows (counter-clockwise in N. Hemisphere) -->
<!-- Arrows curved CCW -->
<path d="M 210 228 A 72 72 0 0 0 143 272" fill="none" stroke="#dc2626" stroke-width="3"/>
<polygon points="143,272 133,258 151,262" fill="#dc2626"/>
<path d="M 210 372 A 72 72 0 0 0 277 328" fill="none" stroke="#dc2626" stroke-width="3"/>
<polygon points="277,328 287,342 269,338" fill="#dc2626"/>

<text x="110" y="238" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">CCW</text>
<text x="110" y="254" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">rotation</text>

<!-- Labels -->
<text x="60" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#0369a1">Outer</text>
<text x="60" y="156" text-anchor="middle" font-family="Arial" font-size="14" fill="#0369a1">rainbands</text>
<line x1="90" y1="150" x2="106" y2="180" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arr26)"/>

<text x="350" y="152" text-anchor="middle" font-family="Arial" font-size="14" fill="#1d4ed8">Eyewall</text>
<text x="350" y="168" text-anchor="middle" font-family="Arial" font-size="14" fill="#1d4ed8">(worst winds)</text>
<line x1="324" y1="163" x2="294" y2="244" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr26)"/>

<!-- Wind speed bar -->
<rect x="30" y="448" width="360" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<rect x="30" y="448" width="32" height="32" rx="4" fill="#22c55e"/>
<text x="46" y="468" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Mild</text>
<rect x="188" y="448" width="80" height="32" fill="#f97316"/>
<text x="228" y="468" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Strong</text>
<rect x="354" y="448" width="36" height="32" rx="4" fill="#dc2626"/>
<text x="372" y="468" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Max</text>
<text x="210" y="494" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Wind speed: outer → eyewall</text>

<!-- ── CENTRE: Coriolis explanation ── -->
<rect x="414" y="74" width="268" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="548" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Coriolis Effect</text>

<!-- Step by step formation -->
<rect x="424" y="102" width="248" height="52" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<text x="548" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Step 1: Low pressure forms</text>
<text x="548" y="138" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Warm ocean &gt;26°C heats air</text>
<text x="548" y="152" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Air rises → low pressure</text>

<line x1="548" y1="154" x2="548" y2="164" stroke="#374151" stroke-width="1.5" marker-end="url(#arr26)"/>

<rect x="424" y="166" width="248" height="52" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="548" y="184" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Step 2: Air rushes in</text>
<text x="548" y="202" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">High pressure → low pressure</text>
<text x="548" y="216" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Pressure gradient force</text>

<line x1="548" y1="218" x2="548" y2="228" stroke="#374151" stroke-width="1.5" marker-end="url(#arr26)"/>

<rect x="424" y="230" width="248" height="64" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="548" y="248" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">Step 3: Coriolis deflects</text>
<text x="548" y="266" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">N. Hemi → deflect RIGHT</text>
<text x="548" y="282" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">→ counter-clockwise spin</text>
<text x="548" y="292" text-anchor="middle" font-family="Arial" font-size="14" fill="#7c3aed">a = 2Ω × v</text>

<line x1="548" y1="294" x2="548" y2="304" stroke="#374151" stroke-width="1.5" marker-end="url(#arr26)"/>

<rect x="424" y="306" width="248" height="52" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
<text x="548" y="324" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Step 4: Cyclone spins</text>
<text x="548" y="342" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Eye calm, eyewall fierce</text>
<text x="548" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Winds up to 300 km/h</text>

<!-- Key facts -->
<rect x="424" y="366" width="248" height="116" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="548" y="384" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#374151">Key Facts</text>
<text x="434" y="402" font-family="Arial" font-size="14" fill="#333">N. Hemi: CCW rotation</text>
<text x="434" y="420" font-family="Arial" font-size="14" fill="#333">S. Hemi: CW rotation</text>
<text x="434" y="438" font-family="Arial" font-size="14" fill="#555">Equator: no rotation (a = 0)</text>
<text x="434" y="456" font-family="Arial" font-size="14" fill="#555">Weaken over land — no</text>
<text x="434" y="474" font-family="Arial" font-size="14" fill="#555">warm ocean evaporation</text>

<!-- ── RIGHT: India context ── -->
<rect x="696" y="74" width="284" height="416" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="838" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#ea580c">India &amp; Cyclones</text>

<rect x="706" y="104" width="264" height="100" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="838" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Bay of Bengal</text>
<text x="838" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Semi-enclosed, warm water</text>
<text x="838" y="158" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Odisha, WB, AP most affected</text>
<text x="838" y="176" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Top 5 most cyclone-affected</text>
<text x="838" y="192" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">nations globally</text>

<rect x="706" y="214" width="264" height="100" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="838" y="232" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#f97316">1999 Odisha Cyclone</text>
<text x="838" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">~10,000 deaths</text>
<text x="838" y="268" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">No warning → no evacuation</text>
<text x="838" y="286" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Transformed India's approach</text>
<text x="838" y="302" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">to disaster management</text>

<rect x="706" y="324" width="264" height="100" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="838" y="342" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#065f46">IMD Early Warning</text>
<text x="838" y="360" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">5-day forecast, ±50 km accuracy</text>
<text x="838" y="378" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Fani (2019): 1.2 M evacuated</text>
<text x="838" y="396" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Deaths: 10,000 → 64</text>
<text x="838" y="414" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Science saves lives</text>

<rect x="706" y="434" width="264" height="50" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="838" y="452" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">Cyclone Biparjoy (2023)</text>
<text x="838" y="470" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Gujarat — 100,000+ evacuated</text>

<!-- Takeaway -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Coriolis effect deflects rushing air rightward (N. Hemi) → counter-clockwise cyclone rotation.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">India's IMD: 5-day forecasts cut cyclone deaths from 10,000 (1999) to 64 (Fani 2019).</text>
</svg>
