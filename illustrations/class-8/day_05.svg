<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">How do neurons carry information?</text>

<!-- Neuron diagram top -->
<text x="30" y="88" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">NEURON STRUCTURE</text>

<!-- Dendrites -->
<line x1="30" y1="155" x2="80" y2="175" stroke="#1f5f8b" stroke-width="2"/>
<line x1="30" y1="175" x2="80" y2="175" stroke="#1f5f8b" stroke-width="2"/>
<line x1="30" y1="195" x2="80" y2="175" stroke="#1f5f8b" stroke-width="2"/>
<line x1="40" y1="148" x2="80" y2="175" stroke="#1f5f8b" stroke-width="1.5"/>
<line x1="40" y1="205" x2="80" y2="175" stroke="#1f5f8b" stroke-width="1.5"/>
<text x="18" y="172" font-family="Arial" font-size="14" fill="#1f5f8b">Den-</text>
<text x="18" y="183" font-family="Arial" font-size="14" fill="#1f5f8b">drites</text>

<!-- Cell body -->
<ellipse cx="115" cy="175" rx="35" ry="28" fill="#9fa8da" stroke="#3949ab" stroke-width="2"/>
<circle cx="115" cy="175" r="12" fill="#5c6bc0"/>
<text x="115" y="179" text-anchor="middle" font-family="Arial" font-size="14" fill="white">nucleus</text>
<text x="115" y="215" text-anchor="middle" font-family="Arial" font-size="14" fill="#1f5f8b">Cell body</text>

<!-- Axon -->
<line x1="150" y1="175" x2="750" y2="175" stroke="#1f5f8b" stroke-width="3"/>
<text x="450" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">AXON (up to 1 metre long)</text>

<!-- Myelin segments -->
<rect x="175" y="162" width="60" height="26" rx="5" fill="#80cbc4" stroke="#00695c" stroke-width="1.5" opacity="0.9"/>
<rect x="265" y="162" width="60" height="26" rx="5" fill="#80cbc4" stroke="#00695c" stroke-width="1.5" opacity="0.9"/>
<rect x="355" y="162" width="60" height="26" rx="5" fill="#80cbc4" stroke="#00695c" stroke-width="1.5" opacity="0.9"/>
<rect x="445" y="162" width="60" height="26" rx="5" fill="#80cbc4" stroke="#00695c" stroke-width="1.5" opacity="0.9"/>
<rect x="535" y="162" width="60" height="26" rx="5" fill="#80cbc4" stroke="#00695c" stroke-width="1.5" opacity="0.9"/>
<rect x="625" y="162" width="60" height="26" rx="5" fill="#80cbc4" stroke="#00695c" stroke-width="1.5" opacity="0.9"/>

<!-- Myelin label -->
<text x="450" y="202" text-anchor="middle" font-family="Arial" font-size="14" fill="#00695c">Myelin sheath</text>

<!-- Nodes of Ranvier (gaps) -->
<text x="240" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#c62828">node</text>
<text x="330" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#c62828">node</text>
<text x="420" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#c62828">node</text>
<text x="510" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#c62828">node</text>
<text x="600" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#c62828">node</text>
<text x="690" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="#c62828">node</text>

<!-- Action potential jumping -->
<text x="240" y="152" text-anchor="middle" font-family="Arial" font-size="14" fill="#f9a825">⚡</text>
<text x="330" y="152" text-anchor="middle" font-family="Arial" font-size="14" fill="#f9a825">⚡</text>
<text x="420" y="152" text-anchor="middle" font-family="Arial" font-size="14" fill="#f9a825">⚡</text>
<text x="240" y="138" text-anchor="middle" font-family="Arial" font-size="14" fill="#f9a825">jump!</text>
<text x="330" y="138" text-anchor="middle" font-family="Arial" font-size="14" fill="#f9a825">jump!</text>
<text x="420" y="138" text-anchor="middle" font-family="Arial" font-size="14" fill="#f9a825">jump!</text>
<text x="450" y="120" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#f9a825">Saltatory conduction: 70–120 m/s</text>

<!-- Synaptic terminal -->
<circle cx="790" cy="175" r="25" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
<text x="790" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#880e4f">Synaptic</text>
<text x="790" y="182" text-anchor="middle" font-family="Arial" font-size="14" fill="#880e4f">terminal</text>

<!-- Vesicles -->
<circle cx="780" cy="192" r="5" fill="#f48fb1"/>
<circle cx="792" cy="195" r="5" fill="#f48fb1"/>
<circle cx="802" cy="192" r="5" fill="#f48fb1"/>

<!-- Synapse gap -->
<line x1="815" y1="162" x2="815" y2="188" stroke="#777" stroke-width="1" stroke-dasharray="3,2"/>
<text x="830" y="170" font-family="Arial" font-size="14" fill="#777">synapse</text>
<text x="830" y="182" font-family="Arial" font-size="14" fill="#777">gap</text>

<!-- Next neuron -->
<ellipse cx="900" cy="175" rx="50" ry="28" fill="#9fa8da" stroke="#3949ab" stroke-width="1.5"/>
<text x="900" y="172" text-anchor="middle" font-family="Arial" font-size="14" fill="white">next neuron</text>
<text x="900" y="183" text-anchor="middle" font-family="Arial" font-size="14" fill="white">or muscle</text>

<!-- Neurotransmitter arrows -->
<text x="840" y="178" font-family="Arial" font-size="14" fill="#880e4f">→→→</text>
<text x="847" y="193" font-family="Arial" font-size="14" fill="#880e4f">NT molecules</text>

<!-- Bottom panels -->
<text x="30" y="235" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">ACTION POTENTIAL MECHANISM</text>

<rect x="20" y="248" width="310" height="115" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="175" y="266" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#3949ab">At rest: −70 mV inside</text>
<text x="175" y="282" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Na⁺ out; K⁺ in via Na/K pump</text>
<text x="175" y="298" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1. Stimulus → Na⁺ channels open</text>
<text x="175" y="313" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">2. −70 to +30 mV: depolarisation</text>
<text x="175" y="328" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">3. Wave travels along axon</text>
<text x="175" y="343" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">4. K⁺ out → repolarisation, refractory</text>

<rect x="345" y="235" width="20" height="5" rx="0" fill="none"/>
<text x="345" y="235" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">SPEED COMPARISON</text>
<rect x="340" y="248" width="270" height="115" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="475" y="268" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#f9a825">Unmyelinated axon: 0.5–2 m/s</text>
<line x1="365" y1="280" x2="395" y2="280" stroke="#c62828" stroke-width="3"/>
<text x="400" y="284" font-family="Arial" font-size="14" fill="#333">slow (like walking)</text>
<text x="475" y="305" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">Myelinated axon: 70–120 m/s</text>
<line x1="365" y1="320" x2="595" y2="320" stroke="#2a7a2a" stroke-width="3"/>
<text x="475" y="340" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">fast (like a car on motorway)</text>
<text x="475" y="356" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Jumps between nodes of Ranvier</text>

<!-- Real world right -->
<text x="630" y="235" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">REAL-WORLD CONNECTIONS</text>
<rect x="625" y="248" width="355" height="55" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
<text x="803" y="265" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c62828">Multiple sclerosis (Q3): damaged myelin</text>
<text x="803" y="281" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Myelin attacked → signals slow or fail</text>
<text x="803" y="295" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: ~15 per 100,000 (less than Europe)</text>

<rect x="625" y="315" width="355" height="48" rx="6" fill="#e8f5e9" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="803" y="332" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">Local anaesthetic (dentist's lidocaine)</text>
<text x="803" y="348" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Na⁺ blocked → action potentials stop → numb</text>
<text x="803" y="360" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Wears off → Na⁺ reopens → sensation returns</text>

<!-- Reflex arc box -->
<rect x="20" y="380" width="960" height="50" rx="6" fill="#e0f7fa" stroke="#006064" stroke-width="1.5"/>
<text x="500" y="397" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#006064">REFLEX ARC (patellar knee-jerk): touch → sensory neuron → spinal cord → motor neuron → muscle</text>
<text x="500" y="414" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">No brain involved — entire signal in spinal cord. You pull away from heat before brain registers pain. Time &lt;0.04 seconds.</text>

<!-- Brain energy note -->
<rect x="20" y="445" width="960" height="38" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
<text x="500" y="462" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Brain: 20% of energy (2% of weight) — Na⁺/K⁺ gradients across 86 billion neurons need constant ATP</text>
<text x="500" y="478" text-anchor="middle" font-family="Arial" font-size="14" fill="#7b1fa2">860 trillion synaptic connections — more than stars in the Milky Way — running on only 20 watts (less than a light bulb)</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="536" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Action potentials jump myelinated nodes at 70–120 m/s. Synapses: chemical. Damaged myelin → signals slow or fail.</text>
</svg>
