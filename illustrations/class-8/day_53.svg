<text x="250" y="418" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">A touching path crosses the boundary</text>
<text x="750" y="418" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">The gap remains; charge moves inside</text>
<text x="500" y="461" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Leaf angle alone identifies neither sign nor a universal charge amount.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Local charge distribution can change while the isolated total stays the same.</text>
