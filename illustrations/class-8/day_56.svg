<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How do migratory birds use stopover wetlands?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Temporary sites can link stages that endpoints alone do not support</text>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">An invented route network, not tracking data</text>
<circle cx="100" cy="235" r="29" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M83 238 q17 -15 34 0" fill="none" stroke="#579b70" stroke-width="3"/>
<circle cx="330" cy="205" r="29" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M313 208 q17 -15 34 0" fill="none" stroke="#579b70" stroke-width="3"/>
<circle cx="570" cy="275" r="29" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M553 278 q17 -15 34 0" fill="none" stroke="#579b70" stroke-width="3"/>
<circle cx="860" cy="215" r="29" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M843 218 q17 -15 34 0" fill="none" stroke="#579b70" stroke-width="3"/>
<line x1="140" y1="230" x2="290" y2="210" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="370" y1="220" x2="530" y2="265" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="610" y1="270" x2="820" y2="225" stroke="#1f5f8b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="540" y1="245" x2="600" y2="305" stroke="#e6a23c" stroke-width="4"/>
<line x1="600" y1="245" x2="540" y2="305" stroke="#e6a23c" stroke-width="4"/>
<path d="M365 240 Q500 385 825 250" fill="none" stroke="#e6a23c" stroke-width="3"/>
<text x="250" y="415" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Feed and rest when resources fit</text>
<text x="750" y="415" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Alternatives may be more demanding</text>
<text x="500" y="461" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Distance, habitat accessibility, timing and disturbance all matter.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Brief use can be important when it enables the next travel stage.</text>
</svg>
