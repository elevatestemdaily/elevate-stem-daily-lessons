<text x="255" y="410" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Leakage changes internal conditions</text>
<text x="750" y="177" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Water pressure + card weight</text>
<text x="750" y="410" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Outside air pressure acts upward</text>
<text x="500" y="460" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Choose the card or combined system consistently; avoid double counting.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Water keeps its weight; the explanation is a balance of forces and seal effects.</text>
