<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does a paper cup hold its shape better with a rolled rim?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Geometry and ring continuity can stiffen a thin shell edge</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Plain thin edge</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Rolled edge section</text>
<line x1="100" y1="220" x2="380" y2="220" stroke="#1f5f8b" stroke-width="3"/>
<path d="M590 220 L820 220 C900 220 900 160 850 160 C800 160 800 200 845 200" fill="none" stroke="#1f5f8b" stroke-width="5"/>
<circle cx="250" cy="335" r="48" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="750" cy="335" r="48" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="150" y1="335" x2="190" y2="335" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="350" y1="335" x2="310" y2="335" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="650" y1="335" x2="690" y2="335" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="850" y1="335" x2="810" y2="335" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="423" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Opening can distort locally</text>
<text x="750" y="423" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Continuous rim supports the edge</text>
<text x="500" y="464" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Stiffness is resistance to deformation, not immunity to every failure.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Material, cross-section, connections and loading all affect performance.</text>
</svg>
