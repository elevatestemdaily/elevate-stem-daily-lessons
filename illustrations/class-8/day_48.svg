<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">How can paper be remade from used notebook pages?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Disperse fibres, reform their network, then press and dry</text>
<text x="170" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Used sheet</text>
<rect x="55" y="170" width="230" height="180" rx="8" fill="#f8fbff" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Watery fibre pulp</text>
<rect x="385" y="170" width="230" height="180" rx="8" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<text x="830" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">New fibre network</text>
