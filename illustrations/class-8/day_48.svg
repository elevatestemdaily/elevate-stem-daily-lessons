<line x1="640" y1="260" x2="685" y2="260" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="170" y="402" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Overlapping cellulose fibres</text>
<text x="500" y="402" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Network separated in water</text>
<text x="830" y="402" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">New contacts support the sheet</text>
<text x="500" y="454" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Sorting, fibre condition, sheet formation and drying affect quality.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Recycling remakes a network; it need not restore every original property.</text>
