<text x="255" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Full cells + partial-cell equivalents</text>
<text x="750" y="397" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Magnification does not change area</text>
<text x="500" y="445" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Invented example: 12 full + eight half cells at 1 cm² ≈ 16 cm².</text>
