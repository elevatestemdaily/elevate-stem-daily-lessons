<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>

<!-- Title -->
<text x="500" y="38" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b">Why do metals conduct electricity?</text>
<text x="500" y="62" text-anchor="middle" font-family="Arial" font-size="17" fill="#555">Delocalised electrons carry charge — Day 18</text>

<!-- ── LEFT: Electron sea model ── -->
<rect x="20" y="78" width="300" height="410" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="170" y="98" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Electron Sea Model</text>

<!-- 4×3 grid of positive metal ions (no text inside) -->
<!-- Row 1: y=130 -->
<circle cx="55"  cy="130" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="97"  cy="130" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="139" cy="130" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="181" cy="130" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="223" cy="130" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="265" cy="130" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<!-- Row 2: y=172 -->
<circle cx="55"  cy="172" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="97"  cy="172" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="139" cy="172" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="181" cy="172" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="223" cy="172" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="265" cy="172" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<!-- Row 3: y=214 -->
<circle cx="55"  cy="214" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="97"  cy="214" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="139" cy="214" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="181" cy="214" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="223" cy="214" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<circle cx="265" cy="214" r="16" fill="#fde68a" stroke="#d97706" stroke-width="2"/>

<!-- Free electrons (blue dots) scattered between ions -->
<circle cx="76"  cy="151" r="5" fill="#3b82f6"/>
<circle cx="118" cy="151" r="5" fill="#3b82f6"/>
<circle cx="160" cy="151" r="5" fill="#3b82f6"/>
<circle cx="202" cy="151" r="5" fill="#3b82f6"/>
<circle cx="244" cy="151" r="5" fill="#3b82f6"/>
<circle cx="76"  cy="193" r="5" fill="#3b82f6"/>
<circle cx="118" cy="193" r="5" fill="#3b82f6"/>
<circle cx="160" cy="193" r="5" fill="#3b82f6"/>
<circle cx="202" cy="193" r="5" fill="#3b82f6"/>
<circle cx="244" cy="193" r="5" fill="#3b82f6"/>

<!-- Legend for the grid -->
<circle cx="36" cy="246" r="10" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<text x="52" y="250" font-family="Arial" font-size="14" fill="#78350f">Positive metal ion (Cu²⁺)</text>
<circle cx="36" cy="268" r="5" fill="#3b82f6"/>
<text x="52" y="272" font-family="Arial" font-size="14" fill="#1d4ed8">Free (delocalised) electron</text>

<!-- Explanation -->
<text x="170" y="296" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Without voltage: electrons move</text>
<text x="170" y="314" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">randomly — no net current</text>

<!-- Voltage box -->
<rect x="30" y="326" width="260" height="56" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="160" y="344" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">Apply Voltage</text>
<text x="160" y="362" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">e⁻ drift from − to + terminal</text>
<text x="160" y="378" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">→ directed drift = current</text>

<!-- Temperature and resistance -->
<text x="170" y="404" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Higher temp → ions vibrate more</text>
<text x="170" y="422" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">→ electrons scatter → higher R</text>
<text x="170" y="444" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">V = IR  (Ohm's Law)</text>
<text x="170" y="462" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Best conductor: silver (Ag)</text>
<text x="170" y="480" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Most used: copper (Cu)</text>

<!-- ── CENTRE: Band gap ── -->
<rect x="334" y="78" width="318" height="410" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="493" y="98" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Band Gap Comparison</text>

<!-- CONDUCTOR -->
<rect x="344" y="108" width="298" height="88" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="493" y="126" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Conductor (e.g. Copper)</text>
<!-- band diagram: valence and conduction overlap -->
<rect x="356" y="134" width="80" height="22" rx="2" fill="#fca5a5"/>
<text x="396" y="149" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f1d1d">Valence</text>
<rect x="444" y="134" width="80" height="22" rx="2" fill="#ef4444"/>
<text x="484" y="149" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Conduction</text>
<text x="530" y="149" font-family="Arial" font-size="14" fill="#dc2626" font-weight="700">← overlap</text>
<text x="493" y="184" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">No gap — electrons flow freely at room temp</text>

<!-- SEMICONDUCTOR -->
<rect x="344" y="206" width="298" height="108" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="493" y="224" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#7c3aed">Semiconductor (Silicon)</text>
<!-- band diagram: small gap -->
<rect x="356" y="232" width="80" height="22" rx="2" fill="#c4b5fd"/>
<text x="396" y="247" text-anchor="middle" font-family="Arial" font-size="14" fill="#4c1d95">Valence</text>
<text x="444" y="247" font-family="Arial" font-size="14" fill="#7c3aed" font-weight="700">~ 1 eV gap</text>
<rect x="514" y="232" width="80" height="22" rx="2" fill="#e9d5ff"/>
<text x="554" y="247" text-anchor="middle" font-family="Arial" font-size="14" fill="#4c1d95">Conduct.</text>
<text x="493" y="270" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Small gap — heat/light can bridge it</text>
<text x="493" y="288" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Doping with P or B narrows gap</text>
<text x="493" y="305" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">→ makes transistors and chips</text>

<!-- INSULATOR -->
<rect x="344" y="324" width="298" height="108" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="493" y="342" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#374151">Insulator (Glass, Rubber)</text>
<!-- band diagram: large gap -->
<rect x="356" y="350" width="80" height="22" rx="2" fill="#cbd5e1"/>
<text x="396" y="365" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">Valence</text>
<text x="444" y="365" font-family="Arial" font-size="14" fill="#475569" font-weight="700">&gt; 5 eV gap</text>
<rect x="514" y="350" width="80" height="22" rx="2" fill="#e2e8f0"/>
<text x="554" y="365" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">Conduct.</text>
<text x="493" y="388" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Large gap — electrons cannot cross</text>
<text x="493" y="406" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">at normal temperatures</text>
<text x="493" y="423" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Wood, plastic, glass, rubber</text>

<!-- Summary note at bottom -->
<rect x="344" y="442" width="298" height="38" rx="4" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
<text x="493" y="458" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#065f46">Conductivity: Ag &gt; Cu &gt; Au &gt; Al &gt; Fe</text>
<text x="493" y="474" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Al used for HV lines (lighter, cheaper)</text>

<!-- ── RIGHT: India applications ── -->
<rect x="666" y="78" width="317" height="410" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="824" y="98" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">India Applications</text>

<rect x="676" y="108" width="297" height="72" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="824" y="127" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Power Transmission</text>
<text x="824" y="146" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">765 kV lines — aluminium cables</text>
<text x="824" y="165" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Powergrid: 1.73 lakh km network</text>
<text x="824" y="179" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Al: lighter and cheaper than Cu</text>

<rect x="676" y="188" width="297" height="72" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="824" y="207" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Home Wiring</text>
<text x="824" y="226" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Copper — σ = 5.96 × 10⁷ S/m</text>
<text x="824" y="245" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India installs ~1.2M km wire/yr</text>
<text x="824" y="259" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Hindalco, Sterlite make Cu wire</text>

<rect x="676" y="268" width="297" height="72" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="824" y="287" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#7c3aed">Silicon Chips</text>
<text x="824" y="306" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">ISRO VSSC — custom ICs in satellites</text>
<text x="824" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Micron plant: Sanand, Gujarat (2024)</text>
<text x="824" y="339" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India Semiconductor Mission</text>

<rect x="676" y="348" width="297" height="72" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="824" y="367" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">LED Lighting (Ujala)</text>
<text x="824" y="386" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">GaN: 3 eV band gap → blue photon</text>
<text x="824" y="405" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">77 crore LEDs — saves 46 BU/yr</text>
<text x="824" y="419" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Cuts CO₂ emission by 38 Mt/yr</text>

<rect x="676" y="428" width="297" height="52" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="824" y="447" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">Superconductors</text>
<text x="824" y="465" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Zero resistance below critical temp</text>
<text x="824" y="475" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">MRI magnets at AIIMS Delhi</text>

<!-- Takeaway -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Metals conduct because outer electrons are delocalised — free to drift when voltage applied.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">Conductor: no band gap. Semiconductor: ~1 eV gap. Insulator: &gt;5 eV gap. V = IR.</text>
</svg>
