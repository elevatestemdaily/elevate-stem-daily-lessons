<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why is the same side of the Moon usually facing Earth?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">The reference frame distinguishes facing inward from not rotating</text>
<text x="255" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">One rotation per circuit</text>
<text x="745" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">No rotation relative to page</text>
<circle cx="255" cy="260" r="23" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="745" cy="260" r="23" fill="#579b70" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="125" cy="260" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="125" y1="260" x2="150" y2="260" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="255" cy="175" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="255" y1="175" x2="255" y2="200" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="385" cy="260" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="385" y1="260" x2="360" y2="260" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="255" cy="345" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="255" y1="345" x2="255" y2="320" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="615" cy="260" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="615" y1="260" x2="615" y2="235" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="745" cy="175" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="745" y1="175" x2="745" y2="150" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="875" cy="260" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="875" y1="260" x2="875" y2="235" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="745" cy="345" r="13" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<line x1="745" y1="345" x2="745" y2="320" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="255" y="420" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Marked side stays inward</text>
<text x="745" y="420" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Different sides face the centre</text>
<text x="500" y="463" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Near/far describes orientation; day/night describes illumination.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Mostly the same facing hemisphere is compatible with rotation.</text>
</svg>
