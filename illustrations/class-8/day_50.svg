<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does a stretched rubber band pull back when released?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Flexible chains rearrange within a connected network</text>
<text x="170" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Relaxed network</text>
<rect x="40" y="170" width="260" height="185" rx="8" fill="#f8fbff" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Stretched network</text>
<rect x="370" y="170" width="260" height="185" rx="8" fill="#f8fbff" stroke="#1f5f8b" stroke-width="2"/>
<text x="830" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f5f8b">Damaged connection</text>
<rect x="700" y="170" width="260" height="185" rx="8" fill="#f8fbff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M70 205 q35 -35 65 0 t65 0 t65 0" fill="none" stroke="#579b70" stroke-width="3"/>
<path d="M70 260 q35 -35 65 0 t65 0 t65 0" fill="none" stroke="#579b70" stroke-width="3"/>
<path d="M70 315 q35 -35 65 0 t65 0 t65 0" fill="none" stroke="#579b70" stroke-width="3"/>
<line x1="120" y1="205" x2="120" y2="315" stroke="#e6a23c" stroke-width="3"/>
<line x1="210" y1="205" x2="210" y2="315" stroke="#e6a23c" stroke-width="3"/>
<path d="M730 205 q35 -35 65 0 t65 0 t65 0" fill="none" stroke="#579b70" stroke-width="3"/>
<path d="M730 260 q35 -35 65 0 t65 0 t65 0" fill="none" stroke="#579b70" stroke-width="3"/>
<path d="M730 315 q35 -35 65 0 t65 0 t65 0" fill="none" stroke="#579b70" stroke-width="3"/>
<line x1="780" y1="205" x2="780" y2="315" stroke="#e6a23c" stroke-width="3"/>
<line x1="870" y1="205" x2="870" y2="315" stroke="#e6a23c" stroke-width="3"/>
<path d="M385 205 q55 -10 110 0 t110 0" fill="none" stroke="#579b70" stroke-width="3"/>
<path d="M385 260 q55 -10 110 0 t110 0" fill="none" stroke="#579b70" stroke-width="3"/>
<path d="M385 315 q55 -10 110 0 t110 0" fill="none" stroke="#579b70" stroke-width="3"/>
<line x1="435" y1="205" x2="435" y2="315" stroke="#e6a23c" stroke-width="3"/>
<line x1="565" y1="205" x2="565" y2="315" stroke="#e6a23c" stroke-width="3"/>
<line x1="410" y1="385" x2="370" y2="385" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="590" y1="385" x2="630" y2="385" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="851" y="250" width="20" height="20" rx="0" fill="#f8fbff" stroke="#f8fbff" stroke-width="2"/>
<text x="170" y="418" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Many chain configurations</text>
<text x="500" y="418" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">More alignment under a pull</text>
<text x="830" y="418" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Not simply more elasticity</text>
<text x="500" y="461" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Real recovery can include dissipation and is limited by material condition.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Recoverable rearrangement differs from breaking the network.</text>
</svg>
