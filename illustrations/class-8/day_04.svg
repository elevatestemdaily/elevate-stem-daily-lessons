<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">Why does your heart beat continuously?</text>

<!-- Heart cross-section left -->
<text x="30" y="88" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">HEART ELECTRICAL SYSTEM</text>

<!-- Heart outline (simplified) -->
<rect x="20" y="100" width="280" height="300" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>

<!-- Four chambers -->
<rect x="30" y="120" width="125" height="120" rx="6" fill="#ef9a9a" stroke="#c62828" stroke-width="1.5"/>
<text x="92" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#880e4f">RIGHT ATRIUM</text>
<text x="92" y="156" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Receives blood</text>
<text x="92" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">from body</text>

<!-- SA Node star -->
<text x="140" y="128" font-family="Arial" font-size="18" fill="#f9a825">★</text>
<text x="155" y="122" font-family="Arial" font-size="14" font-weight="700" fill="#f9a825">SA NODE</text>
<text x="155" y="134" font-family="Arial" font-size="14" fill="#f9a825">pacemaker</text>

<rect x="165" y="120" width="125" height="120" rx="6" fill="#f8bbd0" stroke="#c62828" stroke-width="1.5"/>
<text x="228" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#880e4f">LEFT ATRIUM</text>
<text x="228" y="156" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Receives blood</text>
<text x="228" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">from lungs</text>

<!-- AV node -->
<circle cx="148" cy="250" r="12" fill="#f9a825" stroke="#e65100" stroke-width="2"/>
<text x="148" y="254" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">AV</text>
<text x="48" y="250" font-family="Arial" font-size="14" fill="#e65100">AV Node</text>
<text x="48" y="262" font-family="Arial" font-size="14" fill="#e65100">(0.1s delay)</text>

<rect x="30" y="255" width="125" height="130" rx="6" fill="#e57373" stroke="#c62828" stroke-width="1.5"/>
<text x="92" y="275" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">RIGHT VENTRICLE</text>
<text x="92" y="291" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Pumps to lungs</text>

<rect x="165" y="255" width="125" height="130" rx="6" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
<text x="228" y="275" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">LEFT VENTRICLE</text>
<text x="228" y="291" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Pumps to body</text>
<text x="228" y="307" text-anchor="middle" font-family="Arial" font-size="14" fill="white">(thicker wall)</text>

<!-- Purkinje fibres (branching lines in ventricles) -->
<line x1="148" y1="255" x2="92" y2="285" stroke="#f9a825" stroke-width="2"/>
<line x1="148" y1="255" x2="228" y2="285" stroke="#f9a825" stroke-width="2"/>
<line x1="92" y1="285" x2="60" y2="350" stroke="#f9a825" stroke-width="1.5"/>
<line x1="92" y1="285" x2="110" y2="360" stroke="#f9a825" stroke-width="1.5"/>
<line x1="228" y1="285" x2="200" y2="360" stroke="#f9a825" stroke-width="1.5"/>
<line x1="228" y1="285" x2="255" y2="350" stroke="#f9a825" stroke-width="1.5"/>
<text x="148" y="415" text-anchor="middle" font-family="Arial" font-size="14" fill="#f9a825">Bundle of His + Purkinje fibres</text>

<!-- Signal path labels -->
<text x="160" y="430" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Signal: SA node → atria → AV node → ventricles</text>

<!-- Electrical signal arrows -->
<text x="92" y="200" text-anchor="middle" font-family="Arial" font-size="18" fill="#f9a825">↓</text>
<text x="228" y="200" text-anchor="middle" font-family="Arial" font-size="18" fill="#f9a825">↓</text>

<!-- Centre: Signal flow description -->
<text x="345" y="88" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">HEARTBEAT SEQUENCE</text>

<rect x="330" y="100" width="200" height="45" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="430" y="117" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#f9a825">SA Node fires</text>
<text x="430" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">no brain trigger needed</text>
<text x="430" y="143" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">~60–100 times/min at rest</text>

<text x="430" y="162" text-anchor="middle" font-family="Arial" font-size="16" fill="#c62828">↓</text>

<rect x="330" y="170" width="200" height="45" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
<text x="430" y="187" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c62828">Atrial systole (0.1 s)</text>
<text x="430" y="202" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Both atria contract</text>
<text x="430" y="213" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">→ blood into ventricles</text>

<text x="430" y="232" text-anchor="middle" font-family="Arial" font-size="16" fill="#c62828">↓</text>

<rect x="330" y="240" width="200" height="45" rx="6" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
<text x="430" y="257" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="white">Ventricular systole (0.3 s)</text>
<text x="430" y="272" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Powerful contraction</text>
<text x="430" y="283" text-anchor="middle" font-family="Arial" font-size="14" fill="white">→ blood to lungs + body</text>

<text x="430" y="302" text-anchor="middle" font-family="Arial" font-size="16" fill="#c62828">↓</text>

<rect x="330" y="310" width="200" height="45" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="430" y="327" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#3949ab">Diastole (0.4 s)</text>
<text x="430" y="342" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Heart relaxes</text>
<text x="430" y="353" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">→ refills with blood</text>

<!-- Brain role note -->
<rect x="330" y="370" width="200" height="55" rx="6" fill="#e8f5e9" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="430" y="387" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">Brain role: modulate, not start</text>
<text x="430" y="402" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Vagus nerve → slows SA node</text>
<text x="430" y="414" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Adrenaline → speeds SA node</text>
<text x="430" y="426" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Coma/anesthesia → still beats!</text>

<!-- Right column: ECG and real world -->
<text x="565" y="88" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">ECG TRACE + APPLICATIONS</text>

<!-- ECG trace area -->
<rect x="555" y="100" width="425" height="100" rx="6" fill="white" stroke="#1f5f8b" stroke-width="1.5"/>
<text x="568" y="117" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">ECG (electrocardiogram)</text>
<!-- baseline -->
<line x1="570" y1="165" x2="970" y2="165" stroke="#ccc" stroke-width="1"/>
<!-- P wave -->
<polyline points="600,165 615,165 625,148 635,165 650,165" fill="none" stroke="#2a7a2a" stroke-width="2"/>
<text x="625" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#2a7a2a">P</text>
<text x="620" y="183" font-family="Arial" font-size="14" fill="#2a7a2a">atria</text>
<!-- QRS complex -->
<polyline points="665,165 675,165 680,178 685,118 690,185 695,165 710,165" fill="none" stroke="#c62828" stroke-width="2"/>
<text x="688" y="112" text-anchor="middle" font-family="Arial" font-size="14" fill="#c62828">QRS</text>
<text x="685" y="183" font-family="Arial" font-size="14" fill="#c62828">ventricles</text>
<!-- T wave -->
<polyline points="725,165 745,165 760,142 775,165 800,165" fill="none" stroke="#3949ab" stroke-width="2"/>
<text x="762" y="137" text-anchor="middle" font-family="Arial" font-size="14" fill="#3949ab">T</text>
<text x="762" y="183" font-family="Arial" font-size="14" fill="#3949ab">recovery</text>
<!-- Second cycle -->
<polyline points="825,165 840,165 850,148 860,165 875,165" fill="none" stroke="#2a7a2a" stroke-width="2"/>
<polyline points="890,165 900,165 905,178 910,118 915,185 920,165 935,165" fill="none" stroke="#c62828" stroke-width="2"/>

<!-- Real world cards -->
<rect x="555" y="215" width="200" height="65" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="655" y="232" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#3949ab">Artificial Pacemaker</text>
<text x="655" y="248" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">SA node damaged → electronic</text>
<text x="655" y="262" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">device under skin generates pulses</text>
<text x="655" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: ~20,000/year implanted</text>

<rect x="770" y="215" width="210" height="65" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
<text x="875" y="232" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c62828">Defibrillator (AED)</text>
<text x="875" y="248" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Ventricular fibrillation = chaotic</text>
<text x="875" y="262" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">AED shock resets all cells</text>
<text x="875" y="276" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">SA node takes over again</text>

<rect x="555" y="295" width="200" height="65" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="655" y="312" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c07000">Q3: SA Node damaged?</text>
<text x="655" y="328" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">AV node takes over as backup</text>
<text x="655" y="344" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">but rate is slower → irregular</text>
<text x="655" y="360" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">rhythm or bradycardia</text>

<rect x="770" y="295" width="210" height="65" rx="6" fill="#e8f5e9" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="875" y="312" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">Caffeine effect</text>
<text x="875" y="328" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Blocks adenosine receptors</text>
<text x="875" y="344" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Adenosine slows SA node</text>
<text x="875" y="360" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Block it → heart beats faster</text>

<!-- Surprise fact -->
<rect x="555" y="375" width="425" height="62" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
<text x="767" y="392" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7b1fa2">Surprising: Heart beats 22 days after conception</text>
<text x="767" y="408" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Before the brain forms — before nerves reach it.</text>
<text x="767" y="422" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">SA node fires spontaneously from the very first beat.</text>

<!-- Transplanted heart note -->
<rect x="555" y="448" width="425" height="42" rx="6" fill="#ddeeff" stroke="#1f5f8b" stroke-width="1"/>
<text x="767" y="465" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">A transplanted heart (nerves cut) still beats —</text>
<text x="767" y="479" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">the SA node needs no connection to the brain.</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="536" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">SA node fires spontaneously → atria contract → AV node → Purkinje fibres → ventricles contract. No brain needed.</text>
</svg>
