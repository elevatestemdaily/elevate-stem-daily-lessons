<text x="260" y="405" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Target accumulates at surfaces</text>
<text x="740" y="405" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Finite remaining capacity</text>
<text x="500" y="452" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Pore access, water chemistry and the particular target all matter.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Adsorption is surface association; reduced colour alone does not prove safety.</text>
</svg>
