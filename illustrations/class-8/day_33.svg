<circle cx="195" cy="209" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="285" cy="290" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="675" cy="209" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="705" cy="209" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="760" cy="209" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<circle cx="775" cy="290" r="5" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
