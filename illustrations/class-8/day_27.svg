<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="arr27" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1f5f8b"/></marker>
  <marker id="arr27r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#dc2626"/></marker>
  <marker id="arr27g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#16a34a"/></marker>
</defs>
<rect width="1000" height="560" fill="#f8fbff"/>

<!-- Title -->
<text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How do satellites stay in orbit?</text>
<text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Fast enough sideways → falls around Earth's curve — never hits — Day 27</text>

<!-- ── LEFT: Newton's cannon diagram ── -->
<rect x="20" y="74" width="450" height="416" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
<text x="245" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#0284c7">Newton's Cannon — Orbital Principle</text>

<!-- Earth circle -->
<circle cx="245" cy="310" r="100" fill="#22c55e" fill-opacity="0.3" stroke="#16a34a" stroke-width="3"/>
<text x="245" y="306" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#065f46">Earth</text>
<text x="245" y="322" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">r = 6,371 km</text>

<!-- Orbit path (ellipse) -->
<ellipse cx="245" cy="310" r="176" ry="168" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="8,4"/>

<!-- Satellite dot on orbit -->
<circle cx="325" cy="143" r="10" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
<text x="340" y="138" font-family="Arial" font-size="14" fill="#f59e0b">ISS</text>

<!-- Tangential velocity arrow -->
<line x1="325" y1="143" x2="400" y2="143" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr27r)"/>
<text x="410" y="140" font-family="Arial" font-size="14" fill="#dc2626">v = 7.66 km/s</text>
<text x="410" y="155" font-family="Arial" font-size="14" fill="#dc2626">(tangential)</text>

<!-- Gravity arrow downward toward Earth -->
<line x1="325" y1="143" x2="290" y2="200" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr27g)"/>
<text x="258" y="174" font-family="Arial" font-size="14" fill="#16a34a">g pulls</text>
<text x="255" y="190" font-family="Arial" font-size="14" fill="#16a34a">down</text>

<!-- Three cannonball arcs -->
<!-- Slow: falls near -->
<path d="M 100 178 Q 120 220 140 260" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,3"/>
<text x="88" y="188" font-family="Arial" font-size="14" fill="#6b7280">slow</text>
<!-- Medium: goes further -->
<path d="M 100 178 Q 160 200 200 260" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3"/>
<text x="66" y="215" font-family="Arial" font-size="14" fill="#f97316">medium</text>
<!-- Orbital: goes all the way around -->
<!-- already shown as ellipse -->
<text x="134" y="136" font-family="Arial" font-size="14" fill="#1d4ed8">orbit speed →</text>
<text x="134" y="152" font-family="Arial" font-size="14" fill="#1d4ed8">falls around Earth!</text>

<!-- Cannon on mountain -->
<rect x="86" y="168" width="22" height="14" rx="2" fill="#374151"/>
<line x1="108" y1="175" x2="130" y2="175" stroke="#374151" stroke-width="3"/>
<polygon points="86,182 108,182 108,196 86,196" fill="#4b5563"/>
<text x="60" y="205" font-family="Arial" font-size="14" fill="#374151">cannon</text>

<!-- Formula box -->
<rect x="30" y="416" width="430" height="66" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="245" y="434" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1d4ed8">v = √(GM/r)</text>
<text x="245" y="452" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">At 420 km alt: v = 7.66 km/s (27,576 km/h)</text>
<text x="245" y="470" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Gravity = centripetal force → GMm/r² = mv²/r</text>

<!-- ── RIGHT: Orbital types + ISRO ── -->
<rect x="484" y="74" width="496" height="416" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="732" y="94" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Orbital Types &amp; ISRO Missions</text>

<!-- Orbital types table -->
<rect x="494" y="104" width="476" height="180" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
<text x="732" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#374151">Orbit Comparison</text>

<!-- Header row -->
<rect x="494" y="128" width="476" height="22" rx="2" fill="#1f5f8b"/>
<text x="570" y="143" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Orbit</text>
<text x="680" y="143" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Altitude</text>
<text x="800" y="143" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Speed</text>
<text x="930" y="143" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Period</text>

<!-- LEO row -->
<rect x="494" y="150" width="476" height="26" fill="#e0f2fe"/>
<text x="570" y="167" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">LEO</text>
<text x="680" y="167" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">200–2,000 km</text>
<text x="800" y="167" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">7.8 km/s</text>
<text x="930" y="167" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">~90 min</text>

<!-- MEO row -->
<rect x="494" y="176" width="476" height="26" fill="white"/>
<text x="570" y="193" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">MEO</text>
<text x="680" y="193" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">~20,000 km</text>
<text x="800" y="193" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">3.9 km/s</text>
<text x="930" y="193" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">12 hours</text>

<!-- GEO row -->
<rect x="494" y="202" width="476" height="26" fill="#f0fdf4"/>
<text x="570" y="219" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">GEO</text>
<text x="680" y="219" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">35,786 km</text>
<text x="800" y="219" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">3.1 km/s</text>
<text x="930" y="219" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">24 hours</text>

<!-- GEO note -->
<rect x="494" y="228" width="476" height="22" fill="#d1fae5"/>
<text x="732" y="243" text-anchor="middle" font-family="Arial" font-size="14" fill="#065f46">GEO appears stationary — used for TV, weather, comms</text>

<!-- Moon row -->
<rect x="494" y="250" width="476" height="26" fill="#ede9fe"/>
<text x="570" y="267" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Moon</text>
<text x="680" y="267" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">384,400 km</text>
<text x="800" y="267" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1.0 km/s</text>
<text x="930" y="267" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">29.5 days</text>

<!-- ISRO missions -->
<rect x="494" y="292" width="476" height="190" rx="4" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="732" y="310" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">ISRO Satellite Milestones</text>

<text x="504" y="332" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">INSAT/GSAT:</text>
<text x="610" y="332" font-family="Arial" font-size="14" fill="#333">GEO — weather, TV, internet</text>

<text x="504" y="352" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">NavIC:</text>
<text x="560" y="352" font-family="Arial" font-size="14" fill="#333">India's own GPS constellation (7 satellites)</text>

<text x="504" y="372" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">IRS:</text>
<text x="534" y="372" font-family="Arial" font-size="14" fill="#333">LEO — crop monitoring, disaster mapping</text>

<text x="504" y="392" font-family="Arial" font-size="14" font-weight="700" fill="#7c3aed">Chandrayaan-3 (2023):</text>
<text x="664" y="392" font-family="Arial" font-size="14" fill="#333">First south-pole lunar landing</text>

<text x="504" y="412" font-family="Arial" font-size="14" fill="#555">Sulphur, Fe, O confirmed in lunar soil. Vikram + Pragyan rover.</text>

<text x="504" y="434" font-family="Arial" font-size="14" fill="#333"><tspan font-weight="700" fill="#dc2626">Mangalyaan (2013): </tspan>First Asian mission to Mars</text>

<text x="504" y="454" font-family="Arial" font-size="14" fill="#555">Cost less than film Gravity ($74M). 430+ satellites for 34 countries.</text>

<text x="504" y="474" font-family="Arial" font-size="14" fill="#555">Chandrayaan-1 (2008): discovered water ice at lunar poles.</text>

<!-- Takeaway -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">v = √(GM/r): satellite speed balances gravity. At 7.66 km/s, ISS falls around Earth's curve.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">ISRO: NavIC (GPS), IRS (crops), INSAT (weather), Chandrayaan-3 (Moon south pole, 2023).</text>
</svg>
