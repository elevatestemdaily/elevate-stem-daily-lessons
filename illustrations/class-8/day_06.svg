<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1f5f8b">Why do we have fingerprints?</text>

<!-- Left panel: Fingerprint types -->
<text x="30" y="88" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">THREE RIDGE PATTERN TYPES</text>

<!-- Loop -->
<rect x="20" y="100" width="140" height="160" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="90" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#3949ab">LOOP</text>
<text x="90" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">~65% of people</text>
<!-- Loop ridges (concentric open loops) -->
<path d="M55,155 Q90,130 125,155" fill="none" stroke="#3949ab" stroke-width="1.5"/>
<path d="M55,165 Q90,138 125,165" fill="none" stroke="#3949ab" stroke-width="1.5"/>
<path d="M55,175 Q90,146 125,175" fill="none" stroke="#3949ab" stroke-width="1.5"/>
<path d="M60,185 Q90,154 120,185" fill="none" stroke="#3949ab" stroke-width="1.5"/>
<path d="M65,195 Q90,162 115,195" fill="none" stroke="#3949ab" stroke-width="1.5"/>
<path d="M70,205 Q90,170 110,205" fill="none" stroke="#3949ab" stroke-width="1.5"/>
<path d="M75,215 Q90,178 105,215" fill="none" stroke="#3949ab" stroke-width="1.5"/>
<text x="90" y="238" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Ridges loop back</text>
<text x="90" y="252" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">without spiralling</text>

<!-- Whorl -->
<rect x="175" y="100" width="140" height="160" rx="8" fill="#e8f5e9" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="245" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">WHORL</text>
<text x="245" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">~30% of people</text>
<!-- Whorl ridges (concentric circles) -->
<circle cx="245" cy="185" r="6" fill="none" stroke="#2a7a2a" stroke-width="1.5"/>
<circle cx="245" cy="185" r="12" fill="none" stroke="#2a7a2a" stroke-width="1.5"/>
<circle cx="245" cy="185" r="18" fill="none" stroke="#2a7a2a" stroke-width="1.5"/>
<circle cx="245" cy="185" r="24" fill="none" stroke="#2a7a2a" stroke-width="1.5"/>
<circle cx="245" cy="185" r="30" fill="none" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="245" y="238" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Concentric circles</text>
<text x="245" y="252" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">or spiral</text>

<!-- Arch -->
<rect x="330" y="100" width="130" height="160" rx="8" fill="#fff8e1" stroke="#f0a000" stroke-width="1.5"/>
<text x="395" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c07000">ARCH</text>
<text x="395" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">~5% of people</text>
<!-- Arch ridges (wave lines) -->
<path d="M345,155 Q395,140 445,155" fill="none" stroke="#c07000" stroke-width="1.5"/>
<path d="M345,165 Q395,148 445,165" fill="none" stroke="#c07000" stroke-width="1.5"/>
<path d="M345,175 Q395,155 445,175" fill="none" stroke="#c07000" stroke-width="1.5"/>
<path d="M345,185 Q395,165 445,185" fill="none" stroke="#c07000" stroke-width="1.5"/>
<path d="M345,195 Q395,175 445,195" fill="none" stroke="#c07000" stroke-width="1.5"/>
<path d="M345,205 Q395,185 445,205" fill="none" stroke="#c07000" stroke-width="1.5"/>
<path d="M345,215 Q395,195 445,215" fill="none" stroke="#c07000" stroke-width="1.5"/>
<text x="395" y="238" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Ridges arch</text>
<text x="395" y="252" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">no loop or whorl</text>

<!-- Centre: Grip mechanism -->
<text x="490" y="88" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">GRIP MECHANISM</text>

<!-- Ridged tip gripping -->
<rect x="475" y="100" width="200" height="115" rx="6" fill="#e8f5e9" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="575" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">RIDGED FINGERTIP — grips well</text>
<!-- Ridged tip shape -->
<path d="M510,145 Q575,125 640,145 L640,160 Q575,138 510,160 Z" fill="#ffccbc" stroke="#e07000" stroke-width="1.5"/>
<!-- Ridges on tip -->
<line x1="520" y1="150" x2="520" y2="155" stroke="#e07000" stroke-width="2"/>
<line x1="535" y1="146" x2="535" y2="151" stroke="#e07000" stroke-width="2"/>
<line x1="550" y1="143" x2="550" y2="148" stroke="#e07000" stroke-width="2"/>
<line x1="565" y1="141" x2="565" y2="146" stroke="#e07000" stroke-width="2"/>
<line x1="580" y1="141" x2="580" y2="146" stroke="#e07000" stroke-width="2"/>
<line x1="595" y1="143" x2="595" y2="148" stroke="#e07000" stroke-width="2"/>
<line x1="610" y1="146" x2="610" y2="151" stroke="#e07000" stroke-width="2"/>
<line x1="625" y1="150" x2="625" y2="155" stroke="#e07000" stroke-width="2"/>
<!-- Surface -->
<rect x="505" y="165" width="140" height="8" fill="#ddd"/>
<text x="575" y="187" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Ridges interlock with surface</text>
<text x="575" y="201" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Grooves drain fluid away</text>
<text x="575" y="207" text-anchor="middle" font-family="Arial" font-size="14" fill="#2a7a2a">✓ high friction = strong grip</text>

<!-- Smooth tip -->
<rect x="475" y="228" width="200" height="95" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
<text x="575" y="246" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c62828">SMOOTH FINGERTIP (Q3)</text>
<!-- Smooth tip shape -->
<path d="M510,268 Q575,250 640,268 L640,280 Q575,262 510,280 Z" fill="#ffccbc" stroke="#e07000" stroke-width="1.5"/>
<!-- Surface -->
<rect x="505" y="285" width="140" height="8" fill="#ddd"/>
<!-- Slip arrow -->
<text x="660" y="280" font-family="Arial" font-size="18" fill="#c62828">→</text>
<text x="570" y="305" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">No interlocking; fluid not drained</text>
<text x="570" y="317" text-anchor="middle" font-family="Arial" font-size="14" fill="#c62828">✗ low friction = grip reduced</text>

<!-- Fingertip cross section -->
<text x="490" y="346" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">SKIN CROSS-SECTION</text>
<rect x="475" y="355" width="200" height="110" rx="6" fill="#fff8e1" stroke="#f0a000" stroke-width="1.5"/>
<!-- Epidermis ridge -->
<path d="M490,390 Q495,378 500,390 Q505,378 510,390 Q515,378 520,390 Q525,378 530,390 Q535,378 540,390 Q545,378 550,390 Q555,378 560,390 Q565,378 570,390 Q575,378 580,390 Q585,378 590,390 Q595,378 600,390 Q605,378 610,390 Q615,378 620,390 Q625,378 630,390 Q635,378 640,390 Q645,378 650,390 Q655,378 660,390" fill="none" stroke="#e07000" stroke-width="2"/>
<text x="575" y="373" text-anchor="middle" font-family="Arial" font-size="14" fill="#e07000">epidermis ridges (surface)</text>
<!-- Dermis layer -->
<rect x="488" y="393" width="180" height="30" rx="0" fill="#ffccbc" opacity="0.5"/>
<text x="575" y="408" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">dermis with papillae</text>
<!-- Nerve endings -->
<circle cx="535" cy="385" r="5" fill="#9fa8da"/>
<circle cx="575" cy="380" r="5" fill="#9fa8da"/>
<circle cx="615" cy="385" r="5" fill="#9fa8da"/>
<text x="575" y="420" text-anchor="middle" font-family="Arial" font-size="14" fill="#3949ab">Meissner's corpuscles</text>
<text x="575" y="432" text-anchor="middle" font-family="Arial" font-size="14" fill="#3949ab">(touch sensors at ridge tips)</text>
<circle cx="535" cy="415" r="4" fill="#f48fb1"/>
<circle cx="575" cy="415" r="4" fill="#f48fb1"/>
<circle cx="615" cy="415" r="4" fill="#f48fb1"/>
<text x="575" y="458" text-anchor="middle" font-family="Arial" font-size="14" fill="#880e4f">Merkel's discs (pressure sensors)</text>

<!-- Right panel: Forensics and Aadhaar -->
<text x="700" y="88" font-family="Arial" font-size="14" font-weight="700" fill="#1f5f8b">REAL-WORLD APPLICATIONS</text>

<rect x="690" y="100" width="290" height="65" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="835" y="118" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#3949ab">Aadhaar Biometrics</text>
<text x="835" y="134" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1.3 billion Indians enrolled</text>
<text x="835" y="150" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Reads ridge/groove via capacitance</text>
<text x="835" y="162" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Unique from foetal development</text>

<rect x="690" y="180" width="290" height="65" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
<text x="835" y="198" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c62828">Forensic Science</text>
<text x="835" y="214" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Kolkata 1897: India's print bureau</text>
<text x="835" y="230" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">AFIS database matches prints in seconds</text>
<text x="835" y="242" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Latent: sweat leaves impressions</text>

<rect x="690" y="260" width="290" height="55" rx="6" fill="#e8f5e9" stroke="#2a7a2a" stroke-width="1.5"/>
<text x="835" y="278" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2a7a2a">Convergent Evolution</text>
<text x="835" y="294" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Koalas also evolved fingerprints!</text>
<text x="835" y="308" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Same functional solution → same structure</text>

<rect x="690" y="330" width="290" height="65" rx="6" fill="#fff8e1" stroke="#f0a000" stroke-width="1.5"/>
<text x="835" y="348" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#c07000">Foetal Development</text>
<text x="835" y="364" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Ridges form wks 9–17: skin buckling</text>
<text x="835" y="380" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Wider fingertip → whorls; narrower → loops</text>
<text x="835" y="393" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Identical twins: same DNA, different prints</text>

<rect x="690" y="410" width="290" height="55" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
<text x="835" y="428" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7b1fa2">Texture sensing (bonus function)</text>
<text x="835" y="444" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Ridges vibrate as finger slides over surface</text>
<text x="835" y="458" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Pacinians detect vibration → texture</text>

<!-- Takeaway strip -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="536" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Fingerprint ridges increase grip by interlocking and draining fluid. Smooth tips → friction drops → grip reduced.</text>
</svg>
