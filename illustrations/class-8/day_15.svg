<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="arr15" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1f5f8b"/></marker>
</defs>
<rect width="1000" height="560" fill="#f8fbff"/>

<!-- Title -->
<text x="500" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">How does a mobile phone transmit information?</text>
<text x="500" y="62" text-anchor="middle" font-family="Arial" font-size="17" fill="#555">Voice → digital → radio wave → tower → fibre → recipient — Day 15</text>

<!-- ── TOP ROW: 4 transmission steps ── -->
<!-- Step 1 -->
<rect x="20" y="78" width="220" height="106" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="130" y="99" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1d4ed8">Step 1 — Sound → Signal</text>
<text x="130" y="119" text-anchor="middle" font-family="Arial" font-size="15" fill="#333">Microphone diaphragm</text>
<text x="130" y="138" text-anchor="middle" font-family="Arial" font-size="15" fill="#333">vibrates with voice</text>
<text x="130" y="157" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">→ varying electrical signal</text>
<text x="130" y="176" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">(analogue waveform)</text>
<line x1="240" y1="131" x2="258" y2="131" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arr15)"/>

<!-- Step 2 -->
<rect x="262" y="78" width="220" height="106" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="372" y="99" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#7c3aed">Step 2 — Digitise</text>
<text x="372" y="119" text-anchor="middle" font-family="Arial" font-size="15" fill="#333">Sampled 48,000 times/sec</text>
<text x="372" y="138" text-anchor="middle" font-family="Arial" font-size="15" fill="#333">Each sample → binary</text>
<text x="372" y="157" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Codec compresses data</text>
<text x="372" y="176" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">10–20× smaller (AAC/Opus)</text>
<line x1="482" y1="131" x2="500" y2="131" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arr15)"/>

<!-- Step 3 -->
<rect x="504" y="78" width="220" height="106" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="614" y="99" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#92400e">Step 3 — Radio Wave</text>
<text x="614" y="119" text-anchor="middle" font-family="Arial" font-size="15" fill="#333">Data modulated onto</text>
<text x="614" y="138" text-anchor="middle" font-family="Arial" font-size="15" fill="#333">carrier wave (OFDM)</text>
<text x="614" y="157" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">4G LTE: 1,800 MHz carrier</text>
<text x="614" y="176" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Speed of light: 3×10⁸ m/s</text>
<line x1="724" y1="131" x2="742" y2="131" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arr15)"/>

<!-- Step 4 -->
<rect x="746" y="78" width="234" height="106" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="863" y="99" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#dc2626">Step 4 — Cell Tower</text>
<text x="863" y="119" text-anchor="middle" font-family="Arial" font-size="15" fill="#333">Tower receives signal</text>
<text x="863" y="138" text-anchor="middle" font-family="Arial" font-size="15" fill="#333">Demodulates → digital</text>
<text x="863" y="157" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Fibre backhaul to exchange</text>
<text x="863" y="176" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Routes to recipient's tower</text>

<!-- Vertical connector right-to-left for row 2 -->
<line x1="863" y1="184" x2="863" y2="205" stroke="#1f5f8b" stroke-width="2"/>
<line x1="863" y1="205" x2="130" y2="205" stroke="#1f5f8b" stroke-width="2"/>
<line x1="130" y1="205" x2="130" y2="218" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arr15)"/>

<!-- ── BOTTOM ROW: India context + Spectrum ── -->
<!-- India facts -->
<rect x="20" y="222" width="430" height="242" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="235" y="244" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#16a34a">India Mobile Network</text>
<text x="30" y="266" font-family="Arial" font-size="15" fill="#333">• 1.1 billion subscribers — world's 2nd largest market</text>
<text x="30" y="288" font-family="Arial" font-size="15" fill="#333">• Jio 5G launched Oct 2022 — fastest 5G rollout globally</text>
<text x="30" y="310" font-family="Arial" font-size="15" fill="#333">• 2022 spectrum auction: ₹1.5 lakh crore (~$18 billion)</text>
<text x="30" y="332" font-family="Arial" font-size="15" fill="#333">• BSNL serves tribal / Ladakh areas on 700 MHz</text>
<text x="30" y="354" font-family="Arial" font-size="15" fill="#333">• Train WiFi: phone hands off tower-to-tower as train moves</text>
<text x="30" y="376" font-family="Arial" font-size="14" fill="#555">• ISRO satellite internet: 36,000 km → 250 ms one-way delay</text>
<text x="30" y="397" font-family="Arial" font-size="14" fill="#555">• First India mobile call: 31 July 1995, Kolkata (AMPS 800 MHz)</text>
<text x="30" y="418" font-family="Arial" font-size="14" fill="#555">• That tower handled ~400 calls; a 5G mmWave cell: 10,000+</text>
<text x="30" y="440" font-family="Arial" font-size="14" fill="#555">• 5G mmWave: &gt;10 Gbps but only ~100 m range (small cells needed)</text>
<text x="30" y="458" font-family="Arial" font-size="14" fill="#555">• TRAI emission limit: 10 W/m² in public areas</text>

<!-- Spectrum panel -->
<rect x="464" y="222" width="516" height="242" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<text x="722" y="244" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">India Spectrum Bands</text>

<!-- Spectrum bar -->
<rect x="480" y="258" width="484" height="32" rx="4" fill="#f1f5f9"/>
<rect x="480" y="258" width="72" height="32" fill="#3b82f6" rx="2"/>
<rect x="554" y="258" width="72" height="32" fill="#10b981"/>
<rect x="628" y="258" width="96" height="32" fill="#f59e0b"/>
<rect x="726" y="258" width="114" height="32" fill="#ef4444"/>
<rect x="842" y="258" width="122" height="32" fill="#8b5cf6" rx="2"/>
<text x="516" y="279" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="700">700 MHz</text>
<text x="590" y="279" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="700">900 MHz</text>
<text x="676" y="279" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="700">1,800–2,100</text>
<text x="783" y="279" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="700">5G Sub-6</text>
<text x="903" y="279" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="700">5G 26 GHz</text>

<text x="480" y="308" font-family="Arial" font-size="15" fill="#333">Lower frequency → farther range, better wall penetration</text>
<text x="480" y="328" font-family="Arial" font-size="15" fill="#333">Higher frequency → more data capacity, shorter range</text>
<text x="480" y="352" font-family="Arial" font-size="14" fill="#555">OFDM: carrier split into thousands of sub-bands — if some</text>
<text x="480" y="370" font-family="Arial" font-size="14" fill="#555">are blocked by interference, the rest carry the signal through.</text>
<text x="480" y="392" font-family="Arial" font-size="14" fill="#555">This makes 4G/5G robust in dense urban environments (Mumbai,</text>
<text x="480" y="410" font-family="Arial" font-size="14" fill="#555">Delhi) where buildings scatter signals on individual sub-bands.</text>
<text x="480" y="432" font-family="Arial" font-size="14" fill="#1f5f8b">Propagation speed: 3×10⁸ m/s. Tower at 2 km: signal in 6.7 μs.</text>
<text x="480" y="451" font-family="Arial" font-size="14" fill="#1f5f8b">Satellite: 36,000 km → 120 ms delay (noticeable in voice calls).</text>
<text x="480" y="460" font-family="Arial" font-size="14" fill="#555"> </text>

<!-- Takeaway -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="528" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">Voice → digitised → compressed → modulated on radio carrier → cell tower → fibre → recipient tower → phone.</text>
<text x="500" y="548" text-anchor="middle" font-family="Arial" font-size="15" fill="#a5f3fc">India: 1,800 MHz 4G | 700 MHz rural 5G | 26 GHz urban 5G. All travel at 3×10⁸ m/s.</text>
</svg>
