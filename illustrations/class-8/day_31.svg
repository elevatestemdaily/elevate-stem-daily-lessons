<text x="245" y="405" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Wetted root region</text>
<text x="740" y="405" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Blocked outlet: less delivery</text>
<text x="500" y="453" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Invented rate model: 2 litres/hour × 0.5 hour = 1 litre.</text>
