<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Local delivery needs placement, suitable rates and working emitters</text>
<text x="500" y="134" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Main supply → laterals → emitters</text>
