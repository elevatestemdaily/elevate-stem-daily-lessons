<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1f5f8b"/></marker></defs>
<text x="500" y="40" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b" data-role="title">Why does a pointed pin press into cardboard more easily?</text>
<text x="500" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">For the same force, average pressure increases as contact area decreases</text>
<text x="250" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Narrow blunt contact</text>
<text x="750" y="135" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Broad blunt contact</text>
<line x1="250" y1="155" x2="250" y2="210" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="750" y1="155" x2="750" y2="210" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="225" y="215" width="50" height="100" rx="8" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<rect x="660" y="215" width="180" height="70" rx="8" fill="#e6a23c" stroke="#1f5f8b" stroke-width="2"/>
<path d="M65 310 L210 310 Q250 365 290 310 L435 310 L435 365 L65 365 Z" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<path d="M565 285 L650 285 Q750 315 850 285 L935 285 L935 365 L565 365 Z" fill="#ddeeff" stroke="#1f5f8b" stroke-width="2"/>
<text x="250" y="407" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Greater average pressure</text>
<text x="750" y="407" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">Same force spread farther</text>
<text x="500" y="455" text-anchor="middle" font-family="Arial" font-size="16" font-weight="400" fill="#1f5f8b">P = F/A     Example area ratio 1:10 → pressure ratio 10:1</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">No sharp tools are needed to model concentrated loading safely.</text>
</svg>
