<text x="250" y="410" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">One replenishment route interrupted</text>
<text x="750" y="410" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">New seeds can add to the bank</text>
<text x="500" y="460" text-anchor="middle" font-family="Arial" font-size="15" font-weight="400" fill="#1f5f8b">Old seeds, outside arrivals and underground regrowth may remain.</text>
<line x1="40" y1="484" x2="960" y2="484" stroke="#1f5f8b" stroke-width="2"/>
<text x="500" y="519" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">A clear-looking bed is not proof that every future weed source is gone.</text>
