<circle cx="212" cy="256" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<circle cx="52"  cy="288" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<circle cx="84"  cy="288" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<circle cx="116" cy="288" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<circle cx="148" cy="288" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<circle cx="180" cy="288" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<circle cx="212" cy="288" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>

<!-- Dislocation arrow (slip line) in pure iron -->
<line x1="34" y1="208" x2="238" y2="208" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
<text x="34" y="204" font-family="Arial" font-size="14" fill="#dc2626">← slip</text>

<text x="137" y="322" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Rows slide easily over</text>
<text x="137" y="340" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">each other (dislocation)</text>
<text x="137" y="358" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626" font-weight="700">→ SOFT &amp; DUCTILE</text>

<!-- STEEL (right half) -->
<rect x="255" y="108" width="215" height="240" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="362" y="126" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Steel (Fe + ~0.3% C)</text>
<text x="362" y="143" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Carbon atoms in lattice</text>

<!-- Steel lattice: same grid + carbon atoms -->
<circle cx="277" cy="160" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<circle cx="309" cy="160" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
