<circle cx="277" cy="288" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<circle cx="309" cy="288" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<circle cx="341" cy="288" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<circle cx="373" cy="288" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<circle cx="405" cy="288" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<circle cx="437" cy="288" r="12" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>

<!-- Carbon atoms (smaller, black) blocking dislocations -->
<circle cx="325" cy="208" r="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<circle cx="389" cy="240" r="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<circle cx="293" cy="272" r="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>

<!-- Blocked slip arrow -->
<line x1="259" y1="208" x2="316" y2="208" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
<text x="259" y="204" font-family="Arial" font-size="14" fill="#dc2626">← slip</text>
<text x="338" y="204" font-family="Arial" font-size="14" fill="#16a34a" font-weight="700">BLOCKED</text>

<text x="362" y="322" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Carbon atoms pin rows</text>
<text x="362" y="340" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">→ dislocations can't move</text>
<text x="362" y="358" text-anchor="middle" font-family="Arial" font-size="14" fill="#16a34a" font-weight="700">→ STRONGER &amp; HARDER</text>

<!-- Lattice legend -->
<circle cx="38" cy="384" r="10" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<text x="54" y="388" font-family="Arial" font-size="14" fill="#475569">Iron (Fe) atom</text>
<circle cx="38" cy="408" r="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
<text x="54" y="412" font-family="Arial" font-size="14" fill="#334155">Carbon (C) atom — small, fits between Fe</text>

<!-- Carbon % note -->
<rect x="30" y="428" width="440" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="250" y="446" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">Carbon content determines type:</text>
<text x="250" y="462" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Mild steel: 0.05–0.3% C | Medium: 0.3–0.6% | High: 0.6–1.4%</text>

<!-- ── RIGHT: Properties + India ── -->
<rect x="494" y="78" width="489" height="410" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="738" y="98" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Properties &amp; India Steel Industry</text>

<!-- Properties table -->
<rect x="504" y="108" width="469" height="175" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="738" y="126" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Iron vs Steel Properties</text>
<!-- Headers -->
<rect x="504" y="132" width="160" height="24" rx="2" fill="#e2e8f0"/>
<rect x="668" y="132" width="148" height="24" rx="2" fill="#dbeafe"/>
<rect x="820" y="132" width="153" height="24" rx="2" fill="#fef3c7"/>
<text x="584" y="148" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155" font-weight="700">Property</text>
<text x="742" y="148" text-anchor="middle" font-family="Arial" font-size="14" fill="#1d4ed8" font-weight="700">Pure Iron</text>
<text x="896" y="148" text-anchor="middle" font-family="Arial" font-size="14" fill="#92400e" font-weight="700">Steel</text>
<!-- Row 1 -->
<text x="514" y="168" font-family="Arial" font-size="14" fill="#333">Strength</text>
<text x="742" y="168" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Low</text>
<text x="896" y="168" text-anchor="middle" font-family="Arial" font-size="14" fill="#16a34a" font-weight="700">High</text>
<!-- Row 2 -->
<text x="514" y="186" font-family="Arial" font-size="14" fill="#333">Hardness</text>
<text x="742" y="186" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Soft</text>
<text x="896" y="186" text-anchor="middle" font-family="Arial" font-size="14" fill="#16a34a" font-weight="700">Hard</text>
<!-- Row 3 -->
<text x="514" y="204" font-family="Arial" font-size="14" fill="#333">Ductility</text>
<text x="742" y="204" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">High</text>
<text x="896" y="204" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Lower</text>
<!-- Row 4 -->
<text x="514" y="222" font-family="Arial" font-size="14" fill="#333">Rust resistance</text>
<text x="742" y="222" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">Rusts fast</text>
<text x="896" y="222" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Rusts (SS: no)</text>
<!-- Row 5 -->
<text x="514" y="240" font-family="Arial" font-size="14" fill="#333">Weldability</text>
<text x="742" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Good</text>
<text x="896" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Good</text>
<!-- Row 6 -->
<text x="514" y="258" font-family="Arial" font-size="14" fill="#333">Application</text>
<text x="742" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Electromagnets</text>
<text x="896" y="258" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Bridges, rails, cars</text>
<!-- Row 7 -->
<text x="514" y="274" font-family="Arial" font-size="14" fill="#333">Carbon %</text>
<text x="742" y="274" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">0%</text>
<text x="896" y="274" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">0.05–1.4%</text>

<!-- India Steel industry boxes -->
<rect x="504" y="292" width="227" height="78" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="617" y="310" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">TATA Steel, Jamshedpur</text>
<text x="617" y="328" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Founded 1907 — first steel plant</text>
<text x="617" y="346" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Capacity: 21 MT/year</text>
<text x="617" y="362" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Supplies Indian railways</text>

<rect x="745" y="292" width="228" height="78" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="859" y="310" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Bhilai Steel Plant (SAIL)</text>
<text x="859" y="328" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Soviet collaboration — est. 1955</text>
<text x="859" y="346" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Chhattisgarh — 7.5 MT capacity</text>
<text x="859" y="362" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Rail tracks for entire India</text>

<rect x="504" y="378" width="227" height="72" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="617" y="396" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">JSW Steel, Bellary</text>
<text x="617" y="414" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Karnataka — 28 MT, largest plant</text>
<text x="617" y="432" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Auto-grade steel: Maruti, Tata cars</text>
<text x="617" y="446" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India: 4th largest steel producer</text>

<rect x="745" y="378" width="228" height="72" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
<text x="859" y="396" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Stainless Steel</text>
<text x="859" y="414" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Steel + 10.5% chromium</text>
<text x="859" y="432" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Cr₂O₃ layer — no rust</text>
<text x="859" y="446" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">India exports to 120+ countries</text>

<!-- Takeaway -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Steel = iron + 0.05–1.4% carbon. Carbon atoms block dislocations → steel is stronger than pure iron.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">India: 4th largest steel producer. TATA, SAIL, JSW. Stainless steel adds Cr for rust resistance.</text>
</svg>
