<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="1000" height="560" fill="#f8fbff"/>

<!-- Title -->
<text x="500" y="38" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#1f5f8b">How is steel different from iron?</text>
<text x="500" y="62" text-anchor="middle" font-family="Arial" font-size="17" fill="#555">Carbon atoms in the lattice block dislocations — iron slips, steel resists — Day 19</text>

<!-- ── LEFT: Lattice diagrams side by side ── -->
<rect x="20" y="78" width="460" height="410" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="250" y="98" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Crystal Lattice Comparison</text>

<!-- PURE IRON (left half) -->
<rect x="30" y="108" width="215" height="240" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="137" y="126" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#0369a1">Pure Iron</text>
<text x="137" y="143" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Regular Fe lattice</text>

