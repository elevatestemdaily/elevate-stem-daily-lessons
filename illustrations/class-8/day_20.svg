<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs>
  <marker id="arr20" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1f5f8b"/></marker>
</defs>
<rect width="1000" height="560" fill="#f8fbff"/>

<!-- Title -->
<text x="500" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1f5f8b">Plastics: miracle material or environmental problem?</text>
<text x="500" y="62" text-anchor="middle" font-family="Arial" font-size="17" fill="#555">Polymer chains — strong, light, durable — but persist for centuries — Day 20</text>

<!-- ── LEFT: Polymer chain ── -->
<rect x="20" y="78" width="300" height="410" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="170" y="98" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Monomer → Polymer</text>

<!-- Ethylene monomer -->
<text x="170" y="118" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#333">Ethylene monomer (C₂H₄)</text>
<rect x="45" y="126" width="250" height="52" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<!-- Ethylene structure: H2C=CH2 -->
<text x="95" y="148" text-anchor="middle" font-family="Arial" font-size="16" fill="#1d4ed8" font-weight="700">H₂C</text>
<text x="135" y="148" text-anchor="middle" font-family="Arial" font-size="16" fill="#dc2626" font-weight="700">=</text>
<text x="175" y="148" text-anchor="middle" font-family="Arial" font-size="16" fill="#1d4ed8" font-weight="700">CH₂</text>
<text x="170" y="168" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">double bond = reactive</text>

<line x1="170" y1="179" x2="170" y2="196" stroke="#1f5f8b" stroke-width="2" marker-end="url(#arr20)"/>
<text x="174" y="192" font-family="Arial" font-size="14" fill="#555">polymerisation</text>

<!-- Polyethylene chain -->
<text x="170" y="216" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#333">Polyethylene chain</text>

<!-- Chain: repeated -CH2-CH2- units -->
<rect x="30" y="222" width="50" height="28" rx="3" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="55" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#1d4ed8" font-weight="700">CH₂</text>
<line x1="80" y1="236" x2="92" y2="236" stroke="#1d4ed8" stroke-width="2"/>
<rect x="92" y="222" width="50" height="28" rx="3" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="117" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#1d4ed8" font-weight="700">CH₂</text>
<line x1="142" y1="236" x2="154" y2="236" stroke="#1d4ed8" stroke-width="2"/>
<rect x="154" y="222" width="50" height="28" rx="3" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="179" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#1d4ed8" font-weight="700">CH₂</text>
<line x1="204" y1="236" x2="216" y2="236" stroke="#1d4ed8" stroke-width="2"/>
<rect x="216" y="222" width="50" height="28" rx="3" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="241" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#1d4ed8" font-weight="700">CH₂</text>
<text x="270" y="240" font-family="Arial" font-size="18" fill="#1d4ed8">…</text>

<text x="170" y="268" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Thousands of units linked by</text>
<text x="170" y="286" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">C−C single bonds (very strong)</text>
<text x="170" y="304" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Only C−C and C−H bonds →</text>
<text x="170" y="322" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">microbes lack enzymes to break</text>
<text x="170" y="340" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626" font-weight="700">→ persists 100–500 years</text>

<!-- Thermo vs Thermoset -->
<rect x="30" y="355" width="135" height="98" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="97" y="373" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">Thermoplastic</text>
<text x="97" y="391" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Softens on</text>
<text x="97" y="409" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">heating — can</text>
<text x="97" y="427" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">remould</text>
<text x="97" y="443" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">PE, PP, PET</text>

<rect x="175" y="355" width="135" height="98" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="242" y="373" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#dc2626">Thermoset</text>
<text x="242" y="391" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Cross-links on</text>
<text x="242" y="409" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">heating — rigid,</text>
<text x="242" y="427" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">cannot remould</text>
<text x="242" y="443" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Bakelite, epoxy</text>

<text x="170" y="468" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Thermoplastics can be recycled;</text>
<text x="170" y="484" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">thermosets mostly cannot.</text>

<!-- ── CENTRE: Types + degradation ── -->
<rect x="334" y="78" width="330" height="410" rx="6" fill="white" stroke="#6b7280" stroke-width="1.5"/>
<text x="499" y="98" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1f5f8b">Common Plastics (Resin Codes)</text>

<!-- Plastics table -->
<rect x="344" y="106" width="310" height="24" rx="2" fill="#e2e8f0"/>
<text x="384" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#334155">Type</text>
<text x="554" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#334155">Use</text>
<text x="636" y="122" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#334155">Safe?</text>

<text x="344" y="142" font-family="Arial" font-size="14" fill="#333">①PET (polyethylene tereph.)</text>
<text x="546" y="142" font-family="Arial" font-size="14" fill="#555">Bottles</text>
<text x="634" y="142" font-family="Arial" font-size="14" fill="#16a34a">✓</text>

<text x="344" y="160" font-family="Arial" font-size="14" fill="#333">②HDPE (high-density PE)</text>
<text x="546" y="160" font-family="Arial" font-size="14" fill="#555">Jugs, pipes</text>
<text x="634" y="160" font-family="Arial" font-size="14" fill="#16a34a">✓</text>

<text x="344" y="178" font-family="Arial" font-size="14" fill="#333">③PVC (polyvinyl chloride)</text>
<text x="546" y="178" font-family="Arial" font-size="14" fill="#555">Pipes, cables</text>
<text x="634" y="178" font-family="Arial" font-size="14" fill="#d97706">~</text>

<text x="344" y="196" font-family="Arial" font-size="14" fill="#333">④LDPE (low-density PE)</text>
<text x="546" y="196" font-family="Arial" font-size="14" fill="#555">Plastic bags</text>
<text x="634" y="196" font-family="Arial" font-size="14" fill="#16a34a">✓</text>

<text x="344" y="214" font-family="Arial" font-size="14" fill="#333">⑤PP (polypropylene)</text>
<text x="546" y="214" font-family="Arial" font-size="14" fill="#555">Containers</text>
<text x="634" y="214" font-family="Arial" font-size="14" fill="#16a34a">✓</text>

<text x="344" y="232" font-family="Arial" font-size="14" fill="#333">⑥PS (polystyrene)</text>
<text x="546" y="232" font-family="Arial" font-size="14" fill="#555">Foam cups</text>
<text x="634" y="232" font-family="Arial" font-size="14" fill="#dc2626">✗</text>

<text x="344" y="250" font-family="Arial" font-size="14" fill="#333">⑦Other (incl. BPA)</text>
<text x="546" y="250" font-family="Arial" font-size="14" fill="#555">Mixed uses</text>
<text x="634" y="250" font-family="Arial" font-size="14" fill="#dc2626">✗</text>

<!-- Degradation timeline -->
<rect x="344" y="262" width="310" height="108" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="499" y="280" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Degradation Timeline</text>
<text x="354" y="298" font-family="Arial" font-size="14" fill="#333">• Plastic bag: 10–20 years</text>
<text x="354" y="316" font-family="Arial" font-size="14" fill="#333">• Plastic bottle (PET): 450 years</text>
<text x="354" y="334" font-family="Arial" font-size="14" fill="#333">• Styrofoam cup: 500+ years</text>
<text x="354" y="352" font-family="Arial" font-size="14" fill="#555">Microplastics: break into &lt;5mm pieces</text>
<text x="354" y="370" text-anchor="left" font-family="Arial" font-size="14" fill="#555">→ enter food chain, found in blood</text>

<!-- Biodegradable alternatives -->
<rect x="344" y="380" width="310" height="100" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="499" y="398" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#065f46">Biodegradable Alternatives</text>
<text x="354" y="416" font-family="Arial" font-size="14" fill="#333">• PLA (corn starch) — compostable</text>
<text x="354" y="434" font-family="Arial" font-size="14" fill="#333">• PHB (bacteria-made) — ocean-safe</text>
<text x="354" y="452" font-family="Arial" font-size="14" fill="#555">• Jute bags: India export earns ₹6,000 cr</text>
<text x="354" y="470" font-family="Arial" font-size="14" fill="#555">• Edible cutlery — BAKEY'S, Hyderabad</text>

<!-- ── RIGHT: India plastic facts ── -->
<rect x="678" y="78" width="305" height="410" rx="6" fill="#fff0f0" stroke="#dc2626" stroke-width="1.5"/>
<text x="830" y="98" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#dc2626">India Plastics Context</text>

<rect x="688" y="108" width="285" height="96" rx="4" fill="white" stroke="#6b7280" stroke-width="1"/>
<text x="830" y="126" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#1f5f8b">Production &amp; Use</text>
<text x="830" y="144" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">India: 3rd largest plastic consumer</text>
<text x="830" y="162" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">~20 million tonnes/year (2023)</text>
<text x="830" y="180" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Packaging: 40% of all plastic used</text>
<text x="830" y="197" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Reliance Industries — largest producer</text>

<rect x="688" y="212" width="285" height="96" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="830" y="230" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dc2626">Pollution Crisis</text>
<text x="830" y="248" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Ganga: 2.9 billion plastic items/yr</text>
<text x="830" y="266" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Mumbai drains clogged → 2005 floods</text>
<text x="830" y="284" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Delhi: 10,000 ragpickers sort plastic</text>
<text x="830" y="301" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Sea turtle ingesting bags — coastal India</text>

<rect x="688" y="316" width="285" height="80" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="830" y="334" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#92400e">Policy Actions</text>
<text x="830" y="352" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">July 2022: single-use plastic ban</text>
<text x="830" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Banned: straws, cutlery, carry bags</text>
<text x="830" y="386" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">EPR: brands must take back plastic</text>

<rect x="688" y="404" width="285" height="78" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1.5"/>
<text x="830" y="422" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#16a34a">Innovation in India</text>
<text x="830" y="440" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">PLAEX blocks: plastic + sand bricks</text>
<text x="830" y="458" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">Plastic roads: 2,500+ km in India</text>
<text x="830" y="474" text-anchor="middle" font-family="Arial" font-size="14" fill="#555">IIT research: enzyme to degrade PET</text>

<!-- Takeaway -->
<rect x="0" y="500" width="1000" height="60" fill="#1f5f8b"/>
<text x="500" y="520" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Plastics = long polymer chains. Strong C−C bonds resist microbial breakdown → 100–500 year persistence.</text>
<text x="500" y="544" text-anchor="middle" font-family="Arial" font-size="14" fill="#a5f3fc">India banned single-use plastics (2022). Alternatives: PLA, jute, edible cutlery. Recycle ♻ thermoplastics.</text>
</svg>
